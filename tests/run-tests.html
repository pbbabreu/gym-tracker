<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gym Tracker — test runner</title>
<!--
  ══════════════════════════════════════════════════════════════════════════
  REGRESSION TEST RUNNER — run over a LOCAL server only, never the live site.

    cd gym-tracker
    python -m http.server 8742
    → open http://localhost:8742/tests/run-tests.html

  How it works: this page wipes the origin's storage (localStorage, service
  workers, caches — that's why it must never run against the production
  origin), then loads ../index.html in a same-origin iframe and asserts
  directly against the REAL app — no extracted copies that can drift: if
  it's green here, the shipped file itself behaves.

  Access detail worth knowing: top-level `function` declarations become
  window properties (reachable as W.fn), but top-level `let`/`const`
  bindings (D, S, TAB, today, hasKg, …) do NOT — they live in the iframe
  realm's global lexical environment. The accessor object T below is built
  with W.eval() *inside* that realm, closing over those bindings, which is
  what makes them readable/writable from out here.

  Every test sets up its own state inside the iframe and restores what it
  touched, so order doesn't matter. Add a test for every bug fixed — the
  suite is the project's memory of what must never break again. Coverage
  spans the whole app: sync integrity (per-item LWW merge, tombstones,
  schema guard, both drivers behind one interface), data hygiene (strip/
  scrub, snapshots, duplicates, seed refresh), the progression engine
  (profiles, warm-up ramps + floors, graduation/stall, estimate prefill),
  gym profiles + swap ranking, equipment instances (calibrated vs
  descriptive, machine manager, plate-input modes), plans as entry objects
  (movement slots, resolution + lembrar + ★, prescription notes,
  reconciliation), the family/movement browse, the rest-timer cascade,
  sharing (send/receive/claim, catalog, import hardening), focus mode, and
  the analytics (progress/regimes/per-machine series, weekly volume).
  ══════════════════════════════════════════════════════════════════════════
-->
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #f0ede6; margin: 0 auto; padding: 20px; max-width: 760px; }
  h1 { font-size: 18px; } #summary { font-size: 15px; font-weight: 700; padding: 10px 14px; border-radius: 8px; margin: 12px 0; background: #1c1c1c; }
  #summary.ok { background: #0a2e24; color: #6fcf97; } #summary.bad { background: #2d1010; color: #e57373; }
  .group { font-weight: 700; margin: 14px 0 4px; color: #8a8680; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .t { padding: 3px 0 3px 22px; font-size: 13px; position: relative; }
  .t.ok::before { content: '✓'; color: #6fcf97; position: absolute; left: 4px; }
  .t.bad::before { content: '✗'; color: #e57373; position: absolute; left: 4px; }
  .t.bad { color: #e57373; }
  .detail { color: #8a8680; font-size: 11px; padding-left: 22px; font-family: monospace; }
  iframe { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<h1>Gym Tracker — regression suite</h1>
<div id="summary">running…</div>
<div id="results"></div>
<script>
(async () => {
  const resEl = document.getElementById('results'), sumEl = document.getElementById('summary');
  let pass = 0, fail = 0;
  const g = name => resEl.insertAdjacentHTML('beforeend', `<div class="group">${name}</div>`);
  const t = (name, cond, detail) => {
    cond ? pass++ : fail++;
    resEl.insertAdjacentHTML('beforeend', `<div class="t ${cond ? 'ok' : 'bad'}">${name}</div>${!cond && detail !== undefined ? `<div class="detail">${String(detail).replace(/</g,'&lt;')}</div>` : ''}`);
  };
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);

  // ── boot: wipe origin storage, load the real app in an iframe ─────────────
  g('boot');
  try {
    for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    for (const k of await caches.keys()) await caches.delete(k);
    localStorage.clear();
    t('origin storage wiped (SW, caches, localStorage)', true);
  } catch (e) { t('origin storage wiped', false, e); }

  const frame = document.createElement('iframe');
  frame.src = '../index.html';
  document.body.appendChild(frame);
  const W = await new Promise((resolve, reject) => {
    frame.onload = () => resolve(frame.contentWindow);
    setTimeout(() => reject(new Error('iframe load timeout')), 15000);
  });
  const errors = [];
  W.addEventListener('error', e => errors.push(e.message));

  // Accessor bridge into the iframe realm's top-level let/const bindings —
  // see the header comment for why W.D alone would be undefined.
  const T = W.eval(`({
    get D() { return D; },  set D(v) { D = v; },
    get S() { return S; },  set S(v) { S = v; },
    get TAB() { return TAB; }, set TAB(v) { TAB = v; },
    get schemaAhead() { return _remoteSchemaAhead; }, set schemaAhead(v) { _remoteSchemaAhead = v; },
    get gymId() { return _currentGymId; }, set gymId(v) { _currentGymId = v; },
    get sb() { return sb; }, set sb(v) { sb = v; },
    get sbSession() { return sbSession; }, set sbSession(v) { sbSession = v; },
    get CFG() { return CFG; }, set CFG(v) { CFG = v; },
    get shares() { return _receivedShares; }, set shares(v) { _receivedShares = v; },
    get catalogRows() { return _catalogRows; }, set catalogRows(v) { _catalogRows = v; },
    get restTimer() { return _restTimer; }, set restTimer(v) { _restTimer = v; },
    get liveRestoreDone() { return _liveRestoreDone; }, set liveRestoreDone(v) { _liveRestoreDone = v; },
    get historyGuard() { return _historyGuard; }, set historyGuard(v) { _historyGuard = v; },
    get timerCfgVar() { return _timerCfg; }, set timerCfgVar(v) { _timerCfg = v; },
    hasKg, hasReps, round, esc, today, availableAtGym, currentGym, fmtRest, exIsDone, epley1RM,
    nameKey, findByName, sessionsNewestFirst, calibratedInstanceId, equipChipLabel, loadToDisplay, displayToTotal,
    get nudgeDone() { return _machineNudgeDone; }, set nudgeDone(v) { _machineNudgeDone = v; },
    get varEquip() { return _newVarEquip; }, set varEquip(v) { _newVarEquip = v; },
    SCHEMA_VERSION, MOVEMENTS, MOVEMENT_PATTERNS, SEED_CLASSIFICATION,
    // Provenance (schema 6). Top-level const/function declarations aren't
    // window properties, so the bridge is the only way the suite can reach
    // them — the same reason everything else above is listed here.
    ORIGIN_GLOBAL, ORIGIN_USER, ORIGIN_SHARED, originOf, isGlobalEx,
    isKnownGlobalId, newUserExId, normalizeExerciseOrigin, normalizeExerciseDef,
    // Time-based sets: seconds live in s.reps and the exercise's tracking
    // field says what that number means. NOTE - no backticks in this block:
    // the whole bridge is a template literal, so a backtick here silently
    // terminates it and the entire suite stops parsing.
    TRACK_TIME, TRACK_REPS, trackingOf, isTimed, fmtSecs, volEx, computeSuggestion, profileFor,
    // Catalog delivery: the library arrives on its own and needs no account.
    syncGlobalLibrary, deletedCatalogEntries, restoreDeletedExercise, mergeCollection,
    defaultVariantEquip,
  })`);

  // The starter count is read from library.json rather than hardcoded — the
  // curated library grows as content is promoted from the dump, and a suite
  // that fails on every content addition trains people to ignore it.
  const SEED_COUNT = (await (await fetch('../library.json', { cache: 'no-store' })).json()).exercises.length;
  for (let i = 0; i < 60 && !(T.D && T.D.exercises.length === SEED_COUNT); i++) await new Promise(r => setTimeout(r, 250));
  t(`app booted and seeded the full library (${SEED_COUNT})`, T.D && T.D.exercises.length === SEED_COUNT, T.D && T.D.exercises.length);

  // ── utilities ──────────────────────────────────────────────────────────────
  g('utilities');
  t('hasKg: 0 is real data', T.hasKg({ kg: 0 }) === true);
  t("hasKg: '' is untouched", T.hasKg({ kg: '' }) === false);
  t('hasKg: null is untouched', T.hasKg({ kg: null }) === false);
  t('hasReps: 0 is real data', T.hasReps({ reps: 0 }) === true);
  t('round to 0.5 down', T.round(22.6, 0.5) === 22.5);
  t('round to 0.5 up', T.round(22.8, 0.5) === 23);
  t('esc() escapes HTML', T.esc('<b>&"') === '&lt;b&gt;&amp;&quot;');

  // today(): must be the LOCAL date even when UTC has rolled over (the
  // 2026-07-22 timezone fix — evening sessions were dated tomorrow)
  {
    const RealDate = W.Date;
    const fixed = new RealDate('2026-07-22T23:30:00-03:00');
    W.Date = class extends RealDate {
      constructor(...a) { a.length ? super(...a) : super(fixed.getTime()); }
      static now() { return fixed.getTime(); }
    };
    const late = T.today();
    W.Date = RealDate;
    // Asserts the LOCAL calendar day for whatever TZ the browser runs in —
    // on this project's machine (UTC-3) the UTC day is already the 23rd here.
    const expected = (() => { const d = new Date(fixed); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })();
    t(`today() is the local calendar date at 23:30 UTC-3 (${late})`, late === expected, `got ${late}, expected ${expected}`);
    t('today() now matches a manual local build', T.today() === (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); })());
  }

  // ── training profiles & progression ───────────────────────────────────────
  g('profiles & progression');
  t('strength profile 3×3–5 regardless of regime (owner-corrected range)', eq(W.profileFor('strength', 'assisted'), { targetWorkSets: 3, repLow: 3, repHigh: 5 }) && eq(W.profileFor('strength', 'weighted'), { targetWorkSets: 3, repLow: 3, repHigh: 5 }));
  t('hypertrophy weighted 1×6–10', eq(W.profileFor('hypertrophy', 'weighted'), { targetWorkSets: 1, repLow: 6, repHigh: 10 }));
  t('hypertrophy assisted 1×6–12', eq(W.profileFor('hypertrophy', 'assisted'), { targetWorkSets: 1, repLow: 6, repHigh: 12 }));
  t('bumpWeight +2.5 weighted', W.bumpWeight(20, false) === 22.5);
  t('bumpWeight −2.5 assisted', W.bumpWeight(20, true) === 17.5);
  t('bumpWeight floors at 0 for assisted', W.bumpWeight(2, true) === 0);
  t('bumpWeight rounds to nearest 0.5', W.bumpWeight(21.1, false) === 23.5);

  g('warm-up generation');
  {
    const wu = W.buildWarmupSets('weighted', true, 100);
    t('compound weighted: 25/55/85% ramp', eq(wu.map(s => s.kg), [25, 55, 85]));
    t('compound warm-up reps 10-8-6', eq(wu.map(s => s.reps), [10, 8, 6]));
    t('all intent=warmup', wu.every(s => s.intent === 'warmup'));
    t('compound assisted: 175/145/115% (inverted)', eq(W.buildWarmupSets('assisted', true, 20).map(s => s.kg), [35, 29, 23]));
    const iso = W.buildWarmupSets('weighted', false, 100);
    t('isolation weighted: single 50% set', eq(iso.map(s => s.kg), [50]));
    t('isolation warm-up takes the LAST rep step (6)', iso[0].reps === 6);
    t('isolation assisted: 150% complement', eq(W.buildWarmupSets('assisted', false, 20).map(s => s.kg), [30]));
    t('bodyweight: no warm-ups', W.buildWarmupSets('bodyweight', true, 100).length === 0);
    t('null base: no warm-ups', W.buildWarmupSets('weighted', true, null).length === 0);
  }

  g('suggestion algorithm (computeSuggestion)');
  {
    const keepS = T.D.sessions;
    const mkSess = (date, sets, over = {}) => ({ id: 'T' + date, date, planId: null, planName: null, updatedAt: 1, exercises: [{ exId: 'zercher-squat', exName: 'Z', type: 'strength', regime: 'weighted', sets, ...over }] });
    const P = W.profileFor('strength', 'weighted');

    // fatigue drop-off (the motivating example): 2 of 3 sets held 12kg, third dropped
    T.D.sessions = [mkSess('2026-07-01', [
      { intent: 'work', reps: 5, kg: 12 }, { intent: 'work', reps: 5, kg: 12 }, { intent: 'work', reps: 5, kg: 10 },
    ])];
    let sug = W.computeSuggestion('zercher-squat', 'strength', 'weighted', P);
    t('fatigue drop-off does NOT graduate', sug.graduated === false);
    t('drop-off suggestion offers the working weight back (12)', sug.suggestedKg === 12 && sug.repsTarget === 5);

    // full graduation: all 3 sets at top of range, same weight
    T.D.sessions = [mkSess('2026-07-01', [
      { intent: 'work', reps: 5, kg: 20 }, { intent: 'work', reps: 5, kg: 20 }, { intent: 'work', reps: 5, kg: 20 },
    ])];
    sug = W.computeSuggestion('zercher-squat', 'strength', 'weighted', P);
    t('full target at top of range graduates', sug.graduated === true);
    t('graduation bumps to 22.5 and resets reps to the range floor (3)', sug.suggestedKg === 22.5 && sug.repsTarget === 3);

    // assisted inversion incl. the 0kg full-graduation state
    const PA = W.profileFor('hypertrophy', 'assisted');
    T.D.sessions = [mkSess('2026-07-01', [{ intent: 'work', reps: 12, kg: 5 }], { type: 'hypertrophy', regime: 'assisted' })];
    sug = W.computeSuggestion('zercher-squat', 'hypertrophy', 'assisted', PA);
    t('assisted graduation reduces counterweight (5→2.5)', sug.graduated === true && sug.suggestedKg === 2.5);
    T.D.sessions = [mkSess('2026-07-01', [{ intent: 'work', reps: 12, kg: 0 }], { type: 'hypertrophy', regime: 'assisted' })];
    sug = W.computeSuggestion('zercher-squat', 'hypertrophy', 'assisted', PA);
    t('0kg assisted set is real data, floors at 0', sug.graduated === true && sug.suggestedKg === 0);

    // bodyweight opts out of graduation/stall
    const PB = W.profileFor('hypertrophy', 'bodyweight');
    T.D.sessions = [mkSess('2026-07-01', [{ intent: 'work', reps: 10 }], { type: 'hypertrophy', regime: 'bodyweight' }), mkSess('2026-06-28', [{ intent: 'work', reps: 10 }], { type: 'hypertrophy', regime: 'bodyweight' })];
    sug = W.computeSuggestion('zercher-squat', 'hypertrophy', 'bodyweight', PB);
    t('bodyweight never graduates, never stalls', sug.graduated === false && sug.stallStreak === 0 && sug.repsTarget === PB.repHigh);

    // stall streak counts consecutive non-graduated sessions
    T.D.sessions = [
      mkSess('2026-07-05', [{ intent: 'work', reps: 3, kg: 20 }, { intent: 'work', reps: 3, kg: 20 }, { intent: 'work', reps: 3, kg: 20 }]),
      mkSess('2026-07-01', [{ intent: 'work', reps: 4, kg: 20 }, { intent: 'work', reps: 3, kg: 20 }, { intent: 'work', reps: 3, kg: 20 }]),
    ];
    sug = W.computeSuggestion('zercher-squat', 'strength', 'weighted', P);
    t('two stuck sessions → stallStreak 2', sug.stallStreak === 2);

    // duplicate exercise entries in ONE session combine for history
    T.D.sessions = [{ id: 'dup', date: '2026-07-01', planId: null, planName: null, updatedAt: 1, exercises: [
      { exId: 'zercher-squat', exName: 'Z', type: 'strength', regime: 'weighted', sets: [{ intent: 'work', reps: 5, kg: 20 }, { intent: 'work', reps: 5, kg: 20 }] },
      { exId: 'zercher-squat', exName: 'Z', type: 'strength', regime: 'weighted', sets: [{ intent: 'work', reps: 5, kg: 20 }] },
    ] }];
    const hist = W.getRecentWorkHistory('zercher-squat', 'strength', 'weighted');
    t('superset duplicates combine into one session entry', hist.length === 1 && hist[0].length === 3);
    sug = W.computeSuggestion('zercher-squat', 'strength', 'weighted', P);
    t('combined duplicates can graduate together', sug.graduated === true);

    // explicitly-unchecked sets are excluded; untouched legacy sets count
    T.D.sessions = [mkSess('2026-07-01', [
      { intent: 'work', reps: 5, kg: 20, completed: false }, { intent: 'work', reps: 5, kg: 20 },
    ])];
    const hist2 = W.getRecentWorkHistory('zercher-squat', 'strength', 'weighted');
    t('completed:false excluded, absent counted', hist2.length === 1 && hist2[0].length === 1);

    T.D.sessions = keepS;
  }

  // ── load & volume ──────────────────────────────────────────────────────────
  g('load & volume');
  {
    const keepW = T.D.weights;
    T.D.weights = [{ id: 'w1', date: '2026-07-20', kg: 80, updatedAt: 1 }];
    t('bodyweight load = BW', W.actualLoad({}, 'bodyweight') === 80);
    t('assisted load = BW − counterweight', W.actualLoad({ kg: 20 }, 'assisted') === 60);
    t('assisted 0kg = full BW load', W.actualLoad({ kg: 0 }, 'assisted') === 80);
    t('assisted at BW counterweight floors at 0', W.actualLoad({ kg: 80 }, 'assisted') === 0);
    t("assisted '' = no data", W.actualLoad({ kg: '' }, 'assisted') === null);
    t('weighted 0kg is real (0, not null)', W.actualLoad({ kg: 0 }, 'weighted') === 0);
    t('volEx counts only counted work', W.volEx([
      { intent: 'work', reps: 5, kg: 100 }, { intent: 'work', reps: 5, kg: 100, completed: false }, { intent: 'warmup', reps: 10, kg: 25 },
    ], 'weighted') === 500);
    T.D.weights = [];
    t('no bodyweight logged → assisted load unknowable (null)', W.actualLoad({ kg: 20 }, 'assisted') === null);
    T.D.weights = keepW;
  }

  // ── filter engine ──────────────────────────────────────────────────────────
  g('filter engine');
  {
    // No fType argument anymore: the Força/Hipertrofia filter axis was
    // removed on 2026-07-29 (owner: type is a training mode applied to an
    // exercise, not a property you select exercises by). The bar must not
    // offer it and the engine must not accept it.
    const all = T.D.exercises;
    const biceps = W.applyFilters(all, null, '', false, false, 'biceps', null);
    t('muscle filter returns only that muscle', biceps.length > 0 && biceps.every(e => e.mainMuscle === 'biceps'));
    t('muscle filter count matches manual count', biceps.length === all.filter(e => e.mainMuscle === 'biceps').length);
    const dipTri = W.applyFilters(all, null, 'dip', false, false, 'triceps', null);
    // The POINT is that the muscle chip separates the triceps dips from the
    // chest one, not that there is exactly one of each -- promoting the
    // bodyweight parallel-bar dip made the triceps side two.
    t('muscle+search isolates the triceps dips from the chest one',
      dipTri.length >= 1 && dipTri.every(e => e.mainMuscle === 'triceps')
      && dipTri.some(e => e.id === 'dip-gravitron-upright')
      && !dipTri.some(e => e.id === 'dip-gravitron'));
    const dipChest = W.applyFilters(all, null, 'dip', false, false, 'chest', null);
    t('muscle+search isolates the leaning dip variant', dipChest.length === 1 && dipChest[0].id === 'dip-gravitron');
    t('pattern without muscle is ignored', W.applyFilters(all, null, '', false, false, null, 'curl').length === all.length);
    t('unclassed filter empty on fully-classified seed', W.applyFilters(all, null, '', false, true, null, null).length === 0);
    t('no type filter anywhere in the shared bar', !W.filterBarHTML(null, false, true, null, null).includes('ft:')
      && !W.filterBarHTML(null, false, false, null, null).includes('Força'));
  }

  // ── plan import hardening ──────────────────────────────────────────────────
  g('plan import (untrusted input)');
  {
    const exCount = T.D.exercises.length, planCount = T.D.plans.length;
    W.applyImportedPlan({ name: 'T1', exercises: [{ id: 'bench-press', name: 'Bench press', type: 'strength', compound: true, regime: 'weighted' }] });
    t('exact id match reuses local exercise', T.D.exercises.length === exCount);
    W.applyImportedPlan({ name: 'T2', exercises: [{ id: 'foreign-xyz', name: 'BENCH PRESS', type: 'strength' }] });
    t('name fallback (case-insensitive) despite foreign id', T.D.exercises.length === exCount);
    W.applyImportedPlan({ name: 'T3', exercises: [{ id: 'evil-1', name: 'Foo', type: 'weird', regime: 'eccentric', compound: 'yes', mainMuscle: 'quadzilla', movementPattern: 'zzz', accessoryMuscles: ['nope', 'biceps', 7] }] });
    const foo = T.D.exercises.find(e => e.id === 'evil-1');
    t('unknown enums normalized (type/regime/compound)', foo && foo.type === 'hypertrophy' && foo.regime === 'weighted' && foo.compound === null);
    t('unknown muscle/pattern → undefined strings', foo.mainMuscle === 'undefined' && foo.movementPattern === 'undefined');
    t('accessory list filtered to real groups', eq(foo.accessoryMuscles, ['biceps']));
    W.applyImportedPlan({ name: 'T4', exercises: [{ name: 'Bar Exercise No Id' }] });
    const bar = T.D.exercises.find(e => e.name === 'Bar Exercise No Id');
    t('id-less entry gets a fresh real id', !!bar && !!bar.id && bar.id !== 'undefined');
    const exBefore = T.D.exercises.length;
    W.applyImportedPlan({ name: 'T5', exercises: [{ id: 'no-name-entry' }, { id: 'bench-press', name: 'Bench press' }, { id: 'bench-press', name: 'Bench press' }] });
    const t5 = T.D.plans.find(p => p.name === 'T5');
    t('name-less entries dropped', T.D.exercises.length === exBefore && !T.D.exercises.some(e => e.id === 'no-name-entry'));
    t('within-import duplicates de-duplicated', t5.exercises.length === 1);
    // cleanup
    T.D.plans = T.D.plans.filter(p => !/^T[1-5]$/.test(p.name));
    T.D.exercises = T.D.exercises.filter(e => e.id !== 'evil-1' && e.id !== bar.id);
    t('cleanup restored counts', T.D.exercises.length === exCount && T.D.plans.length === planCount);
  }

  // ── merge engine (the 2026-07-22 LWW fix) ──────────────────────────────────
  g('merge engine');
  {
    const M = W.mergeCollection;
    t('stale remote loses to newer local (THE fix)', M([{ id: 'a', n: 'NEW', updatedAt: 100 }], [{ id: 'a', n: 'old', updatedAt: 50 }], {}, {}).items[0].n === 'NEW');
    t('newer remote wins over older local', M([{ id: 'a', n: 'old', updatedAt: 50 }], [{ id: 'a', n: 'new', updatedAt: 100 }], {}, {}).items[0].n === 'new');
    t('exact tie → remote wins (legacy behavior)', M([{ id: 'a', n: 'L', updatedAt: 9 }], [{ id: 'a', n: 'R', updatedAt: 9 }], {}, {}).items[0].n === 'R');
    t('no-timestamp legacy → remote wins', M([{ id: 'a', n: 'L' }], [{ id: 'a', n: 'R' }], {}, {}).items[0].n === 'R');
    t('disjoint ids union', M([{ id: 'a' }], [{ id: 'b' }], {}, {}).items.length === 2);
    let r = M([{ id: 'a', updatedAt: 50 }], [], {}, { a: 100 });
    t('tombstone removes older item', r.items.length === 0 && r.tombstones.a === 100);
    r = M([{ id: 'a', updatedAt: 200 }], [], {}, { a: 100 });
    t('edit-after-delete survives and drops tombstone', r.items.length === 1 && !('a' in r.tombstones));
    r = M([{ id: 'a', n: 'NEW', updatedAt: 300 }], [{ id: 'a', n: 'stale', updatedAt: 50 }], {}, { a: 100 });
    t('LWW + tombstone interplay', r.items[0].n === 'NEW' && !('a' in r.tombstones));
    t('later tombstone wins the tombstone union', M([], [], { a: 50 }, { a: 100 }).tombstones.a === 100);
  }

  g('schema guard');
  {
    const keepFlag = T.schemaAhead, keepSess = T.D.sessions.slice();
    T.schemaAhead = false;
    const refused = W.mergeRemote({ sessions: { schema: 99, sessions: [{ id: 'future', date: '2026-01-01', updatedAt: 9 }], tombstones: {} } });
    t('newer-schema remote refused wholesale', refused === false && T.schemaAhead === true && !T.D.sessions.some(s => s.id === 'future'));
    T.schemaAhead = false;
    const okMerge = W.mergeRemote({ sessions: { schema: 2, sessions: [{ id: 'ok-sess', date: '2026-01-01', exercises: [], updatedAt: 9 }], tombstones: {} } });
    t('current-schema remote merges fine', okMerge === true && T.D.sessions.some(s => s.id === 'ok-sess'));
    t('legacy files (no schema field) read as v1 and merge', W.mergeRemote({ plans: { plans: [], tombstones: {} } }) === true);
    T.D.sessions = keepSess; T.schemaAhead = keepFlag;
  }

  // ── movement layer (E1 plumbing, 2026-07-29) ───────────────────────────────

      mv[s].pt && mv[s].en && T.MOVEMENT_PATTERNS[mv[s].muscle] && T.MOVEMENT_PATTERNS[mv[s].muscle][mv[s].pattern]));

    // Every shipped exercise carries a movement the map knows (read from

    const lib = (await (await fetch('../library.json', { cache: 'no-store' })).json()).exercises;

    t('the seeded install carries movements end-to-end', T.D.exercises.every(e => e.movement && mv[e.movement]));

    // Backfill: an exercise that predates the movement layer (classified but
    // movement-less) gets it from SEED_CLASSIFICATION's 4th tuple element —
    // and the classification half still respects its early-return.
    const bench = T.D.exercises.find(e => e.id === 'bench-press');
    const keepMove = bench.movement;
    delete bench.movement;
    W.backfillExerciseClassification();
    t('backfill restores movement from the seed tuple', bench.movement === keepMove && Array.isArray(T.SEED_CLASSIFICATION['bench-press']) && T.SEED_CLASSIFICATION['bench-press'][3] === keepMove);
    t('backfill still leaves existing classification untouched', bench.mainMuscle === 'chest' && bench.movementPattern === 'press');

    // normalizeExerciseDef: the bilingual/content layer now survives import,
    // each field validated as untrusted input (this closes the long-tracked
    // "shared plans drop name_en/aliases/equipment/cues" gap).
    const rich = W.normalizeExerciseDef({ id: 'imp-x', name: 'Imp', type: 'hypertrophy', regime: 'weighted',
      compound: true, mainMuscle: 'chest', movementPattern: 'press', movement: 'incline-press',
      name_en: '  Incline thing  ', aliases: ['a', '', 3, 'b'], equipment: 'machine',

    t('import keeps a valid movement + bilingual layer', rich.movement === 'incline-press'
      && rich.name_en === 'Incline thing' && eq(rich.aliases, ['a', 'b']) && rich.equipment === 'machine'
      && eq(rich.cues_pt, ['c1']) && eq(rich.cues_en, ['e1']) && eq(rich.errors_pt, ['x'])
      && !('errors_en' in rich) && rich.stretchEmphasis === true);
    const mismatched = W.normalizeExerciseDef({ id: 'imp-y', name: 'Y', type: 'hypertrophy', regime: 'weighted',
      mainMuscle: 'back', movementPattern: 'row', movement: 'incline-press' });
    t('a movement whose anchor mismatches the classification is dropped', !('movement' in mismatched));
    const junk = W.normalizeExerciseDef({ id: 'imp-z', name: 'Z', type: 'hypertrophy', regime: 'weighted',
      mainMuscle: 'chest', movementPattern: 'press', movement: 'no-such-move', equipment: 'hoverboard',
      aliases: Array.from({ length: 40 }, (_, i) => 'a' + i), stretchEmphasis: 'yes' });
    t('unknown movement/equipment and oversized lists are sanitized', !('movement' in junk)
      && !('equipment' in junk) && junk.aliases.length === 12 && !('stretchEmphasis' in junk));

    // Detail view surfaces the movement label (PT-first).
    W.openExerciseDetail('incline-press-machine');
    t('detail view shows the movement pill', W.document.getElementById('modal-ov').innerHTML.includes('Supino inclinado'));
    W.closeModal();

  // ── movement-first picker (E1b, 2026-07-29) ────────────────────────────────
  g('movement-first picker');

      list().includes('openPickMovement') && list().includes('variaç') && !list().includes('pickEx('));

      && !W.document.getElementById('modal-ov').innerHTML.includes('ft:'));

    W.eval("_aSearch = 'puxada'"); W.aRefreshList();

      W.document.getElementById('a-avulso')?.style.display === 'none' && !!W.document.getElementById('a-avulso-toggle'));

    T.D.exercises = T.D.exercises.filter(e => e.name !== 'Puxada probe');

  // ── machines & session-mode defaults (E2 core, 2026-07-30) ─────────────────
  g('machines & session-mode defaults');
  {
    const keepSessions = [...T.D.sessions], keepMachines = [...T.D.machines], keepGyms = [...T.D.gyms];
    const keepGymId = T.gymId;

    // Sixth collection is wired end to end through the sync shapes.
    t('payload carries the machines collection', 'machines' in W.buildRemotePayload()
      && W.buildRemotePayload().machines.schema === T.SCHEMA_VERSION);
    t('supabase row mapping knows machines', W.sbRowsToRemote([{ collection: 'machines', content: { machines: [] } }]).machines !== null
      && !('bogus' in W.sbRowsToRemote([{ collection: 'bogus', content: {} }])));

    // Merge + tombstones behave like every other collection.
    {
      const localM  = [{ id: 'm1', name: 'A', exId: 'bench-press', gymIds: [], updatedAt: 5 }];
      const remoteM = [{ id: 'm1', name: 'A renamed', exId: 'bench-press', gymIds: [], updatedAt: 9 },
                       { id: 'm2', name: 'B', exId: 'bench-press', gymIds: [], updatedAt: 3 }];
      const r1 = W.mergeCollection(localM, remoteM, {}, {});
      t('machines merge: union by id, newer copy wins', r1.items.length === 2 && r1.items.find(m => m.id === 'm1').name === 'A renamed');
      const r2 = W.mergeCollection(localM, [], {}, { m1: 10 });
      t('machines merge: a remote tombstone removes the local copy', r2.items.length === 0 && r2.tombstones.m1 === 10);
    }

    // THE same-day ordering fix: date ties break by updatedAt, so the most
    // recently SAVED session reads as most recent — not whatever array order
    // insertion or a merge left behind.
    T.D.sessions = [
      { id: 'nf1', date: '2026-07-30', updatedAt: 100, exercises: [{ exId: 'bench-press', type: 'hypertrophy', regime: 'weighted', sets: [] }] },
      { id: 'nf2', date: '2026-07-30', updatedAt: 900, exercises: [{ exId: 'bench-press', type: 'strength', regime: 'weighted', sets: [] }] },

      T.sessionsNewestFirst().map(s => s.id).join(',') === 'nf2,nf1,nf0');
    t('lastModesFor reads the truly latest session', W.lastModesFor('bench-press').type === 'strength');

    // Machine helpers: gym-first ordering, last-instance default, same-machine history.

    T.D.machines = [

    T.D.sessions = [

    t('the machine chip renders in the block with its settings note',

    // switch machine via the picker path; untouched rows rebuild to B's history

      T.S.exercises[0].instanceId === 'mb' && T.S.exercises[0].sets.some(s => s.intent === 'work' && s.lastKg === 65));
    t('using a machine at a new gym auto-tags it there', T.D.machines.find(m => m.id === 'mb').gymIds.includes('g1'));
    // typed data → switch keeps rows, only the suggestion context moves
    const wj = T.S.exercises[0].sets.findIndex(s => s.intent === 'work');
    W.setVal(0, wj, 'kg', '70');
    W.selectMachine(0, 'ma');
    t('switching with typed data keeps the rows (mid-set numbers are sacred)',
      T.S.exercises[0].sets[wj].kg === 70 && T.S.exercises[0].instanceId === 'ma');
    // save: nudge skipped (machine set), instance fields survive the strip
    const cfmA = W.confirm; W.confirm = () => true;
    W.toggleCompleted(0, wj); W.skipRestTimer();
    W.saveSession(); W.doSaveSession('keep');

    const savedM = T.D.sessions.find(s => s.exercises.some(e => e.instanceId === 'ma' && (e.sets||[]).some(x => x.kg === 70)));
    t('saved sessions keep instanceId/instanceName through the strip',
      !!savedM && savedM.exercises[0].instanceName === 'Technogym A');
    T.D.sessions = T.D.sessions.filter(s => s !== savedM);

    // The save-time nudge: fires for counted work without a machine (on a

    // free-weight group), typed name creates-or-reuses, blank skips,
    // re-edits stay silent.
    W.startFree(); T.TAB = 'log';
    W.addPickedEx('leg-extension'); W.removeModal();
    const bj = T.S.exercises[0].sets.findIndex(s => s.intent === 'work');
    W.setVal(0, bj, 'reps', '8'); W.setVal(0, bj, 'kg', '60'); W.toggleCompleted(0, bj); W.skipRestTimer();
    t('nudge targets = counted work with no machine', W.machineNudgeTargets().length === 1);
    W.saveSession();
    t('saving opens the machine nudge first', W.document.getElementById('modal-ov')?.innerHTML.includes('Em qual máquina?'));
    W.document.getElementById('mn-0').value = 'LifeFitness B'; // existing name for ANOTHER exercise → must NOT reuse across exercises
    W.applyMachineNudge();
    const legMachine = T.D.machines.find(m => m.exId === 'leg-extension' && m.name === 'LifeFitness B');
    t('nudge creates per-exercise machines (no cross-exercise capture)', !!legMachine
      && T.S.exercises[0].instanceId === legMachine.id);
    W.doSaveSession('keep');
    T.D.sessions = T.D.sessions.filter(s => !s.exercises.some(e => e.instanceId === legMachine.id));
    // re-edits bypass the nudge entirely
    T.nudgeDone = false;
    T.S = { date: '2026-07-30', _editId: 'nf1', planId: null, planName: null, gymId: null,
      exercises: [{ exId: 'bench-press', exName: 'X', type: 'hypertrophy', regime: 'weighted', sets: [{ intent: 'work', reps: 5, kg: 50, completed: true }] }] };
    W.saveSession();
    t('re-edits of saved sessions never see the nudge', !W.document.getElementById('modal-ov') && T.S === null);

    delete snap.machines; delete snap.tombstones.machines;

    T.D.sessions = [
      { id: 'nf2', date: '2026-07-30', updatedAt: 900, exercises: [{ exId: 'bench-press', type: 'strength', regime: 'weighted', sets: [] }] },

      W.document.getElementById('modal-ov').innerHTML.includes('Adicionar') && W.eval('_pickType') === 'strength');
    W.closeModal();

    // restore
    T.D.sessions = keepSessions; T.D.machines = keepMachines; T.D.gyms = keepGyms;

    t('defaultVariantEquip picks the most common sibling class',
      W.defaultVariantEquip('incline-fly') === 'dumbbell' || W.defaultVariantEquip('incline-fly') === 'cable');
    t('defaultVariantEquip is null for a movement with no classed sibling',
      W.defaultVariantEquip('no-such-movement-slug') === null);
    W.setVarEquip('dumbbell');
    W.document.getElementById('av-name').value = 'Supino teste halteres';
    W.createVariant('bench-press');
    const made = T.D.exercises.find(e => e.name === 'Supino teste halteres');
    t('a created variant carries the chosen equipment (and its semantics)',
      made?.equipment === 'dumbbell' && W.equipmentIsCalibrated(made.id) === false);
    W.closeModal();
    T.D.exercises = T.D.exercises.filter(e => e !== made);
    delete T.D.tombstones.exercises[made?.id];
    const cfdv = W.confirm; W.confirm = () => true; W.cancelSession(); W.confirm = cfdv;
    T.S = null; W.render();
  }

  // ── barbell plate-input modes (owner-designed, 2026-07-30) ─────────────────
  g('barbell plate-input modes');
  {
    const keepSessions = [...T.D.sessions];

    // Conversion math: storage is ALWAYS the grand total; only display flips.
    const sideEx = { loadMode: 'side', barKg: 20 }, platesEx = { loadMode: 'plates', barKg: 20 }, plainEx = {};
    t('side mode: typed 10 stores bar + 2×10; 0 stores the empty bar',
      T.displayToTotal(sideEx, 10) === 40 && T.displayToTotal(sideEx, 0) === 20
      && T.loadToDisplay(sideEx, 40) === 10 && T.loadToDisplay(sideEx, 20) === 0);
    t('plates mode: typed 20 stores bar + 20', T.displayToTotal(platesEx, 20) === 40 && T.loadToDisplay(platesEx, 40) === 20);
    t('no mode / empty values pass through untouched',
      T.displayToTotal(plainEx, 37.5) === 37.5 && T.loadToDisplay(plainEx, 37.5) === 37.5
      && T.displayToTotal(sideEx, '') === '' && T.loadToDisplay(sideEx, '') === '');

    // The owner's walkthrough, end to end on a real block.
    W.startFree(); T.TAB = 'log';
    W.pickEx('bench-press'); W.addPickedEx('bench-press'); W.removeModal();
    const rootHTML = () => W.document.getElementById('root').innerHTML;
    t('barbell blocks carry the ⚖ chip (machine blocks don\'t)', rootHTML().includes('⚖ total'));
    W.toggleLoadSetup(0); W.setBlockBarKg(0, '20'); W.setLoadMode(0, 'side');
    t('choosing a mode collapses the setup back to the chip',
      !T.S.exercises[0]._loadSetup && rootHTML().includes('⚖ por lado · barra 20 kg'));
    t('the load column header and Total column follow the mode',
      rootHTML().includes('Kg de cada lado') && rootHTML().includes('Total'));
    const wj = T.S.exercises[0].sets.findIndex(s => s.intent === 'work');
    W.setVal(0, wj, 'kg', '0'); W.render();
    t('typed 0 = empty bar: stored barKg, hint shown',
      T.S.exercises[0].sets[wj].kg === 20 && rootHTML().includes('barra vazia'));
    W.setVal(0, wj, 'kg', '10'); W.render();
    t('typed per-side 10 stores 40; input re-displays 10; Total shows 40',
      T.S.exercises[0].sets[wj].kg === 40
      && W.document.getElementById(`s-kg-0-${wj}`).value === '10'
      && rootHTML().includes('>40<'));
    W.toggleLoadSetup(0); W.setLoadMode(0, 'plates');
    t('flipping modes is display-only (stored total untouched)',
      T.S.exercises[0].sets[wj].kg === 40 && W.document.getElementById(`s-kg-0-${wj}`).value === '20'
      && rootHTML().includes('Kg em anilhas'));
    W.toggleLoadSetup(0); W.setLoadMode(0, 'side');
    t('chips read in the block\'s input units', true); // covered live; chip text depends on history below

    // Save keeps the preference (strips only the UI flag); the next session
    // re-seeds it and displays history converted.
    W.setVal(0, wj, 'reps', '8'); W.toggleCompleted(0, wj); W.skipRestTimer();
    T.nudgeDone = true; W.saveSession(); W.doSaveSession('keep');
    const savedFW = T.D.sessions[T.D.sessions.length-1].exercises[0];
    t('saved entries keep loadMode/barKg, never _loadSetup, sets stay totals',
      savedFW.loadMode === 'side' && savedFW.barKg === 20 && !('_loadSetup' in savedFW) && savedFW.sets[wj].kg === 40);
    t('lastModesFor carries the plate preference', W.lastModesFor('bench-press').loadMode === 'side'
      && W.lastModesFor('bench-press').barKg === 20);
    T.TAB = 'log'; W.startFree();
    W.pickEx('bench-press'); W.addPickedEx('bench-press'); W.removeModal();
    const wj2 = T.S.exercises[0].sets.findIndex(s => s.intent === 'work');
    t('next session re-seeds the mode and shows history converted',
      T.S.exercises[0].loadMode === 'side' && T.S.exercises[0].barKg === 20
      && W.document.getElementById(`s-kg-0-${wj2}`).value === '10'
      && rootHTML().includes('/lado'));
    const cfp = W.confirm; W.confirm = () => true; W.cancelSession(); W.confirm = cfp;

    T.D.sessions = keepSessions; T.S = null; T.nudgeDone = false; W.render();
  }

  // ── live-session survival & tap-to-edit (2026-07-29 gym-floor feedback) ────
  g('live-session survival & tap-to-edit');
  {
    // The stash mirrors S on every render…
    W.startFree();
    T.S.exercises = [{ exId: 'bench-press', exName: 'Bench', type: 'strength', regime: 'weighted',
      sets: [{ intent: 'work', reps: 5, kg: 100 }] }];
    W.render();
    let stash = JSON.parse(W.localStorage.getItem('gym:live-session') || 'null');
    t('render mirrors the live session into localStorage', !!stash && stash.S.exercises[0].sets[0].kg === 100);

    // …and setVal covers the keystrokes render() deliberately skips.
    W.setVal(0, 0, 'reps', '7');
    stash = JSON.parse(W.localStorage.getItem('gym:live-session') || 'null');
    t('keystrokes reach the stash without a render', stash.S.exercises[0].sets[0].reps === 7);

    // Restore round-trip: killing the page loses S but not the stash.
    const savedStash = W.localStorage.getItem('gym:live-session');
    T.S = null; T.restTimer = null;                    // simulate the death directly (no render — a real death doesn't render either)
    W.localStorage.setItem('gym:live-session', savedStash);
    W.restoreLiveSession();
    t('restore brings the session back onto the Treino tab', !!T.S && T.S.exercises[0].sets[0].reps === 7 && T.TAB === 'log');

    // A still-running rest timer rides along; an expired one is dropped as stale noise.
    const withTimer = JSON.parse(savedStash);
    withTimer.restTimer = { endsAt: Date.now() + 60000, total: 180, label: 'x', done: false };
    W.localStorage.setItem('gym:live-session', JSON.stringify(withTimer));
    W.restoreLiveSession();
    t('a running countdown survives the restore', T.restTimer && T.restTimer.total === 180);
    W.skipRestTimer();
    withTimer.restTimer = { endsAt: Date.now() - 5000, total: 180, label: 'x', done: false };
    W.localStorage.setItem('gym:live-session', JSON.stringify(withTimer));
    W.restoreLiveSession();
    t('an expired countdown is dropped, not resurrected', T.restTimer === null);

    // The boot-order latch: an early render() (e.g. the auth listener firing
    // mid-loadData, S still null) must NOT clear the stash before the boot
    // restore has read it — that was the one ordering that could still lose
    // a workout on exactly the reopen path the stash exists for.
    T.S = null; T.liveRestoreDone = false;
    W.localStorage.setItem('gym:live-session', savedStash);
    W.render();
    t('latched: a pre-restore render cannot clear the stash', !!W.localStorage.getItem('gym:live-session'));
    T.liveRestoreDone = true;
    W.render();
    t('unlatched: a post-restore render with no session clears it', !W.localStorage.getItem('gym:live-session'));

    // Cancelar now guards a session holding real input — and clears the stash on accept.
    W.localStorage.setItem('gym:live-session', savedStash);
    W.restoreLiveSession();
    const origConfirm = W.confirm;
    W.confirm = () => false;
    W.cancelSession();
    t('cancel declined keeps the session and its stash', !!T.S && !!W.localStorage.getItem('gym:live-session'));
    W.confirm = () => true;
    W.cancelSession();
    t('cancel accepted wipes S and the stash', T.S === null && !W.localStorage.getItem('gym:live-session'));
    let confirmAsked = false;
    W.confirm = () => { confirmAsked = true; return true; };
    W.startFree();
    W.cancelSession();
    t('an untouched session cancels without any confirm', T.S === null && !confirmAsked);
    W.confirm = origConfirm;

    // Saving ends the session → the stash goes too (free save via 'keep').
    W.startFree();
    T.S.exercises = [{ exId: 'bench-press', exName: 'Bench', type: 'strength', regime: 'weighted',
      sets: [{ intent: 'work', reps: 5, kg: 100 }] }];
    W.render();
    T.nudgeDone = true; // machine nudge has its own group; this tests the stash
    W.saveSession(); W.doSaveSession('keep');
    t('saving the session clears the stash', T.S === null && !W.localStorage.getItem('gym:live-session'));
    T.D.sessions = T.D.sessions.filter(s => !(s.planId === null && s.exercises.length === 1 && s.exercises[0].exId === 'bench-press'));

    // Tap-to-edit: focusVal/blurVal are exercised directly — focus EVENTS
    // don't fire in an unfocused window (this iframe), so el.focus() would
    // test the harness, not the app. The wiring is asserted on the markup.
    // TAB must be forced back to 'log': doSaveSession above landed on
    // Histórico, and startFree() deliberately doesn't switch tabs (it's only
    // reachable FROM Treino in real use) — without this the set inputs
    // never render and the probe reads null.
    W.startFree();
    T.TAB = 'log';
    T.S.exercises = [{ exId: 'bench-press', exName: 'Bench', type: 'strength', regime: 'weighted',
      sets: [{ intent: 'work', reps: 8, kg: 40 }] }];
    W.render();
    const inp = W.document.getElementById('s-reps-0-0');
    t('set inputs are wired to focusVal/blurVal', (inp.getAttribute('onfocus') || '').includes('focusVal')
      && (inp.getAttribute('onblur') || '').includes('blurVal')
      && W.buildExBlock(T.S.exercises[0], 0).includes('onfocus="focusVal(this)"'));
    W.focusVal(inp);
    t('tapping a filled field clears the display only', inp.value === '' && inp.dataset.prev === '8'
      && T.S.exercises[0].sets[0].reps === 8);
    W.blurVal(inp);
    t('leaving without typing restores it untouched', inp.value === '8' && !inp.dataset.cleared
      && T.S.exercises[0].sets[0].reps === 8);
    W.focusVal(inp); inp.value = '12'; W.setVal(0, 0, 'reps', '12'); W.blurVal(inp);
    t('typing replaces: fresh value sticks in display and state', inp.value === '12' && T.S.exercises[0].sets[0].reps === 12);
    W.focusVal(inp); inp.value = ''; W.setVal(0, 0, 'reps', '');
    W.blurVal(inp);
    t('type-then-erase is a deliberate clear — no restore', inp.value === '' && T.S.exercises[0].sets[0].reps === '');
    W.focusVal(inp);
    t('focusing an empty field is a no-op', inp.value === '' && inp.dataset.cleared === undefined);
    T.S = null; W.render();

    // Back-button integration. Real history.back() NAVIGATION is deliberately
    // not exercised here: this iframe shares the tab's joint session history,
    // and popping entries from inside it can back-navigate the RUNNER page
    // itself (observed mid-run before _historyGuard existed). The app
    // disables the whole integration when embedded (window !== window.top) —
    // that default is asserted first, then the guard is force-enabled to test
    // the arming + popstate handler with non-navigating calls only
    // (pushState/replaceState/synthetic events). The real back()-consumption
    // and the close-then-reopen re-arm race were verified live, top-level,
    // in the Browser pane (2026-07-29).
    t('embedded app leaves the host history alone by default', T.historyGuard === false);
    W.showModal('<div id="bt-probe0">x</div>');
    t('…so an embedded showModal pushes no guard entry', !(W.history.state && W.history.state.modal));
    W.removeModal();

    T.historyGuard = true;
    W.showModal('<div id="bt-probe">x</div>');
    t('top-level: opening a modal arms the history guard', !!W.document.getElementById('bt-probe')
      && !!(W.history.state && W.history.state.modal));
    W.dispatchEvent(new W.PopStateEvent('popstate', { state: null })); // the hardware Back press, minus the navigation
    t('a Back popstate closes the modal and stays in the app', !W.document.getElementById('bt-probe')
      && W.location.pathname.endsWith('index.html'));
    W.history.replaceState(null, '');                  // neutralize the armed entry without navigating
    W.showModal('<div id="bt-probe2">x</div>');
    W.history.replaceState(null, '');                  // entry "already consumed" → closeModal takes the pure-DOM path
    W.closeModal();
    t('UI close removes the modal synchronously', !W.document.getElementById('bt-probe2'));
    T.historyGuard = false;                            // back to the embedded default for any later modal tests
  }

  // ── exercise provenance (schema 6) ────────────────────────────────────────
  // The library is three tiers sharing ONE shape: global (curated catalog),
  // user (created here) and shared (arrived in someone else's plan), with
  // `origin` the only field that differs. These checks pin the invariant at
  // every point an exercise can enter the library, because a wrong origin is
  // invisible in the UI but decides what ⟳ Nomes is allowed to overwrite.
  g('exercise provenance');
  {
    const seeded = T.D.exercises.find(e => e.id === 'bench-press');
    t('library.json seeding stamps origin: global', seeded && seeded.origin === T.ORIGIN_GLOBAL, seeded && seeded.origin);
    t('every seeded exercise is global', T.D.exercises.every(e => e.origin === T.ORIGIN_GLOBAL));

    // id namespace — user exercises can never collide with a catalog slug
    const nid = T.newUserExId();
    t('newUserExId() lives in the u_ namespace', /^u_/.test(nid));
    t('a catalog slug is recognised as global', T.isKnownGlobalId('bench-press') === true);
    t('a u_ id is never a catalog id', T.isKnownGlobalId(nid) === false);

    // creation paths
    const before = T.D.exercises.length;
    W.openNewEx();
    W.document.getElementById('ex-name').value = 'Prov Teste Novo';
    W.saveNewEx();
    const made = T.D.exercises.find(e => e.name === 'Prov Teste Novo');
    t('saveNewEx() creates origin: user with a u_ id', made && made.origin === T.ORIGIN_USER && /^u_/.test(made.id),
       made && `${made.origin}/${made.id}`);
    t('…and actually added one exercise', T.D.exercises.length === before + 1);

    // normalizeExerciseDef: the sender's claim is a HINT, never authority
    const invented = T.normalizeExerciseDef({ id: 'u_someoneelse', name: 'Invenção alheia',
      mainMuscle: 'chest', movementPattern: 'press', origin: 'global' }, T.ORIGIN_SHARED);
    t('an unknown id + shared hint lands shared', invented.origin === T.ORIGIN_SHARED, invented.origin);
    t("…and a sender's origin:'global' claim is ignored", invented.origin !== T.ORIGIN_GLOBAL);
    const official = T.normalizeExerciseDef({ id: 'bench-press', name: 'Supino reto',
      mainMuscle: 'chest', movementPattern: 'press' }, T.ORIGIN_SHARED);
    t('a known catalog id in a share resolves to global', official.origin === T.ORIGIN_GLOBAL, official.origin);
    const withSender = T.normalizeExerciseDef({ id: 'u_x1', name: 'Rosca da Ana',
      mainMuscle: 'biceps', movementPattern: 'curl', sharedFrom: 'ana@example.com' }, T.ORIGIN_SHARED);
    t('sharedFrom is carried on a shared exercise', withSender.sharedFrom === 'ana@example.com');
    t('sharedFrom is dropped when the exercise is not shared', !official.sharedFrom);
    const idless = T.normalizeExerciseDef({ name: 'Sem id' }, T.ORIGIN_SHARED);
    t('an id-less definition gets a u_ id, never a bare uid', /^u_/.test(idless.id), idless.id);

    // ⟳ Nomes must never touch anything but the catalog
    const userEx = T.D.exercises.find(e => e.name === 'Prov Teste Novo');
    const fakeSeedMap = { 'bench-press': { ...seeded, name: 'Supino RENOMEADO' } };
    fakeSeedMap[userEx.id] = { ...userEx, name: 'NÃO DEVE ACONTECER' };
    const chg = W.seedRefreshChanges(fakeSeedMap);
    const allTouched = [...chg.renames, ...chg.contentOnly].map(c => c.ex.id);
    t('seed refresh offers the global rename', allTouched.includes('bench-press'));
    t('seed refresh never offers a user exercise, even if the map names its id',
       !allTouched.includes(userEx.id), allTouched.join(','));

    // the defensive normalizer (a v5 device racing a push)
    userEx.origin = undefined;
    W.normalizeExerciseOrigin();
    t('normalizeExerciseOrigin() repairs an origin-less user exercise', userEx.origin === T.ORIGIN_USER);
    const seeded2 = T.D.exercises.find(e => e.id === 'bench-press');
    seeded2.origin = undefined;
    W.normalizeExerciseOrigin();
    t('…and derives global for a known catalog id', seeded2.origin === T.ORIGIN_GLOBAL);
    t('originOf() falls back sanely for a null-ish record', T.originOf({ id: 'zzz' }) === T.ORIGIN_USER);
    t('isGlobalEx() reads through the fallback', T.isGlobalEx({ id: 'bench-press' }) === true);

    // the share payload must not leak origin — the receiver always re-derives
    const p = { id: 'provplan', name: 'Prov', exercises: [{ eid: 'e1', exId: 'bench-press' }], rests: {} };
    const payload = W.buildPlanPayload(p);
    t('share payload carries no origin field', payload.exercises.every(e => !('origin' in e)));

    // cleanup so later assertions (and the persisted clean state) are unaffected
    T.D.exercises = T.D.exercises.filter(e => e.name !== 'Prov Teste Novo');
    W.closeModal();
  }


  // -- time-based sets (`tracking`) ------------------------------------------
  // Seconds are stored in s.reps and the EXERCISE says what that number means.
  // These checks pin the two halves that matter: the number renders as a
  // duration, and every piece of rep-arithmetic (graduation, stall, e1RM,
  // volume-load) is switched OFF -- because each of those would otherwise
  // produce a confident, wrong number for a 60-second hold.
  g('time-based sets');
  {
    const plank = T.D.exercises.find(e => e.id === 'plank');
    t('the plank ships tracking: time', plank && plank.tracking === T.TRACK_TIME, plank && plank.tracking);
    t('isTimed() reads it', T.isTimed(plank) === true);
    t('a normal exercise is rep-tracked by default',
       T.trackingOf(T.D.exercises.find(e => e.id === 'bench-press')) === T.TRACK_REPS);
    t('trackingOf() ignores a bogus value', T.trackingOf({ tracking: 'banana' }) === T.TRACK_REPS);

    // duration formatting, same m:ss the rest timer uses
    t('fmtSecs 60 -> 1:00', T.fmtSecs(60) === '1:00');
    t('fmtSecs 45 -> 0:45', T.fmtSecs(45) === '0:45');
    t('fmtSecs 90 -> 1:30', T.fmtSecs(90) === '1:30');
    t('fmtSecs handles blank', T.fmtSecs('') === '-'.replace('-', '\u2013'));

    // volume-load: kg x seconds is not volume-load, so a timed block adds 0
    const sets = [{ intent: 'work', reps: 60, kg: 10 }, { intent: 'work', reps: 45, kg: 10 }];
    t('volEx counts kg x reps for a rep exercise', T.volEx(sets, 'weighted', false) === 60 * 10 + 45 * 10);
    t('volEx returns 0 for a timed exercise', T.volEx(sets, 'weighted', true) === 0);

    // graduation / stall / e1RM must not fire on seconds
    const prof = T.profileFor('hypertrophy', 'weighted');
    const mkSess = (id, reps) => ({ id, date: '2026-07-0' + id, exercises: [
      { exId: 'plank', exName: 'Prancha', type: 'hypertrophy', regime: 'weighted', tracking: 'time',
        sets: Array.from({ length: prof.targetWorkSets }, () => ({ intent: 'work', reps, kg: 10 })) } ] });
    const keepSess = T.D.sessions;
    T.D.sessions = [mkSess(1, 99), mkSess(2, 99), mkSess(3, 99)];
    const sug = T.computeSuggestion('plank', 'hypertrophy', 'weighted', prof);
    t('a timed exercise never graduates, however long the hold', sug && sug.graduated === false,
       sug && JSON.stringify({ g: sug.graduated, r: sug.repsTarget }));
    t('...and shows no rep target', sug && sug.repsTarget === null);
    t('...and never accrues a stall streak', sug && sug.stallStreak === 0);
    // the same history on a rep-tracked exercise DOES graduate -- proving the
    // opt-out above is the tracking flag doing it, not the fixture being inert
    T.D.sessions = T.D.sessions.map(x => ({ ...x, exercises: x.exercises.map(e =>
      ({ ...e, exId: 'bench-press', tracking: undefined })) }));
    const sug2 = T.computeSuggestion('bench-press', 'hypertrophy', 'weighted', prof);
    t('control: identical history on a rep exercise DOES graduate', sug2 && sug2.graduated === true,
       sug2 && JSON.stringify({ g: sug2.graduated }));
    // e1RM is skipped for timed
    T.D.sessions = [mkSess(1, 60)];
    T.D.sessions = keepSess;
  }

  // ── wrap-up ────────────────────────────────────────────────────────────────
  g('wrap-up');
  // Persist the restored (clean) state: several tests persist() mid-run
  // (saveSession, restoreSnapshot, …), so without this final write the
  // origin's localStorage would keep whatever the LAST mid-test persist
  // happened to hold — leftover test sessions that then contaminate any
  // manual poking at the app on this origin afterwards. (Found the hard
  // way — a "leftover snapme session" confused a later check.)
  await W.persistLocal();
  t('final state persisted clean (no test leftovers in localStorage)', !JSON.parse(W.localStorage.getItem('gym:data')).sessions.some(s => String(s.id).startsWith('T2026') || ['dup','snapme','later','legacy','ok-sess'].includes(s.id)));
  t('zero uncaught errors inside the app during the whole run', errors.length === 0, errors.join(' | '));

  sumEl.textContent = `${pass} passed, ${fail} failed`;
  sumEl.className = fail ? 'bad' : 'ok';
  document.title = (fail ? '✗ ' : '✓ ') + document.title;
  window.__TEST_RESULT__ = { pass, fail };
})();
</script>
</body>
</html>
