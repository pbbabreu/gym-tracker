    </div>`;
}

// ── Superset rendering (E3b) ─────────────────────────────────────────────────
//
// The session's flat exercise list walked into RENDER UNITS: a run of
// contiguous blocks sharing an `ss` becomes one group unit; everything else
// stays its own exercise unit and renders exactly as it always has.
//
// Contiguity is an invariant the grouping actions maintain, not an assumption
// — without it moveEx() could park a non-member between two members and the
// round view would be meaningless. Handled defensively all the same: a second,
// separated run carrying the same gid renders as its own unit rather than
// throwing or silently swallowing the blocks in between.
function sessionUnits() {
  const out = [];
  (S?.exercises || []).forEach((ex, i) => {
    const prev = out[out.length - 1];
    if (isGrouped(ex) && prev && prev.kind === 'group' && prev.gid === ex.ss) { prev.idxs.push(i); return; }
    out.push(isGrouped(ex) ? { kind: 'group', gid: ex.ss, idxs: [i] } : { kind: 'ex', i });
  });
  return out;
}

const groupCfg = gid => (S?.groups && S.groups[gid]) || {};

// Member render order for ONE round: that round's own deviation if it has
// one, else the group default — which is simply the order the members sit in
// the session array, so the common case stores nothing at all.
//
// A deviation that doesn't name every member still renders the rest, after.
// A stale order (a member added since, or an id that arrived from another
// device) must never make a logged set silently invisible.
function roundMembers(idxs, gid, r) {
  const dev = groupCfg(gid).roundOrder?.[r];
  if (!dev || !dev.length) return idxs;
  const byMem = new Map(idxs.map(i => [S.exercises[i].ssMem, i]));
  const ordered = dev.map(m => byMem.get(m)).filter(i => i != null);
  return [...ordered, ...idxs.filter(i => !ordered.includes(i))];
}

// The (exercise, set) pairs a round actually contains. A member with fewer
// sets than the group's round count simply isn't in the later rounds —
// which is the whole of the unequal-set-count handling (owner: "unequal set
// counts are fine, history will add up the work that was done").
function roundSets(idxs, r) {
  const out = [];
  idxs.forEach(i => {
    const j = roundSetIdxs(S.exercises[i])[r];
    if (j != null) out.push({ i, j });
  });
  return out;
}

// A round is DONE when every set it contains is EXPLICITLY completed —
// derived, never stored, the same strict ===true rule exIsDone() applies one
// level up. Order of checking inside the round is irrelevant: only the
// transition into fully-done collapses it and starts the between-rounds rest.
function roundIsDone(idxs, r) {
  const ss = roundSets(idxs, r);
  return ss.length > 0 && ss.every(({ i, j }) => S.exercises[i].sets[j].completed === true);
}

// Rest for one gap inside a group, in seconds.
//
// Inside a superset the per-transition cascade (restDurationFor) deliberately
// does NOT apply: the owner defines the rests, so the group config is the
// single source of truth for its members and there is no second place the two
// could disagree. Each member's own `rest` field is left untouched and simply
// goes unused while grouped — which is what makes Desagrupar restore the
// normal cascade with nothing lost.
//
// `slot` is a member's ssMem (a gap between exercises) or 'end' (the gap after
// the round). Keyed by MEMBER rather than by position, so reordering a round
// carries its overrides with it instead of shifting them onto whoever moved
// into that slot. 0 is a real value — "no timer here" — so the default is only
// reached when nothing was configured at all.
function groupGapSecs(gid, r, slot) {
  const cfg = groupCfg(gid);
  const ov = cfg.rest?.overrides?.[`${r}:${slot}`];
  if (ov != null) return ov;
  return (slot === 'end' ? cfg.rest?.round : cfg.rest?.between) ?? 0;
}

// Round collapse state lives on S (so it rides the live-session mirror across
// a reload, like every other in-progress fact) and is keyed `${gid}:${r}`.
// It never reaches history for free: the saved session record is a WHITELIST
// of fields, so anything not named there — this included — cannot leak in.
const roundCollapsed = (gid, r) => !!(S?.ssCollapsed && S.ssCollapsed[`${gid}:${r}`]);

function buildGroupBlock(gid, idxs) {
  const members = idxs.map(i => S.exercises[i]);
  const rounds  = roundCountFor(members);
  const ctxs    = {}; idxs.forEach(i => { ctxs[i] = exRowCtx(S.exercises[i], i); });

  // Pre-round warm-ups: each member's LEADING warm-ups, done per exercise
  // before the rounds start. This is the owner's stated default ("by default
  // WUs should be grouped together"); a member flagged ssWu contributes
  // nothing here because its warm-ups ride the rounds instead.
  const soloBlocks = idxs.map(i => {
    const ex = S.exercises[i], solo = soloSetIdxs(ex);
    if (!solo.length) return '';
    return `
      <div style="margin-bottom:10px">
        <div style="font-size:12px;color:${DM};margin-bottom:4px">${esc(ex.exName)}</div>
        ${solo.map(j => setRowHTML(ctxs[i], ex.sets[j], j)).join('')}
      </div>`;
  }).join('');

  const soloSection = !soloBlocks.trim() ? '' : `
    <div style="padding:10px 14px;border-bottom:1px solid ${BD}">
      <div style="font-size:11px;color:${DM};font-weight:700;margin-bottom:8px">AQUECIMENTO</div>
      ${soloBlocks}
    </div>`;

  // One rest row — the owner's "timers are to be user defined, like adding a
  // row to the sets table". A rest is literally a row in the round table,
  // tappable to edit in place; editing writes a per-gap override and leaves
  // the group's own default alone.
  const restRow = (r, slot, label) => {
    const secs = groupGapSecs(gid, r, slot);
    const isEnd = slot === 'end';
    return `<div onclick="openGapRest('${gid}',${r},'${slot}')" style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:${isEnd?'7px 0 2px':'3px 0 5px'};${isEnd?`border-top:1px dashed ${BD};margin-top:4px`:''}">
      <span style="font-size:11px;color:${secs?'#6fcf97':DM}">⏱ ${secs ? fmtSecs(secs) : 'sem descanso'}</span>
      <span style="font-size:10px;color:${DM}">${label}</span>
    </div>`;
  };

  const roundBlocks = Array.from({ length: rounds }, (_, r) => buildRoundHTML(gid, idxs, r, ctxs, restRow)).join('');

  const allDone = rounds > 0 && Array.from({ length: rounds }, (_, r) => roundIsDone(idxs, r)).every(Boolean);

  return `
    <div id="ssblk-${gid}" style="background:${BG2};border:1px solid ${allDone?'#1a4a3a':CSB};border-radius:10px;margin-bottom:12px;overflow:hidden">
      <div style="padding:10px 12px;border-bottom:1px solid ${BD};display:flex;align-items:flex-start;gap:8px">
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:14px;margin-bottom:4px">⛓ Superset <span style="font-weight:400;font-size:11px;color:${DM}">· ${members.length} exercícios · ${rounds} ${rounds===1?'rodada':'rodadas'}</span></div>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${idxs.map(i => `<button onclick="openSsMember(${i})" style="padding:3px 8px;border-radius:99px;border:1px solid ${BD};background:${BG3};color:${DM};font-size:10px;font-weight:600;cursor:pointer;font-family:inherit;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(S.exercises[i].exName)}</button>`).join('')}
          </div>
        </div>
        <button onclick="openSsBuilder('${gid}')" title="Editar superset" style="flex-shrink:0;background:none;border:none;color:${DM};font-size:15px;cursor:pointer;padding:4px 6px">⚙</button>
      </div>
      ${soloSection}
      <div style="padding:6px 14px 12px">
        ${rounds ? roundBlocks : `<div style="font-size:12px;color:${DM};padding:8px 0">Nenhuma rodada ainda.</div>`}
        ${B(BG3,TX,'+ Rodada',`addRound('${gid}')`,';margin-bottom:0;margin-top:10px')}
      </div>
    </div>`;
}

// One ROUND card: the header (fold chevron, "Rodada n", the promote-this-order
// affordance, the checked/total count) and, when open, one two-line member row
// per participating member with the rest gaps between them.
//
// Split out of buildGroupBlock() in the post-build review: at 106 lines that
// function was the densest thing in the feature, and a round is the unit
// people actually reason about, so it earns its own name. `restRow` is passed
// in rather than rebuilt because it closes over the group's gap config.
function buildRoundHTML(gid, idxs, r, ctxs, restRow) {
    const order   = roundMembers(idxs, gid, r);
    // Members with no set at this round index simply don't appear — the whole
    // of the unequal-set-count handling, and the reason nothing here special-
    // cases it.
    const present = order.filter(i => roundSetIdxs(S.exercises[i])[r] != null);
    const done    = roundIsDone(idxs, r);
    const sets    = roundSets(idxs, r);
    const checked = sets.filter(({ i, j }) => S.exercises[i].sets[j].completed === true).length;
    const open    = !roundCollapsed(gid, r);
    // A round where EVERY participating set is a warm-up is a warm-up round —
    // say so, rather than calling it "Rodada 1" and leaving the user to read
    // the W/WU chips. Mixed rounds (a member warming up while others work)
    // stay plain "Rodada n", because that is exactly what they are.
    const allWu = sets.length > 0 && sets.every(({ i, j }) => S.exercises[i].sets[j].intent === 'warmup');
    const label = allWu ? `Aquecimento ${r+1}` : `Rodada ${r+1}`;

    const head = `
      <div style="display:flex;align-items:center;gap:8px;padding:6px 0">
        <button onclick="toggleRoundCollapse('${gid}',${r})" style="flex-shrink:0;background:none;border:none;color:${DM};font-size:15px;cursor:pointer;padding:4px 6px;line-height:1">${open?'▾':'▸'}</button>
        <button onclick="toggleRoundCollapse('${gid}',${r})" style="flex:1;min-width:0;background:none;border:none;color:${TX};font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;text-align:left;padding:0">${label}</button>
        ${groupCfg(gid).roundOrder?.[r] ? `<button onclick="applyRoundOrderToAll('${gid}',${r})" title="Usar esta ordem em todas as rodadas" style="flex-shrink:0;background:none;border:1px solid ${BD};border-radius:99px;color:${CST};font-size:9px;font-weight:700;cursor:pointer;padding:2px 7px;font-family:inherit">↕ todas</button>` : ''}
        <span style="flex-shrink:0;font-size:12px;color:${done?'#6fcf97':DM}">${checked}/${sets.length} ✓</span>
      </div>`;

    if (!open) return `<div style="border-bottom:.5px solid ${BD};opacity:${done?'.7':'1'}">${head}</div>`;

    const body = present.map((i, k) => {
      const ex = S.exercises[i], j = roundSetIdxs(ex)[r];
      // The member name sits ABOVE the controls rather than beside them: the
      // W/WU toggle cannot be dropped to make room, because intent inside a
      // round is per-member (a member warming up while another works is an
      // explicitly supported shape), so the row is two lines by necessity.
      // Reorder lives on the NAME line, not the controls line — measured at
      // 375px, the controls row is full (28/54/83/83/38) while the name line
      // has ~280px spare. Reordering writes only THIS round's order; the
      // round header then offers "aplicar a todas", which is the owner's
      // "be asked if he wants to apply it to all blocks or just the one"
      // without a confirm on every single tap.
      const arrow = (dir, off) => `<button onclick="moveInRound('${gid}',${r},'${ex.ssMem}',${dir})" ${off?'disabled':''} title="Mover nesta rodada" style="flex-shrink:0;background:none;border:none;color:${off?BD:DM};font-size:12px;cursor:${off?'default':'pointer'};padding:0 2px;line-height:1">${dir<0?'▲':'▼'}</button>`;
      const nameHTML = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
        ${present.length > 1 ? arrow(-1, k===0) + arrow(1, k===present.length-1) : ''}
        <button onclick="openExerciseDetail('${ex.exId}')" style="flex:1;min-width:0;background:none;border:none;color:${TX};font-weight:600;font-size:13px;font-family:inherit;text-align:left;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.exName)}</button>
        ${ex.instanceName ? `<span style="flex-shrink:0;font-size:10px;color:#4dd0c4;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🔧 ${esc(ex.instanceName)}</span>` : ''}
        <button onclick="openSsMember(${i})" title="Opções deste exercício" style="flex-shrink:0;background:none;border:none;color:${DM};font-size:14px;cursor:pointer;padding:2px 4px;line-height:1">⋯</button>
      </div>`;
      const row = setRowHTML(ctxs[i], ex.sets[j], j, { nameHTML });
      const gap = k < present.length - 1 ? restRow(r, ex.ssMem, 'entre exercícios') : '';
      return row + gap;
    }).join('');

    return `<div style="border-bottom:.5px solid ${BD};padding-bottom:4px">
      ${head}
      <div style="padding:0 2px">${body}${restRow(r, 'end', 'após a rodada')}</div>
    </div>`;
}

// ── Shared set-row rendering ─────────────────────────────────────────────────
//
// Factored out of buildExBlock when supersets (E3b) landed, and the reason is
// a design promise rather than tidiness: a superset round is defined as "a
// re-arrangement of the same inputs, not a reimplementation of them". That is
// only true if both views literally render the same row — so the
// timed/bodyweight/assisted/bw-plus branching, the plate-mode Total column,
// the ↺/▲ quick-fill chips and the completed checkbox have exactly ONE
// implementation, and a fix to any of them lands in both views at once.
//
// exRowCtx() holds everything that depends on the EXERCISE rather than on the
// individual set. Hoisted so it isn't recomputed per row, and so the round
// view can build it once per member and reuse it across every round.
function exRowCtx(ex, i) {
  const isAs = ex.regime==='assisted', isBW = ex.regime==='bodyweight', isBWP = ex.regime===REGIME_BW_PLUS;
  // Time-based (planks, dead hangs, any hold): the count column is SECONDS.
  // Read from the block's own snapshot so an in-progress session keeps
  // rendering correctly even if the library entry changes underneath it.
  const isTm = isTimed(ex);
  const libEx = D.exercises.find(e => e.id === ex.exId);
  // Barbell plate-input mode: whether this block converts typed loads. It
  // branches the GRID (an extra computed Total column), the header label, and
  // every displayed kg on it.
  const isBarbell = libEx?.equipment === 'barbell';
  const plateMode = isBarbell ? (ex.loadMode || null) : null;
  const gridCols  = plateMode ? '28px 54px 1fr 1fr 1fr 38px' : '28px 54px 1fr 1fr 38px';
  const kgHeader  = plateMode === 'side' ? 'Kg de cada lado' : plateMode === 'plates' ? 'Kg em anilhas' : (isAs?'Assist.':isBW?'BW':isBWP?'+ Kg':'Kg');
  const dispKg    = k => (k===''||k==null) ? '' : loadToDisplay(ex, k);
  // Formats a reps/kg pair for a quick-fill chip label. BW rows have no
  // meaningful kg, so they show the count alone. In a plate mode the kg is
  // CONVERTED to the block's input units — a chip must read in the same
  // currency the field expects, or "▲ 8 × 100" over a per-side column misleads.
  // A timed row's count is a DURATION, so it reads "1:00".
  const cntLbl  = r => isTm ? fmtSecs(r) : `${r ?? '–'} reps`;
  const fmtPair = (r,k) => isBW ? cntLbl(r)
    : `${isTm ? fmtSecs(r) : (r ?? '–')} × ${k==null?'–':dispKg(k)} ${plateMode==='side'?'/lado':plateMode==='plates'?'anilhas':(isAs?'assist.':'kg')}`;
  return { ex, i, isAs, isBW, isBWP, isTm, libEx, isBarbell, plateMode, gridCols, kgHeader, dispKg, cntLbl, fmtPair, bw: currentBW() };
}

// One set row. `opts.nameHTML`, passed only by the superset round view, adds
// the member-name line above the controls — which is why a grouped row is two
// lines: inside a round the W/WU toggle CANNOT be dropped to make space for
// the name, because intent is per-member-per-round there (member A warming up
// while member B works is an explicitly supported shape), so the toggle is
// the control that expresses it.
function setRowHTML(ctx, s, j, opts = {}) {
  const { i, isBW, plateMode, gridCols, dispKg, fmtPair, bw } = ctx;
  const isWork = s.intent === 'work';
  const rv = (s.reps===''||s.reps==null) ? '' : s.reps;
  const kv = (s.kg===''  ||s.kg==null)   ? '' : s.kg;
  const repsColor = s.repsEdited ? TX : DM;
  const kgColor   = s.kgEdited   ? TX : DM;

  // Quick-fill chips — up to two per work row. "Repeat last time" always
  // shows when there's history; "apply suggestion" only when it actually
  // differs from last time. Tapping either fills reps+kg at once and marks
  // the row edited, same as typing — see applyChip().
  let chips = '';
  if (isWork && (s.lastReps!=null || s.lastKg!=null)) {
    const parts = [`<button onclick="applyChip(${i},${j},'last')" style="background:none;border:none;padding:2px 6px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:${DM}">↺ ${fmtPair(s.lastReps,s.lastKg)}</button>`];
    // Bodyweight never has a suggested/last kg, so comparing kg there would
    // always read as "different" even when the rep suggestion is identical.
    const sameAsLast = s.sugReps===s.lastReps && (isBW || s.sugKg===s.lastKg);
    if ((s.sugReps!=null || s.sugKg!=null) && !sameAsLast) {
      // A lower rep target is never a regression — structurally it only ever
      // results from a weight graduation (reps reset to the bottom of the
      // range on purpose). Shown from the weight's perspective (▲) with a
      // distinct color, so a graduation stands out without reading as bad news.
      const isGraduation = s.sugReps!=null && s.lastReps!=null && s.sugReps < s.lastReps;
      parts.push(`<button onclick="applyChip(${i},${j},'sug')" style="background:none;border:none;padding:2px 6px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:${isGraduation?CA:CG}">▲ ${fmtPair(s.sugReps,s.sugKg)}</button>`);
    }
    chips = `<div style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:2px">${parts.join('')}</div>`;
  }

  // Completed checkbox — every row, warm-ups included. Warm-up completion
  // doesn't feed memory/volume (those filter to intent==='work' upstream),
  // it's purely the user's own tracking — but checking it still confirms
  // whatever's in the fields, same as a work row (see toggleCompleted()).
  const checkCell = `<button onclick="toggleCompleted(${i},${j})" aria-label="Concluído" style="width:100%;min-height:38px;border-radius:7px;border:1px solid ${s.completed?CG:BD};background:${s.completed?CG:'transparent'};color:#fff;font-size:14px;font-weight:700;cursor:pointer;padding:0">${s.completed?'✓':''}</button>`;

  // The Total cell (plate modes only) — computed, read-only, always the
  // stored grand total. A converted input of exactly 0 is the empty bar.
  const dv = dispKg(s.kg);
  const totalCell = !plateMode ? '' : (kv === ''
    ? `<div style="text-align:center;font-size:12px;color:${DM}">–</div>`
    : `<div style="text-align:center;line-height:1.2"><span style="font-size:13px;color:${TX}">${kv}</span>${dv === 0 ? `<div style="font-size:9px;color:${DM}">barra vazia</div>` : ''}</div>`);

  return `<div style="margin-bottom:8px">
    ${opts.nameHTML || ''}
    ${chips}
    <div style="display:grid;grid-template-columns:${gridCols};gap:6px;align-items:center">
      ${checkCell}
      <button onclick="toggleIntent(${i},${j})" style="padding:10px 0;border:none;border-radius:7px;
        background:${isWork?CG:'#555'};color:#fff;font-weight:700;font-size:11px;cursor:pointer;
        font-family:inherit;text-align:center;width:100%">${isWork?'W':'WU'}</button>
      <input id="s-reps-${i}-${j}" type="number" inputmode="decimal" placeholder="${s.phReps||'Reps'}" value="${rv}"
        oninput="setVal(${i},${j},'reps',this.value)" onfocus="focusVal(this)" onblur="blurVal(this)"
        style="background:${BG3};border:1px solid ${BD};border-radius:7px;color:${repsColor};font-size:15px;padding:10px 4px;text-align:center;outline:none;width:100%;box-sizing:border-box">
      ${isBW
        ? `<div style="text-align:center;font-size:12px;color:${DM};padding:4px">${bw?bw+'kg':'BW'}</div>`
        : `<input id="s-kg-${i}-${j}" type="number" inputmode="decimal" placeholder="${plateMode==='side'?'Por lado':plateMode==='plates'?'Anilhas':(ctx.isAs?'Assist.':'Kg')}" step="0.5" value="${dispKg(kv)}"
             oninput="setVal(${i},${j},'kg',this.value)" onfocus="focusVal(this)" onblur="blurVal(this)"
             style="background:${BG3};border:1px solid ${ctx.isAs?CA:BD};border-radius:7px;color:${kgColor};font-size:15px;padding:10px 4px;text-align:center;outline:none;width:100%;box-sizing:border-box">`}
      ${totalCell}
      <button onclick="rmSet(${i},${j})" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px;line-height:1;text-align:center;width:100%">×</button>
    </div>
  </div>`;
}

function buildExBlock(ex, i) {
  if (ex.slot) return buildSlotBlock(ex, i);
  const isS  = ex.type==='strength', isH=ex.type==='hypertrophy';
  const isW  = ex.regime==='weighted';
  const isFirst = i===0, isLast=i===S.exercises.length-1;
  // Everything the set rows need, built once and shared VERBATIM with the
  // superset round view (see exRowCtx) so the two renderings can never drift.
  const ctx = exRowCtx(ex, i);
  const { isAs, isBW, isBWP, isTm, libEx, isBarbell, plateMode, gridCols, kgHeader, dispKg } = ctx;

  // Same exercise+type+regime logged more than once in this session (e.g.
  // a squat→curl→squat→curl superset) is supported, not blocked — history
  // combines their sets for suggestions/graduation (see
  // getRecentWorkHistory()), and Histórico/Planos always show each
  // occurrence separately in the order they were added. The border +
  // info icon here are purely a same-session heads-up so it's obvious at a
  // glance this isn't accidental duplication, not a restriction.
  const isDuplicated = S.exercises.filter(e =>
    memKey(e.exId, e.type, e.regime||'weighted') === memKey(ex.exId, ex.type, ex.regime||'weighted')
  ).length > 1;

  // Reads the suggestion buildSetsFromMemory() already cached on the
  // exercise object (ex._sug) rather than recomputing computeSuggestion()
  // again here — keeps this banner and each row's sug*/last* chip fields
  // single-sourced so they can never disagree, and avoids redundantly
  // re-deriving the same result on every render. Refreshed on the same
  // triggers the row data already refreshes on: adding the exercise, or
  // changing its type/regime mid-session (setExType/setExRegime both
  // re-run buildSetsFromMemory).
  const sug = ex._sug;
  const stallBanner = (sug && sug.stallStreak >= 2) ? `
    <div style="background:#2d1010;border:1px solid #5c1a1a;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12px;color:#e57373">
      Mesma carga há ${sug.stallStreak} treinos — foque em completar todas as séries no topo da faixa de reps antes de aumentar a carga.
    </div>` : '';

  // Availability lives on the LIBRARY entry, not the session copy — ctx.libEx
  // is looked up fresh on every render, so a mid-session availability edit is
  // reflected. Only warns when this session actually has a gym context
  // (S.gymId); never blocks — maybe the machine exists and the tags are stale.
  const unavailableHere = S.gymId && libEx && !availableAtGym(libEx, S.gymId);
  const unavailableBanner = unavailableHere ? `
    <div style="background:#1e1a00;border:1px solid #5a4a00;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12px;color:#e6c84a;display:flex;align-items:center;gap:10px">
      <span style="flex:1">Não disponível em ${esc(S.gymName||'nesta academia')} — trocar por um exercício equivalente?</span>
      ${Bs(BG3,TX,'Trocar',`openSwapEx(${i})`,';flex-shrink:0;padding:6px 10px;font-size:12px')}
    </div>` : '';

  // First-ever log of this exercise (no sug) has no warm-ups yet — see
  // estimateWarmups(). Disappears on its own once warm-up rows exist
  // (generated from an estimate, or from real history the next time this
  // exercise is logged); reappears if they're all removed.
  const hasWarmups = ex.sets.some(s => s.intent === 'warmup');
  const estimatePrompt = (!sug && !isBW && !hasWarmups) ? `
    <div style="background:${BG3};border:1px solid ${BD};border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12px;color:${DM}">
      Primeira vez com este exercício — sem histórico para calcular o aquecimento. Quanto você espera usar hoje?
      <input type="number" inputmode="decimal" step="0.5" placeholder="${isAs?'Assist. estimado':(plateMode?'Kg estimado (total, com barra)':'Kg estimado')}"
        onchange="estimateWarmups(${i}, this.value)"
        style="margin-top:8px;width:100%;background:${BG2};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:14px;padding:8px 10px;outline:none;box-sizing:border-box">
    </div>` : '';

  // Per-exercise session note — "how THIS exercise went today" (a twinge, a
  // seat position that worked, why the load dropped). Deliberately distinct
  // from the two notes that already exist: a MACHINE note is a durable fact
  // about the apparatus, and a PLAN note is a standing instruction. This one
  // is history: it belongs to this session and is read back in Histórico.
  // Shown expanded whenever it has content, so a written note is never
  // hidden behind a tap.
  const noteOpen = _exNoteEdit === i || !!ex.note;
  const noteRow = noteOpen ? `
    <div style="margin-bottom:10px">
      <input type="text" value="${esc(ex.note || '')}" placeholder="Como foi hoje? Ex.: banco 7, ombro incomodou"
        onchange="setExNote(${i}, this.value)"
        style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:13px;padding:8px 10px;outline:none;box-sizing:border-box">
    </div>` : '';

  const setHeader = ex.sets.length ? `
    <div style="display:grid;grid-template-columns:${gridCols};gap:6px;margin-bottom:6px">
      <span></span>
      <span style="font-size:11px;color:${DM};text-align:center">Tipo</span>
      <span style="font-size:11px;color:${DM};text-align:center">${isTm ? 'Segundos' : 'Reps'}</span>
      <span style="font-size:11px;color:${DM};text-align:center">${kgHeader}</span>
      ${plateMode ? `<span style="font-size:11px;color:${DM};text-align:center">Total</span>` : ''}
      <span></span>
    </div>` : '';

  // One row per set — rendered by the SHARED renderer, so the plain block
  // and the superset round view can never disagree about what a set row is.
  const setRows = ex.sets.map((s,j) => setRowHTML(ctx, s, j)).join('');

  // Exercise-level done state is DERIVED from the sets (every set
  // explicitly completed), never stored — the two ways of finishing an
  // exercise (checking its header box, or checking every set) converge on
  // the same data. _collapsed is the only stored flag, and it's live-
  // session UI state, stripped at save.
  const done = exIsDone(ex);
  const doneCheck = `<button onclick="toggleExDone(${i})" aria-label="Exercício concluído" style="flex-shrink:0;width:26px;height:26px;border-radius:7px;border:1px solid ${done?CG:BD};background:${done?CG:'transparent'};color:#fff;font-size:13px;font-weight:700;cursor:pointer;padding:0">${done?'✓':''}</button>`;

  // Collapsed: one compact row — chevron/name to expand, the done box, and
  // a set-count summary. Everything else (toggles, sets, banners, buttons)
  // stays out of the way; that's the point of focus mode.
  // The chevron: SAME size and SAME leftmost position in both states —
  // collapsed (▸) and expanded (▾) — so folding a block never makes the
  // control jump around. Sized for thumbs (17px glyph, generous padding).
  const chevron = open => `<button onclick="toggleExCollapse(${i})" title="${open?'Minimizar':'Expandir'}" style="flex-shrink:0;background:none;border:none;color:${DM};font-size:17px;cursor:pointer;padding:6px 6px;line-height:1">${open?'▾':'▸'}</button>`;

  if (ex._collapsed) {
    const checked = ex.sets.filter(s => s.completed === true).length;
    return `
    <div id="exblk-${i}" style="background:${BG2};border:1px solid ${done?'#1a4a3a':(isDuplicated?CA:BD)};border-radius:10px;margin-bottom:8px;overflow:hidden;opacity:${done?'.75':'1'}">
      <div style="display:flex;align-items:center;gap:8px;padding:7px 12px 7px 6px">
        ${chevron(false)}
        ${doneCheck}
        <button onclick="toggleExCollapse(${i})" style="flex:1;min-width:0;background:none;border:none;color:${TX};font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-align:left;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.exName)}</button>
        <span style="flex-shrink:0;font-size:12px;color:${done?'#6fcf97':DM}">${checked}/${ex.sets.length} ✓</span>
      </div>
    </div>`;
  }

  return `
    <div id="exblk-${i}" style="background:${BG2};border:1px solid ${isDuplicated?CA:BD};border-radius:10px;margin-bottom:12px;overflow:hidden">
      <!-- Exercise header: chevron (always leftmost), reorder arrows, name, done box, type/regime toggles, buttons -->
      <div style="padding:10px 12px 10px 6px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid ${BD};gap:6px">
        <div style="display:flex;align-items:center;flex-shrink:0;align-self:stretch">${chevron(true)}</div>
        <div style="display:flex;flex-direction:column;gap:2px;padding-top:2px;flex-shrink:0">
          <button onclick="moveEx(${i},-1)" ${isFirst?'disabled':''} style="background:none;border:none;color:${isFirst?BD:DM};font-size:14px;cursor:${isFirst?'default':'pointer'};padding:1px 4px;line-height:1">▲</button>
          <button onclick="moveEx(${i},1)"  ${isLast?'disabled':''} style="background:none;border:none;color:${isLast?BD:DM};font-size:14px;cursor:${isLast?'default':'pointer'};padding:1px 4px;line-height:1">▼</button>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:15px;margin-bottom:6px;display:flex;align-items:center;gap:6px">
            <button onclick="openExerciseDetail('${ex.exId}')" title="Ver dicas e detalhes" style="flex:1;min-width:0;background:none;border:none;color:${TX};font-weight:700;font-size:15px;font-family:inherit;text-align:left;padding:0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.exName)}</button>
            ${isDuplicated ? `<button onclick="alert('Este exercício aparece mais de uma vez neste treino (mesmo tipo e regime). O histórico combina os dados das duas entradas para sugestões futuras, mas cada uma é salva separadamente, na ordem em que foram adicionadas.')" style="flex-shrink:0;background:none;border:1px solid ${CA};color:${CA};border-radius:99px;width:16px;height:16px;font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0">i</button>` : ''}
            ${doneCheck}
          </div>
          ${ex._planNote ? `<div style="font-size:11px;color:#4dd0c4;margin:-2px 0 6px">📋 ${esc(ex._planNote)}</div>` : ''}
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <button onclick="setExType(${i},'strength')"    style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isS?'#A32D2D':BG3};color:${isS?TX:DM}">Força</button>
            <button onclick="setExType(${i},'hypertrophy')" style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isH?CB:BG3};color:${isH?TX:DM}">Hipert.</button>
            <button onclick="setExRegime(${i},'weighted')"   style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isW?CB:BG3};color:${isW?TX:DM}">Carga</button>
            <button onclick="setExRegime(${i},'assisted')"   style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isAs?CA:BG3};color:${isAs?TX:DM}">Assist.</button>
            <button onclick="setExRegime(${i},'bodyweight')" style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isBW?CG:BG3};color:${isBW?TX:DM}">BW</button>
            <button onclick="setExRegime(${i},'${REGIME_BW_PLUS}')" title="Peso corporal + carga adicional (cinto, colete)" style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isBWP?'#0a2438':BG3};color:${isBWP?'#7fb8e0':DM}">BW+</button>
          </div>
          <!-- Machine chip — which SPECIFIC apparatus this is being done on.
               Numbers are machine-calibrated (owner: "much stronger in
               different machines"), so the chip is always visible: filled =
               teal with the machine's name (+ its settings note beside it,
               readable mid-set), empty = a quiet invitation to identify. -->
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px">
            <button onclick="openMachinePicker(${i})" title="Equipamento específico" style="padding:4px 9px;border-radius:99px;border:1px solid ${ex.instanceId?'#14484a':BD};font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${ex.instanceId?'#0a2e2e':BG3};color:${ex.instanceId?'#4dd0c4':DM};max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🔧 ${ex.instanceName?esc(ex.instanceName):equipChipLabel(ex.exId)}</button>
            ${isBarbell && !ex._loadSetup ? `<button onclick="toggleLoadSetup(${i})" title="Como digitar a carga" style="padding:4px 9px;border-radius:99px;border:1px solid ${plateMode?'#14484a':BD};font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${plateMode?'#0a2e2e':BG3};color:${plateMode?'#4dd0c4':DM};white-space:nowrap">⚖ ${plateMode==='side'?`por lado · barra ${ex.barKg||0} kg`:plateMode==='plates'?`anilhas · barra ${ex.barKg||0} kg`:'total'}</button>` : ''}
            ${(() => { const m = ex.instanceId && D.machines.find(mm => mm.id === ex.instanceId); if (!m) return '';
              const bits = [m.barKg && !isBarbell ? `barra ${m.barKg} kg` : null, m.note].filter(Boolean);
              return bits.length ? `<span style="font-size:11px;color:${DM}">${esc(bits.join(' · '))}</span>` : ''; })()}
          </div>
          ${isBarbell && ex._loadSetup ? `
          <!-- The plate-input setup (owner-designed flow): bar weight + how
               loads will be TYPED. Choosing a mode collapses this back to
               the ⚖ chip. Display-only switch — stored kg stays the grand
               total, so flipping modes mid-session rewrites no data, only
               how the fields read. -->
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;padding:8px 10px;background:${BG3};border:1px solid ${BD};border-radius:8px">
            <span style="font-size:11px;color:${DM}">Barra</span>
            <input id="lb-bar-${i}" type="number" inputmode="decimal" step="0.5" min="0" value="${ex.barKg??''}" placeholder="kg"
              onchange="setBlockBarKg(${i}, this.value)"
              style="width:58px;background:${BG2};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:13px;padding:6px 6px;text-align:center;outline:none">
            <span style="font-size:11px;color:${DM}">· digitar em:</span>
            <button onclick="setLoadMode(${i}, null)"     style="padding:5px 10px;border-radius:99px;border:none;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${!plateMode?CG:BG2};color:${!plateMode?TX:DM}">Total</button>
            <button onclick="setLoadMode(${i}, 'side')"   style="padding:5px 10px;border-radius:99px;border:none;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${plateMode==='side'?CG:BG2};color:${plateMode==='side'?TX:DM}">Por lado</button>
            <button onclick="setLoadMode(${i}, 'plates')" style="padding:5px 10px;border-radius:99px;border:none;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${plateMode==='plates'?CG:BG2};color:${plateMode==='plates'?TX:DM}">Anilhas</button>
          </div>` : ''}
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
          <button onclick="rmEx(${i})" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px 6px;line-height:1;margin-top:-2px">×</button>
          <button onclick="openSwapEx(${i})" title="Trocar exercício" style="background:none;border:none;color:${DM};font-size:15px;cursor:pointer;padding:2px 6px;line-height:1">⇄</button>
          <button onclick="openExRest(${i})" title="Descanso deste exercício" style="background:none;border:none;color:${ex.rest?'#6fcf97':DM};font-size:13px;cursor:pointer;padding:2px 6px;line-height:1">⏱</button>
          <button onclick="toggleExNote(${i})" title="Observação deste exercício hoje" style="background:none;border:none;color:${ex.note||_exNoteEdit===i?'#4dd0c4':DM};font-size:13px;cursor:pointer;padding:2px 6px;line-height:1">📝</button>
        </div>
      </div>
      <!-- Set rows -->
      <div style="padding:12px 16px">
        ${unavailableBanner}
        ${stallBanner}
        ${noteRow}
        ${estimatePrompt}
        ${!ex.sets.length ? `<div style="font-size:13px;color:${DM};margin-bottom:8px">Nenhuma série. Adicione abaixo.</div>` : ''}
        ${setHeader}${setRows}
        ${(() => {
          // Per-side plate readout — barbell blocks with a known bar weight
          // that are still typing plain TOTALS. In a plate-input mode the
          // grid itself carries the conversion (input column + Total
          // column), so this line would be redundant noise there. Values
          // below the bar's own weight are skipped — nothing sensible to
          // show for them.
          if (plateMode || !isBarbell) return '';
          const bar = ex.barKg || (ex.instanceId ? D.machines.find(mm => mm.id === ex.instanceId)?.barKg : null);
          if (!bar) return '';
          const vals = [...new Set(ex.sets.filter(hasKg).map(s => Number(s.kg)))].filter(v => v >= bar).sort((a,b) => a-b);
          if (!vals.length) return '';
          return `<div style="font-size:11px;color:${DM};margin-top:8px">Barra ${bar} kg → por lado: ${vals.map(v => `<strong style="color:${TX}">${v}</strong> kg = ${round((v - bar) / 2, 0.25)}`).join(' · ')}</div>`;
        })()}
        ${B(BG3,TX,'+ Série',`addSet(${i})`,';margin-bottom:0;margin-top:4px')}
      </div>
    </div>`;
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  12. TAB: HISTORY (Histórico)
// ║
// ║  Sorted list of saved sessions, newest first — each collapsed row shows
// ║  plan name, date, gym tag, counted-set count and volume; tappable to
// ║  expand into per-exercise set detail.
// ║  Actions: Edit (loads the session back into the Log tab), Criar plano
// ║  (extracts it into a plan — openPlanFromSession, section 19), Delete.
// ║  Header buttons: 📊 Volume (weekly muscle-volume table, below) and
// ║  Backup & Sync (section 20).
// ╚══════════════════════════════════════════════════════════════════════════════

function buildHistory() {
  const bkp = `<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px">${Bs(BG3,DM,'📊 Volume','openVolume()')}${Bs(BG3,DM,'⬆ Backup & Sync','openBackup()')}</div>`;
  if (!D.sessions.length)
    return bkp + `<div style="text-align:center;color:${DM};padding:40px;font-size:14px">Nenhum treino salvo ainda.</div>`;

  const sorted = [...D.sessions].sort((a,b) => b.date.localeCompare(a.date));
  return bkp + `<div style="font-size:18px;font-weight:700;margin-bottom:16px">Histórico</div>` + sorted.map(s => {
    // `ex.tracking` is snapshotted on the session entry (like type/regime),
    // so a timed exercise stays excluded from the volume-load total even
    // after its library entry is deleted or retracked.
    const v  = s.exercises.reduce((a,ex) => a + volEx(ex.sets, ex.regime, isTimed(ex)), 0);
    // isCountedWork, not a bare intent==='work' check — an explicitly-
    // unchecked set shouldn't inflate the displayed series count when the
    // volume total on the same line already excludes it via volEx().
    const ws = s.exercises.reduce((a,ex) => a + (ex.sets||[]).filter(isCountedWork).length, 0);
    const open = EXP === s.id;

    let detail = '';
    if (open) {
      const exRows = s.exercises.map(ex => {
        let wc = 0;
        const lines = (ex.sets||[]).map(set => {
          if (set.intent==='work') wc++;
          const lbl = set.intent==='work' ? `W${wc}` : 'WU';
          const bw  = currentBW();
          // hasKg (shared, section 4), not a truthy check — a genuinely-
          // entered 0kg set (full graduation for assisted; a deliberate
          // 0kg entry for weighted) must show "0", not "–" as if untouched.
          const kgLbl = ex.regime==='bodyweight' ? (bw?`${bw}kg (BW)`:'BW')
            : ex.regime===REGIME_BW_PLUS ? (bw ? `+${hasKg(set)?set.kg:0} kg (${bw+(hasKg(set)?Number(set.kg):0)}kg real)` : `+${hasKg(set)?set.kg:'–'} kg`)
            : ex.regime==='assisted' ? (bw ? `${hasKg(set)?set.kg:'–'} assist. (${bw&&hasKg(set)?Math.max(0,bw-Number(set.kg)):'-'}kg real)` : `${hasKg(set)?set.kg:'–'} assist.`)
            : `${hasKg(set)?set.kg:'–'} kg`;
          return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid ${BD};font-size:14px">
            <span style="background:${set.intent==='work'?CG:'#555'};color:#fff;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;min-width:34px;text-align:center">${lbl}</span>
            <span>${isTimed(ex) ? `${fmtSecs(set.reps)} × ${kgLbl}` : `${set.reps||'–'} reps × ${kgLbl}`}</span>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">
            <span style="font-weight:600">${esc(ex.exName)}</span>${typePill(ex.type)}${ex.regime?regimePill(ex.regime):''}${ex.instanceName?`<span style="font-size:11px;color:${DM}">🔧 ${esc(ex.instanceName)}</span>`:''}
          </div>${ex.note ? `<div style="font-size:12px;color:#4dd0c4;margin:-2px 0 6px;line-height:1.4">📝 ${esc(ex.note)}</div>` : ''}${lines}
        </div>`;
      });

      // Superset bracket (E3b). History deliberately keeps each exercise as
      // its own block with its own sets — progression is measured per
      // exercise whether or not they were performed together (owner: "the
      // history should track each exercise individually, even if they're done
      // together"). The grouping is shown, not re-modelled: contiguous
      // same-`ss` blocks are wrapped in one labelled frame. A round-by-round
      // history RENDERING is deliberately not v1; the marker is stored, so it
      // stays available if it's ever wanted.
      const wrapped = [];
      s.exercises.forEach((ex, k) => {
        const prev = wrapped[wrapped.length - 1];
        if (ex.ss && prev && prev.gid === ex.ss) { prev.html.push(exRows[k]); return; }
        wrapped.push(ex.ss ? { gid: ex.ss, html: [exRows[k]] } : { gid: null, html: [exRows[k]] });
      });
      const exRowsHTML = wrapped.map(u => u.gid
        ? `<div style="border-left:2px solid ${CS};padding-left:10px;margin-bottom:14px">
             <div style="font-size:11px;color:${CST};font-weight:700;margin-bottom:8px">⛓ SUPERSET · ${u.html.length} exercícios</div>
             ${u.html.join('')}
           </div>`
        : u.html.join('')).join('');

      detail = `<div style="border-top:1px solid ${BD};padding:14px 16px">${exRowsHTML}
        <div style="display:flex;gap:8px;margin-top:12px">
          ${Bs(BG3,TX,'Editar',`editSess('${s.id}')`,';flex:1;padding:10px;justify-content:center')}
          ${Bs(BG3,TX,'Criar plano',`openPlanFromSession('${s.id}')`,';flex:1;padding:10px;justify-content:center')}
          ${Bs('#1a0808',CR,'Excluir',`delSess('${s.id}')`,`;flex:1;padding:10px;justify-content:center;border:1px solid #3a1010`)}
        </div>
      </div>`;
    }

    return `<div style="background:${BG2};border:1px solid ${BD};border-radius:10px;margin-bottom:9px;overflow:hidden">
      <div onclick="toggleExp('${s.id}')" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <div>
          <div style="font-weight:600">${esc(s.planName||'Treino livre')}</div>
          <div style="font-size:13px;color:${DM}">${fmt(s.date)}${s.gymName?` · ${esc(s.gymName)}`:''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;color:${DM}">${ws} série${ws!==1?'s':''} · ${s.exercises.length} ex.</div>
          ${v>0 ? `<div style="font-size:12px;color:${DM}">${v.toFixed(0)} kg vol.</div>` : ''}
        </div>
      </div>${detail}
    </div>`;
  }).join('');
}


// ── Weekly muscle-volume view (📊 Volume, Histórico header) ──────────────────
//
// Counted work sets per muscle group over the last 4 weeks, against the
// usual 10–20 sets/week hypertrophy guideline — the first analytics payoff
// of the muscle classification beyond filtering and swap suggestions.
// Current-week cell is color-coded (amber under 10, green 10–20, red
// over 20, dim zero); past weeks stay neutral — the guideline is about
// steering THIS week, not grading history.
function openVolume() {
  const { mondays, rows } = weeklyMuscleVolume(4);
  const dd = s => `${s.slice(8,10)}/${s.slice(5,7)}`;
  const fmtN = n => n === 0 ? `<span style="color:${BD}">–</span>` : (Number.isInteger(n) ? n : n.toFixed(1));
  const curColor = n => n === 0 ? BD : n < 10 ? '#e6c84a' : n <= 20 ? '#6fcf97' : '#e57373';
  const header = `<div style="display:grid;grid-template-columns:1.6fr repeat(4, 1fr);gap:4px;padding:4px 0;border-bottom:1px solid ${BD}">
    <span style="font-size:10px;color:${DM};text-transform:uppercase;letter-spacing:.04em">Grupo</span>
    ${mondays.map((m, i) => `<span style="font-size:10px;color:${i === 3 ? TX : DM};text-align:center;font-weight:${i === 3 ? '700' : '400'}">${i === 3 ? 'agora' : dd(m)}</span>`).join('')}
  </div>`;
  const lines = Object.entries(rows).map(([muscle, counts]) => `
    <div style="display:grid;grid-template-columns:1.6fr repeat(4, 1fr);gap:4px;padding:6px 0;border-bottom:.5px solid ${BD};align-items:center">
      <span style="font-size:13px">${MUSCLE_GROUPS[muscle]}</span>
      ${counts.map((n, i) => `<span style="font-size:13px;text-align:center;font-variant-numeric:tabular-nums;${i === 3 ? `font-weight:700;color:${curColor(n)}` : `color:${n === 0 ? BD : DM}`}">${fmtN(n)}</span>`).join('')}
    </div>`).join('');
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Volume semanal por músculo</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Séries contadas por semana (seg–dom). Músculo principal vale 1, acessórios ½. Meta usual de hipertrofia: <strong style="color:#6fcf97">10–20</strong> séries/semana.</div>
    ${header}${lines}
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0;margin-top:14px')}`);
}

// Category cards + exercise rows. Shared by the full render and the

  if (!D.exercises.length)
    return `<div style="text-align:center;color:${DM};padding:32px 0;font-size:14px;line-height:1.7">Nenhum exercício cadastrado.<br>Adicione manualmente pelo botão "+ Novo" acima.</div>`;

// Header line describing the active filter/category context.
function libCountNote() {
  const filtered = applyFilters(D.exercises, _libFMove, _libSearch, _libAlpha, _libUnclassed, _libFMuscle, _libFPattern);
  if (_libFMuscle && _libFPattern) {

// ── Per-exercise progress chart (tap an exercise in the Library) ─────────────

// Inline SVG line chart — no libraries (CSP-clean, offline, ~zero bytes).
// X = session order (even spacing; the question is "am I progressing per
// session", not calendar density), Y = the regime's metric. Weighted gets
// a second, dimmer estimated-1RM line. Assisted is deliberately NOT
// inverted: the raw counterweight is plotted and the caption says falling
// = progress — flipping the axis would make the numbers lie.
function progressChartSVG(prog) {
  const P = prog.points;
  if (P.length < 2) return '';
  const W = 420, H = 190, padL = 40, padR = 10, padT = 14, padB = 24;
  const vals = P.flatMap(p => p.e1rm != null ? [p.metric, p.e1rm] : [p.metric]);
  let min = Math.min(...vals), max = Math.max(...vals);
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  min -= span * 0.08; max += span * 0.08;
  const x = i => padL + i * (W - padL - padR) / (P.length - 1);
  const y = v => padT + (max - v) * (H - padT - padB) / (max - min);
  const line = key => P.map((p, i) => p[key] == null ? null : `${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).filter(Boolean).join(' ');
  const last = P[P.length - 1];
  const dd = s => `${s.slice(8,10)}/${s.slice(5,7)}`;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <line x1="${padL}" y1="${y(min)}" x2="${W-padR}" y2="${y(min)}" stroke="${BD}" stroke-width="1"/>
    ${prog.regime === 'weighted' && P.some(p => p.e1rm != null) ? `<polyline points="${line('e1rm')}" fill="none" stroke="${CB}" stroke-width="1.5" stroke-dasharray="4 3" opacity=".8"/>` : ''}
    <polyline points="${line('metric')}" fill="none" stroke="${CG}" stroke-width="2.5" stroke-linejoin="round"/>
    ${P.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.metric)}" r="2.5" fill="${CG}"/>`).join('')}
    <circle cx="${x(P.length-1)}" cy="${y(last.metric)}" r="4.5" fill="${CG}" stroke="${BG}" stroke-width="1.5"/>
    <text x="${padL-6}" y="${y(max - span*0)}" fill="${DM}" font-size="10" text-anchor="end" dominant-baseline="hanging">${Math.round(max)}</text>
    <text x="${padL-6}" y="${y(min)}" fill="${DM}" font-size="10" text-anchor="end">${Math.round(min)}</text>
    <text x="${padL}" y="${H-6}" fill="${DM}" font-size="10">${dd(P[0].date)}</text>
    <text x="${W-padR}" y="${H-6}" fill="${DM}" font-size="10" text-anchor="end">${dd(last.date)}</text>
  </svg>`;
}

// ── Exercise detail ───────────────────────────────────────────────────────────
//
// The reading view for an exercise: what it is, how to do it, what to watch
// out for, where it's available. Until this existed the curated content
// (cues, common errors, equipment, aliases) shipped in the data and was
// completely invisible in the app.
//
// Language: Portuguese first, English as fallback per field, so a
// half-translated entry still shows everything it has rather than a gap.
// (A real language toggle is its own backlog item — the whole UI is still
// hardcoded pt-BR.)
const EQUIPMENT_LABELS = {
  barbell: 'Barra', dumbbell: 'Halter', cable: 'Cabo', machine: 'Máquina',
  bodyweight: 'Peso corporal', band: 'Elástico', kettlebell: 'Kettlebell', other: 'Outro',
};

function openExerciseDetail(exId) {
  const ex = D.exercises.find(e => e.id === exId); if (!ex) return;
  const cues = (ex.cues_pt?.length ? ex.cues_pt : ex.cues_en) || [];
  const errs = (ex.errors_pt?.length ? ex.errors_pt : ex.errors_en) || [];
  const gymNames = (ex.gyms || []).map(id => D.gyms.find(g => g.id === id)?.name).filter(Boolean);

  const section = (title, color, items) => items.length ? `
    <div style="font-size:10px;font-weight:700;color:${color};text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px">${title}</div>
    ${items.map(t => `<div style="display:flex;gap:8px;font-size:13px;line-height:1.5;margin-bottom:6px">
      <span style="color:${color};flex-shrink:0">•</span><span>${esc(t)}</span></div>`).join('')}` : '';

  // Rest override, resolved against this exercise's own defaults so the
  // numbers shown are the ones the timer would actually use.
  const restRow = ex.rest ? `
    <div style="font-size:10px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px">Descanso próprio</div>
    <div style="font-size:12px;color:${DM}">
      ${[['wuwu','Aquec.→Aquec.'],['wuw','Aquec.→Trab.'],['ww','Trab.→Trab.']]
        .filter(([k]) => ex.rest[k] != null)
        .map(([k,l]) => `${l}: <strong style="color:${TX}">${fmtRest(ex.rest[k])}</strong>`).join(' · ')}
    </div>` : '';

  showModal(`
    <div style="font-size:18px;font-weight:700;margin-bottom:2px">${esc(ex.name)}</div>
    ${ex.name_en && nameKey(ex.name_en) !== nameKey(ex.name)
      ? `<div style="font-size:12px;color:${DM};margin-bottom:8px">${esc(ex.name_en)}</div>` : '<div style="height:6px"></div>'}
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
      ${ex.regime?regimePill(ex.regime):''}${compPill(ex.compound!=null?ex.compound:null)}${musclePill(ex.mainMuscle,ex.movementPattern)}${originPill(ex)}
      ${ex.movement ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:${BG3};color:${TX}">${esc(MOVEMENTS[ex.movement]?.pt || ex.movement)}</span>` : ''}
      ${ex.equipment ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:${BG3};color:${DM}">${esc(EQUIPMENT_LABELS[ex.equipment] || ex.equipment)}</span>` : ''}
    </div>
    ${(ex.accessoryMuscles||[]).length ? `<div style="font-size:11px;color:${DM};margin-bottom:4px">Acessórios: ${ex.accessoryMuscles.map(m => esc(MUSCLE_GROUPS[m]||m)).join(', ')}</div>` : ''}
    ${(ex.aliases||[]).length ? `<div style="font-size:11px;color:${DM}">Também: ${ex.aliases.map(esc).join(' · ')}</div>` : ''}

    ${section('Dicas', '#6fcf97', cues)}
    ${section('Erros comuns', '#e6c84a', errs)}
    ${ex.stretchEmphasis ? `<div style="margin-top:12px;padding:9px 11px;background:#0a2e2e;border:1px solid #14484a;border-radius:8px;font-size:12px;color:#4dd0c4">Trabalha bem o músculo alongado — bom candidato a parciais na porção esticada.</div>` : ''}
    ${restRow}

const REGIME_LABELS = { weighted: 'Carga', assisted: 'Assistido', bodyweight: 'Corporal' };

// The stats + chart + caption for ONE regime's series — split out so the
// regime dropdown can swap it in place (#prog-body) without rebuilding the
// modal (showModal() would close it).
function progressBodyHTML(exId, regime, instance) {
  const prog = exerciseProgress(exId, 24, regime || null, instance ?? null);
  const P = prog.points;
  if (!P.length) return `<div style="text-align:center;color:${DM};padding:24px 0;font-size:13px">Nenhum treino registrado com este exercício ainda.</div>`;
  // Machine dropdown (E2 remainder C): only when this regime's counted
  // history spans >1 calibration bucket (exerciseProgress computes the
  // buckets — empty for free weights by design). Lives INSIDE #prog-body,
  // unlike the regime select in the modal header, because a regime switch
  // must rebuild it: the bucket list is per-regime.
  const instSelect = prog.instances.length > 1 ? `
    <select onchange="progInstSwitch('${exId}', '${prog.regime}', this.value)"
      style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:12px;padding:6px 8px;outline:none;margin-bottom:10px;box-sizing:border-box">
      ${prog.instances.map(b => `<option value="${esc(b.key)}" ${b.key === prog.instance ? 'selected' : ''}>🔧 ${esc(b.name)}</option>`).join('')}
    </select>` : '';
  const unit = prog.regime === 'bodyweight' ? 'reps' : 'kg';
  const metricName = prog.regime === 'bodyweight' ? 'Reps máx.' : prog.regime === 'assisted' ? 'Contrapeso' : prog.regime === REGIME_BW_PLUS ? 'Carga adicional' : 'Carga';
  const last = P[P.length - 1];
  const best = prog.regime === 'assisted' ? Math.min(...P.map(p => p.metric)) : Math.max(...P.map(p => p.metric));
  const bestE = P.some(p => p.e1rm != null) ? Math.max(...P.map(p => p.e1rm || 0)) : null;
  const stat = (lbl, val) => `<div style="flex:1;background:${BG3};border-radius:8px;padding:8px 10px;text-align:center">
    <div style="font-size:10px;color:${DM};text-transform:uppercase;letter-spacing:.04em">${lbl}</div>
    <div style="font-size:16px;font-weight:700;margin-top:2px">${val}</div>
  </div>`;
  return `
    ${instSelect}
    <div style="display:flex;gap:8px;margin-bottom:12px">
      ${stat('Último', `${last.metric} ${unit}`)}
      ${stat(prog.regime === 'assisted' ? 'Melhor (menor)' : 'Melhor', `${best} ${unit}`)}
      ${bestE ? stat('1RM est.', `${round(bestE, 0.5)} kg`) : stat('Treinos', P.length)}
    </div>
    ${P.length >= 2 ? progressChartSVG(prog) : `<div style="text-align:center;color:${DM};padding:14px 0;font-size:12px">Registre mais um treino neste regime para ver o gráfico.</div>`}
    <div style="font-size:11px;color:${DM};margin-top:10px;line-height:1.5">
      ${metricName} por treino (${P.length} treino${P.length!==1?'s':''}, séries contadas apenas).
      ${prog.regime === 'assisted' ? 'Assistido: linha CAINDO = progresso (menos contrapeso).' : ''}
      ${prog.regime === 'weighted' && bestE ? `Linha tracejada azul: 1RM estimado (Epley).` : ''}
      ${prog.instance ? 'Mostrando só esta máquina — calibrações diferentes não se misturam.' : ''}
    </div>`;
}

//
// This dialog used to be "⟳ Catálogo": a per-entry opt-in for every curated
// exercise the install didn't have. syncGlobalLibrary() now delivers those
// automatically, so the only thing left worth asking about is the case the
// auto-sync deliberately refuses to touch — exercises the user DELETED.
// Undoing a deliberate deletion stays a deliberate act.
//
// It reads library.json, not Supabase, so it works **without an account**
// (the whole point of the delivery change). `_catalogRows` holds the
// fetched catalog for the duration of the dialog.
async function openDeletedExercises() {

function renderDeletedList() {

// Restoring CLEARS the tombstone — without that, the next merge would just
// delete the row again (mergeCollection drops any item whose updatedAt is
// older than its tombstone). The restored copy is a deliberate user action,
// so unlike an auto-synced row it carries a real updatedAt and propagates.
function restoreDeletedExercise(id) {
  const d = (_catalogRows || []).find(r => r && r.id === id);
  if (!d) return;
  delete D.tombstones.exercises[id];
  if (!D.exercises.some(e => e.id === id)) {
    // Same hardening every foreign definition gets — "trusted author" is not
    // a reason to skip validation that costs nothing.
    D.exercises.push(normalizeExerciseDef(d, ORIGIN_GLOBAL));
  }
  persist();
  renderDeletedList();  // entry disappears from the list
  render();             // library behind the modal updates too
}

// ── Seed refresh — "Atualizar do catálogo" (the Backlog's deliberate action) ─
//
// An existing install seeds ONCE and never picks up curated library changes
// on its own — the PT-BR rename reached only fresh installs, so an older
// device keeps showing "Bench press" where a fresh one says "Supino reto"
// (the owner hit exactly this registering their first real session). This
// is the deliberate, confirmed re-sync: exercises whose STABLE SLUG ID
// matches the shipped library.json are updated to the current curated
// identity — name, bilingual layer, cues/errors, equipment, movement,
// classification — with an updatedAt bump so the fix propagates to every
// other device through the normal LWW merge (strictly better than the
// per-device factory reset for this purpose: history, plans and machines
// are untouched because ids never change).
//
// Deliberately untouched: user-created exercises (id unknown to the seed)
// and the user-owned fields on seeded ones — type/regime/compound (the
// "Modo padrão" trio), rest timings, gym tags, ★ favorite. A user's RENAME
// of a seeded exercise IS overwritten — which is exactly why this is a
// button with a confirm listing every rename, not a background migration.
// A rename that collides with a user-created copy of the same exercise
// becomes a visible duplicate, and the existing duplicates banner + merge
// tool are the designed cleanup for that.
const SEED_REFRESH_FIELDS = ['name','name_en','aliases','equipment','cues_pt','cues_en','errors_pt','errors_en','stretchEmphasis','tracking','movement','mainMuscle','movementPattern','accessoryMuscles'];
let _seedRefreshMap = null;

function seedRefreshChanges(map) {
  const renames = [], contentOnly = [];
  D.exercises.forEach(ex => {
    // Since schema 6 the "don't touch the user's own exercises" promise is
    // an ENFORCED invariant rather than an emergent one. It used to rest
    // entirely on the id lookup below missing — i.e. on user ids being
    // random enough never to collide with a catalog slug. Now origin says
    // so outright, which also covers a `shared` exercise whose sender
    // happened to build it on a catalog id.
    if (!isGlobalEx(ex)) return;
    const s = map[ex.id]; if (!s) return;
    const differs = SEED_REFRESH_FIELDS.some(f => JSON.stringify(s[f] ?? null) !== JSON.stringify(ex[f] ?? null));
    if (!differs) return;
    ((s.name && s.name !== ex.name) ? renames : contentOnly).push({ ex, s });
  });
  return { renames, contentOnly };
}

async function openSeedRefresh() {
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Atualizar do catálogo</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Sincroniza os exercícios padrão desta biblioteca com a versão atual do catálogo — nomes (PT-BR), dicas, classificação e movimento. Ids não mudam: histórico, planos e máquinas ficam intactos. Exercícios criados por você nunca são tocados.</div>
    <div id="sr-body" style="font-size:13px;color:${DM}">Carregando…</div>
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0;margin-top:14px')}`);
  let seed;
  // Same no-store fetch as the one-time seeding — a plain fetch would be
  // answered from the service-worker cache and could diff against a stale
  // catalog copy.
  try { seed = await (await fetch('library.json', { cache: 'no-store' })).json(); }
  catch (e) { const b = document.getElementById('sr-body'); if (b) b.textContent = 'Não foi possível carregar o catálogo — verifique a conexão.'; return; }
  const map = {};
  (seed.exercises || []).forEach(x => { if (x.id) map[x.id] = x; });
  _seedRefreshMap = map;
  const body = document.getElementById('sr-body');
  if (!body) return; // modal closed while fetching
  const { renames, contentOnly } = seedRefreshChanges(map);
  if (!renames.length && !contentOnly.length) { body.innerHTML = `<span style="color:#6fcf97">Biblioteca em dia com o catálogo ✓</span>`; return; }
  const shown = renames.slice(0, 30);
  body.innerHTML = `
    ${renames.length ? `<div style="font-size:12px;font-weight:700;color:${TX};margin-bottom:6px">${renames.length} nome${renames.length===1?'':'s'} ser${renames.length===1?'á':'ão'} atualizado${renames.length===1?'':'s'}:</div>`
      + shown.map(({ ex, s }) => `<div style="font-size:12px;margin-bottom:3px"><span style="color:${DM}">${esc(ex.name)}</span> → <strong>${esc(s.name)}</strong></div>`).join('')
      + (renames.length > shown.length ? `<div style="font-size:11px;color:${DM}">… e mais ${renames.length - shown.length}</div>` : '') : ''}
    ${contentOnly.length ? `<div style="font-size:12px;color:${DM};margin-top:8px">+ conteúdo atualizado em ${contentOnly.length} exercício${contentOnly.length===1?'':'s'} (dicas, classificação, movimento).</div>` : ''}
    <div style="font-size:11px;color:#e6c84a;margin-top:10px">Substitui edições suas nesses campos, nesses exercícios. Modo padrão, descansos, academias e ★ não são tocados.</div>
    ${B(CG,TX,'Atualizar','applySeedRefresh()',';margin-top:12px;margin-bottom:0')}`;
}

function applySeedRefresh() {
  if (!_seedRefreshMap) return;
  const { renames, contentOnly } = seedRefreshChanges(_seedRefreshMap);
  [...renames, ...contentOnly].forEach(({ ex, s }) => {
    SEED_REFRESH_FIELDS.forEach(f => {
      const v = s[f];
      // Absent in the seed = the curated truth dropped the field — clear the
      // stale local copy too (an alias list that no longer exists, say).
      if (v === undefined) delete ex[f];
      else ex[f] = JSON.parse(JSON.stringify(v));
    });
    ex.updatedAt = Date.now(); // LWW: the refresh must win on every other device
  });
  // Live-session blocks follow the rename immediately — a live session
  // isn't history yet, and its save should snapshot the CURRENT name (the
  // same rule machine renames follow). Saved history keeps its exName
  // snapshots untouched, as always.
  (S?.exercises||[]).forEach(x => {
    if (x.slot || !_seedRefreshMap[x.exId]) return;
    const lib = D.exercises.find(e => e.id === x.exId);
    if (lib) x.exName = lib.name;
  });
  persist(); closeModal(); render();
}

// ── Duplicate detection & merge ───────────────────────────────────────────────
//
// Duplicates aren't just clutter: the progression engine keys on exId
// (getRecentWorkHistory/computeSuggestion), so two entries with the same
// name mean two SPLIT histories — suggestions, graduation and the progress
// chart all see half the story. Several paths could create them before the
// guards added alongside this (mid-session quick-create, "+ Novo", a
// catalog add whose id differs from a local hand-made copy), and no path
// existed to find or fix them afterwards.

function duplicateGroups() {
  const by = {};
  D.exercises.forEach(ex => { (by[nameKey(ex.name)] ||= []).push(ex); });
  return Object.entries(by)
    .filter(([, list]) => list.length > 1)
    .map(([key, list]) => ({ key, name: list[0].name, entries: list }))
    .sort((a, b) => b.entries.length - a.entries.length || a.name.localeCompare(b.name, 'pt'));
}

// How much history hangs off an exercise — decides which copy to keep and
// warns before anything is discarded.
function exerciseUsage(id) {
  const sessions = D.sessions.filter(s => (s.exercises||[]).some(e => e.exId === id)).length;
  // Entry-aware since schema 5: a plan uses an exercise as a concrete
  // entry's pick or as a slot's remembered per-gym resolution.
  const plans    = D.plans.filter(p => (p.exercises||[]).some(en =>
    en.exId === id || Object.values(en.perGym||{}).includes(id))).length;
  return { sessions, plans };
}

// Rewrites every reference from the duplicates onto the keeper, then
// tombstones them. Nothing is thrown away: sessions keep all their sets
// (only the exId pointer moves — exName stays as the historical snapshot
// of what it was called at the time), and plans keep their slot. Touched
// records get updatedAt bumped so the merge propagates through the
// per-item LWW sync instead of being undone by another device.
function mergeExercises(keeperId, dupIds) {
  const now = Date.now();
  D.sessions.forEach(s => {
    let touched = false;
    (s.exercises||[]).forEach(e => { if (dupIds.includes(e.exId)) { e.exId = keeperId; touched = true; } });
    if (touched) s.updatedAt = now;
  });
  D.plans.forEach(p => {
    let touched = false;
    // Entry-aware since schema 5: repoint concrete picks AND per-gym slot
    // memories. Deliberately NO de-duplication anymore — two entries
    // resolving to one exercise is the valid superset shape (each keeps
    // its own eid and its own rest), not an artifact to clean. Rests key
    // by eid, so merging exercises moves no timing keys at all.
    (p.exercises||[]).forEach(en => {
      if (dupIds.includes(en.exId)) { en.exId = keeperId; touched = true; }
      Object.entries(en.perGym||{}).forEach(([g, v]) => {
        if (dupIds.includes(v)) { en.perGym[g] = keeperId; touched = true; }
      });
    });
    if (touched) p.updatedAt = now;
  });
  dupIds.forEach(id => { D.tombstones.exercises[id] = now; });
  D.exercises = D.exercises.filter(e => !dupIds.includes(e.id));
  persist();
}

// Which copy each group is currently set to keep (defaults to the one
// carrying the most history). Reset every time the modal opens.
let _dupKeepers = {};

function openDuplicates() {
  const groups = duplicateGroups();
  _dupKeepers = {};
  groups.forEach(g => {
    const best = [...g.entries].sort((a, b) => {
      const ua = exerciseUsage(a.id), ub = exerciseUsage(b.id);
      return (ub.sessions - ua.sessions) || (ub.plans - ua.plans);
    })[0];
    _dupKeepers[g.key] = best.id;
  });
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Exercícios duplicados</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Exercícios com o mesmo nome dividem o histórico: as sugestões e o gráfico de progresso enxergam só metade dos treinos. Escolha qual manter e unifique — nenhum treino é perdido, as séries são reapontadas para o exercício escolhido.</div>
    <div id="dup-body">${duplicatesBodyHTML()}</div>
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0;margin-top:14px')}`);
}

function duplicatesBodyHTML() {
  const groups = duplicateGroups();
  if (!groups.length) return `<div style="text-align:center;color:#6fcf97;padding:20px 0;font-size:13px">Nenhum exercício duplicado ✓</div>`;
  return groups.map(g => {
    const keeper = _dupKeepers[g.key];
    const rows = g.entries.map(ex => {
      const u = exerciseUsage(ex.id);
      const isKeeper = ex.id === keeper;
      const use = [u.sessions ? `${u.sessions} treino${u.sessions !== 1 ? 's' : ''}` : null,
                   u.plans ? `${u.plans} plano${u.plans !== 1 ? 's' : ''}` : null]
                  .filter(Boolean).join(' · ') || 'sem histórico';
      return `<div onclick="setDupKeeper('${g.key}','${ex.id}')" style="display:flex;align-items:center;gap:8px;padding:7px 8px;margin-bottom:4px;border-radius:8px;cursor:pointer;background:${isKeeper ? '#0a2e24' : BG3};border:1px solid ${isKeeper ? '#1a4a3a' : BD}">
        <span style="flex-shrink:0;width:16px;height:16px;border-radius:99px;border:1px solid ${isKeeper ? CG : BD};background:${isKeeper ? CG : 'transparent'}"></span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.name)}</div>
          <div style="font-size:11px;color:${DM};margin-top:2px">${use}</div>
        </div>
        <div style="display:flex;gap:3px;flex-shrink:0">${ex.type?typePill(ex.type):''}${ex.regime?regimePill(ex.regime):''}</div>
      </div>`;
    }).join('');
    return `<div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid ${BD}">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">${esc(g.name)} <span style="font-weight:400;color:${DM}">— ${g.entries.length} cópias</span></div>
      ${rows}
      ${Bs(CG,TX,`Unificar em "${esc(g.entries.find(e => e.id === keeper)?.name || '')}"`,`doMergeGroup('${g.key}')`,';width:100%;justify-content:center;padding:8px;margin-top:4px')}
    </div>`;
  }).join('');
}

function setDupKeeper(key, id) { _dupKeepers[key] = id; const b = document.getElementById('dup-body'); if (b) b.innerHTML = duplicatesBodyHTML(); }

function doMergeGroup(key) {
  const group = duplicateGroups().find(g => g.key === key); if (!group) return;
  const keeperId = _dupKeepers[key];
  const keeper = group.entries.find(e => e.id === keeperId); if (!keeper) return;
  const dups = group.entries.filter(e => e.id !== keeperId);
  const moved = dups.reduce((a, e) => a + exerciseUsage(e.id).sessions, 0);
  if (!confirm(`Unificar ${dups.length + 1} cópias em "${keeper.name}"?\n\n${moved} treino${moved !== 1 ? 's' : ''} ${moved === 1 ? 'será reapontado' : 'serão reapontados'} para este exercício. As outras cópias são excluídas.`)) return;
  mergeExercises(keeperId, dups.map(e => e.id));
  const b = document.getElementById('dup-body');
  if (b) b.innerHTML = duplicatesBodyHTML();
  render();
}

// ║  14. TAB: PLANS (Planos)
// ║
// ║  Displays saved training plans.
// ║  Plan editor modal replaces the old <select> dropdown with a full
// ║  search + filter + scrollable exercise picker (same UX as add-exercise).
// ║
// ║  Plans carry a `rests` map (per-exercise rest overrides — edited via
// ║  the per-row ⏱ inline expansion, see refreshPlanExList()).
// ║
// ║  Plans also carry SUPERSETS (E3b): entries take an `ss` group id (plus
// ║  optional `ssWu`) and the plan a `groups` map, the exact shape the
// ║  session uses — so startPlan() hands the workout the group with no
// ║  translation layer. Assembled here via pick mode (togglePlanSsMode →
// ║  togglePlanSsPick → doCreatePlanSuperset), configured in openPlanSsCfg,
// ║  dissolved by ungroupPlanSs. Group membership is pruned on every write
// ║  path: a group needs 2+ entries to mean anything, and its member order
// ║  is rebuilt from the entries rather than trusted.
// ║
// ║  Plan sharing, two transports over ONE payload (buildPlanPayload():
// ║  name + a snapshot of the exercises' definitions + rests + supersets —
// ║  never bare ids, and never gym tags):
// ║    · file: exportPlan()/importPlanFile() — works with zero accounts
// ║    · in-app: openSharePlan()/sendPlanShare() by e-mail; received ones
// ║      land in the "Planos recebidos" inbox (receivedSharesHTML) with
// ║      importShare()/dismissShare()
// ║  Both import through the same shape guard + applyImportedPlan()
// ║  hardening. Separate from the full-state Backup & Sync export/import
// ║  in section 20 — this is scoped to a single plan, and merges into the
// ║  local library on import rather than replacing it.
// ╚══════════════════════════════════════════════════════════════════════════════

// "Planos recebidos" — in-app shares addressed to me, awaiting a decision.
// Only rendered when there are any; refreshed in the background by
// loadReceivedShares() (tab entry + every successful account pull).
function receivedSharesHTML() {
  if (!_receivedShares.length) return '';
  const rows = _receivedShares.map(s => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid ${BD}">

function buildPlans() {
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700">Planos</div>

    </div>
    ${receivedSharesHTML()}
    ${!D.plans.length
      ? `<div style="text-align:center;color:${DM};padding:40px;font-size:14px">Nenhum plano criado.</div>`
      : D.plans.map(p => {
          const hasList = (p.exercises||[]).length > 0;
          const exList  = (p.exercises||[]).map((en,idx) => {
            // A slot entry renders as its movement — the plan's actual

            if (!en.exId) { const mv = MOVEMENTS[en.movement]; return `<div style="padding:6px 0;border-bottom:.5px solid ${BD};font-size:14px;display:flex;align-items:center;gap:6px">
              <span style="color:${DM};min-width:20px">${idx+1}.</span>

            return `<div style="padding:6px 0;border-bottom:.5px solid ${BD};font-size:14px;display:flex;align-items:center;gap:6px">
              <span style="color:${DM};min-width:20px">${idx+1}.</span>

          }).join('');
          return `<div style="background:${BG2};border:1px solid ${BD};border-radius:10px;margin-bottom:10px;overflow:hidden">
            <div style="padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:${hasList?`1px solid ${BD}`:'none'}">

function openNewPlan()   { _planExs=[]; _planId=null; _planRests={}; _planGroups={}; _planSsPick=[]; _planRestEdit=null; _planNoteEdit=null; _peFMove=null; _peSearch=''; _peAlpha=false; _peFMuscle=null; _peFPattern=null; _peMode='ex'; showPlanEditor(''); }
// _planExs holds ENTRY objects since schema 5 — deep-copied, because a
// shallow spread would alias each entry's perGym/prescription objects and
// let editor tinkering mutate the stored plan before Salvar.
function openEditPlan(id){ const p=D.plans.find(x=>x.id===id); if(!p)return; _planId=id; _planExs=JSON.parse(JSON.stringify(p.exercises||[])); _planRests=JSON.parse(JSON.stringify(p.rests||{})); _planGroups=JSON.parse(JSON.stringify(p.groups||{})); _planSsPick=[]; _planRestEdit=null; _planNoteEdit=null; _peFMove=null; _peSearch=''; _peAlpha=false; _peFMuscle=null; _peFPattern=null; _peMode='ex'; showPlanEditor(p.name); }

function peRefreshList() {
  const c = document.getElementById('pe-ex-list');

    const ms = movementsWithCounts()

      : `<div style="display:flex;flex-direction:column;gap:2px">

        </div>`;
