    const subs = {};
    inFam.filter(m => m.family.length === 2).forEach(m => { (subs[m.family[1]] ||= []).push(m); });
    rows = direct.map(m => aMovementRow(m)).join('')
      + Object.entries(subs).sort((a,b) => a[0].localeCompare(b[0],'pt'))
          .map(([sub, movs]) => aFamilyRow([path[0], sub], movs)).join('')
      + (Object.keys(subs).length ? Bs(BG3,TX,`Ver todos (${inFam.length})`,'aSeeAllFamily()',';width:100%;justify-content:center;margin-top:2px') : '');
  }
  return `
    <button onclick="aCloseFamily()" style="background:none;border:none;color:${DM};font-size:13px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:8px">← ${path.length === 2 || _aSeeAll ? esc(path[0]) : 'Movimentos'}</button>
    <div style="font-size:16px;font-weight:700;margin-bottom:8px">${esc(path.join(' — '))}</div>
    ${rows || `<div style="text-align:center;color:${DM};padding:16px 0;font-size:13px">Nenhum movimento aqui${_aFMuscle ? ' neste grupo muscular' : ''}.</div>`}`;
}

function aRefreshList() {
  const c = document.getElementById('a-list'); if(!c)return;
  if (_aMovement && MOVEMENTS[_aMovement]) { c.innerHTML = aVariantViewHTML(_aMovement); c.scrollTop = 0; return; }

  const q = _aSearch.trim();
  // Muscle-chip membership is DISPLAY membership (anchor + accessory-derived
  // — see movementDisplayMuscles), not anchor-only: a row works under every
  // group it involves. The anchor keeps ordering the unfiltered browse.
  // Search also matches FAMILY labels ("terra" surfaces every Terra
  // movement) — local to this picker, like the involvement rule.
  const all = movementsWithCounts()
    .filter(m => m.count > 0 && (!q || movementMatchesSearch(m, q)
      || (m.family||[]).some(l => nameKey(l).includes(nameKey(q)))));
  // Movements group by muscle in MUSCLE_GROUPS' own declaration order —
  // the same order every other muscle-grouped list in the app uses.
  const order = Object.keys(MUSCLE_GROUPS);
  all.sort((a,b) => (order.indexOf(a.muscle)-order.indexOf(b.muscle)) || a.pt.localeCompare(b.pt,'pt'));
  const movements = all.filter(m => !_aFMuscle || movementDisplayMuscles(m.slug).includes(_aFMuscle));
  // Movement-less exercises (the avulsos) must still be reachable in browse
  // — "grouping ALL the exercises we have" includes surfacing the ungrouped
  // ones instead of hiding them behind search. Muscle chips filter them by
  // main OR accessory, the same involvement rule movements get.
  const loose = D.exercises.filter(e => !e.movement
    && (!_aFMuscle || e.mainMuscle === _aFMuscle || (e.accessoryMuscles||[]).includes(_aFMuscle)))
    .sort((a,b) => a.name.localeCompare(b.name,'pt'));
  const looseSection = loose.length ? aSectionHeader('Sem movimento (avulsos)') + loose.map(aExRow).join('') : '';

  // An open family renders its own view (drill/see-all) over the already
  // count-, search- and involvement-filtered movement set.
  if (_aFamily) { c.innerHTML = aFamilyViewHTML(movements); c.scrollTop = 0; return; }

  if (!q) {
    // Browse: ONE row per unit under muscle headers — a unit is either a
    // standalone movement or a whole FAMILY (E5). A family whose visible
    // membership is a single movement collapses to that movement's own row:
    // no tap tax for a group of one. Direct exercise rows stay deliberately
    // absent (the flat 50-entry wall is what the redesign removed) — except
    // the avulsos, which have no movement to live under.
    const famGroups = {}, standalone = [];
    movements.forEach(m => { if (m.family) (famGroups[m.family[0]] ||= []).push(m); else standalone.push(m); });
    const units = [
      ...standalone.map(m => ({ f:null, m, muscle:m.muscle, anchors:[m.muscle], sort:m.pt })),
      ...Object.entries(famGroups).map(([label, movs]) => movs.length === 1
        ? ({ f:null, m:movs[0], muscle:movs[0].muscle, anchors:[movs[0].muscle], sort:movs[0].pt })
        : ({ f:label, movs, muscle:familyHomeMuscle(movs), anchors:[...new Set(movs.map(x=>x.muscle))], sort:label }))
    ];
    units.sort((a,b) => (order.indexOf(a.muscle)-order.indexOf(b.muscle)) || a.sort.localeCompare(b.sort,'pt'));
    const row = (u, showAnchor) => u.f ? aFamilyRow([u.f], u.movs, showAnchor) : aMovementRow(u.m, showAnchor);
    let html = '';
    if (!_aFMuscle) {
      let lastMuscle = null;
      units.forEach(u => {
        if (u.muscle !== lastMuscle) { html += aSectionHeader(MUSCLE_GROUPS[u.muscle]||u.muscle); lastMuscle = u.muscle; }
        html += row(u, false);
      });
    } else {
      // One muscle selected: units ANCHORED there first (for a family: any
      // member anchors it), then the ones that merely INVOLVE it — so
      // "Bíceps" surfaces the curls and the Remada/Puxada families alike.
      const label = MUSCLE_GROUPS[_aFMuscle] || _aFMuscle;
      const anchored = units.filter(u => u.anchors.includes(_aFMuscle));
      const also     = units.filter(u => !u.anchors.includes(_aFMuscle));
      html += anchored.map(u => row(u, false)).join('');
      if (also.length) html += aSectionHeader(`Também envolvem ${label}`) + also.map(u => row(u, true)).join('');
    }
    html += looseSection;
    c.innerHTML = html || `<div style="text-align:center;color:${DM};padding:16px 0;font-size:13px">Nenhum movimento aqui ainda.</div>`;
  } else {
    // Search: movements first (the intended navigation), then direct
    // exercise hits (the fast path when you know the exact variant name).
    // The exercise hits use the same involvement rule as everything else in
    // this picker (main OR accessory) — deliberately local, not a change to
    // the shared applyFilters(), whose other callers stay main-muscle-only.
    const exs = applyFilters(D.exercises, null, q, false, false, null, null)
      .filter(e => !_aFMuscle || e.mainMuscle === _aFMuscle || (e.accessoryMuscles||[]).includes(_aFMuscle));
    c.innerHTML =
      (movements.length ? aSectionHeader('Movimentos') + movements.map(m => aMovementRow(m, _aFMuscle && m.muscle !== _aFMuscle)).join('') : '') +
      (exs.length ? aSectionHeader('Exercícios') + exs.map(aExRow).join('') : '') +
      (!movements.length && !exs.length ? `<div style="text-align:center;color:${DM};padding:16px 0;font-size:13px">Nada encontrado — crie uma variação dentro de um movimento, ou um exercício avulso abaixo.</div>` : '');
  }
  c.scrollTop = 0;
}

// Preference used only to break a tie between equally-common sibling classes:
// the apparatus a movement is archetypally done on comes first. Anything not
// listed sorts last, so an unknown/future class never wins a tie by accident.
const VARIANT_EQUIP_PREF = ['barbell', 'dumbbell', 'machine', 'cable', 'bodyweight', 'kettlebell', 'band', 'other'];

function defaultVariantEquip(slug) {
  const counts = {};
  D.exercises.forEach(e => {
    if (e.movement !== slug || !e.equipment) return;
    counts[e.equipment] = (counts[e.equipment] || 0) + 1;
  });
  const classes = Object.keys(counts);
  if (!classes.length) return null;
  const rank = k => { const i = VARIANT_EQUIP_PREF.indexOf(k); return i === -1 ? VARIANT_EQUIP_PREF.length : i; };
  return classes.sort((a, b) => (counts[b] - counts[a]) || (rank(a) - rank(b)))[0];
}

function openPickMovement(slug) {
  _aMovement = slug; _aSearch = '';
  // The new-variant form defaults to a sibling's equipment class as a
  // SELECTED CHIP the user can flip (barra → halteres is exactly how
  // "Supino com halteres" gets born).
  //
  // Which sibling used to be whichever `find()` hit first, i.e. whatever the
  // generator's (muscle, pattern, name) sort happened to put earliest. That
  // is unstable: promoting "Supino no cabo" silently moved the bench-press
  // default from barra to cabo, because "no cabo" sorts before "reto". So
  // it now takes the most COMMON class among the siblings, and breaks ties
  // with a fixed preference that puts the archetypal apparatus first —
  // deterministic, and it survives every future content batch.
  _newVarEquip = defaultVariantEquip(slug);
  const inp = document.getElementById('a-search'); if (inp) inp.value = '';
  aRefreshList();
}
function closePickMovement() { _aMovement = null; aRefreshList(); }

// A movement's variants, grouped by equipment class (EQUIPMENT_LABELS'
// declaration order; entries without the field land in a trailing group) —
// plus the inline "+ nova variação" form, which is the quick-create done
// right: classification, movement and sensible compound/regime defaults are
// INHERITED, so nothing created here needs a follow-up Library fix to stop
// being Undefined.
function aVariantViewHTML(slug) {
  const m = MOVEMENTS[slug];
  const vars = D.exercises.filter(e => e.movement === slug);
  const byEquip = {};
  vars.forEach(e => { const k = e.equipment && EQUIPMENT_LABELS[e.equipment] ? e.equipment : '_none'; (byEquip[k] = byEquip[k]||[]).push(e); });
  const groups = [...Object.keys(EQUIPMENT_LABELS).filter(k => byEquip[k]), ...(byEquip._none ? ['_none'] : [])];
  return `
    <button onclick="closePickMovement()" style="background:none;border:none;color:${DM};font-size:13px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:8px">← ${_aFamily ? esc(_aFamily[_aFamily.length-1]) : 'Movimentos'}</button>
    <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:4px">
      <span style="font-size:16px;font-weight:700">${esc(m.pt)}</span>
      <span style="font-size:11px;color:${DM}">${esc(MUSCLE_GROUPS[m.muscle]||'')}</span>
    </div>
    ${groups.map(g => aSectionHeader(g === '_none' ? 'Equipamento não definido' : EQUIPMENT_LABELS[g])
      // ★ favorites float to the top WITHIN each equipment group (a stable
      // sort keeps the rest in library order) — the owner's "favorite
      // variations stay at the top of the list", per class.
      + byEquip[g].slice().sort((a,b) => (b.favorite?1:0) - (a.favorite?1:0)).map(aExRow).join('')).join('')}
    ${aSectionHeader('Nova variação')}
    <input id="av-name" type="text" value="${esc(m.pt)} " placeholder="Nome da variação"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
    <!-- Equipment class chips — the same movement on different apparatus is
         a NEW VARIANT ("Supino reto" barra vs halteres), and this is where
         it's born. Defaults to the sibling's class (openPickMovement); the
         choice drives the variant's calibrated-vs-descriptive semantics and
         its chip vocabulary from day one. -->
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px">
      ${Object.entries(EQUIPMENT_LABELS).map(([k,label]) =>
        `<button id="av-eq-${k}" onclick="setVarEquip('${k}')" style="padding:5px 10px;border-radius:99px;border:none;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${_newVarEquip===k?'#0a2e2e':BG3};color:${_newVarEquip===k?'#4dd0c4':DM}">${label}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button id="v-str" onclick="setNewType('strength')"    style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${_newType==='strength'?'#A32D2D':BG3};color:${_newType==='strength'?TX:DM}">Força</button>
      <button id="v-hyt" onclick="setNewType('hypertrophy')" style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${_newType==='hypertrophy'?CB:BG3};color:${_newType==='hypertrophy'?TX:DM}">Hipert.</button>
    </div>
    ${B(CG,TX,'Criar variação e adicionar',`createVariant('${slug}')`,';margin-bottom:0')}`;
}

// In-place chip restyle, same no-rerender pattern as setNewType() — a full
// aRefreshList() here would rebuild the form and eat the half-typed name.
function setVarEquip(k) {
  _newVarEquip = _newVarEquip === k ? null : k;
  Object.keys(EQUIPMENT_LABELS).forEach(key => {
    const b = document.getElementById(`av-eq-${key}`); if (!b) return;
    b.style.background = _newVarEquip === key ? '#0a2e2e' : BG3;
    b.style.color = _newVarEquip === key ? '#4dd0c4' : DM;
  });
}

// Create a variant INSIDE a movement. Same duplicate discipline as the old
// quick-create: an existing same-named exercise is REUSED, never forked
// (split ids = split histories). Classification comes from the movement's
// category anchor; compound/regime/accessories are copied from an existing
// sibling when there is one — same gesture, best available guess, all
// editable later in the Library.
function createVariant(slug) {
  const m = MOVEMENTS[slug]; if (!m) return;
  const name = (document.getElementById('av-name')?.value||'').trim(); if (!name) return;
  const clash = findByName(name);
  if (clash) { pickEx(clash.id); return; }
  const sib = D.exercises.find(e => e.movement === slug);
  const ex = {
    id: newUserExId(), name, type: _newType, origin: ORIGIN_USER,
    compound: sib ? sib.compound : null,
    regime: sib ? (sib.regime||'weighted') : 'weighted',
    mainMuscle: m.muscle, movementPattern: m.pattern, movement: slug,
    accessoryMuscles: sib ? [...(sib.accessoryMuscles||[])] : [],
    // The chosen equipment class (chips above) — what makes a same-movement
    // variant on different apparatus a real, correctly-behaving exercise:
    // it decides the picker grouping, the 🔧 vocabulary, and whether
    // instances calibrate history or stay descriptive.
    ...(_newVarEquip && EQUIPMENT_LABELS[_newVarEquip] ? { equipment: _newVarEquip } : {}),
    updatedAt: Date.now(),
  };
  D.exercises.push(ex);
  persist();
  pickEx(ex.id); // straight into the type/regime confirm → Adicionar
}

function setNewType(t) {
  _newType=t;
  // Two create forms share this toggle state — the avulso block (m-*) and
  // the in-movement variant form (v-*); color whichever pair is rendered.
  [['m-str','m-hyt'],['v-str','v-hyt']].forEach(([sid,hid]) => {
    const s=document.getElementById(sid),h=document.getElementById(hid);
    if(s){s.style.background=t==='strength'?'#A32D2D':BG3;s.style.color=t==='strength'?TX:DM;}
    if(h){h.style.background=t==='hypertrophy'?CB:BG3;h.style.color=t==='hypertrophy'?TX:DM;}
  });
}

// Type + regime picker before adding to session
function pickEx(id) {
  const ex = D.exercises.find(e=>e.id===id); if(!ex)return;
  // Default to how this exercise was trained LAST time (mode = per-session
  // choice, not a category); the library values only seed the first-ever log.
  const lm = lastModesFor(id);
  _pickType=(lm?lm.type:ex.type)||'hypertrophy'; _pickRegime=(lm?lm.regime:ex.regime)||'weighted';
  const isS=_pickType==='strength', isW=_pickRegime==='weighted', isAs=_pickRegime==='assisted', isBW=_pickRegime==='bodyweight', isBWP=_pickRegime===REGIME_BW_PLUS;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">${esc(ex.name)}</div>
    <div style="display:flex;gap:5px;margin-bottom:14px;flex-wrap:wrap">${ex.compound!=null?compPill(ex.compound):''}${ex.regime?regimePill(ex.regime):''}${musclePill(ex.mainMuscle,ex.movementPattern)}</div>
    <label style="font-size:12px;color:${DM};margin-bottom:6px;display:block">Tipo neste treino</label>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <button id="pt-s" onclick="setPickType('strength')"    style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${isS?'#A32D2D':BG3};color:${isS?TX:DM}">Força</button>
      <button id="pt-h" onclick="setPickType('hypertrophy')" style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${!isS?CB:BG3};color:${!isS?TX:DM}">Hipert.</button>
    </div>
    <label style="font-size:12px;color:${DM};margin-bottom:6px;display:block">Regime neste treino</label>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button id="pr-w"  onclick="setPickRegime('weighted')"   style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${isW?CB:BG3};color:${isW?TX:DM}">Carga</button>
      <button id="pr-a"  onclick="setPickRegime('assisted')"   style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${isAs?CA:BG3};color:${isAs?TX:DM}">Assist.</button>
      <button id="pr-bw" onclick="setPickRegime('bodyweight')" style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${isBW?CG:BG3};color:${isBW?TX:DM}">BW</button>
      <button id="pr-bwp" onclick="setPickRegime('${REGIME_BW_PLUS}')" title="Peso corporal + carga adicional" style="flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${isBWP?'#0a2438':BG3};color:${isBWP?'#7fb8e0':DM}">BW+</button>
    </div>
    ${B(CG,TX,'Adicionar',`addPickedEx('${id}')`)}
    ${B(BG3,TX,'Voltar','showAddEx()',';margin-bottom:0')}`);
}

function setPickType(t) {
  _pickType=t;
  const s=document.getElementById('pt-s'),h=document.getElementById('pt-h');
  if(s){s.style.background=t==='strength'?'#A32D2D':BG3;s.style.color=t==='strength'?TX:DM;}
  if(h){h.style.background=t==='hypertrophy'?CB:BG3;h.style.color=t==='hypertrophy'?TX:DM;}
}
function setPickRegime(r) {
  _pickRegime=r;
  const w=document.getElementById('pr-w'),a=document.getElementById('pr-a'),b=document.getElementById('pr-bw');
  if(w){w.style.background=r==='weighted'?CB:BG3;w.style.color=r==='weighted'?TX:DM;}
  if(a){a.style.background=r==='assisted'?CA:BG3;a.style.color=r==='assisted'?TX:DM;}
  if(b){b.style.background=r==='bodyweight'?CG:BG3;b.style.color=r==='bodyweight'?TX:DM;}
}

function addPickedEx(exId) {
  const ex = D.exercises.find(e=>e.id===exId); if(!ex||!S)return;
  // Rest seeding includes the followed plan's override even for an exercise
  // added mid-session — if the plan prescribes timings for it, they apply
  // regardless of when it joined the session.
  // `tracking` is snapshotted onto the block exactly like type/compound/
  // regime: the session must keep rendering (and tallying) correctly even
  // if the library entry is later retracked or deleted. Written only when
  // timed, so rep-based blocks stay byte-identical to before.
  const o = { exId, exName:ex.name, type:_pickType, compound:ex.compound, regime:_pickRegime, ...(isTimed(ex) ? { tracking: TRACK_TIME } : {}), rest: seedRestFor(exId, S.planId), sets:[] };
  // Auto-attach the machine used last time (at this gym, when known) BEFORE
  // building the set rows — the suggestion math prefers same-machine
  // history, so the attachment has to exist when it runs.
  const lim = lastInstanceFor(exId, S.gymId);
  if (lim) { o.instanceId = lim.id; o.instanceName = lim.name; }
  seedLoadPrefs(o, lim);
  o.sets = buildSetsFromMemory(o);
  S.exercises.push(o);
  // Added from INSIDE the superset builder ("+ Exercício" there): tick the
  // new block and go straight back, so a group can be assembled in one pass
  // instead of "add three exercises, then find the group button". Reuses the
  // whole movement-first picker rather than growing a second one.
  if (_ssPendingAdd) { _ssPick = [..._ssPick, S.exercises.length - 1]; render(); openSsBuilder(); return; }
  closeModal(); render();
}

// Barbell plate-input preference carry-over: reuse last session's
// loadMode/barKg for this exercise; a bar weight known on the attached
// equipment fills barKg when history has none. Non-barbell exercises never
// get either field.
function seedLoadPrefs(o, attachedInstance) {
  if (D.exercises.find(e => e.id === o.exId)?.equipment !== 'barbell') return;
  const lm = lastModesFor(o.exId);
  if (lm?.loadMode) o.loadMode = lm.loadMode;
  const bar = lm?.barKg || attachedInstance?.barKg
    || (o.instanceId ? D.machines.find(m => m.id === o.instanceId)?.barKg : null);
  if (bar > 0) o.barKg = bar;
}

// Quick-create classification state. Defaults to Undefined so the selects
// have a valid starting value; a user who ignores them lands exactly where
// this path used to land, but the fields are in front of them now.
let _avMuscle = 'undefined', _avPattern = 'undefined';

// Pattern options scoped to the chosen muscle — the same containment the
// Library modal enforces, so an impossible (muscle, pattern) pair can't be
// produced from here either.
function avPatternOptions() {
  const map = MOVEMENT_PATTERNS[_avMuscle] || MOVEMENT_PATTERNS.undefined;
  return Object.entries(map).map(([k, l]) =>
    `<option value="${k}" ${_avPattern === k ? 'selected' : ''}>${l}</option>`).join('');
}

function avSetMuscle(v) {
  _avMuscle = v;
  // Changing muscle invalidates the pattern: 'press' means something under
  // chest and nothing under biceps. Reset to the first legal option rather
  // than carrying a pattern that its new muscle doesn't own.
  const map = MOVEMENT_PATTERNS[_avMuscle] || MOVEMENT_PATTERNS.undefined;
  _avPattern = Object.keys(map)[0];
  const sel = document.getElementById('av-pattern');
  if (sel) sel.innerHTML = avPatternOptions();
}

function createAndAdd() {
  const el   = document.getElementById('new-ex-name');
  const name = (el?el.value:'').trim(); if(!name)return;
  // Mid-workout quick-create is the fastest way to fragment a library:
  // type a name you couldn't find in the picker, get a brand-new random
  // id, and every future session logs against a DIFFERENT exercise than
  // the one holding your history. Reuse the existing entry instead — that
  // is virtually always the intent, and it keeps the progression intact.
  const existing = findByName(name);
  if (existing) {
    if (S) {
      const o = { exId: existing.id, exName: existing.name, type: _newType, compound: existing.compound,
                  regime: existing.regime || 'weighted', ...(isTimed(existing) ? { tracking: TRACK_TIME } : {}),
                  rest: seedRestFor(existing.id, S.planId), sets: [] };
      const lim = lastInstanceFor(existing.id, S.gymId);
      if (lim) { o.instanceId = lim.id; o.instanceName = lim.name; }
      seedLoadPrefs(o, lim);
      o.sets = buildSetsFromMemory(o);
      S.exercises.push(o);
    }
    closeModal(); render();
    alert(`"${existing.name}" já existe na biblioteca — adicionei o exercício existente, para não dividir seu histórico.`);
    return;
  }
  const id   = newUserExId();
  // Classification now comes from the form (avSetMuscle/_avPattern) instead
  // of defaulting to Undefined. That matters beyond tidiness: an exercise
  // with mainMuscle 'undefined' earns NO credit in weeklyMuscleVolume(), so
  // the fastest way to add an exercise mid-session used to be the one that
  // silently punched a permanent hole in the volume chart. compound/regime
  // are still assumed here — they're per-session tracking modes the user
  // adjusts on the block itself, not identity.
  D.exercises.push({ id, name, type:_newType, compound:true, regime:'weighted', origin:ORIGIN_USER,
    mainMuscle:_avMuscle, movementPattern:_avPattern, accessoryMuscles:[], updatedAt:Date.now() });
  if (S) { const o={exId:id,exName:name,type:_newType,compound:true,regime:'weighted',rest:seedRestFor(id,S.planId),sets:[]}; o.sets=buildSetsFromMemory(o); S.exercises.push(o); }
  persist(); closeModal(); render();
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  19. SESSION ACTIONS
// ║
// ║  Manages the active session (S):
// ║    startPlan()    — loads a plan into S (history-driven sets, seeded
// ║                     rest overrides, gym stamp)
// ║    startFree()    — blank session (gym stamp only)
// ║    saveSession()  — routes the save: plan drift → three-way
// ║                     reconciliation modal (openSaveOptions), plan-less
// ║                     first save → plan offer (openFreeSaveOptions),
// ║                     otherwise straight to doSaveSession('keep')
// ║    doSaveSession()— applies the chosen plan effect, strips render
// ║                     scaffolding, commits S to D.sessions, persists
// ║    editSess()     — loads a saved session back into S for editing
// ║    cancelSession()— discards S (and any running rest timer)
// ║    openPlanFromSession()/doPlanFromSession() — History's "Criar plano"
// ║
// ║  Also lives here: the swap-exercise flow (openSwapEx/doSwapEx —
// ║  classification-ranked, gym-aware), the per-exercise rest editor
// ║  (openExRest), the rest timer (startRestTimer/tick/banner/settings),
// ║  and focus mode (exIsDone/toggleExCollapse/toggleExDone/
// ║  collapseAndAdvance + toggleCompleted's cascade-down uncheck).
// ║
// ║  SUPERSETS (E3b) — the actions half; the rendering lives in section 11:
// ║    makeSuperset()/ungroupSuperset()/removeFromSuperset() — assemble and
// ║      dissolve. Members are kept CONTIGUOUS in S.exercises, which the
// ║      round view depends on.
// ║    addRound()/setRoundCounts() — grow or shrink the rounds, trailing
// ║      sets only, so nothing already typed or checked is discarded.
// ║    setGapRest()/moveInRound()/applyRoundOrderToAll() — the two sparse
// ║      deviation maps (rest.overrides, roundOrder) over the group default.
// ║    collapseRoundAndAdvance() — focus mode one level down: the unit that
// ║      finishes inside a group is the ROUND, not the exercise.
// ║    openSsBuilder()/openSsMember()/openGapRest() — the three modals.
// ║  startRestTimer() and toggleCompleted() each branch on membership; a
// ║  grouped member's SOLO warm-ups deliberately fall through to the normal
// ║  cascade, since those are performed per exercise before the rounds.
// ║
// ║  Per-set mutations (addSet, rmSet, toggleIntent, setVal) are called
// ║  directly from oninput/onclick attributes in the exercise block HTML.
// ╚══════════════════════════════════════════════════════════════════════════════

function startPlan(id) {
  const p = D.plans.find(x=>x.id===id); if(!p)return;
  const gm = currentGym(); // gymName is a snapshot, same pattern as planName — history survives a gym deletion
  _restTimer = null; _machineNudgeDone = false;
  S = {
    planId: p.id, planName: p.name, date: today(),
    gymId: gm?.id || null, gymName: gm?.name || null,
    // Sanitized on the way in for the same reason imported plans are: a plan
    // can arrive from another device or another user, and a malformed group
    // config must degrade to "no grouping" rather than break the session view.
    ...(sanitizeGroups(p.groups) ? { groups: sanitizeGroups(p.groups) } : {}),
    exercises: (p.exercises||[]).map(en => {
      // A SLOT entry (exId null) becomes a placeholder block — the owner's
      // rule: a slot never resolves silently. The block itself surfaces the
      // ranked suggestion and opens the picker (resolveSlot, section 19);
      // until resolved it holds no sets and is skipped by every reader
      // that keys on exId or sets (nudges, volume, suggestions, save).
      if (!en.exId) return { slot:true, _planEid:en.eid, movement:en.movement||null,
        exName: MOVEMENTS[en.movement]?.pt || en.movement || 'Movimento',
        ...(en.prescription?.note ? { _planNote: en.prescription.note } : {}) };
      const exId = en.exId;
      const ex = D.exercises.find(e=>e.id===exId);
      // Mode defaults come from the exercise's LAST session, not its library
      // label — type/regime are per-session tracking choices (owner doctrine
      // 2026-07-29); the library values only cover the first-ever log.
      const lm = lastModesFor(exId);
      // '(removido)' — same label the Plans tab itself shows for a plan
      // entry whose exercise was deleted from the library, not a bare '?'.
      // _planEid ties the block back to its plan entry for save-time
      // reconciliation (slot entries must survive an 'update' as slots);
      // _planNote is the entry's prescription, live-display only — both are
      // stripped at save alongside _sug.
      // Superset membership travels from the plan onto the block (E3b): the
      // owner's "plan groups carry into the session". ssMem defaults to the
      // entry's own eid, which is already unique per entry and is what the
      // plan's group order/rest-override keys reference.
      const o  = { exId, exName:ex?ex.name:'(removido)', type:(lm?lm.type:ex?.type)||'hypertrophy', compound:ex?.compound, regime:(lm?lm.regime:ex?.regime)||'weighted',
                   ...(isTimed(ex) ? { tracking: TRACK_TIME } : {}),
                   ...(en.ss ? { ss: en.ss, ssMem: en.ssMem || en.eid } : {}),
                   ...(en.ssWu ? { ssWu: true } : {}),
                   rest: seedRestFor(exId, p.id, en.eid), sets:[], _planEid:en.eid,
                   ...(en.prescription?.note ? { _planNote: en.prescription.note } : {}) };
      // Same last-used-machine default the picker path applies — before
      // buildSetsFromMemory so same-machine suggestions see it.
      const lim = lastInstanceFor(exId, gm?.id || null);
      if (lim) { o.instanceId = lim.id; o.instanceName = lim.name; }
      seedLoadPrefs(o, lim);
      o.sets   = buildSetsFromMemory(o);
      return o;
    })
  };
  render();
}

function startFree()     { const gm=currentGym(); S={ planId:null, planName:null, date:today(), gymId:gm?.id||null, gymName:gm?.name||null, exercises:[] }; _restTimer=null; _machineNudgeDone=false; render(); }
function cancelSession() {
  // Guard the wipe when the session holds real input — Cancelar discards S
  // AND its live-session stash (render() clears the mirror once S is null),
  // so a mis-tap here would be the one remaining way to lose a workout
  // outright. An untouched session (no typing, no checks) still cancels
  // with zero friction.
  const hasData = S && S.exercises.some(ex => (ex.sets||[]).some(s => s.completed === true || s.repsEdited || s.kgEdited));
  if (hasData && !confirm('Descartar este treino?\n\nAs séries preenchidas serão perdidas.')) return;
  S=null; _restTimer=null; _machineNudgeDone=false; render();
}

// ── Saving a session vs. its plan ─────────────────────────────────────────────
//
// A session is always a free copy of its plan — reorder, swap, add, drop,
// retime, nothing touches the plan while training. The reconciliation
// happens ONCE, at save: if the session still points at an existing plan
// and drifted from it in a plan-representable way, the user chooses to
// update that plan, fork a new one, or save the session alone. Only two
// kinds of drift ARE plan-representable and thus compared: the exercise id
// list in order, and per-exercise rest overrides (compared against what
// the session was SEEDED with, so library-inherited values the user never
// touched don't trigger the prompt). Set counts, reps/kg, and type/regime
// toggles are session-only by design — plans don't model them.

// Canonical serialization of a rests map — key ORDER must not read as
// drift ({ww,wuwu} vs {wuwu,ww}), so keys are sorted and each value passes
// sanitizeRest for its own canonical key order.
const restsKey = o => JSON.stringify(Object.keys(o||{}).sort().map(k => [k, sanitizeRest(o[k])]));

// Canonical serialization of an ENTRY LIST for the drift comparison.
//
// This was a bare JSON.stringify of the two arrays, which is key-ORDER
// sensitive. It worked only because every writer happened to build entries
// the same way — and supersets break that luck: an entry that gains `ss` via
// a spread carries the key at the end, while one authored with grouping in
// the plan editor carries it wherever the editor put it. Two identical plans
// would then stringify differently and every save would falsely report drift,
// nagging the user to update a plan nothing had changed. Same job restsKey()
// and groupsKey() already do for their maps.
//
// Every field a plan entry can hold is listed here on purpose: a field left
// out would become invisible to drift detection, which fails silently and in
// the dangerous direction (a real change that never prompts).
const entriesKey = list => JSON.stringify((list || []).map(en => [
  en.eid || '', en.exId || null, en.movement || null,
  en.prescription?.note || '',
  en.ss || '', en.ssMem || '', en.ssWu ? 1 : 0,
  en.perGym ? Object.keys(en.perGym).sort().map(k => [k, en.perGym[k]]) : null,
]));

function sessionPlanDiff() {
  if (!S || !S.planId || S._editId) return null; // re-edits of old sessions save silently — the prompt is a live-workout affordance
  const plan = D.plans.find(p => p.id === S.planId);
  if (!plan) return null; // plan deleted meanwhile — nothing to reconcile against
  // Drift = "would writing the session's shape change the plan?" — the
  // comparison runs on exactly what doSaveSession('update') would write
  // (sessionPlanShape), so prompt and write can never disagree. Entry
  // identity compares as JSON: an untouched entry is the same object, a
  // swapped concrete differs by exId, a new block is a new entry.
  const shape = sessionPlanShape(plan);
  const listChanged   = entriesKey(shape.entries) !== entriesKey(plan.exercises || []);
  const restsChanged  = restsKey(shape.rests) !== restsKey(plan.rests);
  // Assembling or dissolving a superset mid-session IS a change to the plan's
  // shape, and the owner asked to be asked about it: "if you group an exercise
  // mid-session, ask the user if he wants to update the plan or keep that for
  // the sessions only". That question is exactly what this prompt already
  // offers — update the plan / create a new plan / save only the session — so
  // grouping needed no new dialog, only inclusion here. Deliberately NOT an
  // interrupt at the moment of grouping: nothing modal fires mid-workout.
  const groupsChanged = groupsKey(shape.groups) !== groupsKey(plan.groups);
  return (listChanged || restsChanged || groupsChanged)
    ? { plan, listChanged, restsChanged, groupsChanged } : null;
}

// A rest override is plan-worthy only when it differs from the library
// exercise's own default — the plan stores what's plan-specific, not a
// frozen copy of library values (which would pin them against future
// library edits). Shared by sessionPlanShape() and doPlanFromSession().
function planWorthyRest(ex) {
  const r = sanitizeRest(ex.rest);
  const lib = sanitizeRest(D.exercises.find(e => e.id === ex.exId)?.rest);
  return (r && JSON.stringify(r) !== JSON.stringify(lib)) ? r : null;
}

// The { entries, rests } a plan updated FROM the live session would hold —
// the same derivation doSaveSession('update'/'new') writes, so the drift
// comparison and the write can never disagree. Rules (E3): a block that
// came from a plan entry keeps that entry — a SLOT entry stays a slot even
// though the block resolved to a concrete exercise (the slot is the plan's
// intent; the resolution memory lives in perGym, not in the entry) — while
// a CONCRETE entry follows the block's current exId (a ⇄-swap becomes the
// plan's new pick on update, today's semantics). An unresolved slot
// placeholder counts as its entry (still in the plan, just not trained
// today) and contributes no rest. Blocks added mid-session become fresh
// concrete entries, each occurrence its own eid (the superset shape).
// Rests key by eid, captured only where plan-worthy (see above).
function sessionPlanShape(plan) {
  const planEntries = plan ? (plan.exercises||[]) : [];
  const entries = [], rests = {};
  (S?.exercises||[]).forEach(ex => {
    const known = ex._planEid && planEntries.find(e => e.eid === ex._planEid);
    let en;
    if (known) en = (!known.exId && known.movement) ? known : (known.exId === ex.exId ? known : { ...known, exId: ex.exId });
    else if (ex.slot) return; // placeholder whose entry vanished from the plan — nothing to represent
    else en = { eid: uid(), exId: ex.exId };
    // Superset membership is taken from the SESSION BLOCK, never from the plan
    // entry that `known` reuses verbatim. That reuse is what lets an old app
    // carry grouping through untouched — but here it would also silently
    // discard a superset assembled (or dissolved) during the workout, which is
    // precisely the change the save-time prompt exists to ask about. Rebuilt
    // rather than mutated: `known` IS the stored plan's entry object.
    const wantSs  = ex.ss || '';
    const wantMem = wantSs ? (ex.ssMem || en.eid) : '';
    const wantWu  = wantSs && ex.ssWu ? 1 : 0;
    if (wantSs !== (en.ss || '') || wantMem !== (en.ssMem || '') || wantWu !== (en.ssWu ? 1 : 0)) {
      const { ss, ssMem, ssWu, ...bare } = en;
      en = wantSs ? { ...bare, ss: wantSs, ssMem: wantMem, ...(wantWu ? { ssWu: true } : {}) } : bare;
    }
    entries.push(en);
    if (ex.slot) return;
    // Rest capture is SEED-aware, not just library-aware: a block's rest is
    // the plan+library merge it was seeded with, so an untouched block must
    // carry the plan's own stored override forward VERBATIM — comparing the
    // merged value against the library alone would smear library keys into
    // the plan and make every untouched session read as drift. Only a block
    // whose rest genuinely differs from its seed captures a new override
    // (and then only what differs from the library — a user resetting to
    // library values means "drop the override", not "pin the library").
    const cur  = sanitizeRest(ex.rest) || null;
    const seed = sanitizeRest(seedRestFor(ex.exId, plan?.id, known ? known.eid : undefined)) || null;
    if (JSON.stringify(cur) === JSON.stringify(seed)) {
      const stored = known && plan?.rests?.[known.eid];
      if (stored) rests[en.eid] = sanitizeRest(stored);
    } else {
      const r = planWorthyRest(ex);
      if (r) rests[en.eid] = r;
    }
  });

  // Group configs, kept only for groups the derived entries actually still
  // form, and with each member ORDER rebuilt from those entries rather than
  // copied from S.groups: the session's block order is the truth about who is
  // in the group and in what sequence, while a stored order can name members
  // that were swapped out or removed during the workout.
  return { entries, rests, groups: pruneGroups(entries, S?.groups) };
}

// ── Machine picker & save-time nudge (E2) ────────────────────────────────────
//
// The 🔧 chip on every session block opens this picker: pick a known machine
// for the exercise (current gym's listed first), create a new one, clear
// the association, or ✎-edit any listed machine (the manager below).
// Selecting a machine while training AT a gym auto-tags it as existing
// there — the owner's "equipment added at gym A usable at gym B should be
// simple", done with zero extra ceremony. Each machine row is a flex
// WRAPPER holding the select button and the ✎ button side by side — the ✎
// can't live inside the select button because a button nested in a button
// is invalid HTML and the click would ambiguously hit both.
function openMachinePicker(i) {
  const ex = S?.exercises[i]; if (!ex) return;
  const list = machinesFor(ex.exId, S.gymId);
  const gymLabel = m => (m.gymIds||[]).map(id => D.gyms.find(g=>g.id===id)?.name).filter(Boolean).join(' · ');
  const detail = m => [m.barKg ? `barra ${m.barKg} kg` : null, m.maker, m.model, m.location].filter(Boolean).join(' · ');
  // Calibrated equipment (machines/cables) carries the precision warning;
  // free-weight equipment is descriptive — the copy says so, since here the
  // instance never splits the progression (owner model, 2026-07-30).
  const calibrated = equipmentIsCalibrated(ex.exId);
  const isBarbell = D.exercises.find(e => e.id === ex.exId)?.equipment === 'barbell';
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:2px">Equipamento</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">${esc(ex.exName)} — ${calibrated
      ? 'os números de uma máquina não valem para outra; identificar deixa as sugestões precisas.'
      : 'registra com o que você fez o movimento (barra reta, W, trap…). A progressão continua uma só — isto é descritivo.'}</div>
    ${list.length ? list.map(m => `
      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:stretch">
        <button onclick="selectMachine(${i},'${m.id}')" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:10px 12px;background:${ex.instanceId===m.id?'#0a2e2e':BG3};border:1px solid ${ex.instanceId===m.id?'#14484a':BD};border-radius:8px;color:${TX};font-family:inherit;cursor:pointer;text-align:left">
          <span style="flex:1;min-width:0">
            <span style="font-weight:600;font-size:13px;display:block">${esc(m.name)}</span>
            ${detail(m) ? `<span style="font-size:11px;color:${DM};display:block">${esc(detail(m))}</span>` : ''}
            ${m.note ? `<span style="font-size:11px;color:#4dd0c4;display:block">${esc(m.note)}</span>` : ''}
            ${gymLabel(m) ? `<span style="font-size:10px;color:${DM};display:block">${esc(gymLabel(m))}</span>` : ''}
          </span>
          ${ex.instanceId===m.id ? `<span style="color:#4dd0c4;font-weight:700">✓</span>` : ''}
        </button>
        <button onclick="openMachineEditor('${m.id}', ${i})" title="Editar equipamento" style="flex-shrink:0;width:40px;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${DM};font-size:14px;cursor:pointer;font-family:inherit">✎</button>
      </div>`).join('')
    : `<div style="font-size:13px;color:${DM};margin-bottom:8px">Nenhuma máquina cadastrada para este exercício ainda.</div>`}
    ${ex.instanceId ? B(BG3,DM,'Sem equipamento neste treino',`clearMachine(${i})`) : ''}
    <div style="font-size:10px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px">Novo equipamento</div>
    <input id="mc-name" type="text" placeholder="Nome (ex.: ${calibrated ? 'Remada Technogym #3' : 'Barra W do fundo'})"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
    ${isBarbell ? `
    <input id="mc-barkg" type="number" inputmode="decimal" step="0.5" min="0" placeholder="Peso da barra em kg (ex.: 20) — o registro soma tudo"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:13px;padding:9px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">` : ''}
    <input id="mc-note" type="text" placeholder="Ajustes (ex.: banco 7, pegada aberta) — opcional"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:13px;padding:9px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
    <button id="mc-more-toggle" style="background:none;border:none;color:${DM};font-size:12px;cursor:pointer;font-family:inherit;padding:0;margin-bottom:8px">+ marca, modelo, localização</button>
    <div id="mc-more" style="display:none">
      ${[['mc-maker','Marca (ex.: Technogym)'],['mc-model','Modelo'],['mc-location','Localização (ex.: 2º andar, fundo)']].map(([id,ph]) => `
      <input id="${id}" type="text" placeholder="${ph}"
        style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:13px;padding:9px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">`).join('')}
    </div>
    ${B(CG,TX,'Criar e usar neste treino',`createMachine(${i})`)}
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0')}`);
  // (mc-more toggle listener attached below — the barKg field, when present,
  // sits above it as a first-class input: bar weight is the fact that makes
  // the per-side readout and any future plate math possible.)
  document.getElementById('mc-more-toggle')?.addEventListener('click', function() {
    const d = document.getElementById('mc-more');
    const open = d.style.display !== 'none';
    d.style.display = open ? 'none' : 'block';
    this.textContent = (open ? '+' : '−') + ' marca, modelo, localização';
  });
}

// Recompute this block's suggestion context after its machine changed.
// UNTOUCHED blocks get rebuilt set rows (fresh same-machine chips/dims);
// a block already holding typed or checked data keeps its rows — mid-set
// numbers are sacred — and only the cached _sug (stall banner, estimate)
// follows the new machine.
function remachineEx(i) {
  const ex = S.exercises[i];
  const touched = (ex.sets||[]).some(s => s.completed === true || s.repsEdited || s.kgEdited);
  if (!touched) { ex.sets = []; ex.sets = buildSetsFromMemory(ex); }
  else {
    const profile = profileFor(ex.type, ex.regime||'weighted', trackingOf(ex));
    ex._sug = computeSuggestion(ex.exId, ex.type, ex.regime||'weighted', profile, calibratedInstanceId(ex));
  }
}

function selectMachine(i, mid) {
  const ex = S?.exercises[i]; const m = D.machines.find(x => x.id === mid);
  if (!ex || !m) return;
  if (S.gymId && !(m.gymIds||[]).includes(S.gymId)) {
    m.gymIds = [...(m.gymIds||[]), S.gymId]; m.updatedAt = Date.now(); persist();
  }
  ex.instanceId = m.id; ex.instanceName = m.name;
  // Switching BARS moves the block's bar weight with it — the per-side
  // readout and any plate-input conversion must do their math against the
  // bar actually in hand. Display-only, as ever: stored totals don't move —
  // except generated warm-ups, which re-clamp to the new bar's floor.
  if (m.barKg > 0) { ex.barKg = m.barKg; applyBarFloor(ex); }
  remachineEx(i);
  closeModal(); render();
}

function clearMachine(i) {
  const ex = S?.exercises[i]; if (!ex) return;
  delete ex.instanceId; delete ex.instanceName;
  remachineEx(i);
  closeModal(); render();
}

// ── Plate-input setup handlers (see loadToDisplay()'s banner) ────────────────
// Mode/bar changes are DISPLAY-ONLY for anything the user touched: stored
// kg is the grand total either way, so flipping units rewrites no logged
// data. The one exception is applyBarFloor() below — generated warm-ups.

// Re-clamp GENERATED warm-up rows to the empty bar after the bar weight
// becomes known. buildWarmupSets() floors at generation — but the bar can
// arrive AFTER the rows exist (⚖ set up after the estimate prompt, or a bar
// attached via 🔧), and the owner hit exactly that: a pre-existing 15 kg
// warm-up under a late-set 20 kg bar still displayed as −2.5/lado. Only
// untouched warm-ups are clamped: a hand-edited row is the user's claim,
// and work-row prefills are last session's real history — neither is ours
// to rewrite.
function applyBarFloor(ex) {
  if (!(ex.barKg > 0)) return;
  if (D.exercises.find(e => e.id === ex.exId)?.equipment !== 'barbell') return;
  (ex.sets||[]).forEach(s => {
    if (s.intent === 'warmup' && !s.kgEdited && hasKg(s) && Number(s.kg) < ex.barKg) s.kg = ex.barKg;
  });
}

function toggleLoadSetup(i) { const ex = S?.exercises[i]; if (!ex) return; ex._loadSetup = !ex._loadSetup; render(); }
function setBlockBarKg(i, v) {
  const ex = S?.exercises[i]; if (!ex) return;
  const n = parseFloat(v);
  if (n > 0 && n <= 100) ex.barKg = n; else delete ex.barKg;
  applyBarFloor(ex);
  render();
}
function setLoadMode(i, mode) {
  const ex = S?.exercises[i]; if (!ex) return;
  if (mode) ex.loadMode = mode; else delete ex.loadMode;
  ex._loadSetup = false; // the owner's flow: choosing collapses the section
  applyBarFloor(ex);
  render();
}

function createMachine(i) {
  const ex = S?.exercises[i]; if (!ex) return;
  const name = (document.getElementById('mc-name')?.value||'').trim(); if (!name) return;
  const val = id => (document.getElementById(id)?.value||'').trim();
  const note = val('mc-note'), maker = val('mc-maker'), model = val('mc-model'), location = val('mc-location');
  // Bar weight: a positive number or nothing — same parse-don't-|| care as
  // setVal() (though a 0 kg bar is meaningless, so falsy IS invalid here).
  const barKg = parseFloat(val('mc-barkg'));
  const m = { id: uid(), name, exId: ex.exId, gymIds: S.gymId ? [S.gymId] : [],
    ...(note ? { note } : {}), ...(maker ? { maker } : {}), ...(model ? { model } : {}), ...(location ? { location } : {}),
    ...(barKg > 0 && barKg <= 100 ? { barKg } : {}),
    updatedAt: Date.now() };
  D.machines.push(m); persist();
  ex.instanceId = m.id; ex.instanceName = m.name;
  if (m.barKg > 0) { ex.barKg = m.barKg; applyBarFloor(ex); } // same bar-follows-the-block rule as selectMachine()
  remachineEx(i);
  closeModal(); render();
}

// ── Machine manager: edit / rename / delete (E2 remainder A) ─────────────────
//
// Until this existed a machine could only be CREATED and SELECTED — a typo,
// a changed settings note, or a machine the gym hauled away had no answer
// short of a factory reset. The editor is reached from the two places
// machines are already seen (the ✎ on each 🔧-picker row and on each
// detail-view "Máquinas conhecidas" row) — deliberately no standalone
// management screen: machines belong to their exercise, which is how people
// think of them ("the low-row machine"), so that's where they're managed.
//
// RENAME semantics: saved history keeps its instanceName snapshots exactly
// as logged — same precedent as gymName/exName, history says what things
// were called *then*. The rename bumps updatedAt so LWW propagates it to
// other devices; future sessions attach under the new name. A LIVE session
// block holding the machine does follow the rename immediately — it isn't
// history yet, and its save should snapshot what the machine is called now.
//
// DELETE semantics: tombstone through the sixth collection's existing merge
// machinery; saved history is untouched (entries keep instanceId +
// instanceName as historical record — every reader already tolerates a
// dangling id: lastInstanceFor only returns live machines, and suggestion
// filtering on a dead id simply finds that machine's old sessions, which is
// correct — the data happened). Live blocks pointing at it get their
// instance cleared, with remachineEx() refreshing their suggestion context.
//
// NON-GOAL: a machine *merge* tool. Machines are cheap and personal;
// delete + re-select covers the mess cases until proven otherwise.

// fromBlock: the session-block index when opened from the 🔧 picker (routes
// the return trip back there), null when opened from the exercise detail
// view. showModal() replaces the origin modal in place — the history-guard
// entry is reused, so Back still closes whatever is on top.
function openMachineEditor(mid, fromBlock) {
  const m = D.machines.find(x => x.id === mid); if (!m) return;
  const lib = D.exercises.find(e => e.id === m.exId);
  const isBarbell = lib?.equipment === 'barbell';
  // Phantom-gym filter, same as openEditEx(): tags may reference a gym
  // deleted on another device before its delGym cleanup merged in.
  _meGyms = (m.gymIds||[]).filter(id => D.gyms.some(g => g.id === id));
  const inp = (id, ph, val) => `
    <input id="${id}" type="text" placeholder="${ph}" value="${esc(val||'')}"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:13px;padding:9px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">`;
  const fromArg = fromBlock == null ? 'null' : fromBlock;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:2px">Editar equipamento</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">${esc(lib?.name || '?')} — renomear não altera treinos já salvos: o histórico guarda o nome da época.</div>
    <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">Nome</label>
    <input id="me-name" type="text" value="${esc(m.name)}"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
    ${isBarbell ? `
    <input id="me-barkg" type="number" inputmode="decimal" step="0.5" min="0" placeholder="Peso da barra em kg (ex.: 20)" value="${m.barKg ?? ''}"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:13px;padding:9px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">` : ''}
    ${inp('me-note', 'Ajustes (ex.: banco 7, pegada aberta) — opcional', m.note)}
    ${inp('me-maker', 'Marca (ex.: Technogym)', m.maker)}
    ${inp('me-model', 'Modelo', m.model)}
    ${inp('me-location', 'Localização (ex.: 2º andar, fundo)', m.location)}
    ${D.gyms.length ? `
    <label style="font-size:12px;color:${DM};margin:6px 0 2px;display:block">Academias onde existe</label>
    <div style="font-size:11px;color:${DM};margin-bottom:6px">Ordena o seletor — as da academia atual aparecem primeiro.</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
      ${D.gyms.map(gm =>
        `<button id="meg-${gm.id}" onclick="meGymToggle('${gm.id}')" style="padding:6px 10px;border:none;border-radius:8px;font-weight:600;font-size:11px;cursor:pointer;font-family:inherit;background:${_meGyms.includes(gm.id)?'#0a2e24':BG3};color:${_meGyms.includes(gm.id)?'#6fcf97':DM}">${esc(gm.name)}</button>`
      ).join('')}
    </div>` : ''}
    ${B(CG,TX,'Salvar',`saveMachineEdit('${m.id}', ${fromArg})`)}
    ${B('#2d1010','#e57373','Excluir equipamento',`delMachine('${m.id}', ${fromArg})`)}
    ${B(BG3,DM,'Cancelar',`machineEditorReturn('${m.exId}', ${fromArg})`,';margin-bottom:0')}`);
}

// Gym availability multi-toggle — same in-place restyle pattern as exF('gymav').
function meGymToggle(gid) {
  const idx = _meGyms.indexOf(gid);
  if (idx === -1) _meGyms.push(gid); else _meGyms.splice(idx, 1);
  const el = document.getElementById('meg-' + gid);
  if (el) { el.style.background = _meGyms.includes(gid)?'#0a2e24':BG3; el.style.color = _meGyms.includes(gid)?'#6fcf97':DM; }
}

// The editor's way back to wherever it was opened from — the same
// "Voltar returns to the exact view you left" convention the picker's
// variant form set. Falls through detail → plain close if the origin is
// gone (block removed mid-edit, exercise deleted on another device).
function machineEditorReturn(exId, fromBlock) {
  if (fromBlock != null && S?.exercises[fromBlock]) { openMachinePicker(fromBlock); return; }
  if (D.exercises.some(e => e.id === exId)) { openExerciseDetail(exId); return; }
  closeModal();
}

function saveMachineEdit(mid, fromBlock) {
  const m = D.machines.find(x => x.id === mid); if (!m) return;
  const name = (document.getElementById('me-name')?.value||'').trim(); if (!name) return;
  const val = id => (document.getElementById(id)?.value||'').trim();
  m.name = name;
  // Optional fields: blank clears — delete rather than storing '', keeping
  // the object the same lean shape createMachine() writes.
  [['me-note','note'],['me-maker','maker'],['me-model','model'],['me-location','location']].forEach(([id,k]) => {
    const v = val(id); if (v) m[k] = v; else delete m[k];
  });
  // Bar weight only exists where the field was shown (barbell-class
  // exercise) — same parse + sanity bounds as createMachine().
  const barEl = document.getElementById('me-barkg');
  if (barEl) { const bk = parseFloat(barEl.value); if (bk > 0 && bk <= 100) m.barKg = bk; else delete m.barKg; }
  m.gymIds = [..._meGyms];
  m.updatedAt = Date.now(); // LWW: the edit must outrank stale copies on other devices
  // Live blocks holding this machine follow the edit: the name (a live
  // session isn't history yet — its save should snapshot the current name)
  // and, for bars, the weight — same bar-follows-the-block rule as
  // selectMachine(), including the generated-warm-up re-clamp. A REMOVED
  // barKg deliberately doesn't strip the block's: the user may have set
  // that via ⚖ independently, and deleting their data isn't ours to do.
  (S?.exercises||[]).forEach(ex => {
    if (ex.instanceId !== mid) return;
    ex.instanceName = m.name;
    if (m.barKg > 0) { ex.barKg = m.barKg; applyBarFloor(ex); }
  });
  persist();
  machineEditorReturn(m.exId, fromBlock);
  render();
}

function delMachine(mid, fromBlock) {
  const m = D.machines.find(x => x.id === mid); if (!m) return;
  // The confirm names real usage, like the exercise-merge modal does —
  // and says out loud that history survives, because "excluir" next to
  // workout data reads scarier than what this actually does.
  const uses = D.sessions.filter(s => (s.exercises||[]).some(e => e.instanceId === mid)).length;
  if (!confirm(`Excluir "${m.name}"?\n\n${uses
    ? `Usada em ${uses} treino${uses===1?'':'s'} — o histórico continua registrado com o nome da máquina.`
    : 'Nenhum treino registrado nela.'} Ela só deixa de aparecer para escolher.`)) return;
  D.tombstones.machines[mid] = Date.now();
  D.machines = D.machines.filter(x => x.id !== mid);
  const exId = m.exId; // captured before the object goes out of scope conceptually — routing needs it after deletion
  (S?.exercises||[]).forEach((ex, i) => {
    if (ex.instanceId === mid) { delete ex.instanceId; delete ex.instanceName; remachineEx(i); }
  });
  persist();
  machineEditorReturn(exId, fromBlock);
  render();
}

// Save-time nudge (owner spec 2026-07-29: "prompt the user to identify the
// machine when he goes to finish logging — but don't block"). Fires at most
// once per save attempt, only for a session's FIRST save (re-edits of
// history stay silent, per the same convention every other save prompt
// follows), and only for exercises with real counted work and no machine.
// Leaving a field blank IS the skip — one tap continues to the normal save.
let _machineNudgeDone = false;

function machineNudgeTargets() {
  if (!S) return [];
  return S.exercises
    .map((ex, i) => ({ ex, i }))
    // Only CALIBRATED equipment is worth interrupting a save for — that's
    // where an unidentified unit genuinely costs suggestion precision.
    // Free-weight blocks keep the chip for opt-in labeling ("EZ vs barra
    // reta") but are never nagged: their progression is one story either
    // way (owner model, 2026-07-30).
    .filter(({ ex }) => !ex.instanceId
      && D.exercises.some(e => e.id === ex.exId)
      && equipmentIsCalibrated(ex.exId)
      && (ex.sets||[]).some(s => isCountedWork(s) && (hasReps(s)||hasKg(s))));
}

function openMachineNudge() {
  const targets = machineNudgeTargets();
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Em qual máquina?</div>
    <div style="font-size:13px;color:${DM};margin-bottom:14px">Identificar a máquina deixa as sugestões futuras precisas — os números de uma não valem para outra. Deixe em branco para pular.</div>
    ${targets.map(({ ex, i }) => `
      <label style="font-size:12px;color:${DM};margin-bottom:4px;display:block">${esc(ex.exName)}</label>
      <input id="mn-${i}" list="mnl-${i}" type="text" placeholder="nome da máquina (opcional)"
        style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:10px;box-sizing:border-box">
      <datalist id="mnl-${i}">${machinesFor(ex.exId, S.gymId).map(m => `<option value="${esc(m.name)}">`).join('')}</datalist>`).join('')}
    ${B(CG,TX,'Continuar e salvar','applyMachineNudge()')}
    ${B(BG3,DM,'Voltar ao treino','closeModal()',';margin-bottom:0')}`);
}

function applyMachineNudge() {
  let created = false;
  machineNudgeTargets().forEach(({ ex, i }) => {
    const v = (document.getElementById(`mn-${i}`)?.value||'').trim(); if (!v) return;
    // Same reuse-not-fork rule as exercises: a typed name matching one of
    // this exercise's existing machines selects it instead of duplicating.
    let m = D.machines.find(x => x.exId === ex.exId && nameKey(x.name) === nameKey(v));
    if (!m) { m = { id: uid(), name: v, exId: ex.exId, gymIds: S.gymId ? [S.gymId] : [], updatedAt: Date.now() }; D.machines.push(m); created = true; }
    else if (S.gymId && !(m.gymIds||[]).includes(S.gymId)) { m.gymIds = [...m.gymIds, S.gymId]; m.updatedAt = Date.now(); created = true; }
    ex.instanceId = m.id; ex.instanceName = m.name;
  });
  if (created) persist();
  _machineNudgeDone = true;
  saveSession(); // re-enter the normal save routing, nudge satisfied
}

// ── Start-of-session nudge (E2 remainder D) ──────────────────────────────────
//
// The owner's "maybe once at the start, too" — belt-and-braces next to
// auto-attach and the save-time nudge, which is why it's the smallest and
// most disposable piece of the equipment layer (built last, by plan; drop
// it if real sessions show the save nudge suffices). A dismissible inline
// LINE under the session header, deliberately not a modal: nothing may
// interrupt the start of a workout.
//
// Shows when ≥1 calibrated block has no machine while known machines for
// that exercise exist AT THIS GYM — with a gym selected that means tagged
// there or location-unknown (empty gymIds: it might be here, and the
// picker lists it regardless); with no gym context, any known machine
// counts. Blocks whose exercise has no known machines are never counted:
// there'd be nothing to pick, and *creating* one is the save nudge's job.
// Re-edits of saved sessions are excluded (the same convention every other
// prompt follows — history touch-ups stay silent). The dismissal flag
// lives on S, so it rides the live-session mirror across reloads (a
// dismissed nudge stays dismissed for THIS session) but is dropped by the
// explicit-field record rebuild at save — it can never leak into history.

function startNudgeTargets() {
  if (!S) return [];
  return S.exercises
    .map((ex, i) => ({ ex, i }))
    .filter(({ ex }) => !ex.instanceId
      && D.exercises.some(e => e.id === ex.exId)
      && equipmentIsCalibrated(ex.exId)
      && D.machines.some(m => m.exId === ex.exId
        && (!S.gymId || !(m.gymIds||[]).length || m.gymIds.includes(S.gymId))));
}

function startNudgeHTML() {
  if (!S || S._editId || S._startNudgeHidden) return '';
  const targets = startNudgeTargets();
  if (!targets.length) return '';
  const n = targets.length;
  return `
    <div style="display:flex;align-items:center;gap:8px;background:#0a2e2e;border:1px solid #14484a;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:12px;color:#4dd0c4">
      <span onclick="startNudgeGo()" style="flex:1;cursor:pointer">🔧 ${n} exercício${n===1?'':'s'} sem máquina identificada — toque para ir</span>
      <button onclick="startNudgeHide()" title="Dispensar neste treino" style="flex-shrink:0;background:none;border:none;color:${DM};font-size:15px;cursor:pointer;padding:0 2px;font-family:inherit">×</button>
    </div>`;
}

// Tap-to-go: same scroll idiom as the focus-mode advance (exblk-N ids).
function startNudgeGo() {
  const first = startNudgeTargets()[0];
  if (first) document.getElementById('exblk-' + first.i)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function startNudgeHide() { if (S) { S._startNudgeHidden = true; render(); } }

// ── Slot resolution & ★ favorites (E3) ───────────────────────────────────────
//
// A slot NEVER resolves silently (owner redirection at kickoff: "a reminder
// or a suggestion, not just being automatically picked"). The placeholder
// block surfaces the top EVIDENCE-BASED suggestion inline (one-tap Usar);
// the picker ranks the movement's variants:
//   1. perGym[gymKey]        — "lembrado nesta academia", written ONLY by
//                               the explicit 📌 lembrar tap (owner call)
//   2. last-used at this gym — computed from session history
//   3. ★ favorites           — the owner's star system: a PREFERENCE, so it
//                               orders the list but never claims "sugerido"
//                               (suggestions are facts about here; a star
//                               isn't)
//   4. the rest, alphabetical
// gymKey is S.gymId or '' — the empty key covers gym-less sessions with the
// same mechanism, no second field. Resolving records fromMovement on the
// session entry (E4's movement-history data, accumulating from day one) and
// builds the block exactly as startPlan would have (modes from history,
// eid-keyed rest seed, machine auto-attach, load prefs).

const slotGymKey = () => S?.gymId || '';

// The live plan entry behind a slot block — resolution memory (perGym)
// lives THERE, on the plan, not on the session copy.
function planEntryFor(ex) {
  if (!S?.planId || !ex?._planEid) return null;
  return (D.plans.find(p => p.id === S.planId)?.exercises||[]).find(e => e.eid === ex._planEid) || null;
}

// Last exercise of this movement trained at this gym (any variant counts as
// evidence, whether or not it came from a slot — fromMovement OR the
// exercise's own movement). sessionsNewestFirst: the same-day-tie rule.
function lastMovementExAt(movement, gymKey) {
  if (!movement) return null;
  for (const sess of sessionsNewestFirst()) {
    if ((sess.gymId || '') !== gymKey) continue;
    const e = (sess.exercises||[]).find(x => x.exId
      && (x.fromMovement === movement || D.exercises.find(le => le.id === x.exId)?.movement === movement));
    if (e) return e.exId;
  }
  return null;
}

// Evidence rungs only (remembered → last-here); returns null when neither
// exists — the block then shows just "Escolher variação".
function slotSuggestionFor(ex) {
  const gymKey = slotGymKey();
  const remembered = planEntryFor(ex)?.perGym?.[gymKey];
  if (remembered && D.exercises.some(e => e.id === remembered)) return { exId: remembered, why: 'lembrado' };
  const last = lastMovementExAt(ex.movement, gymKey);
  if (last && D.exercises.some(e => e.id === last)) return { exId: last, why: 'ultima' };
  return null;
}

function resolveSlot(i) {
  const ex = S?.exercises[i]; if (!ex || !ex.slot) return;
  const m = MOVEMENTS[ex.movement];
  const gymKey = slotGymKey();
  const remembered = planEntryFor(ex)?.perGym?.[gymKey] || null;
  const lastHere = lastMovementExAt(ex.movement, gymKey);
  const vars = D.exercises.filter(e => e.movement === ex.movement);
  const rank = e => e.id === remembered ? 0 : e.id === lastHere ? 1 : e.favorite ? 2 : 3;
  vars.sort((a,b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'pt'));
  const badge = (txt, teal) => `<span style="display:inline-flex;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:700;background:${teal?'#0a2e2e':BG3};color:${teal?'#4dd0c4':DM}">${txt}</span>`;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:2px">🎯 ${esc(m?.pt || ex.movement || 'Movimento')}</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Escolha a variação de hoje${S.gymName ? ` — ${esc(S.gymName)}` : ''}. 📌 lembra a escolha para ${S.gymName ? 'esta academia' : 'treinos sem academia'}; ★ marca favoritas, que ficam no topo.</div>
    ${vars.length ? vars.map(e => {
      const unavail = S?.gymId && !availableAtGym(e, S.gymId);
      const isRem = e.id === remembered;
      return `
      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:stretch">
        <button onclick="resolveSlotTo(${i},'${e.id}')" style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:10px 12px;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-family:inherit;cursor:pointer;text-align:left${unavail?';opacity:.55':''}">
          <span style="flex:1;min-width:0">
            <span style="font-weight:600;font-size:13px;display:block">${e.favorite?'★ ':''}${esc(e.name)}</span>
            <span style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">
              ${isRem ? badge('lembrado nesta academia', true) : ''}
              ${e.id === lastHere && !isRem ? badge('última vez aqui', false) : ''}
              ${unavail ? `<span style="display:inline-flex;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:700;background:#1e1a00;color:#e6c84a">indisponível</span>` : ''}
            </span>
          </span>
        </button>
        <button onclick="toggleFavorite('${e.id}');resolveSlot(${i})" title="Favorita" style="flex-shrink:0;width:38px;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${e.favorite?'#e6c84a':DM};font-size:15px;cursor:pointer;font-family:inherit">${e.favorite?'★':'☆'}</button>
        <button onclick="slotRemember(${i},'${e.id}')" title="Lembrar nesta academia" style="flex-shrink:0;width:38px;background:${isRem?'#0a2e2e':BG3};border:1px solid ${isRem?'#14484a':BD};border-radius:8px;color:${isRem?'#4dd0c4':DM};font-size:14px;cursor:pointer;font-family:inherit">📌</button>
      </div>`;
    }).join('') : `<div style="font-size:13px;color:${DM};margin-bottom:8px">Nenhuma variação deste movimento na biblioteca ainda — crie uma no seletor de exercícios ou na Biblioteca.</div>`}
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0')}`);
}

// The explicit "lembrar" toggle (owner call: memory is written by THIS tap
// and nothing else). Lives on the PLAN entry — it's the plan's per-gym
// memory, not session state — with an updatedAt bump so LWW propagates.
// Toggling off = same tap on the remembered row.
function slotRemember(i, exId) {
  const ex = S?.exercises[i]; const en = planEntryFor(ex);
  if (!en) return; // plan deleted mid-session — nowhere to remember
  const gymKey = slotGymKey();
  en.perGym = en.perGym || {};
  if (en.perGym[gymKey] === exId) delete en.perGym[gymKey]; else en.perGym[gymKey] = exId;
  if (!Object.keys(en.perGym).length) delete en.perGym;
  const plan = D.plans.find(p => p.id === S.planId);
  if (plan) plan.updatedAt = Date.now();
  persist();
  resolveSlot(i); // re-rank + re-badge in place
}

// Turns the placeholder into a full exercise block IN PLACE — the same
// seeding startPlan gives a concrete entry (history-first modes, eid-keyed
// rest, last-used machine, load prefs), plus fromMovement: the record of
// which slot this exercise answered, which SURVIVES the save (unlike
// _planEid/_planNote) because it's E4's movement-history data.
function resolveSlotTo(i, exId) {
  const ph = S?.exercises[i]; if (!ph || !ph.slot) return;
  const ex = D.exercises.find(e => e.id === exId); if (!ex) return;
  const lm = lastModesFor(exId);
  const o = { exId, exName: ex.name, type:(lm?lm.type:ex.type)||'hypertrophy', compound:ex.compound, regime:(lm?lm.regime:ex.regime)||'weighted',
    ...(isTimed(ex) ? { tracking: TRACK_TIME } : {}),
    rest: seedRestFor(exId, S.planId, ph._planEid), sets: [],
    fromMovement: ph.movement,
    ...(ph._planEid ? { _planEid: ph._planEid } : {}),
    ...(ph._planNote ? { _planNote: ph._planNote } : {}) };
  const lim = lastInstanceFor(exId, S.gymId || null);
  if (lim) { o.instanceId = lim.id; o.instanceName = lim.name; }
  seedLoadPrefs(o, lim);
  o.sets = buildSetsFromMemory(o);
  S.exercises[i] = o;
  closeModal(); render();
}

// ── ★ Favorites (E3, owner proposal at kickoff) ──────────────────────────────
// A per-user preference flag ON the library exercise, synced through the
// normal exercise LWW like any edit (toggling bumps updatedAt). It's a
// RANKING signal for variant lists — resolve picker and movement browse —
// never an auto-pick. Deliberately NOT in normalizeExerciseDef: someone
// else's favorite is not the receiver's, so imports arrive unstarred.
function toggleFavorite(exId) {
  const ex = D.exercises.find(e => e.id === exId); if (!ex) return;
  if (ex.favorite) delete ex.favorite; else ex.favorite = true;
  ex.updatedAt = Date.now();
  persist();
}

// Star tap in the add-exercise picker rows — rebuilds the list so the
// ★-first ordering is immediately visible. (In the variant view this also
// rebuilds the new-variant form; starring while half-typing a name is rare

// A free workout's save offers plan creation too (the user asked for the
// option "in the moment of saving") — a lighter two-choice modal, since
