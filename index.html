// ── Plan editor: supersets (E3b) ─────────────────────────────────────────────
//
// The plan-side half of "assembled in both the plan editor and mid-session".
// Same data the session builder writes, so a group built here is the group
// startPlan() hands to the workout — no translation layer between them.

// Groups are lettered by the order their first member appears in the list, so
// the label is stable to read and needs nothing stored.
function planSsLetter(gid) {
  const seen = [];
  _planExs.forEach(en => { if (en.ss && !seen.includes(en.ss)) seen.push(en.ss); });
  const n = seen.indexOf(gid);
  return n < 0 ? '' : String.fromCharCode(65 + n);
}

function togglePlanSsMode() { _planSsMode = !_planSsMode; _planSsPick = []; refreshPlanExList(); }
function togglePlanSsPick(eid) {
  _planSsPick = _planSsPick.includes(eid) ? _planSsPick.filter(x => x !== eid) : [..._planSsPick, eid];
  refreshPlanExList();
}

function planSsToolbarHTML() {
  if (_planSsMode) return `
    <div style="background:${BG3};border:1px solid ${CS};border-radius:8px;padding:9px 10px;margin-bottom:8px">
      <div style="font-size:11px;color:${DM};margin-bottom:8px">Marque 2 ou mais exercícios que serão feitos juntos, em rodadas.</div>
      <div style="display:flex;gap:6px">
        ${Bs(_planSsPick.length>=2?CG:'#333',TX,`Criar superset${_planSsPick.length?` (${_planSsPick.length})`:''}`,'doCreatePlanSuperset()')}
        ${Bs(BG3,DM,'Cancelar','togglePlanSsMode()')}
      </div>
    </div>`;
  const groupable = _planExs.filter(en => !en.ss).length >= 2;
  return groupable ? `<div style="margin-bottom:8px">${Bs(BG3,DM,'⛓ Agrupar em superset','togglePlanSsMode()')}</div>` : '';
}

// Members are moved into a CONTIGUOUS run at the first pick's position — the
// same invariant the session side maintains (see sessionUnits), and the plan
// has to hold it too or startPlan() would hand the session a broken group.
function doCreatePlanSuperset() {
  const picks = _planExs.map((en, i) => _planSsPick.includes(en.eid) ? i : -1).filter(i => i >= 0);
  if (picks.length < 2) return;
  const gid = 'g' + uid();
  const at = picks[0];
  const members = picks.map(i => _planExs[i]);
  members.forEach(en => { en.ss = gid; en.ssMem = en.ssMem || en.eid; });
  _planExs = _planExs.filter(en => !members.includes(en));
  _planExs.splice(Math.min(at, _planExs.length), 0, ...members);
  _planGroups[gid] = { order: members.map(en => en.ssMem), rest: { between: 0, round: 120 } };
  _planSsMode = false; _planSsPick = [];
  refreshPlanExList();
}

function ungroupPlanSs(gid) {
  _planExs.forEach(en => { if (en.ss === gid) { delete en.ss; delete en.ssMem; delete en.ssWu; } });
  delete _planGroups[gid];
  closeModal(); showPlanEditorKeepingState();
}

// Re-opening the editor modal after a sub-modal would lose the name input's
// current text, so the name is cached before the rebuild. (A sub-modal
// replaces the editor outright — the same constraint that made the rest and
// note rows expand inline instead of opening their own modal.)
function showPlanEditorKeepingState() { showPlanEditor(_planNameCache); }

function openPlanSsCfg(gid) {
  const cfg = _planGroups[gid] || {};
  const mems = _planExs.filter(en => en.ss === gid);
  _planNameCache = (document.getElementById('plan-name')?.value || '').trim();
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">⛓ Superset ${planSsLetter(gid)}</div>
    <div style="font-size:12px;color:${DM};margin-bottom:14px">Executado em rodadas. Cada exercício continua sendo registrado individualmente.</div>
    <div style="margin-bottom:14px">${mems.map(en => {
      const ex = en.exId ? D.exercises.find(e => e.id === en.exId) : null;
      const mv = !en.exId ? MOVEMENTS[en.movement] : null;
      return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid ${BD}">
        <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ex ? ex.name : (mv?.pt || en.movement || '(removido)'))}</span>
        <button onclick="togglePlanMemberWu('${en.eid}','${gid}')" style="flex-shrink:0;padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:10px;cursor:pointer;font-family:inherit;background:${en.ssWu?CB:BG3};color:${en.ssWu?TX:DM}">WU nas rodadas</button>
      </div>`;
    }).join('')}</div>
    <div style="font-size:11px;color:${DM};font-weight:700;margin-bottom:6px">DESCANSO PADRÃO</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      ${numField('pss-between','Entre exercícios (s)', cfg.rest?.between ?? 0, 5)}
      ${numField('pss-round','Após a rodada (s)', cfg.rest?.round ?? 120, 5)}
    </div>
    <div style="font-size:11px;color:${DM};margin-bottom:14px">Intervalos individuais por rodada são ajustados durante o treino.</div>
    ${B(CG,TX,'Salvar',`savePlanSsCfg('${gid}')`)}
    ${B(BG3,TX,'Desagrupar (separar exercícios)',`ungroupPlanSs('${gid}')`)}
    ${B(BG3,DM,'Cancelar',`closeModal();showPlanEditorKeepingState()`,';margin-bottom:0')}`);
}

function togglePlanMemberWu(eid, gid) {
  const en = _planExs.find(x => x.eid === eid); if (!en) return;
  if (en.ssWu) delete en.ssWu; else en.ssWu = true;
  openPlanSsCfg(gid);
}

function savePlanSsCfg(gid) {
  _planGroups[gid] = _planGroups[gid] || { order: _planExs.filter(en => en.ss === gid).map(en => en.ssMem) };
  _planGroups[gid].rest = {
    between: sanitizeSecs(document.getElementById('pss-between')?.value) ?? 0,
    round:   sanitizeSecs(document.getElementById('pss-round')?.value) ?? 0,
    ...(_planGroups[gid].rest?.overrides ? { overrides: _planGroups[gid].rest.overrides } : {}),
  };
  closeModal(); showPlanEditorKeepingState();
}

function togglePlanRestEdit(eid) { _planRestEdit = _planRestEdit === eid ? null : eid; refreshPlanExList(); }
function togglePlanNoteEdit(eid) { _planNoteEdit = _planNoteEdit === eid ? null : eid; refreshPlanExList(); }

// The prescription note lives ON the entry — a plan-specific instruction
// ("what to do in THIS plan"), unlike a machine note (a fact about the
// apparatus, which lives on the machine). Trimmed and capped like every
// other free-text field that rides the sync payload.
function setPlanNote(eid, v) {
  const en = _planExs.find(x => x.eid === eid); if (!en) return;
  const note = (v||'').trim().slice(0, 200);
  if (note) en.prescription = { note }; else delete en.prescription;
}

// onchange from the inline rest inputs — keys by ENTRY id (schema 5); keeps
// only valid entries so a cleared field genuinely means "back to
// inheriting" for that transition.
function setPlanRest(eid, key, val) {
  const cur = { ..._planRests[eid], [key]: val };
  const clean = sanitizeRest(cur);
  if (clean) _planRests[eid] = clean; else delete _planRests[eid];
}

function movePlanEx(i,dir) { const j=i+dir; if(j<0||j>=_planExs.length)return; [_planExs[i],_planExs[j]]=[_planExs[j],_planExs[i]]; refreshPlanExList(); }
// Duplicates are ALLOWED since E3 (owner call — the a→b→a→b superset
// shape): each add mints its own entry, so nothing collides on ids.
function addExToPlan(id)   { if(!id)return; _planExs.push({ eid:uid(), exId:id }); refreshPlanExList(); }
// Adds a movement SLOT entry — the exercise gets picked at session time.
function addSlotToPlan(slug) { if(!slug||!MOVEMENTS[slug])return; _planExs.push({ eid:uid(), exId:null, movement:slug }); refreshPlanExList(); }
// Removing an entry also drops its per-plan rest override — re-adding
// it later silently resurrecting old timings would surprise more than help.
function rmPlanEx(i)       {
  const gone = _planExs[i];
  delete _planRests[gone.eid]; _planExs.splice(i,1);
  // A group left with one member is no longer a superset — dissolve it now
  // rather than at save, so the list never shows a ⛓ badge on a lone row.
  if (gone.ss && _planExs.filter(en => en.ss === gone.ss).length < 2) {
    _planExs.forEach(en => { if (en.ss === gone.ss) { delete en.ss; delete en.ssMem; delete en.ssWu; } });
    delete _planGroups[gone.ss];
  }
  refreshPlanExList();
}

// Prunes _planRests to the entries actually in the plan (a guard, not a
// normal path — rmPlanEx already cleans as it goes) and drops empty
// overrides, so a stored plan never carries dead rest entries.
function collectPlanRests() {
  const out = {};
  _planExs.forEach(en => { const r = sanitizeRest(_planRests[en.eid]); if (r) out[en.eid] = r; });
  return out;
}

function savePlan() {
  const name = (document.getElementById('plan-name')?.value||'').trim();
  if (!name) return;
  const rests = collectPlanRests();
  // Clone on write: _planExs keeps living as module state after the modal
  // closes, and the stored plan must never share mutable entry objects
  // with it (same rule as doSaveSession's plan writes).
  const entries = JSON.parse(JSON.stringify(_planExs));
  // Groups pruned to those the entries actually still form, with each order
  // rebuilt from the entry list — an entry removed from the plan must not
  // leave a group naming it, and a group down to one member is not a
  // superset. Same rule sessionPlanShape() applies on the session side.
  const cleanGroups = pruneGroups(entries, _planGroups);
  if (_planId) { const p=D.plans.find(x=>x.id===_planId); if(p){p.name=name;p.exercises=entries;p.rests=rests;if(cleanGroups)p.groups=cleanGroups;else delete p.groups;p.updatedAt=Date.now();} }
  else D.plans.push({ id:uid(), name, exercises:entries, rests, ...(cleanGroups?{groups:cleanGroups}:{}), updatedAt:Date.now() });
  persist(); closeModal(); render();
}
function delPlan(id) { D.tombstones.plans[id]=Date.now(); D.plans=D.plans.filter(p=>p.id!==id); persist(); render(); }

// ── Plan sharing — export a single plan as its own JSON file, import one ──
//
// Unlike the full Backup & Sync export (all of D), this bundles just one
// plan PLUS a snapshot of its concrete exercises' definitions — not just
// their ids. Entries only reference exercises by id, and ids are random
// per user for anything custom-created, so shipping ids alone would only
// work if the receiving user's library happened to already contain
// matching ids. Bundling the definitions means the plan works on import
// even into an empty library. Since schema 5 the payload also carries
// `entries` — the plan's structure (order, slots, prescription notes,
// duplicates) — WITHOUT perGym: remembered per-gym resolutions reference
// the sender's own gym ids, meaningless to the receiver (the same rule
// that keeps gym tags off the definitions). Used identically by the file
// export (exportPlan, e.g. over WhatsApp) and the in-app send
// (sendPlanShare).
function buildPlanPayload(p) {
  const defIds = [...new Set((p.exercises||[]).map(en => en.exId).filter(Boolean))];
  const exercises = defIds
    .map(exId => D.exercises.find(e => e.id === exId))
    .filter(Boolean)
    // rest DOES travel (unlike gyms): per-exercise timings are part of the
    // training prescription — the coach-sends-a-plan case wants them.
    .map(e => ({ id:e.id, name:e.name, type:e.type, compound:e.compound, regime:e.regime,
      mainMuscle:e.mainMuscle, movementPattern:e.movementPattern, accessoryMuscles:e.accessoryMuscles||[],
      ...(e.rest ? { rest: e.rest } : {}) }));
  // Superset grouping DOES travel, on the same argument that lets `rests`
  // travel and keeps gym tags off: it is training prescription, not local
  // bookkeeping — "do these three as a circuit, 15s between, 90s after" is
  // exactly what the coach-sends-a-plan case wants to carry. Unlike perGym,
  // nothing in it references sender-local ids: ssMem values are plan-internal,
  // the same way eids already are.
  const entries = (p.exercises||[]).map(en => ({ eid: en.eid, exId: en.exId || null,
    ...(en.movement ? { movement: en.movement } : {}),
    ...(en.ss ? { ss: en.ss, ssMem: en.ssMem || en.eid } : {}),
    ...(en.ssWu ? { ssWu: true } : {}),
    ...(en.prescription?.note ? { prescription: { note: en.prescription.note } } : {}) }));
  const shareGroups = sanitizeGroups(p.groups);
  return { type: 'gym-tracker-plan', name: p.name, exercises, entries,
    ...(p.rests && Object.keys(p.rests).length ? { rests: p.rests } : {}),
    ...(shareGroups ? { groups: shareGroups } : {}) };
}

function exportPlan(id) {
  const p = D.plans.find(x => x.id === id); if (!p) return;
  const payload = buildPlanPayload(p);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const fn   = `plano-${p.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')||'sem-nome'}.json`;
  const a = document.createElement('a'); a.href=url; a.download=fn;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// Reads a plan file selected via the hidden file input (not paste-into-
// textarea like Backup & Sync — this is meant to be received as an actual
// file from another user, e.g. over WhatsApp/email, so picking it directly
// is the more natural flow).
function importPlanFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.type !== 'gym-tracker-plan' || !Array.isArray(data.exercises)) throw new Error();
      applyImportedPlan(data);
    } catch(e) {
      alert('Arquivo de plano inválido.');
    }
  };
  reader.readAsText(file);
  input.value = ''; // reset so re-selecting the same file re-fires onchange
}

// Normalizes ONE untrusted exercise definition into a safe library entry.
// Single-sourced on purpose: the file import (applyImportedPlan), the
// in-app received share (same function), and the catalog add
// (restoreDeletedExercise) all apply EXACTLY this hardening — a fix here fixes
// every path.
//   · type/regime/compound outside the app's real enums are coerced to
//     defaults rather than stored verbatim. Every hand-created exercise is
//     constrained to these values by the modal's toggles (exF()); a stray
//     regime:'eccentric' would make the regime pill show one thing while
//     actualLoad()/buildWarmupSets() — which only special-case
//     'assisted'/'bodyweight' — silently treat it as another.
//   · mainMuscle/movementPattern are typeof-guarded before the enum lookup
//     because bracket access coerces its key to a string —
//     MUSCLE_GROUPS[undefined] resolves to the *string* key "undefined"
//     (a real, valid entry), so an absent field would otherwise pass the
//     membership check and store the literal JS value undefined instead of
//     the string 'undefined'.
//   · an absent id gets a fresh uid() — it must never fall through as
//     literal `undefined`, or two id-less entries would collide on the
//     same key for every `D.exercises.find(e => e.id === ...)` in the app.
// Caller remains responsible for name-presence filtering and for deciding
// whether a matching local exercise should be reused instead.
// `originHint` is what the CALLER knows about where this definition came
// from — ORIGIN_GLOBAL for a ⟳ Catálogo row, ORIGIN_SHARED for a plan
// import. It is a hint and not authority: a shared definition claiming
// `origin:'global'` is just another untrusted field, so a hint of SHARED is
// only honoured when the id isn't a known catalog id. That single rule
// covers both real cases — a friend sharing a plan built on official
// exercises (those resolve to `global`, they simply haven't been pulled
// yet) and a friend sharing something they invented (`shared`).
function normalizeExerciseDef(imp, originHint) {
  const origin = (originHint === ORIGIN_GLOBAL || isKnownGlobalId(imp.id)) ? ORIGIN_GLOBAL
    : (originHint === ORIGIN_SHARED ? ORIGIN_SHARED : ORIGIN_USER);
  const sharedFrom = (origin === ORIGIN_SHARED && typeof imp.sharedFrom === 'string' && imp.sharedFrom.trim())
    ? imp.sharedFrom.trim().slice(0, 120) : null;
  const type     = imp.type==='strength' ? 'strength' : 'hypertrophy';
  const regime   = (imp.regime==='assisted'||imp.regime==='bodyweight'||imp.regime===REGIME_BW_PLUS) ? imp.regime : 'weighted';
  const compound = imp.compound===true || imp.compound===false ? imp.compound : null;
  const mainMuscle = (typeof imp.mainMuscle === 'string' && MUSCLE_GROUPS[imp.mainMuscle]) ? imp.mainMuscle : 'undefined';
  const patternMap = MOVEMENT_PATTERNS[mainMuscle] || MOVEMENT_PATTERNS.undefined;
  const movementPattern = (typeof imp.movementPattern === 'string' && patternMap[imp.movementPattern])
    ? imp.movementPattern : (mainMuscle==='undefined'?'undefined':'other');
  const accessoryMuscles = Array.isArray(imp.accessoryMuscles)
    ? imp.accessoryMuscles.filter(m => typeof m==='string' && m!=='undefined' && MUSCLE_GROUPS[m]) : [];
  const rest = sanitizeRest(imp.rest); // same [0,3600]-integer discipline as every rest input

  // The bilingual/content layer (2026-07-29) — these used to be silently
  // DROPPED here, so a shared plan or catalog add arrived stripped of its
  // English name, aliases, equipment and cues (a long-tracked gap). Each
  // field is validated as untrusted input, never copied verbatim:
  // strings trimmed, lists filtered to non-empty strings and capped (a
  // hand-edited share file shouldn't be able to inject a 10k-alias blob
  // into everyone's sync payload), enums checked against the real maps.
  const strList = v => Array.isArray(v)
    ? v.filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().slice(0, 200)).slice(0, 12) : [];
  const name_en    = (typeof imp.name_en === 'string' && imp.name_en.trim()) ? imp.name_en.trim().slice(0, 120) : null;
  const equipment  = (typeof imp.equipment === 'string' && EQUIPMENT_LABELS[imp.equipment]) ? imp.equipment : null;
  const aliases    = strList(imp.aliases), cues_pt = strList(imp.cues_pt), cues_en = strList(imp.cues_en);
  const errors_pt  = strList(imp.errors_pt), errors_en = strList(imp.errors_en);
  const stretchEmphasis = imp.stretchEmphasis === true;
  // Only the literal 'time' is honoured; anything else (absent, garbage, a
  // future value this build doesn't know) falls back to rep tracking, which
  // is the safe default — a hold mis-imported as reps merely looks odd,
  // whereas a rep exercise mis-imported as timed would silently suppress
  // its graduation and 1RM.
  const tracking = imp.tracking === TRACK_TIME ? TRACK_TIME : null;
  // A movement slug only survives if this app's shipped vocabulary knows it
  // AND its category anchor matches the (already-normalized) classification —
  // a mismatched pair means either a corrupted file or a newer vocabulary
  // than this app; both drop to "no movement" rather than storing a claim
  // the resolution ladder would silently mis-group on.
  const movement = (typeof imp.movement === 'string' && MOVEMENTS[imp.movement]
    && MOVEMENTS[imp.movement].muscle === mainMuscle
    && MOVEMENTS[imp.movement].pattern === movementPattern) ? imp.movement : null;

  // An id-less definition is one this device is inventing storage for, so
  // it gets a user-namespaced id — never a bare uid() that could later
  // collide with a catalog slug.
  return { id: imp.id || newUserExId(), name: imp.name, type, compound, regime, mainMuscle, movementPattern, accessoryMuscles,
    origin, ...(sharedFrom ? { sharedFrom } : {}),
    ...(movement ? { movement } : {}), ...(name_en ? { name_en } : {}), ...(aliases.length ? { aliases } : {}),
    ...(equipment ? { equipment } : {}), ...(cues_pt.length ? { cues_pt } : {}), ...(cues_en.length ? { cues_en } : {}),
    ...(errors_pt.length ? { errors_pt } : {}), ...(errors_en.length ? { errors_en } : {}),
    ...(stretchEmphasis ? { stretchEmphasis } : {}), ...(tracking ? { tracking } : {}),
    ...(rest ? { rest } : {}), updatedAt: Date.now() };
}

// Merges an imported plan's exercises into the local library and creates a
// new plan referencing them. Matches each imported exercise against the
// local library first by id (works out of the box for anyone's untouched
// library.json-seeded exercises, since those ids are stable slugs shared
// across every install), falling back to a case-insensitive name match
// (covers a renamed or independently-recreated exercise with a different
// id). Only when neither matches is a new library entry added, using the
// sender's own id — keeping a second import of the same plan idempotent
// against the exercise list rather than creating duplicates.
// `sharedFrom` is the sender's identity when we actually know it — the
// in-app share path has it from the share row, where RLS pins from_email to
// the sender's JWT so it can't be spoofed. A plan arriving as a FILE (over
// WhatsApp, say) has no verifiable sender, so it stays null: better an
// unattributed "compartilhado comigo" than a name anyone could type into a
// JSON file.
function applyImportedPlan(data, sharedFrom) {
  // sender exId → resolved local exId, for remapping the plan-level rests
  // map below (its keys are the SENDER's ids, which may resolve to
  // different local ids via the name-match fallback).
  const idMap = {};
  const exIds = data.exercises
    // A plan file is untrusted input (from another user, possibly hand-
    // edited) — an entry with no usable name can't become a real library
    // exercise, so drop it rather than importing something invisible.
    .filter(imp => imp && typeof imp.name === 'string' && imp.name.trim())
    .map(imp => {
      // Match by id only if one was actually given — an absent id must
      // never fall through to `local.id` as literal `undefined`, or two
      // separately-imported id-less entries would collide on the same
      // `id: undefined` and become indistinguishable to every other
      // `D.exercises.find(e => e.id === ...)` lookup in the app.
      // The name fallback goes through findByName(), which matches name AND
      // name_en — a plan exported before the library went PT-BR-primary says
      // "Bench press", and it must resolve to the local "Supino reto"
      // instead of importing a duplicate with a split history.
      let local = (imp.id && D.exercises.find(e => e.id === imp.id)) || findByName(imp.name);
      if (!local) {
        // Anything genuinely new from someone else's plan is SHARED unless
        // its id is a catalog id we recognise — in which case it really is
        // official and the receiver simply hasn't pulled it yet.
        local = normalizeExerciseDef({ ...imp, sharedFrom }, ORIGIN_SHARED);
        D.exercises.push(local);
      }
      if (imp.id) idMap[imp.id] = local.id;
      return local.id;
    });
  // Entry structure (schema-5 payloads carry `entries`; legacy payloads
  // don't — for those, the definitions array IS the order, so entries are
  // derived from it, concrete and de-duplicated exactly as the old import
  // was). Sender eids are KEPT: they're plan-internal, uid-collision-free,
  // and keeping them preserves the rests mapping verbatim. Untrusted like
  // everything else here: notes trimmed/capped, a slot survives only when
  // this app's vocabulary knows its movement (the normalizeExerciseDef
  // movement rule — an unknown slug has nothing to resolve against), and
  // perGym never arrives (the payload never carries it; even a hand-added
  // one is dropped by the explicit field build).
  let entries;
  if (Array.isArray(data.entries)) {
    entries = data.entries.map(en => {
      if (!en || typeof en !== 'object') return null;
      const eid  = (typeof en.eid === 'string' && en.eid) ? en.eid : uid();
      const note = (typeof en.prescription?.note === 'string' && en.prescription.note.trim())
        ? en.prescription.note.trim().slice(0, 200) : null;
      // Superset markers arrive as untrusted strings like everything else: a
      // group id is only kept if it survives sanitizeGroups() below, and an
      // entry whose group didn't survive is stripped back to ungrouped rather
      // than left pointing at nothing.
      const ss = (typeof en.ss === 'string' && /^[A-Za-z0-9_-]+$/.test(en.ss)) ? en.ss : null;
      const grp = ss ? { ss, ssMem: (typeof en.ssMem === 'string' && /^[A-Za-z0-9_-]+$/.test(en.ssMem)) ? en.ssMem : eid,
                         ...(en.ssWu === true ? { ssWu: true } : {}) } : {};
      if (en.exId) {
        const localId = idMap[en.exId] || (D.exercises.some(e => e.id === en.exId) ? en.exId : null);
        return localId ? { eid, exId: localId, ...grp, ...(note ? { prescription: { note } } : {}) } : null;
      }
      return (typeof en.movement === 'string' && MOVEMENTS[en.movement])
        ? { eid, exId: null, movement: en.movement, ...grp, ...(note ? { prescription: { note } } : {}) } : null;
    }).filter(Boolean);
  } else {
    entries = [...new Set(exIds)].map(exId => ({ eid: uid(), exId }));
  }
  // Remap + sanitize the per-plan rest overrides: schema-5 payloads key by
  // sender eid (kept above, so a direct membership check suffices); legacy
  // payloads key by sender exId → resolve through idMap to the derived
  // entry. Only overrides for entries that actually made it in survive.
  const rests = {};
  Object.entries(data.rests || {}).forEach(([key, r]) => {
    const clean = sanitizeRest(r); if (!clean) return;
    if (Array.isArray(data.entries)) {
      if (entries.some(en => en.eid === key)) rests[key] = clean;
    } else {
      const localId = idMap[key];
      const en = localId && entries.find(x => x.exId === localId);
      if (en) rests[en.eid] = clean;
    }
  });
  // Groups, normalized as untrusted input and pruned to what actually landed:
  // a group needs 2+ entries that survived exercise resolution to mean
  // anything, and its member order is rebuilt from those entries so a
  // hand-edited order can't name members this import never created.
  const cleanGroups = pruneGroups(entries, sanitizeGroups(data.groups));
  D.plans.push({ id: uid(), name: data.name || 'Plano importado', exercises: entries, rests,
    ...(cleanGroups ? { groups: cleanGroups } : {}), updatedAt: Date.now() });
  persist(); render();
}

// ── In-app plan sharing UI (M2) — send by email, receive in "Planos recebidos"

function openSharePlan(planId) {
  const p = D.plans.find(x => x.id === planId); if (!p) return;

      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">

}

async function doSendPlanShare(planId) {
  const p = D.plans.find(x => x.id === planId); if (!p) return;
  const el  = document.getElementById('share-email');
  const msg = document.getElementById('share-msg');
  const to  = (el ? el.value : '').trim();
  if (!to || !msg) return;
  msg.style.display = 'block'; msg.style.color = DM; msg.textContent = 'Enviando…';
  const { error } = await sendPlanShare(to, p);
  msg.style.color = error ? '#e57373' : '#6fcf97';
  msg.textContent = error
    ? 'Não foi possível enviar: ' + (error.message || 'erro desconhecido')
    : `Enviado! Aparece em Planos recebidos quando ${to} abrir o app.`;
}

// Importing a received share runs the exact same pipeline as a picked file:
// shape guard first (same one importPlanFile applies), then
// applyImportedPlan()'s full untrusted-input hardening — an in-app share is
// still another user's data, trust it exactly as much as a file.
async function importShare(id) {
  const s = _receivedShares.find(x => x.id === id); if (!s) return;
  const data = s.payload;
  if (!data || data.type !== 'gym-tracker-plan' || !Array.isArray(data.exercises)) {
    alert('Plano recebido em formato inválido.');
    return;
  }
  applyImportedPlan(data, s.from_email);   // persists + renders
  _receivedShares = _receivedShares.filter(x => x.id !== id);
  markShareClaimed(id);                    // fire-and-forget; row stays server-side with claimed_at set
  render();
}

async function dismissShare(id) {
  _receivedShares = _receivedShares.filter(x => x.id !== id);
  markShareClaimed(id);
  render();
}

// ║  16. MODAL SYSTEM
// ║
// ║  All modals share the same overlay/box pattern.
// ║  showModal() injects HTML into a fixed overlay appended to body.
// ║  Tapping outside the modal closes it.
// ╚══════════════════════════════════════════════════════════════════════════════

// The hardware/browser Back button closes an open modal instead of leaving
// the page — real-device feedback (2026-07-29): the instinctive Back on an
// open exercise modal navigated away and (pre-stash) took the live session
// with it. Scheme: ONE history guard entry represents "a modal layer is
// open" (modal→modal replacement swaps DOM under the same entry — Back
// always means "close what's on top of the page", it doesn't retrace the
// modal-to-modal path). removeModal() is the raw DOM removal; closeModal()
// is user-intent close and ALSO consumes the guard entry via history.back()
// so the stack can't accumulate stale entries.
//
// _modalPop marks a history.back() WE issued: when its popstate lands, the
// modal is already gone from the DOM (removed synchronously — callers and
// the test suite rely on closeModal() being immediate). If a NEW modal
// opened in the gap (close-then-open flows do this synchronously), the
// consumed guard entry is re-pushed for it, or its Back press would exit
// the app instead of closing it.
let _modalPop = false;

// The whole integration only runs when the app IS the page. Embedded in an
// iframe (the regression suite; a Claude-artifact sandbox), pushState/back
// operate on the HOST tab's joint session history — the suite found this
// the hard way when in-iframe back() calls navigated the runner page itself
// away mid-run. An embedded app has no business steering its embedder's
// Back button, and the modals degrade cleanly to plain DOM open/close.
let _historyGuard = (window === window.top);

function showModal(html) {
  removeModal(); // replacement path: swap the DOM, keep the existing guard entry
  const ov  = document.createElement('div');
  ov.id     = 'modal-ov';
  ov.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end`;
  ov.onclick = e => { if (e.target===ov) closeModal(); };
  const box = document.createElement('div');
  box.style.cssText = `background:${BG2};border-radius:10px 10px 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto;box-sizing:border-box`;
  box.innerHTML = html;
  ov.appendChild(box);
  document.body.appendChild(ov);
  if (_historyGuard && !(history.state && history.state.modal)) { try { history.pushState({ modal: true }, ''); } catch (e) {} }
}
function removeModal() { document.getElementById('modal-ov')?.remove(); }
function closeModal() {
  removeModal();
  if (_historyGuard && history.state && history.state.modal && !_modalPop) {
    _modalPop = true;
    try { history.back(); } catch (e) { _modalPop = false; }
  }
}
window.addEventListener('popstate', () => {
  if (_modalPop) {
    // Our own back() landing. The DOM work already happened; just re-arm the
    // guard if a newer modal opened while the pop was in flight.
    _modalPop = false;
    if (document.getElementById('modal-ov') && !(history.state && history.state.modal)) {
      try { history.pushState({ modal: true }, ''); } catch (e) {}
    }
    return;
  }
  removeModal(); // genuine Back press with a modal open — close it, stay in the app
});
// A reload that happened while a modal was open leaves {modal:true} as the
// live history entry with no modal in the DOM — the first Back press would
// then eat itself popping it. Normalize at boot.
if (_historyGuard && history.state && history.state.modal) { try { history.replaceState(null, ''); } catch (e) {} }

// currently selected — MOVEMENT_PATTERNS is keyed per muscle group, so this
// has to be rebuilt (not just re-styled) every time the muscle changes.
function patternButtonsHTML() {
  const patterns = MOVEMENT_PATTERNS[_newMuscle] || MOVEMENT_PATTERNS.undefined;
  return Object.entries(patterns).map(([key,label]) =>
    `<button onclick="exF('pattern','${key}')" style="padding:8px 10px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${_newPattern===key?'#0a2e2e':BG3};color:${_newPattern===key?'#4dd0c4':DM}">${label}</button>`
  ).join('');
}

// Updates button styles in-place when type/compound/regime/muscle/
// pattern/accessory is toggled.
function exF(field, val) {
  if (field === 'type') {
    _newType = val;
    const s=document.getElementById('ex-s'), h=document.getElementById('ex-h');
    if(s){s.style.background=val==='strength'?'#A32D2D':BG3;s.style.color=val==='strength'?TX:DM;}
    if(h){h.style.background=val==='hypertrophy'?CB:BG3;h.style.color=val==='hypertrophy'?TX:DM;}
  } else if (field === 'compound') {
    _newCompound = val;
    _newCompoundTouched = true;
    const c=document.getElementById('ex-c'), i=document.getElementById('ex-i');
    if(c){c.style.background=val===true?'#1a1035':BG3;c.style.color=val===true?'#b39ddb':DM;}
    if(i){i.style.background=val===false?'#1e1810':BG3;i.style.color=val===false?'#d4a96a':DM;}
  } else if (field === 'regime') {
    _newRegime = val;
    const w=document.getElementById('ex-w'), a=document.getElementById('ex-a'), b=document.getElementById('ex-bw');
    if(w){w.style.background=val==='weighted'?CB:BG3;w.style.color=val==='weighted'?TX:DM;}
    if(a){a.style.background=val==='assisted'?CA:BG3;a.style.color=val==='assisted'?TX:DM;}
    if(b){b.style.background=val==='bodyweight'?CG:BG3;b.style.color=val==='bodyweight'?TX:DM;}
  } else if (field === 'muscle') {
    _newMuscle = val;
    // Changing muscle invalidates the old pattern — each group has its own
    // scoped vocabulary (MOVEMENT_PATTERNS) — so reset to that group's own
    // escape valve rather than leaving a stale key from a different group.
    _newPattern = val === 'undefined' ? 'undefined' : 'other';
    const g = document.getElementById('ex-pattern-group');
    if (g) g.innerHTML = patternButtonsHTML();
  } else if (field === 'pattern') {
    _newPattern = val;

    _newEquip = _newEquip === val ? null : val;

// Reads the three rest inputs from the open exercise modal into the shape

function openNewEx()  {

function openEditEx(id) {
  const ex = D.exercises.find(e=>e.id===id); if(!ex)return;

  // to highlight for an unclassified (compound:null) exercise — it does

  // display default should ever be written back.
  _newType=ex.type||'hypertrophy'; _newCompound=ex.compound!=null?ex.compound:true; _newRegime=ex.regime||'weighted';
  _newCompoundTouched = false;

  // nullable like compound — every exercise already has a real string here
  // (backfillExerciseClassification() guarantees it) — but default anyway

  _newMuscle = ex.mainMuscle || 'undefined';

  _newGyms = (ex.gyms||[]).filter(id => D.gyms.some(g => g.id === id));

  // unknown class just highlights no chip, and an untouched save writes it
  // back unchanged (see _newEquip's declaration for the future-class case).
  _newEquip = ex.equipment || null;

  _newRest = { wuwu: ex.rest?.wuwu ?? '', wuw: ex.rest?.wuw ?? '', ww: ex.rest?.ww ?? '' };

// Normalized name key for duplicate detection: case-, accent- and
// whitespace-insensitive, so "Rosca direta", "rosca  direta" and "Rosca
// Direta" all collide. Used by the creation guards and by the duplicate
// finder (section 13).
const nameKey = n => String(n||'')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')   // strip accents
  .toLowerCase().trim().replace(/\s+/g, ' ');

// Matches name AND name_en — since the library went PT-BR-primary
// (2026-07-29), someone quick-creating by the English name they remember
// ("bench press") must still land on the existing "Supino reto" instead of
// forking its history. Deliberately NOT aliases: those are loose search
// terms ("supino" is an alias of Supino reto), and treating them as
// identity would swallow genuinely new names into the wrong exercise.
const findByName = n => D.exercises.find(e =>
  nameKey(e.name) === nameKey(n) || (e.name_en && nameKey(e.name_en) === nameKey(n)));

function saveNewEx() {
  const name = (document.getElementById('ex-name')?.value||'').trim(); if(!name)return;
  // Nothing stopped this path from creating a second "Supino reto" with a
  // fresh random id — and a split id means split history: the progression
  // engine keys on exId, so duplicates silently fragment suggestions.
  // Warn, but allow (it's their library, and deliberate near-duplicates
  // with the same name are their call).
  const clash = findByName(name);
  if (clash && !confirm(`Já existe "${clash.name}" na biblioteca.\n\nCriar outro com o mesmo nome? Isso divide o histórico e as sugestões entre os dois.`)) return;
  const rest = readModalRest();
  D.exercises.push({ id:newUserExId(), name, type:_newType, compound:_newCompound, regime:_newRegime, origin:ORIGIN_USER,
    mainMuscle:_newMuscle, movementPattern:_newPattern, accessoryMuscles:[..._newAccessory],
    gyms:[..._newGyms], ...(_newEquip ? { equipment:_newEquip } : {}),
    ...(_newTracking===TRACK_TIME ? { tracking:TRACK_TIME } : {}), ...(rest ? { rest } : {}), updatedAt:Date.now() });
  persist(); closeModal(); render();
}
function saveEditEx() {
  const id   = document.getElementById('edit-ex-id')?.value;
  const name = (document.getElementById('ex-name')?.value||'').trim();
  if (!id||!name) return;
  const ex = D.exercises.find(e=>e.id===id);
  // Only write compound if the toggle was actually clicked this edit —
  // otherwise an unclassified (compound:null) exercise gets permanently
  // reclassified to _newCompound's display default just from renaming it
  // or editing type/regime, without the user ever making that choice.
  // mainMuscle/movementPattern/accessoryMuscles have no such nullable state
  // to preserve — they're mandatory-with-an-escape-valve, so every save
  // just writes whatever the modal currently shows, same as type/regime.
  if (ex) {
    ex.name=name; ex.type=_newType; if(_newCompoundTouched) ex.compound=_newCompound; ex.regime=_newRegime;
    ex.mainMuscle=_newMuscle; ex.movementPattern=_newPattern; ex.accessoryMuscles=[..._newAccessory];
    ex.gyms=[..._newGyms];
    // Equipment class (E2 remainder B): the one field this modal couldn't
    // touch — which left "exercício avulso" creations class-less with no
    // in-app fix. Changing it on an exercise WITH history is safe by
    // construction: stored kg is unit-blind totals, so nothing rewrites;
    // what flips is picker grouping, 🔧 vocabulary and calibrated-vs-
    // descriptive semantics going forward (flipping a machine exercise to
    // barbell releases its instance-filtered history into the shared pool —
    // the honest meaning of the correction, not a hazard).
    if (_newEquip) ex.equipment = _newEquip; else delete ex.equipment;
    // Set measurement. Flipping this on an exercise WITH history is safe by
    // construction for the same reason the equipment flip is: nothing stored
    // is rewritten. The numbers in s.reps stay exactly as logged — what
    // changes is how they're READ from here on (a column header, m:ss
    // formatting, and whether rep-arithmetic runs). Flipping a rep exercise
    // to time therefore reinterprets its past reps as seconds, which is the
    // honest meaning of the correction rather than a hazard — the same
    // trade the equipment-class flip already makes.
    if (_newTracking === TRACK_TIME) ex.tracking = TRACK_TIME; else delete ex.tracking;
    const rest = readModalRest();
    if (rest) ex.rest = rest; else delete ex.rest; // all-blank inputs mean "back to inheriting"
    ex.updatedAt=Date.now();
  }
  persist(); closeModal(); render();
}
function delEx(id) { D.tombstones.exercises[id]=Date.now(); D.exercises=D.exercises.filter(e=>e.id!==id); persist(); render(); }

function familyHomeMuscle(movs) {

  Object.keys(MUSCLE_GROUPS).forEach(k => { if (tally[k] && (!best || tally[k] > tally[best])) best = k; });
