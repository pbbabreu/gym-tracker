// ── Sync queue ──────────────────────────────────────────────────────────────
//
// Every push (remoteSave) and pull (remotePull, loadData's background fetch)
// runs through this so they're never concurrent — a pull racing an
// in-flight push could read a half-written remote state, and two
// overlapping pushes could clobber each other's writes. A save that starts
// while one's already running doesn't wait or fire a second overlapping
// request; it just flags that there's more to sync, and the in-flight one
// triggers exactly one more push once it finishes, capturing whatever
// changed in between — so a burst of rapid edits collapses into at most one
// extra round-trip instead of a pile of overlapping requests. Pulls, being
// deliberate/infrequent rather than rapid-fire, simply wait their turn.
let _syncBusy = false;
let _syncQueued = false;

// Consecutive failed Gist round-trips (push or pull) while apparently
// ONLINE — attempts with navigator.onLine === false don't count, because
// failing to sync at the gym with no signal is expected, not a problem
// worth nagging about. Any success resets to 0. At 3+, the banner in
// buildPage() surfaces it: the tiny red dot alone proved too quiet for a
// genuinely broken setup (expired PAT, revoked scope), which otherwise
// stays invisible until someone happens to open the Backup modal.
let _syncFailStreak = 0;

// Stamped on every successful fetch+merge (loadData's background pull and
// remotePull) — read by the visibilitychange resume-pull below to rate-limit
// itself.
let _lastPullOk = 0;

function releaseSyncSlot() {
  _syncBusy = false;
  if (_syncQueued) { _syncQueued = false; remoteSave(); }
}

// Push all six payloads to the active driver (fire-and-forget from persist())
async function remoteSave() {
  if (!syncConfigured()) return;
  // Never let an app build overwrite data written by a NEWER one — this
  // flag is set when a pull saw a schema stamp ahead of ours (see
  // mergeRemote()). Checked before the busy/queue logic on purpose: a
  // blocked push must not sit in the queue and fire later anyway.
  if (_remoteSchemaAhead) { setSyncStatus('error'); return; }
  if (_syncBusy) { _syncQueued = true; return; }
  _syncBusy = true;
  setSyncStatus('syncing');
  const payload = buildRemotePayload();
  const ok = syncDriver() === 'supabase'
    ? await sbWriteAll(payload)
    : await gistWriteFiles(payloadToGistFiles(payload));
  if (ok) _syncFailStreak = 0;
  else if (navigator.onLine !== false) _syncFailStreak++;
  setSyncStatus(ok ? 'ok' : 'error');
  releaseSyncSlot();
}

// Manual re-sync — called from "Forçar download" button in sync modal.
// Since every data type below merges by safe union (never destructive),
// this doesn't need a "force" path anymore — it's just an on-demand version
// of the background fetch+merge loadData() already does automatically.
// Useful when you're about to start a workout and a session logged on
// another device hasn't shown up in History yet.
// Returns true only when the fetch AND merge both succeeded — the one
// caller that chains a push off this (saveGithubConfig()) must never push
// after a failed pull, or it would blind-overwrite the remote state it
// just failed to read.
async function remotePull() {
  if (!syncConfigured()) {
    alert(syncDriver() === 'supabase' ? 'Entre com seu e-mail primeiro (Backup & Sync).' : 'Configure o token do GitHub primeiro.');
    return false;
  }
  while (_syncBusy) await new Promise(r => setTimeout(r, 50)); // wait for any in-flight push/pull
  _syncBusy = true;
  setSyncStatus('syncing');
  const remote = await remoteFetchAll();
  if (!remote) { if (navigator.onLine !== false) _syncFailStreak++; setSyncStatus('error'); releaseSyncSlot(); return false; }
  if (!mergeRemote(remote)) { setSyncStatus('error'); releaseSyncSlot(); return false; } // remote schema is newer than this app — see mergeRemote(); not a failure streak
  await persistLocal();
  _syncFailStreak = 0;
  _lastPullOk = Date.now();
  setSyncStatus('ok');
  render();
  releaseSyncSlot();
  // Piggyback the shares inbox on every successful account pull — one cheap
  // extra select, keeps "Planos recebidos" fresh without its own schedule.
  if (syncDriver() === 'supabase') loadReceivedShares();
  return true;
}

// ── Resume pull ───────────────────────────────────────────────────────────────
//
// An installed PWA can sit warm in the app switcher for days, and
// loadData()'s background pull only runs on a genuine cold start — so
// "phone doesn't see the session logged on the desktop yesterday" kept
// happening until a manual Forçar download. This fires the same queued
// fetch+merge whenever the app becomes visible again, rate-limited by
// _lastPullOk so ordinary tab-switching doesn't hammer the API. On a
// successful pull it also pushes the merged result back (same convergence
// step loadData's cold-start pull does).
const RESUME_PULL_MIN_MS = 5 * 60 * 1000;
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  // Rest-timer catch-up, before any sync early-return below: browsers
  // throttle (or fully suspend) intervals in hidden tabs, so a rest that
  // expired while the screen was off/app was backgrounded may not have
  // ticked yet — run one immediate tick so the banner flips and the expiry
  // signal fires the moment the user comes back, not up to a throttle
  // period later. (The signal itself stays best-effort: vibration is
  // Blink-only and some browsers ignore it for pages that were hidden.)
  if (_restTimer && !_restTimer.done) restTimerTick();
  if (!syncConfigured()) return;           // no driver ready (no Gist config / not logged in)
  if (_remoteSchemaAhead) return;          // frozen until a fresh reload anyway
  if (Date.now() - _lastPullOk < RESUME_PULL_MIN_MS) return;
  const ok = await remotePull();             // queued — can never race an in-flight push
  if (ok) remoteSave();
});

// Merges one collection: union by id with per-item last-writer-wins (the
// copy with the higher updatedAt is kept; remote wins ties), then
// tombstones remove anything they cover UNLESS the surviving item's own
// updatedAt is newer than the deletion. Also unions the tombstone maps
// themselves (keeping the later deletedAt per id) so a deletion recorded
// on either side sticks. See the section 5 banner for why this exists —
// a plain union with no tombstones let a deleted item come back to life
// the next time a stale device synced.
function mergeCollection(local, remote, localTombstones, remoteTombstones) {
  const map = new Map(local.map(x => [x.id, x]));
  // Per-item LWW, not blind "remote wins": remoteSave() always uploads WHOLE
  // collections, so every push implicitly rewrites every item in them, not
  // just the one the user touched. Under blind remote-wins, any push from
  // a device holding a stale copy (e.g. a tab left open since yesterday
  // editing an unrelated plan) silently reverted newer edits everywhere —
  // no concurrent edit to the same item needed. Comparing each item's own
  // updatedAt closes that: the stale copy loses, the newer edit survives
  // the round-trip and re-propagates. Remote wins ties (>=) on purpose:
  // legacy items with no updatedAt compare 0 vs 0 and must keep the old
  // remote-wins behavior they were originally written under.
  (remote||[]).forEach(x => {
    const cur = map.get(x.id);
    if (!cur || (x.updatedAt||0) >= (cur.updatedAt||0)) map.set(x.id, x);
  });

  const tombstones = { ...localTombstones };
  Object.entries(remoteTombstones||{}).forEach(([id, deletedAt]) => {
    if (!tombstones[id] || deletedAt > tombstones[id]) tombstones[id] = deletedAt;
  });

  Object.entries(tombstones).forEach(([id, deletedAt]) => {
    const item = map.get(id);
    if (!item) return;
    if ((item.updatedAt||0) <= deletedAt) map.delete(id);
    else delete tombstones[id]; // item was genuinely edited after the delete — the tombstone is stale
  });

  return { items: [...map.values()], tombstones };
}

// Merge remote Gist data into D using mergeCollection() for all four
// collections — see the section 5 banner for the shared merge rule.
// Returns false (merging nothing at all) when any remote file was written
// by a newer app version than this one — a partial old-shape/new-shape
// merge is scarier than skipping a sync, and the next fresh load gets the
// current app anyway.
function mergeRemote(remote) {
  const remoteSchema = Math.max(...[remote.sessions, remote.library, remote.plans, remote.weights, remote.gyms, remote.machines].map(f => f?.schema || 1));
  if (remoteSchema > SCHEMA_VERSION) { _remoteSchemaAhead = true; return false; }

  if (remote.sessions?.sessions) {
    const { items, tombstones } = mergeCollection(D.sessions, remote.sessions.sessions, D.tombstones.sessions, remote.sessions.tombstones);
    D.sessions = items.sort((a,b) => b.date.localeCompare(a.date));
    D.tombstones.sessions = tombstones;
    // A remote device running an app version older than the saveSession()
    // metadata strip can push sets still carrying chip/dim scaffolding —
    // scrub after every merge, same reasoning as the backfill below.
    scrubSessionSetMetadata();
  }

  if (remote.library?.exercises) {
    const { items, tombstones } = mergeCollection(D.exercises, remote.library.exercises, D.tombstones.exercises, remote.library.tombstones);
    D.exercises = items;
    D.tombstones.exercises = tombstones;
    // A remote device that hasn't loaded this classification feature yet
    // could push exercises with no mainMuscle at all — backfill after every
    // merge, not just on local load, so that never leaves a gap.
    backfillExerciseClassification(); backfillPlanEntries(); normalizeExerciseOrigin();
  }

  if (remote.plans?.plans) {
    const { items, tombstones } = mergeCollection(D.plans, remote.plans.plans, D.tombstones.plans, remote.plans.tombstones);
    D.plans = items;
    D.tombstones.plans = tombstones;
  }

  if (remote.weights?.weights) {
    const { items, tombstones } = mergeCollection(D.weights, remote.weights.weights, D.tombstones.weights, remote.weights.tombstones);
    D.weights = items;
    D.tombstones.weights = tombstones;
  }

  if (remote.gyms?.gyms) {
    const { items, tombstones } = mergeCollection(D.gyms, remote.gyms.gyms, D.tombstones.gyms, remote.gyms.tombstones);
    D.gyms = items;
    D.tombstones.gyms = tombstones;
  }
  if (remote.machines?.machines) {
    const { items, tombstones } = mergeCollection(D.machines, remote.machines.machines, D.tombstones.machines, remote.machines.tombstones);
    D.machines = items;
    D.tombstones.machines = tombstones;
  }
  return true;
}

// ── persist() — called after every mutation ───────────────────────────────────

async function persist() {
  D.lastModified = Date.now();
  await persistLocal();
  remoteSave(); // fire-and-forget
}

// ── Live-session persistence ──────────────────────────────────────────────────
//
// The in-progress session (S) used to exist only in memory — real-device
// feedback (2026-07-29): the browser's Back button, an accidental tab close,
// or the OS reclaiming the tab silently discarded a whole workout. Now S is
// mirrored into localStorage on every state change (render() is the
// universal post-mutation hook; setVal() additionally covers keystrokes,
// which deliberately don't render) and restored on the next app open. The
// rest timer rides along so a still-running countdown survives the reload.
//
// The _liveRestoreDone latch exists for a boot-ordering hazard: the Supabase
// auth listener (and anything else async) can call render() while loadData()
// is still mid-startup — with S still null, an unlatched stash write would
// CLEAR the stash before restoreLiveSession() ever read it, losing the
// workout on exactly the reopen path this feature exists for. Nothing may
// touch the stash until the boot restore has run.
let _liveRestoreDone = false;

function stashLiveSession() {
  if (!_liveRestoreDone) return;
  // Clearing uses the same LS.set(k,'') idiom as gym:currentGym — the reader
  // treats a falsy value as "no stash".
  if (S) LS.set('gym:live-session', JSON.stringify({ v: 1, S, restTimer: _restTimer, savedAt: Date.now() }));
  else LS.set('gym:live-session', '');
}

// Called once from loadData(), before the first render. Restoring drops the
// user straight back into the session screen (TAB='log') — for the "phone
// killed the tab mid-workout" case that's exactly where they were. A stale
// stash from days ago restores too, on purpose: it's unsaved data and only
// the user can decide whether it's a workout worth keeping (Salvar) or
// discarding (Cancelar, which now confirms) — silent expiry would be the
// same data loss this feature exists to prevent.
function restoreLiveSession() {
  try {
    const raw = LS.get('gym:live-session');
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.S && Array.isArray(p.S.exercises)) {
        S = p.S;
        // Resume a countdown that's still genuinely running. An expired or
        // already-"Bora!" timer is dropped: buzzing about a rest that ended
        // while the app was closed is noise, not information.
        if (p.restTimer && !p.restTimer.done && p.restTimer.endsAt > Date.now()) {
          _restTimer = p.restTimer;
          if (!_restTimerInterval) _restTimerInterval = setInterval(restTimerTick, 500);
        }
        TAB = 'log';
      }
    }
  } catch (e) {} // corrupt stash: leave it in place for inspection, boot normally
  _liveRestoreDone = true; // latch opens even when there was nothing to restore
}

// ── Load sequence ─────────────────────────────────────────────────────────────
// 1. Load config
// 2. Load local cache → render immediately (app is usable offline)
// 2b. Fresh install only (no personal exercises yet) → seed from library.json
// 3. Fetch all four Gist files in background → merge → re-render

async function loadData() {
  await loadConfig();

  // Restore the per-device gym selection (see _currentGymId, section 3) —
  // resolved lazily through currentGym(), so a stale id is harmless.
  _currentGymId = LS.get('gym:currentGym') || null;

  // Step 2 — local cache
  const local = await loadLocalData();
  if (local) {
    D.exercises    = local.exercises    || [];
    D.plans        = local.plans        || [];
    D.sessions     = local.sessions     || [];
    D.weights      = local.weights      || [];
    D.gyms         = local.gyms         || [];
    D.machines     = local.machines     || [];
    D.tombstones   = local.tombstones   || { exercises:{}, plans:{}, sessions:{}, weights:{}, gyms:{}, machines:{} };
    // A cache written before gyms/machines existed has a tombstones object
    // missing those keys — normalize so the delete paths and
    // mergeCollection() never hit undefined.
    if (!D.tombstones.gyms) D.tombstones.gyms = {};
    if (!D.tombstones.machines) D.tombstones.machines = {};
    D.lastModified = local.lastModified || 0;
    // Backfills any exercise saved before muscle-group classification
    // existed — see backfillExerciseClassification() (section 2). A no-op
    // once every exercise has been through it once.
    backfillExerciseClassification(); backfillPlanEntries(); normalizeExerciseOrigin();
    // Same idea for sessions saved before the set-metadata strip existed —
    // see scrubSessionSetMetadata() (section 2). Also a no-op once clean.
    scrubSessionSetMetadata();
    // First load of the day → stash the as-loaded state (pre-any-merge)
    // into today's weekday snapshot slot. See writeDailySnapshot().
    writeDailySnapshot();
  }
  // Bring back any workout that was in progress when the page last went away
  // (Back button, tab killed, app closed) — must run before the first render,
  // which is also what opens the stash latch. See restoreLiveSession().
  restoreLiveSession();
  render();

  // Step 2b — a genuinely fresh install (no personal exercises at all yet)
  // gets seeded from library.json. Runs after the first render so the app
  // is already usable while this fetch is in flight.
  if (!D.exercises.length) await seedStarterLibrary();
  // Step 2c — an EXISTING install picks up whatever the catalog has gained
  // since. This is what makes the curated library arrive on its own instead
  // of having to be opted into entry by entry, and it deliberately runs
  // BEFORE the login check below: the library must not require an account.
  else await refreshGlobalLibrary();

  // Restore any persisted login BEFORE deciding whether sync can run — the
  // SDK reads its stored session from localStorage asynchronously, and the
  // supabase driver counts as configured only once that session exists.
  if (sb) { try { const { data } = await sb.auth.getSession(); sbSession = data?.session || null; } catch(e) {} }
  if (!syncConfigured()) return;

  // Step 3 — background remote fetch (whichever driver is active). Goes
  // through the same sync queue as remotePull()/remoteSave() (see their
  // comment) so this can't race a push that's already in flight. Status is
  // set to 'ok' only once the fetch+merge itself is actually done — it
  // used to be set right after firing remoteSave() without awaiting it,
  // which could show "synced" a moment before the push had even started,
  // let alone finished.
  while (_syncBusy) await new Promise(r => setTimeout(r, 50));
  _syncBusy = true;
  setSyncStatus('syncing');
  const remote = await remoteFetchAll();
  if (!remote) { if (navigator.onLine !== false) _syncFailStreak++; setSyncStatus('error'); releaseSyncSlot(); return; }

  if (!mergeRemote(remote)) { setSyncStatus('error'); releaseSyncSlot(); return; } // remote schema newer than this app — don't merge, don't push
  await persistLocal();
  _syncFailStreak = 0;
  _lastPullOk = Date.now();
  setSyncStatus('ok');
  render();
  releaseSyncSlot();
  remoteSave(); // push merged result back so all devices converge — goes through the queue itself
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  6. MEMORY SYSTEM
// ║
// ║  Computes progressive-overload suggestions directly from D.sessions —
// ║  there is no separate cached-memory layer (an earlier D.memory/
// ║  rebuildMemory() snapshot cache was removed as dead code: it only ever
// ║  held a single latest entry per key, nothing read it back once history-
// ║  aware suggestions shipped, and its own remote merge was provably
// ║  overwritten by its own rebuild in the same function).
// ║  Key format: "exId:type:regime"  e.g. "abc123:strength:weighted"
// ║
// ║  isCountedWork()       — a set counts as real performed work only if
// ║                          intent==='work' and it wasn't explicitly left
// ║                          unchecked (completed!==false, not ===true —
// ║                          sets saved before the checkbox existed, or a
// ║                          freshly-added row nobody has touched yet, have
// ║                          no `completed` at all and must still count).
// ║  profileFor()          — the baseline rep-range/target-set-count profile,
// ║                          by type and (for hypertrophy) regime. Per-
// ║                          exercise custom profiles are a deliberately
// ║                          deferred future feature (see the project Log).
// ║  getRecentWorkHistory()— last N sessions' counted work sets for a key,
// ║                          newest first — a short window, not a single
// ║                          snapshot, since detecting a multi-session stall
// ║                          needs more than the latest session alone.
// ║  computeSuggestion()   — the actual progression algorithm. NOT a simple
// ║                          per-number trend: "graduated" (ready for more
// ║                          weight) requires the FULL target work-set count
// ║                          to be completed at the top of the rep range, all
// ║                          at the same (working) weight. A set performed
// ║                          below that weight — e.g. a fatigue drop-off
// ║                          partway through a session — fails the check on
// ║                          its own, which is exactly the desired behavior:
// ║                          don't suggest more weight until the whole
// ║                          prescribed session can be done at it. Bodyweight
// ║                          is excluded from graduation/stall entirely (see
// ║                          below) — there's no adjustable resistance to
// ║                          progress in this data model.
// ║
// ║  Warm-up generation rules (weight scales off the SUGGESTED weight for
// ║  today, not last session's actual heaviest set; reps ramp 10-8-6 as the
// ║  sets get heavier/closer to work weight — see WU_REPS in
// ║  buildSetsFromMemory()):
// ║    Compound + weighted  → 3 WU sets at 25 / 55 / 85% of suggested weight
// ║    Compound + assisted  → 3 WU sets at 175 / 145 / 115% (more assist = easier)
// ║    Isolation + weighted → 1 WU set at 50% of suggested weight (6 reps —
// ║                           the "closest to work weight" step, not 10)
// ║    Isolation + assisted → 1 WU set at 150% (the complement of 50%, same
// ║                           inversion the compound ramp uses)
// ║    Bodyweight           → no warm-ups
// ║  Every set (warm-up and work) gets a completed checkbox — checking it
// ║  confirms whatever's currently shown as accurate, same as editing it by
// ║  hand (see toggleCompleted()).
// ╚══════════════════════════════════════════════════════════════════════════════

const memKey = (exId, type, regime) => `${exId}:${type}:${regime||'weighted'}`;

const isCountedWork = s => s.intent === 'work' && s.completed !== false;

// Target bands for TIMED exercises, in seconds — the direct analogue of
// repLow/repHigh. A hold graduates by getting LONGER until it reaches the
// top of its band, at which point (if the exercise carries load) the load
// goes up and the target resets to the bottom, exactly as reps do.
// Strength holds are short and heavy, hypertrophy/endurance holds longer.
// Per-exercise overrides are the already-planned custom-profiles item.
const TIME_BANDS = { strength: { low: 15, high: 30 }, hypertrophy: { low: 30, high: 60 } };

function profileFor(type, regime, tracking) {
  // A timed exercise measures the same three things — how many work sets,
  // and the low/high of the target band — the band is just in seconds. The
  // rest of the engine reads repLow/repHigh, so timed profiles fill those
  // fields with the time band rather than introducing a parallel shape;
  // `timed` marks which unit they're in.
  if (tracking === TRACK_TIME) {
    const b = TIME_BANDS[type === 'strength' ? 'strength' : 'hypertrophy'];
    return { targetWorkSets: type === 'strength' ? 3 : 1, repLow: b.low, repHigh: b.high, timed: true };
  }
  // 3–5, per the owner's explicit correction (2026-07-25). The earlier 2–5
  // came from git archaeology of the pre-feature code and stood until the
  // range got real-world use — user preference beats historical accuracy.
  if (type === 'strength') return { targetWorkSets: 3, repLow: 3, repHigh: 5 };
  // Hypertrophy's 1 target work set is the same for compound and isolation
  // — only the warm-up count differs by isComp (3 vs 1, in
  // buildWarmupSets()), the work-set target doesn't.
  return regime === 'assisted'
    ? { targetWorkSets: 1, repLow: 6, repHigh: 12 }
    : { targetWorkSets: 1, repLow: 6, repHigh: 10 };
}

// Returns up to n most recent sessions' counted work sets for this exact
// exercise+type+regime, newest first — e.g. [[{reps,kg},...], [{reps,kg},...]].
// Sessions where this exercise had no counted work sets are skipped
// entirely rather than counted as a zero — there's simply no data from that
// attempt to reason about.
// The most recent (type, regime) this exercise was actually trained with —
// strength/hypertrophy is a per-session tracking mode, not an exercise
// category (owner doctrine, 2026-07-29), so the default for the NEXT
// session is whatever the user chose LAST time, not a stored label.
// ex.type/ex.regime remain only as the seed default for the first-ever log.
function lastModesFor(exId) {
  const sorted = sessionsNewestFirst();
  for (const sess of sorted) {
    const e = (sess.exercises||[]).find(x => x.exId === exId);
    // loadMode/barKg ride along (barbell plate-input preference, 2026-07-30)
    // so the NEXT session opens in the same input units as the last one.
    if (e) return { type: e.type || 'hypertrophy', regime: e.regime || 'weighted',
                    loadMode: e.loadMode || null, barKg: e.barKg || null };
  }
  return null;
}

// Sessions in true newest-first order. session.date is a DAY — two sessions
// logged the same day tie on it, and a stable sort would then keep whatever
// relative order the array happens to hold (insertion order locally, MERGE
// ORDER after a sync — not chronology either way), silently making the
// OLDER same-day session read as "most recent". updatedAt (stamped at save,
// bumped on edit) breaks the tie with actual save-time chronology. Every
// "what happened last time" reader must go through this.
const sessionsNewestFirst = () =>
  [...D.sessions].sort((a,b) => b.date.localeCompare(a.date) || (b.updatedAt||0) - (a.updatedAt||0));

// ── Machine (equipment instance) helpers ─────────────────────────────────────

// Whether an exercise's equipment is CALIBRATED — i.e., per-unit numbers
// genuinely differ (machines, cables) — or FREE-WEIGHT, where 60 kg is 60 kg
// on any bar and the instance is purely descriptive ("what you do the
// movement with" — owner model, 2026-07-30: trap bar vs barbell, EZ vs
// straight — progression stays ONE story per exercise/movement). Calibrated
// classes get same-instance-first suggestions and the save-time nudge;
// free-weight classes share history across instances and are never nagged.
// Unknown/unset equipment counts as calibrated — the conservative default,
// since wrongly BLENDING two calibrations misleads, while wrongly splitting
// merely narrows.
const FREE_WEIGHT_EQUIPMENT = { barbell:1, dumbbell:1, kettlebell:1, band:1, bodyweight:1 };
function equipmentIsCalibrated(exId) {
  const eq = D.exercises.find(e => e.id === exId)?.equipment;
  return !FREE_WEIGHT_EQUIPMENT[eq];
}
// The instanceId a suggestion may filter history by — null for free-weight
// exercises, so their instances never split the progression story.
const calibratedInstanceId = sessionEx =>
  (sessionEx.instanceId && equipmentIsCalibrated(sessionEx.exId)) ? sessionEx.instanceId : null;

// What the 🔧 chip calls an unset instance — the exercise's own equipment
// vocabulary, so a barbell block invites "barra", not "máquina".
const EQUIP_CHIP_LABEL = { barbell:'barra', dumbbell:'halter', kettlebell:'kettlebell', band:'elástico', cable:'máquina', machine:'máquina' };
const equipChipLabel = exId => EQUIP_CHIP_LABEL[D.exercises.find(e => e.id === exId)?.equipment] || 'equipamento';

// ── Barbell plate-input modes (owner-designed, 2026-07-30) ───────────────────
//
// On barbell blocks the user can choose to TYPE loads as per-side plate
// weight ('side' — "10" meaning +10 kg each side) or total plate weight
// ('plates' — bar excluded), set alongside the bar's own weight in a
// collapsible setup row. STORAGE never changes: s.kg is always the grand
// total the body moves (bar included), so history, suggestions, charts and
// sync are unit-blind — only the input/display boundary converts. barKg 0
// is tolerated (plates-only arithmetic still holds). loadMode/barKg live on
// the session exercise entry and are re-seeded from the last session, so a
// preference sticks without re-setup every workout.
const loadToDisplay = (ex, total) => {
  if (total === '' || total == null || !ex.loadMode) return total;
  const bar = ex.barKg || 0;
  return ex.loadMode === 'side' ? round((Number(total) - bar) / 2, 0.25) : round(Number(total) - bar, 0.25);
};
const displayToTotal = (ex, v) => {
  if (v === '' || v == null || !ex.loadMode) return v;
  const bar = ex.barKg || 0;
  return ex.loadMode === 'side' ? round(bar + Number(v) * 2, 0.25) : round(bar + Number(v), 0.25);
};

// Machines known for an exercise, current gym's first — the picker's order.
function machinesFor(exId, gymId) {
  const list = D.machines.filter(m => m.exId === exId);
  if (!gymId) return list;
  return [...list.filter(m => (m.gymIds||[]).includes(gymId)),
          ...list.filter(m => !(m.gymIds||[]).includes(gymId))];
}

// The machine this exercise was last done on — the zero-tap default (owner
// decision 2026-07-29: keeping the pre-filled machine costs nothing, so
// granular data accumulates by default). Prefers the most recent session AT
// the same gym; falls back to the most recent anywhere (a machine used at
// another gym is still a better guess than none). Only returns machines
// that still exist — a tombstoned one must not resurrect through defaults.
function lastInstanceFor(exId, gymId) {
  let anywhere = null;
  const sorted = sessionsNewestFirst();
  for (const sess of sorted) {
    const e = (sess.exercises||[]).find(x => x.exId === exId && x.instanceId);
    if (!e) continue;
    const m = D.machines.find(mm => mm.id === e.instanceId);
    if (!m) continue;
    if (gymId && sess.gymId === gymId) return m;
    if (!anywhere) anywhere = m;
    if (!gymId) return anywhere;
  }
  return anywhere;
}

function getRecentWorkHistory(exId, type, regime, n=3, instanceId=null) {
  const key = memKey(exId, type, regime);
  // The bottom rung of the resolution ladder (owner requirement 2026-07-29:
  // "I feel much stronger in different machines, even if the movement is in
  // theory the same"): when the current session block names a MACHINE,
  // prefer history logged on that same machine — its calibration is the
  // only one those numbers are true for. Falls back to all-machine history
  // when the machine has none yet (first time on it → exercise-level
  // numbers are still the best available estimate, same as today).
  const collect = (wantInstance) => {
    const out = [];
    sessionsNewestFirst()
      .some(sess => {
        // A session can log the same exercise+type+regime combo more than
        // once (e.g. squat→curl→squat→curl as a superset) — combine every
        // matching entry's counted work sets for this session, not just the
        // first one found, so a repeated exercise's full contribution counts
        // toward suggestions/graduation instead of silently losing everything
        // past the first occurrence.
        const matches = (sess.exercises||[]).filter(e => memKey(e.exId, e.type, e.regime||'weighted') === key
          && (!wantInstance || e.instanceId === wantInstance));
        const ws = matches.flatMap(ex => (ex.sets||[]).filter(s => isCountedWork(s) && (hasReps(s)||hasKg(s))));
        if (ws.length) out.push(ws.map(s => ({reps:s.reps, kg:s.kg})));
        return out.length >= n; // stop early once we have enough
      });
    return out;
  };
  if (instanceId) {
    const same = collect(instanceId);
    if (same.length) return same;
  }
  return collect(null);
}

// Default weight increment on graduation. Flipped for assisted regimes:
// less assistance is *harder*, so "heavier" there means a smaller
// counterweight number, not a larger one. Hardcoded for now — an easy
// config point once custom profiles exist.
function bumpWeight(kg, isAssisted) {
  const inc = 2.5;
  return isAssisted ? Math.max(0, round(kg - inc, 0.5)) : round(kg + inc, 0.5);
}

// The progression algorithm. See the section banner above for why
// "graduated" requires the full target work-set count, not just one set.
function computeSuggestion(exId, type, regime, profile, instanceId=null) {
  const history = getRecentWorkHistory(exId, type, regime, 3, instanceId);
  if (!history.length) return null;

  const isAsst = regime === 'assisted';
  const isBW   = regime === 'bodyweight';
  // A timed exercise stores SECONDS in s.reps. That is not an obstacle to
  // progression, it just changes the UNIT of the target band: `profile`
  // carries a seconds band (TIME_BANDS) instead of a rep range, and every
  // comparison below reads the same way. See the graduation comment for how
  // the two progression axes — duration and load — sequence.
  const isTime = profile.timed === true;

  // Assisted: less counterweight = harder, so the WORKING weight (the one
  // that was actually challenging) is the SMALLEST kg logged in a session,
  // not the largest — inverse of every other regime, where more kg = harder.
  const workingKgOf = vals => isAsst ? Math.min(...vals) : Math.max(...vals);

  const graduatedAt = (sets) => {
    if (sets.length < profile.targetWorkSets) return false;
    if (isBW) {
      // No kg exists for bodyweight sets — graduation is reps-only: hit the
      // top of the rep range across the full prescribed set count.
      return sets.every(s => Number(s.reps) >= profile.repHigh);
    }
    const vals = sets.filter(hasKg).map(s => Number(s.kg));
    if (!vals.length) return false;
    const workingKg = workingKgOf(vals);
    return sets.every(s => hasKg(s) && Number(s.kg) === workingKg && Number(s.reps) >= profile.repHigh);
  };

  const last = history[0];
  let workingKg = null;
  if (!isBW) {
    const lastVals = last.filter(hasKg).map(s => Number(s.kg));
    workingKg = lastVals.length ? workingKgOf(lastVals) : null;
  }
  // Bodyweight has no adjustable resistance in this data model, so
  // "stalled, add weight" is never an actionable nudge — it opts out of
  // graduation/stall entirely, same as it already opts out of warm-ups
  // above. repsTarget stays at the top of the range permanently as a
  // stable "aim for more reps" cue. (Revisit if weighted-bodyweight
  // variants — vest/added load as a real progression axis — are ever
  // tracked; see the project Log.)
  // A TIMED exercise progresses on two axes, and which ones exist depends on
  // whether it carries load:
  //
  //   timed + weighted (weighted dead hang, plate on a plank)
  //     Both axes. It behaves exactly like a rep exercise with the band in
  //     seconds: hold the whole band at one working load, then the LOAD goes
  //     up and the time target resets to the bottom of the band. No special
  //     case is needed — graduatedAt() already reads profile.repHigh, which
  //     for a timed profile IS the band top in seconds.
  //
  //   timed + bodyweight (plank, dead hang)
  //     Duration is the ONLY axis, so freezing the target at the band top
  //     would stall the exercise the day someone holds 60 s. Instead the bar
  //     is "the shortest set you held last time, but never below the band
  //     top", and clearing it on every set moves the bar up by TIME_STEP.
  //     That is the direct analogue of bumpWeight() for an exercise whose
  //     resistance can't be changed.
  const TIME_STEP = 5; // seconds added on a bodyweight-hold graduation
  let timeTarget = null, timeGraduated = false;
  if (isTime && isBW) {
    const times = last.filter(hasReps).map(s => Number(s.reps));
    const floor = times.length ? Math.min(...times) : 0;
    const bar   = Math.max(profile.repHigh, floor);
    timeGraduated = times.length >= profile.targetWorkSets && times.every(t => t >= bar);
    timeTarget = timeGraduated ? bar + TIME_STEP : bar;
  }

  const graduated = isTime && isBW ? timeGraduated : (!isBW && graduatedAt(last));

  const suggestedKg = (graduated && workingKg != null) ? bumpWeight(workingKg, isAsst) : workingKg;
  // For a timed BODYWEIGHT hold the target is the computed seconds bar; for
  // everything else (including timed+weighted) it is the band bottom after a
  // graduation and the band top otherwise — the unit differs, the rule does not.
  const repsTarget   = (isTime && isBW) ? timeTarget
                     : (graduated ? profile.repLow : profile.repHigh);

  // Stall streak — consecutive most-recent sessions that did NOT graduate.
  // 0 if the last session graduated (no stall, they just progressed).
  // Bodyweight (including bodyweight holds) still opts out: "you've stalled,
  // add load" is not an actionable nudge when there is no load to add. A
  // timed WEIGHTED exercise does have that axis, so it accrues a streak like
  // any other loaded lift.
  let stallStreak = 0;
  if (!isBW) {
    for (const sets of history) {
      if (graduatedAt(sets)) break;
      stallStreak++;
    }
  }

  return { last, workingKg, suggestedKg, repsTarget, graduated, stallStreak };
}

// Warm-up rep ramp (10-8-6, heaviest/closest-to-work step last) — shared by
// buildWarmupSets() below and read nowhere else.
const WU_REPS = [10, 8, 6];

// Builds warm-up set objects scaled off a base "today's target" weight.
// Shared by two callers with two different sources for that base weight:
// buildSetsFromMemory() (a returning exercise's computed suggestion) and
// estimateWarmups() (a first-ever log, where the user types their own
// estimate instead, since there's no history to suggest one — see
// estimateWarmups() for why). Reps ramp down (10-8-6) as the sets get
// heavier/closer to work weight — more reps to prime lightly-loaded early
// sets, fewer as it gets harder. A single isolation warm-up takes the LAST
// step (6) since it plays the same role as the final, closest-to-work step
// of the compound ramp, not the first. Isolation's multiplier mirrors the
// compound ramp's assisted inversion (less counterweight = harder): 0.5
// weighted's complement is 1.5, the same "2 − x" relationship the compound
// mults already use (0.25↔1.75, 0.55↔1.45, 0.85↔1.15) — BUT that complement
// is only the assisted FALLBACK now: with a logged bodyweight the assisted
// ramp runs in effective-load space instead (see inside). ctx (from
// warmupCtxFor()) carries the barbell floor and the bodyweight. No warm-ups
// for bodyweight regime (no adjustable resistance to warm up into).
function buildWarmupSets(regime, isComp, baseKg, ctx = {}) {
  if (regime === 'bodyweight' || baseKg == null) return [];
  const wuReps = idx => isComp ? WU_REPS[idx] : WU_REPS[WU_REPS.length - 1];
  const mkSet = (kg, idx) => ({ intent: 'warmup', reps: wuReps(idx), kg,
    lastReps:null, lastKg:null, sugReps:null, sugKg:null });
  const effMults = isComp ? [0.25, 0.55, 0.85] : [0.5];

  // ASSISTED, with the bodyweight known: ramp in EFFECTIVE-LOAD space
  // (effective = bodyweight − counterweight), then convert back. The old
  // heuristic multiplied the COUNTERWEIGHT by a "2 − x" complement — which
  // has no ceiling and produced real absurdities (owner report, 2026-07-30:
  // a 96 kg assistance warm-up, more than the user weighs — the machine
  // would lift them off the pads). Scaling the effective load is the
  // physically meaningful ramp, and by construction the counterweight can
  // never reach the bodyweight (capped 2.5 kg short of it for safety when
  // the working effective load is already tiny).
  if (regime === 'assisted' && ctx.bodyKg > 0) {
    const workEff = Math.max(ctx.bodyKg - baseKg, 0);
    return effMults.map((m, idx) => {
      let counter = round(ctx.bodyKg - workEff * m, 0.5);
      counter = Math.max(0, Math.min(counter, round(ctx.bodyKg - 2.5, 0.5)));
      return mkSet(counter, idx);
    });
  }

  // ASSISTED with no bodyweight logged: the legacy complement heuristic is
  // the best available (the app already banners for a bodyweight entry
  // before load-dependent numbers) — kept, explicitly, as the fallback.
  const mults = isComp
    ? (regime === 'assisted' ? [1.75, 1.45, 1.15] : effMults)
    : (regime === 'assisted' ? [1.5] : [0.5]);
  return mults.map((m, idx) => {
    let kg = round(baseKg*m, 0.5);
    // Barbell floor: a warm-up can't weigh less than the empty bar. Without
    // it, a 60 kg total target with a 20 kg bar generated a 15 kg first
    // warm-up — displayed as “−2.5 por lado” in plate mode (owner report,
    // 2026-07-30). Clamping to the bar IS the real-world answer: the first
    // warm-up on a light day is the empty bar.
    if (regime !== 'assisted' && ctx.floorKg > 0 && kg < ctx.floorKg) kg = ctx.floorKg;
    return mkSet(kg, idx);
  });
}

// The warm-up generation context an exercise block can supply: the barbell
// floor (this block's bar, or its attached equipment's) and the current
// bodyweight for assisted effective-load ramps.
function warmupCtxFor(ex) {
  const lib = D.exercises.find(e => e.id === ex.exId);
  const floorKg = lib?.equipment === 'barbell'
    ? (ex.barKg || (ex.instanceId ? D.machines.find(m => m.id === ex.instanceId)?.barKg : null) || null)
    : null;
  return { floorKg, bodyKg: currentBW() || null };
}

function buildSetsFromMemory(ex) {
  const regime  = ex.regime || 'weighted';
  const isComp  = ex.compound !== false;
  const profile = profileFor(ex.type, regime, trackingOf(ex));
  const sug     = computeSuggestion(ex.exId, ex.type, regime, profile, calibratedInstanceId(ex));
  ex._sug       = sug; // cached for buildExBlock()'s stall banner — see its comment
  const sets    = [];

  // No history yet → return empty default rows based on type. No warm-ups
  // either (nothing to scale them off) — buildExBlock() shows a prompt
  // instead, letting the user estimate a working weight (see
  // estimateWarmups()) so warm-ups aren't just silently missing.
  if (!sug) {
    const ph = `${profile.repLow}–${profile.repHigh}`;
    for (let i=0; i<profile.targetWorkSets; i++) sets.push({ intent:'work', reps:'', kg:'', lastReps:null, lastKg:null, sugReps:null, sugKg:null, phReps:ph });
    return sets;
  }

  sets.push(...buildWarmupSets(regime, isComp, sug.suggestedKg, warmupCtxFor(ex)));

  // Work rows: always start from what actually happened last time (never
  // silently replaced by the suggestion) — lastReps/lastKg feed the "repeat
  // last time" chip and the dimmed starting value; sugReps/sugKg feed the
  // "apply suggestion" chip, only meaningfully different when a row fell
  // short of target or the exercise just graduated.
  sug.last.forEach(s => sets.push({
    intent: 'work',
    reps: s.reps, kg: s.kg,
    lastReps: s.reps, lastKg: s.kg,
    sugReps: sug.repsTarget, sugKg: sug.suggestedKg,
  }));
  return sets;
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  7. BODYWEIGHT, VOLUME & ANALYTICS HELPERS
// ║
// ║  Bodyweight is used in two ways:
// ║    · Bodyweight exercises: actual load = BW (no input needed)
// ║    · Assisted exercises:   actual load = BW − counterweight
// ║
// ║  Volume is calculated using actual load, not entered kg.
// ║
// ║  The analytics block below (epley1RM / exerciseProgress / weekStartOf /
// ║  weeklyMuscleVolume) feeds the two read-only views: the per-exercise
// ║  progress chart (openProgress, section 13) and the weekly muscle-volume
// ║  table (openVolume, section 12).
// ╚══════════════════════════════════════════════════════════════════════════════

function currentBW() {
  if (!D.weights?.length) return null;
  return [...D.weights].sort((a,b) => b.date.localeCompare(a.date))[0].kg;
}

function bwIsStale() {
  if (!D.weights?.length) return true;
  const last = [...D.weights].sort((a,b) => b.date.localeCompare(a.date))[0].date;
  return (new Date(today()) - new Date(last)) / 86400000 > 7;
}

// ── Regimes ──────────────────────────────────────────────────────────────────
// How resistance is applied, as a per-SESSION tracking mode (not exercise
// identity — see the type/regime note in buildExBlock):
//
//   weighted    kg IS the load
//   assisted    kg is COUNTERWEIGHT, real load = bodyweight − kg
//   bodyweight  no kg at all, real load = bodyweight
//   bw-plus     kg is ADDED load, real load = bodyweight + kg
//
// `bw-plus` is the mirror of `assisted` and exists because a dead hang, dip,
// pull-up or plank stops being a pure bodyweight exercise the moment a belt
// goes on. Crucially it is NOT treated as `isBW` anywhere else: isBW means
// both "no kg field" and "no load axis to progress on", and a weighted
// pull-up has both. So bw-plus behaves exactly like `weighted` for the kg
// column, graduation and stalls — only the real-load maths and the labels
// differ. That is what makes a weighted hold reachable by the two-axis time
// progression in computeSuggestion().
const REGIME_BW_PLUS = 'bw-plus';
const isBodyweightish = r => r === 'bodyweight' || r === REGIME_BW_PLUS;

function actualLoad(set, regime) {
  const bw = currentBW();
  if (regime === 'bodyweight') return bw || null;
  // Added load only counts once a bodyweight is known — without it there is
  // no base to add to, exactly as assisted has nothing to subtract from.
  if (regime === REGIME_BW_PLUS) return bw ? bw + (hasKg(set) ? Number(set.kg) : 0) : null;
  // hasKg, not a truthy check — a genuinely-entered 0kg set (full
  // graduation for assisted; a deliberate empty-bar/0kg entry for
  // weighted) must count, not be treated as an untouched field. Applies to
  // both regimes here — weighted used to skip this and only assisted had
  // it, which was itself the bug: same class, same fix, every regime.
  if (regime === 'assisted') return (bw && hasKg(set)) ? Math.max(0, bw - Number(set.kg)) : null;
  return hasKg(set) ? Number(set.kg) : null;
}

// Volume-load (kg × reps) for one exercise's sets. `timed` exercises are
// excluded outright rather than computed: their count dimension is SECONDS,
// and kg × seconds is not volume-load — summing it would silently inflate a
// session's total with a number in the wrong unit. The sets still count
// toward per-muscle SET volume (weeklyMuscleVolume, which counts sets, not
// load); it's only this kg-weighted tally that has no meaning for a hold.
function volEx(sets, regime, timed) {
  if (timed) return 0;
  return (sets||[])
    .filter(isCountedWork)
    .reduce((a,s) => {
      const l = actualLoad(s, regime||'weighted');
      return a + (l && s.reps ? Number(s.reps)*l : 0);
    }, 0);
}

// ── Progress & weekly-volume analytics ────────────────────────────────────────
//
// Read-only aggregations over D.sessions, feeding the two analytics views:
// openProgress() (per-exercise chart, Biblioteca) and openVolume() (weekly
// muscle-group sets, Histórico). Same counting discipline as everything
// else: only isCountedWork() sets exist as far as analytics are concerned.

// Epley estimated 1RM — the standard kg × (1 + reps/30). Only meaningful
// for the weighted regime (assisted "kg" is a counterweight, bodyweight
// has no kg at all), so only exerciseProgress()'s weighted branch uses it.
const epley1RM = (kg, reps) => kg * (1 + reps / 30);

// Per-session progress points for one exercise, oldest → newest (charts
// read left-to-right in time), capped to the most recent `cap` sessions.
// Charts ONE regime's series at a time — kg means different things per
// regime (weighted: load, more = better · assisted: counterweight, less =
// better · bodyweight: no kg, reps are the metric). `regime` picks which;
// when omitted, the exercise's most recently LOGGED regime (among those
// with counted history) wins, so the default chart reflects how the
// exercise is trained NOW. Returns `regimes` — every regime with counted
// history, most recent first — which is what feeds the chart's dropdown.
// `instance` (E2 remainder C) narrows the series the same way for one
// machine — see the bucket rules inside; returns `instances`/`instance`
// as the machine dropdown's counterpart to `regimes`/`regime`.
function exerciseProgress(exId, cap = 24, regime = null, instance = null) {
  const lib = D.exercises.find(e => e.id === exId);
  const sorted = [...D.sessions].sort((a, b) => a.date.localeCompare(b.date));
  const regimes = [];
  for (let k = sorted.length - 1; k >= 0; k--) {
    (sorted[k].exercises || []).forEach(e => {
      if (e.exId !== exId) return;
      const r = e.regime || 'weighted';
      if (!regimes.includes(r) && (e.sets || []).some(isCountedWork)) regimes.push(r);
    });
  }
  const chosen = (regime && regimes.includes(regime)) ? regime : (regimes[0] || lib?.regime || 'weighted');
  // ── Per-machine series buckets (E2 remainder C) ──
  // The chart used to pool every machine of a calibrated exercise into one
  // line — exactly the blending the suggestion engine refuses (two units'
  // numbers aren't comparable). Buckets are per REGIME: the dropdown
  // filters the series being displayed, which is per-regime, so every
  // option is guaranteed a non-empty series. '__none__' collects entries
  // logged without a machine — real data whose blending into a machine's
  // line would be the same lie. Free-weight exercises never split (their
  // instances are descriptive — one progression story by design), so their
  // bucket list stays empty. Order is most-recently-used first via
  // sessionsNewestFirst() (same-day ties break by save time — the
  // 2026-07-30 ordering lesson), and the DEFAULT series is that first
  // bucket: the machine actually in use these days. Names resolve live
  // machine first (renames show the current name), then the history
  // snapshot for deleted machines — dangling ids are chartable history,
  // not errors.
  const instances = [];
  if (equipmentIsCalibrated(exId)) {
    sessionsNewestFirst().forEach(sess => {
      (sess.exercises || []).forEach(e => {
        if (e.exId !== exId || (e.regime || 'weighted') !== chosen) return;
        if (!(e.sets || []).some(isCountedWork)) return;
        const key = e.instanceId || '__none__';
        if (instances.some(b => b.key === key)) return;
        const live = e.instanceId && D.machines.find(m => m.id === e.instanceId);
        instances.push({ key, name: key === '__none__' ? 'Sem máquina'
          : (live ? live.name : `${e.instanceName || 'Máquina'} (removida)`) });
      });
    });
  }
  // Filter only when there is genuinely more than one calibration story —
  // with a single bucket the pooled line already IS that machine's line.
  const chosenInst = instances.length > 1
    ? (instance && instances.some(b => b.key === instance) ? instance : instances[0].key)
    : null;
  const points = [];
  sorted.forEach(sess => {
    const sets = (sess.exercises || [])
      .filter(e => e.exId === exId && (e.regime || 'weighted') === chosen
        && (!chosenInst || (e.instanceId || '__none__') === chosenInst))
      .flatMap(e => (e.sets || []).filter(isCountedWork));
    if (!sets.length) return;
    const kgVals  = sets.filter(hasKg).map(s => Number(s.kg));
    const repVals = sets.filter(hasReps).map(s => Number(s.reps));
    const p = { date: sess.date };
    if (chosen === 'bodyweight') {
      if (!repVals.length) return;
      p.metric = Math.max(...repVals);
    } else if (chosen === 'assisted') {
      if (!kgVals.length) return;
      p.metric = Math.min(...kgVals); // the working counterweight — falling line = progress
    } else {
      if (!kgVals.length) return;
      p.metric = Math.max(...kgVals);
      // Epley estimates a 1RM from kg × REPS. On a timed exercise s.reps
      // holds seconds, so feeding it here would print a confident, wholly
      // fictional 1RM for a 60-second hold. Skipped, not approximated.
      const e1s = isTimed(lib) ? [] : sets
        .filter(s => hasKg(s) && hasReps(s) && Number(s.reps) > 0)
        .map(s => epley1RM(Number(s.kg), Number(s.reps)));
      if (e1s.length) p.e1rm = Math.max(...e1s);
    }
    points.push(p);
  });
  return { regime: chosen, regimes, instance: chosenInst, instances, points: points.slice(-cap) };
}

// Monday of the week containing dateStr, as a local YYYY-MM-DD — the same
// noon-anchored parse fmt() uses, so timezones can't shift the day.
function weekStartOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // getDay(): 0=Sun → Monday is 6 back
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// Counted work sets per muscle group per week (columns oldest → newest,
// ending in the current week). Main muscle credits 1 per set, each
// accessory ½ — the usual way weekly-volume guidelines are tallied.
// Muscle data comes from the LIBRARY entry (session entries don't carry
// classification); deleted exercises are skipped, Undefined mains earn no
// main credit but their (real) accessories still count.
function weeklyMuscleVolume(nWeeks = 4) {
  const mondays = [];
  const cur = new Date(weekStartOf(today()) + 'T12:00:00');
  for (let i = nWeeks - 1; i >= 0; i--) {
    const d = new Date(cur); d.setDate(d.getDate() - 7 * i);
    mondays.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
  }
  const rows = {};
  Object.keys(MUSCLE_GROUPS).filter(k => k !== 'undefined').forEach(k => { rows[k] = Array(nWeeks).fill(0); });
  D.sessions.forEach(sess => {
    const col = mondays.indexOf(weekStartOf(sess.date));
    if (col === -1) return;
    (sess.exercises || []).forEach(entry => {
      const lib = D.exercises.find(e => e.id === entry.exId);
      if (!lib) return;
      const counted = (entry.sets || []).filter(isCountedWork).length;
      if (!counted) return;
      if (lib.mainMuscle && rows[lib.mainMuscle]) rows[lib.mainMuscle][col] += counted;
      (lib.accessoryMuscles || []).forEach(m => { if (rows[m]) rows[m][col] += counted * 0.5; });
    });
  });
  return { mondays, rows };
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  8. UI HELPERS — buttons, pills, filter bars
// ║
// ║  These are pure HTML string factories.
// ║  B()  = full-width button
// ║  Bs() = small inline button

// wrong is silent: the two callers mix rest SECONDS (step 5) with round

const numField = (id, label, val, step, onchange = '') => `

// ── Pills (colored badges) ────────────────────────────────────────────────────

  : `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1a1a2e;color:#90caf9">Carga</span>`;

const compPill = c => c === true

// Provenance marker (schema 6). Deliberately EMPTY for the curated catalog:
// after the library rework the overwhelming majority of entries are global,
// so badging those would put a pill on nearly every row and say nothing.
// Marking the exceptions is quieter and carries the actual information —
// "this one isn't from the catalog, nobody reviewed it".
const originPill = ex => {
  const o = originOf(ex);
  if (o === ORIGIN_GLOBAL) return '';
  const label = o === ORIGIN_SHARED
    ? (ex.sharedFrom ? `De ${esc(ex.sharedFrom)}` : 'Compartilhado')
    : 'Minha';

};

// Combines mainMuscle + movementPattern into one pill ("Peito · Supino")
// rather than two separate ones — see MOVEMENT_PATTERNS (section 2) for why
// the pattern label depends on which muscle group it's being read from.
const musclePill = (m, p) => {
  // Checked against MUSCLE_GROUPS directly (not just `m === 'undefined'`) so
  // an unrecognized value — corrupted data, or a muscle group renamed/
  // removed in a future version — falls back to the gray "unclassified"
  // look instead of a teal "classified" pill showing the Undefined label.
  const isUndef = !m || !MUSCLE_GROUPS[m] || m === 'undefined';
  const mLabel  = MUSCLE_GROUPS[m] || MUSCLE_GROUPS.undefined;
  const pLabel  = (MOVEMENT_PATTERNS[m] || {})[p] || '';
  const label   = isUndef ? mLabel : (pLabel ? `${mLabel} · ${pLabel}` : mLabel);
  return isUndef
    ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1a1a1a;color:${DM}">${label}</span>`
    : `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#0a2e2e;color:#4dd0c4">${label}</span>`;
};


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  9. FILTER SYSTEM
// ║
// ║  applyFilters() — pure filter function, used by library, add-ex modal, plan editor
// ║
// ║  Filter bars are built as HTML strings with data-* attributes.
// ║  Listeners are attached programmatically after injection (avoids onclick
// ║  attribute CSP issues in sandboxed environments).
// ╚══════════════════════════════════════════════════════════════════════════════

// ── Categories & bilingual search ─────────────────────────────────────────────
//
// A "category" is not a new entity: it's the (mainMuscle, movementPattern)
// pair the classification system already stores. `pulldown`, `row` and
// `curl` are literally already pattern keys — so a pulldown category is
// just (back, pulldown), with no extra data to maintain or sync.
//
// Bilingual search falls out of that for free: the pattern KEYS are
// English (`pulldown`) and their LABELS are Portuguese (`Puxada`), so
// matching against both covers either language with no translation table.
// Exercise-level search matches name + name_en + aliases, all folded
// through nameKey() so accents and case never block a match ("triceps"
// finds "Tríceps").

function exerciseMatchesSearch(ex, q) {
  const k = nameKey(q);
  if (!k) return true;
  return [ex.name, ex.name_en, ...(ex.aliases || [])]
    .some(h => h && nameKey(h).includes(k));
}

// Every (muscle, pattern) pair actually present in a list, with counts.
// Excludes the escape valves — an "Outro"/"Não definido" bucket is a
// filter, not a browsable family.
function exerciseCategories(list) {
  const out = new Map();
  (list || []).forEach(ex => {
    const m = ex.mainMuscle, p = ex.movementPattern;
    if (!m || m === 'undefined' || !p || p === 'undefined' || p === 'other') return;
    const key = `${m}:${p}`;
    const cur = out.get(key) || { muscle: m, pattern: p, count: 0 };
    cur.count++;
    out.set(key, cur);
  });
  return [...out.values()].sort((a, b) => b.count - a.count);
}

const categoryLabel = c => (MOVEMENT_PATTERNS[c.muscle] || {})[c.pattern] || c.pattern;

// Categories whose pattern key ("pulldown"), pattern label ("Puxada") or
// muscle label ("Costas") matches the query. Two-character minimum so a
// single keystroke doesn't flood the results with every category.
function matchingCategories(list, q) {
  const k = nameKey(q);
  if (k.length < 2) return [];
  return exerciseCategories(list).filter(c =>
    nameKey(c.pattern).includes(k) ||
    nameKey(categoryLabel(c)).includes(k) ||
    nameKey(MUSCLE_GROUPS[c.muscle] || '').includes(k));
}

// Category cards shown above search results — tapping one drops the search
// term and switches to that category's filtered view, which is exactly the
// existing muscle+pattern filter pair. Capped: these are a shortcut into a
// family, not a second results list.
function categoryCardsHTML(cats, handler) {
  if (!cats.length) return '';
  return `<div style="margin-bottom:10px">
    <div style="font-size:10px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px">Categorias</div>
    ${cats.slice(0, 4).map(c => `
      <button onclick="${handler}('${c.muscle}','${c.pattern}')" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:#0a2e2e;border:1px solid #14484a;border-radius:8px;color:${TX};font-family:inherit;cursor:pointer;margin-bottom:6px;text-align:left">
        <span style="flex:1;font-weight:600;font-size:13px">${esc(categoryLabel(c))} <span style="font-weight:400;color:${DM}">· ${esc(MUSCLE_GROUPS[c.muscle] || '')}</span></span>
        <span style="font-size:11px;color:#4dd0c4;flex-shrink:0">${c.count} exerc.</span>
        <span style="color:${DM};font-size:12px;flex-shrink:0">→</span>
      </button>`).join('')}
  </div>`;
}

// Landing in a category = the muscle+pattern filters, search cleared so the
// user can immediately type again to narrow WITHIN the family.
function openLibCategory(muscle, pattern) {
  _libFMuscle = muscle; _libFPattern = pattern; _libSearch = '';
  _libFMove = null; _libUnclassed = false;
  render();
}

function applyFilters(list, fMove, search, alpha, unclassed, fMuscle, fPattern) {
  let out = list.filter(ex => {
    if (unclassed) { if (ex.compound != null) return false; }
    else {
      if (fMove === 'compound'  && ex.compound !== true)  return false;
      if (fMove === 'isolation' && ex.compound !== false) return false;
    }
    if (fMuscle && ex.mainMuscle !== fMuscle) return false;
    // Pattern is only ever checked once a muscle is also selected — each
    // group has its own scoped pattern vocabulary (MOVEMENT_PATTERNS), so
    // filterBarHTML() never offers a pattern pill without one, and checking
    // it here without fMuscle set would be ambiguous (the same pattern key
    // can mean different things — or not exist at all — in another group).
    if (fMuscle && fPattern && ex.movementPattern !== fPattern) return false;
    // Matches name, name_en and aliases, accent- and case-folded — see
    // exerciseMatchesSearch() above.
    if (search && !exerciseMatchesSearch(ex, search)) return false;
    return true;
  });
  if (alpha) out = [...out].sort((a,b) => a.name.localeCompare(b.name,'pt'));
  return out;
}

// Builds a filter pill bar HTML string.
// Each pill carries a data-key attribute so listeners can be attached externally.
// No Força/Hipertrofia pills here — see the filter-state comment in
// section 3: type is a training mode, not a selection axis.
function filterBarHTML(fMove, unclassed, showUnclassed, fMuscle, fPattern) {
  const p = (lbl, active, key, acBg) =>
    `<button data-fk="${key}" style="padding:6px 13px;border-radius:99px;border:none;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;background:${active?(acBg||CG):BG3};color:${active?TX:DM}">${lbl}</button>`;
  const muscleRow = Object.entries(MUSCLE_GROUPS)
    .filter(([k]) => k !== 'undefined')
    .map(([k,label]) => p(label, fMuscle===k, `mg:${k}`, '#0a2e2e')).join('');
  // Only the currently-selected muscle's own pattern list is ever shown —
  // see the comment in applyFilters() for why a global pattern list would
  // be misleading.
  const patternRow = fMuscle
    ? Object.entries(MOVEMENT_PATTERNS[fMuscle]||{}).map(([k,label]) => p(label, fPattern===k, `mp:${k}`, '#0a2e2e')).join('')
    : '';
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
    ${p('Composto',     !unclassed&&fMove==='compound',  'fm:compound',  '#1a1035')}
    ${p('Isolado',      !unclassed&&fMove==='isolation', 'fm:isolation', '#1e1810')}
    ${showUnclassed ? p('Não classif.', unclassed, 'fm:unclassed', '#2a2a1a') : ''}
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:${patternRow?'6px':'10px'}">${muscleRow}</div>
  ${patternRow ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${patternRow}</div>` : ''}`;
}

// Attaches click listeners to a rendered filter bar.
// onMove/onMuscle/onPattern(val) are callbacks that handle state changes.
function bindFilterBar(containerId, onMove, onMuscle, onPattern) {
  const bar = document.getElementById(containerId);
  if (!bar) return;
  bar.querySelectorAll('[data-fk]').forEach(btn => {
    btn.addEventListener('click', function() {
      const [ns, val] = this.dataset.fk.split(':');
      if      (ns === 'fm') onMove(val);
      else if (ns === 'mg') onMuscle(val);
      else if (ns === 'mp') onPattern(val);
    });
  });
}

// ║  10. RENDER ENGINE
// ║
// ║  render() rebuilds the entire page from state.
// ║  Each tab is a separate function (sections 11–15).
// ║  After render, programmatic listeners are re-attached where needed.
// ╚══════════════════════════════════════════════════════════════════════════════

function render() {
  // Mirror the live session BEFORE rebuilding the DOM — render() runs after
  // every state mutation, which makes it the one choke point where the
  // workout-in-progress can be persisted (see stashLiveSession, section 5).
  // First so a rendering crash can never cost the stashed workout too.
  stashLiveSession();
  document.getElementById('root').innerHTML = buildPage();
  // Re-attach listeners that can't use onclick attributes
  bindLibraryFilters();
  updateSyncDot();
}

function buildPage() {
  const TABS = [['log','Treino'],['history','Histórico'],['library','Biblioteca'],['plans','Planos'],['weight','Peso']];
  const tabBar = `
    <div style="position:sticky;top:0;z-index:50;background:${BG};border-bottom:1px solid ${BD};display:flex;position:relative">
      ${TABS.map(([id,lbl]) => `
        <button onclick="setTab('${id}')" style="flex:1;padding:12px 2px;background:none;border:none;
          border-bottom:2px solid ${TAB===id?CG:'transparent'};color:${TAB===id?TX:DM};
          font-weight:600;font-size:11px;cursor:pointer;font-family:inherit">${lbl}</button>
      `).join('')}
      <div id="sync-dot" style="width:7px;height:7px;border-radius:99px;background:transparent;
        position:absolute;top:10px;right:10px;transition:background .3s"></div>
    </div>`;
  const body = TAB==='log'     ? buildLog()
             : TAB==='history' ? buildHistory()
             : TAB==='library' ? buildLibrary()
             : TAB==='plans'   ? buildPlans()
             :                   buildWeight();
  return `<div style="min-height:100vh">${tabBar}<div id="sync-banner">${syncProblemBanner()}</div><div style="padding:16px">${body}</div></div>`;
}

// Cross-tab problem banner, shown directly under the tab bar when sync is
// genuinely broken (not just a transient blip): either the remote data is
// from a newer app version (see SCHEMA_VERSION) or 3+ consecutive online
// round-trips have failed (see _syncFailStreak — an expired/revoked PAT
// looks exactly like this). Rendered by buildPage() and ALSO refreshed
// in place by setSyncStatus() via updateSyncBanner() — same pattern as the
// sync dot — so it appears/clears promptly without forcing a full render
// mid-interaction (a background render() would blow away input focus,
// exactly what setVal() is built to avoid).
function syncProblemBanner() {
  const style = `background:#1e1a00;border-bottom:1px solid #5a4a00;padding:9px 14px;font-size:12px;color:#e6c84a;display:flex;align-items:center;gap:10px`;
  if (_remoteSchemaAhead) return `<div style="${style}">
    <span style="flex:1">Dados na nuvem vêm de uma versão mais nova do app — recarregue para atualizar.</span>
    ${Bs(BG3,TX,'Recarregar','location.reload()')}
  </div>`;
  if (_syncFailStreak >= 3) return `<div style="${style}">
    <span style="flex:1">Sincronização falhando (${_syncFailStreak} tentativas) — verifique o token e a conexão.</span>
    ${Bs(BG3,TX,'Abrir','openBackup()')}
  </div>`;
  return '';
}
function updateSyncBanner() {
  const el = document.getElementById('sync-banner');
  if (el) el.innerHTML = syncProblemBanner();
}

function setTab(t) {
  if (t === 'library') _libSearch = ''; // clear search when entering library
  if (t === 'plans' && sb && sbSession) loadReceivedShares(); // background inbox refresh; re-renders on arrival
  TAB = t;
  render();
}

// Sync status dot — green=ok, red=error, yellow=syncing
function setSyncStatus(state) { _syncStatus = { state, time: Date.now() }; updateSyncDot(); updateSyncBanner(); }
function updateSyncDot() {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  const s = _syncStatus?.state;
  el.style.background = s==='ok' ? CG : s==='error' ? CR : s==='syncing' ? '#e6c84a' : 'transparent';
  el.title = s==='ok' ? `Sincronizado · ${fmtTime(_syncStatus.time)}` : s==='error' ? 'Erro de sincronização' : s==='syncing' ? 'Sincronizando...' : '';
}

// BW stale banner — shown on Log tab when weight hasn't been logged in 7+ days
function bwBanner() {
  if (!bwIsStale()) return '';
  const msg = !D.weights?.length
    ? 'Nenhum peso corporal registrado — necessário para cálculos de carga.'
    : 'Peso corporal não atualizado há mais de 7 dias.';
  return `<div style="background:#1e1a00;border:1px solid #5a4a00;border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <span style="font-size:13px;color:#e6c84a;flex:1">${msg}</span>
    ${Bs(CG,TX,'+ Peso',"setTab('weight')")}
  </div>`;
}

// ── Gyms (gym profiles) ───────────────────────────────────────────────────────

// Pill row on the Log start screen. Tapping the selected gym deselects it
// (back to "no gym context" — no availability filtering). The ⚙ pill opens
// the manager; when no gyms exist yet, a single quiet "+ Academias" pill is

function gymSelectorHTML() {

      ${pill('⚙', false, 'openGymManager()', true)}

function setCurrentGym(id) {
  _currentGymId = _currentGymId === id ? null : id; // tap the active one to deselect
  LS.set('gym:currentGym', _currentGymId || '');

function openGymManager() {
  const rows = D.gyms.map(gm => `

    <div style="display:flex;gap:8px;margin:14px 0">

function addGym() {
  const el = document.getElementById('gym-new-name');
  const name = (el?el.value:'').trim(); if (!name) return;
  D.gyms.push({ id: uid(), name, updatedAt: Date.now() });
  persist();
  openGymManager(); // rebuild the modal with the new row
  render();
}

function renameGym(id, v) {
  const name = (v||'').trim();
  const gm = D.gyms.find(g => g.id === id); if (!gm) return;
  if (!name) { openGymManager(); return; } // blank rename → just restore the row
  gm.name = name; gm.updatedAt = Date.now();
  persist(); render();
}

function delGym(id) {
  const gm = D.gyms.find(g => g.id === id); if (!gm) return;
  if (!confirm(`Excluir a academia "${gm.name}"?\n\nExercícios marcados apenas nela passam a valer em todas as academias.`)) return;
  D.tombstones.gyms[id] = Date.now();
  D.gyms = D.gyms.filter(g => g.id !== id);
  // Strip the dead tag from every exercise that carried it — an updatedAt
  // bump included, so the cleanup propagates through the LWW merge instead
  // of lingering as a dangling id on other devices. An exercise whose list
  // becomes empty is now available everywhere, exactly what the confirm
  // text promised.
  D.exercises.forEach(ex => {
    if ((ex.gyms||[]).includes(id)) {
      ex.gyms = ex.gyms.filter(g => g !== id);
      ex.updatedAt = Date.now();
    }
  });
  // Same dead-tag strip for machines (their gymIds lists are the same kind
  // of reference). A machine left with no gyms stays valid — it just lists
  // under "others" in the picker until it's used somewhere again.
  D.machines.forEach(m => {
    if ((m.gymIds||[]).includes(id)) {
      m.gymIds = m.gymIds.filter(g => g !== id);
      m.updatedAt = Date.now();
    }
  });
  if (_currentGymId === id) { _currentGymId = null; LS.set('gym:currentGym', ''); }
  persist();
  openGymManager();
  render();
}

// The placeholder a movement SLOT renders as until resolved (E3): compact,
// dashed, inert — no sets, no suggestion math, and every reader that keys
// on exId or sets (save, nudges, volume, suggestions) skips it for free
// because it has neither. Reorder/remove reuse the normal block's
// moveEx()/rmEx() (same array, same indices). The resolution affordance
// (ranked suggestion + picker) attaches here in the resolution layer —
// until then a slot is only creatable through data, not UI.
function buildSlotBlock(ex, i) {
  const isFirst = i===0, isLast = i===S.exercises.length-1;
  const mv = MOVEMENTS[ex.movement];
  return `
    <div id="exblk-${i}" style="background:${BG2};border:1px dashed ${BD};border-radius:10px;margin-bottom:12px;padding:12px 14px">

          <button onclick="moveEx(${i},1)"  ${isLast?'disabled':''} style="background:none;border:none;color:${isLast?BD:DM};font-size:14px;cursor:${isLast?'default':'pointer'};padding:1px 4px;line-height:1">▼</button>

        </div>
        <button onclick="rmEx(${i})" style="background:none;border:none;color:${DM};font-size:20px;cursor:pointer;padding:4px;flex-shrink:0">×</button>
      </div>
      ${(() => {
        // The evidence-based suggestion, inline with a one-tap Usar — the
        // owner's "reminder or suggestion, not just being automatically
        // picked": the fast path costs one tap, silence costs nothing.
        const sug = slotSuggestionFor(ex);
        const sugEx = sug && D.exercises.find(e => e.id === sug.exId);
        return sugEx ? `
        <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
          <span style="flex:1;min-width:0;font-size:12px;color:${TX}">sugerido: <strong>${esc(sugEx.name)}</strong>
