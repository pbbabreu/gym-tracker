<body>
<div id="root"></div>
<!-- Vendored Supabase client (see vendor/supabase.js header) — must load
     before the app script below, which reads window.supabase at startup.
     If it ever fails to load (e.g. a pre-v4 SW cache), the app degrades to
     local-only + Gist sync: everything guards on window.supabase existing. -->
<script src="vendor/supabase.js"></script>
<script>

// ╔══════════════════════════════════════════════════════════════════════════════
// ║  1. DESIGN TOKENS
// ║  Colors and constants used throughout the UI.
// ║  Change a color here and it updates everywhere.
// ╚══════════════════════════════════════════════════════════════════════════════

const COLOR = {
  green:  '#0F6E56',  // primary action, W set, sync ok
  blue:   '#185FA5',  // weighted regime, hypertrophy
  red:    '#c0392b',  // danger, delete
  amber:  '#854F0B',  // assisted regime
  bg:     '#111',
  bg2:    '#1c1c1c',  // cards
  bg3:    '#2a2a2a',  // inputs, inactive buttons
  text:   '#f0ede6',
  dim:    '#8a8680',  // secondary text
  border: '#2e2e2e',
};

// Shorthand aliases used in template literals
const CG=COLOR.green, CB=COLOR.blue, CR=COLOR.red, CA=COLOR.amber;
const BG=COLOR.bg, BG2=COLOR.bg2, BG3=COLOR.bg3;
const TX=COLOR.text, DM=COLOR.dim, BD=COLOR.border;


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  2. EXERCISE LIBRARY SEED
// ║
// ║  The starter exercise library used to live here as a hardcoded array.
// ║  It now lives in library.json (same origin as this file, fetched with a
// ║  plain relative fetch() — no CORS/auth needed) so it can be edited
// ║  without touching app code.
// ║
// ║  seedStarterLibrary() is called from loadData() ONLY when D.exercises is
// ║  completely empty — i.e. a genuinely fresh install. It is deliberately
// ║  NOT an ongoing sync: once seeded, entries are indistinguishable from
// ║  anything the user adds themselves (same array, same CRUD functions), so
// ║  deleting a seeded exercise deletes it for good — it will not silently
// ║  reappear because library.json still has it. There is currently exactly
// ║  one user, so a shared/global library with a suggestion-and-approval
// ║  workflow (originally considered) was deliberately deferred — see the
// ║  project Log — this is scoped to just "give every install a starting
// ║  library, including offline."
// ╚══════════════════════════════════════════════════════════════════════════════

// Set on a failed seed fetch so buildLibrary() can offer a retry — the only
// case this matters is a fresh install with zero exercises AND no network
// (so the service-worker cache, populated by a previous successful load,
// isn't there yet either).
let _libSeedError = false;

async function seedStarterLibrary() {
  try {
    const r = await fetch('library.json');
    if (!r.ok) throw new Error('fetch failed: ' + r.status);
    const data = await r.json();
    D.exercises = (data.exercises || []).map(e => ({...e, updatedAt:Date.now()}));
    // library.json ships fully classified, so this is normally a no-op —
    // but calling it here too (not just from loadData()/mergeRemote()/
    // applyData()) means a future entry added to library.json without the
    // new fields still degrades safely instead of relying entirely on the
    // seed file always being complete.
    backfillExerciseClassification();
    _libSeedError = false;
    await persist();
  } catch(e) {
    _libSeedError = true;
  }
  render();
}

// ── Muscle-group / movement-pattern classification ───────────────────────────
//
// Every exercise is mandatorily classified — never null/undefined as a
// JS value — but 'undefined' is itself a valid MUSCLE_GROUPS key, so a user
// who doesn't know how to classify something yet always has a real, saveable
// option instead of a blocked save. Movement patterns are scoped PER main
// muscle group (MOVEMENT_PATTERNS[mainMuscle]), not a single global list —
// this is deliberate: "leg curl" and "bicep curl" are different enough
// exercises that collapsing them onto one shared "curl" pattern would make
// muscle-grouped progress tracking misleading. Each group's pattern list
// ends in its own 'other' escape valve for the same reason mainMuscle has
// 'undefined' — classification must never block saving.
const MUSCLE_GROUPS = {
  chest:      'Peito',
  back:       'Costas',
  shoulders:  'Ombros',
  biceps:     'Bíceps',
  triceps:    'Tríceps',
  forearms:   'Antebraços',
  abs:        'Abdômen',
  quads:      'Quadríceps',
  hamstrings: 'Posterior de coxa',
  glutes:     'Glúteos',
  adductors:  'Adutores',
  calves:     'Panturrilhas',
  undefined:  'Não definido',
};

const MOVEMENT_PATTERNS = {
  chest:      { press:'Supino', fly:'Voador', other:'Outro' },
  back:       { row:'Remada', pulldown:'Puxada', hinge:'Dobra de quadril', extension:'Extensão lombar', other:'Outro' },
  shoulders:  { press:'Press', raise:'Elevação', rear_delt:'Deltoide posterior', other:'Outro' },
  biceps:     { curl:'Rosca', other:'Outro' },
  triceps:    { extension:'Extensão', pushdown:'Tríceps pulley', dip:'Mergulho', other:'Outro' },
  forearms:   { curl:'Rosca de punho', extension:'Extensão de punho', other:'Outro' },
  abs:        { flexion:'Flexão de tronco', anti_extension:'Anti-extensão', rotation:'Rotação', other:'Outro' },
  quads:      { squat:'Agachamento', extension:'Extensão de joelho', lunge:'Avanço', other:'Outro' },
  hamstrings: { curl:'Flexora', hinge:'Dobra de quadril', other:'Outro' },
  // 'adduction' deliberately NOT listed here anymore — it moved to its own
  // Adductors group below (a structurally distinct muscle group, different
  // nerve supply, not a glute function) once Hip adduction machine was
  // reclassified there. Abduction stays — hip abductors genuinely are glutes.
  glutes:     { hip_thrust:'Elevação de quadril', hinge:'Dobra de quadril', abduction:'Abdução', other:'Outro' },
  adductors:  { adduction:'Adução', other:'Outro' },
  calves:     { raise:'Elevação de panturrilha', other:'Outro' },
  undefined:  { undefined:'Não definido' },
};

// Best-effort mainMuscle/movementPattern/accessoryMuscles for the 44
// starter-library ids, used ONLY to backfill an already-live install's own
// D.exercises the first time this classification system loads on it — see
// backfillExerciseClassification() below. library.json ships the same
// classification directly on each entry for a genuinely fresh install; this
// table is a hand-kept duplicate of that data (not fetched from
// library.json) so the backfill works synchronously and fully offline for
// existing users, who never re-run seedStarterLibrary(). User-created
// exercises aren't in this table at all — backfillExerciseClassification()
// defaults anything not found here to 'undefined'/'undefined'/[].
const SEED_CLASSIFICATION = {
  'narrow-stance-sumo-deadlift':  ['back', 'hinge', ['hamstrings','glutes','quads']],
  'wide-stance-sumo-deadlift':    ['glutes', 'hinge', ['hamstrings','quads']],
  'bent-over-barbell-row':        ['back', 'row', ['biceps']],
  'zercher-squat':                ['quads', 'squat', ['glutes','back']],
  'bench-press':                  ['chest', 'press', ['triceps','shoulders']],
  'assisted-pull-up-gravitron':   ['back', 'pulldown', ['biceps']],
  'dip-gravitron':                ['chest', 'press', ['triceps','shoulders']],
  'dip-gravitron-upright':        ['triceps', 'dip', ['chest','shoulders']],
  'kettlebell-swing':             ['glutes', 'hinge', ['hamstrings','back']],
  'incline-press-machine':        ['chest', 'press', ['shoulders','triceps']],
  'seated-cable-row':             ['back', 'row', ['biceps']],
  'wide-grip-lat-pulldown':       ['back', 'pulldown', ['biceps']],
  'wide-grip-neutral-pulldown':   ['back', 'pulldown', ['biceps']],
  'chest-supported-high-row':     ['back', 'row', ['biceps']],
  'machine-low-row':              ['back', 'row', ['biceps']],
  'v-squat-front-facing':         ['quads', 'squat', ['glutes']],
  'bulgarian-split-squat':        ['quads', 'lunge', ['glutes','hamstrings']],
  'hip-thrust':                   ['glutes', 'hip_thrust', ['hamstrings']],
  'cable-low-to-high-fly':        ['chest', 'fly', ['shoulders']],
  'pec-deck-fly':                 ['chest', 'fly', []],
  'stiff-leg-deadlift':           ['hamstrings', 'hinge', ['glutes','back']],
  'overhead-cable-triceps':       ['triceps', 'extension', []],
  'machine-triceps':              ['triceps', 'extension', []],
  'cable-triceps-kickback':       ['triceps', 'extension', []],
  'rope-cable-triceps-extension': ['triceps', 'pushdown', []],
  'single-arm-preacher-curl':     ['biceps', 'curl', []],
  'incline-deficit-curl':         ['biceps', 'curl', []],
  'hammer-curl':                  ['biceps', 'curl', ['forearms']],
  'reverse-grip-ez-bar-curl':     ['biceps', 'curl', ['forearms']],
  'hammer-curl-lateral-raise':    ['shoulders', 'raise', ['biceps']],
  'lateral-raise':                ['shoulders', 'raise', []],
  'crucifix-swing':               ['shoulders', 'raise', []],
  'face-pull':                    ['shoulders', 'rear_delt', ['back']],
  'seated-leg-curl':              ['hamstrings', 'curl', []],
  'leg-extension':                ['quads', 'extension', []],
  'standing-leg-curl':            ['hamstrings', 'curl', []],
  'single-leg-45-back-extension': ['back', 'extension', ['hamstrings','glutes']],
  'seated-machine-shoulder-press':['shoulders', 'press', ['triceps']],
  'hip-abduction-machine':        ['glutes', 'abduction', []],
  'hip-adduction-machine':        ['adductors', 'adduction', []],
  'calf-raise':                   ['calves', 'raise', []],
  'seated-calf-raise':            ['calves', 'raise', []],
  'scapular-pull-up':             ['back', 'other', []],
  'strict-halos':                 ['shoulders', 'other', []],
};

// Idempotent — safe to call on every load. Fills mainMuscle/movementPattern/
// accessoryMuscles ONLY on exercises that don't have them yet (a falsy
// ex.mainMuscle means "never classified," including truly missing from an
// old backup/sync — the literal string 'undefined' is a real, already-made
// classification choice and is left alone). Called from loadData() (local
// cache + after a remote merge) and applyData() (backup restore) — anywhere
// D.exercises can be hydrated from a source that predates this feature.
function backfillExerciseClassification() {
  D.exercises.forEach(ex => {
    if (ex.mainMuscle) return;
    const seed = SEED_CLASSIFICATION[ex.id];
    ex.mainMuscle       = seed ? seed[0] : 'undefined';
    ex.movementPattern  = seed ? seed[1] : 'undefined';
    ex.accessoryMuscles = seed ? [...seed[2]] : [];
  });
}

// ── Saved-session set scrub ───────────────────────────────────────────────────
//
// Cleanup twin of saveSession()'s metadata strip (section 19): sessions
// saved before that strip existed carry render-time scaffolding on every
// set (chip sources, dim-state flags, placeholder hints) that means nothing
// as history and bloats every backup, localStorage write, and Gist push
// forever. A BLOCKLIST of known-scaffolding keys, not an allowlist rebuild,
// so any genuinely-new set field added in the future survives untouched.
// Deliberately does NOT bump updatedAt — this isn't a user edit, and
// inflating recency would let a merely-scrubbed copy beat a genuine remote
// edit under mergeCollection()'s per-item LWW. Idempotent and cheap, so it
// runs on every path that hydrates D.sessions (loadData local cache,
// mergeRemote, applyData backup restore) — the exact same pattern
// backfillExerciseClassification() above uses, for the same reason.
const SET_SCAFFOLDING_KEYS = ['lastReps','lastKg','sugReps','sugKg','phReps','repsEdited','kgEdited'];
function scrubSessionSetMetadata() {
  D.sessions.forEach(sess => (sess.exercises||[]).forEach(ex => (ex.sets||[]).forEach(s => {
    SET_SCAFFOLDING_KEYS.forEach(k => { if (k in s) delete s[k]; });
  })));
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  3. APPLICATION STATE
// ║  All mutable state lives here. Nothing outside this section should
// ║  hold data that needs to survive a re-render.
// ║
// ║  D  = persisted data (saved to localStorage + Gist)
// ║  S  = active in-progress session (discarded on cancel)
// ║  CFG = sync configuration (token, gistId — never exported with data)
// ╚══════════════════════════════════════════════════════════════════════════════

// Persisted data — written to storage on every mutation
let D = {
  exercises:    [],  // library entries: { id, name, type, compound, regime,
                      // mainMuscle, movementPattern, accessoryMuscles, updatedAt,
                      // gyms?: [gymId,...] — OPTIONAL availability tags: absent or
                      // empty means "available everywhere" (the zero-config
                      // default — nobody is forced to tag anything; see
                      // availableAtGym() in section 4) }
  plans:        [],  // training plans:  { id, name, exercises:[exId,...], updatedAt }
  sessions:     [],  // history:         { id, date, planId, planName, gymId?, gymName?,
                      // exercises:[...], updatedAt } — gymId/gymName tag which gym the
                      // session happened at; gymName is a snapshot (same pattern as
                      // planName) so history still reads right after a gym is deleted
  weights:      [],  // bodyweight log:  { id, date, kg, updatedAt }
  gyms:         [],  // gym profiles:    { id, name, updatedAt } — a fifth synced
                      // collection, same merge/tombstone machinery as the others.
                      // Which gym is CURRENTLY selected is per-device UI state
                      // (_currentGymId + localStorage), deliberately NOT in D:
                      // "where am I training today" shouldn't sync across devices.
  // One deletedAt-timestamp map per collection, keyed by id. Exists so a
  // deletion can survive being merged against a device that hasn't synced
  // it yet — see mergeCollection() in section 5 for how these are used and
  // why a plain union (no tombstones) let deletions get silently
  // resurrected. Small enough (id+timestamp per entry) that these are never
  // garbage-collected.
  tombstones: { exercises:{}, plans:{}, sessions:{}, weights:{}, gyms:{} },
  lastModified: 0,   // unix timestamp of the last local mutation — used to
                      // decide whether a fresh Gist push is needed, NOT for
                      // per-item conflict resolution (each item's own
                      // updatedAt handles that, see mergeCollection()).
};

// Sync config — stored separately, never exported in data backups.
// driver: which remote transport syncs the data — 'supabase' (account-based,
// the default for fresh installs) or 'gist' (the original PAT+Gist setup,
// kept as the legacy driver until every existing device migrates). Empty
// string = not chosen yet; syncDriver() resolves the effective value.
let CFG = { token: '', gistId: '', driver: '' };

// Active session — null when no workout is in progress
let S = null;

// UI state — controls what is rendered, not persisted
let TAB = 'log';
let EXP = null; // expanded session id in history

// Sync status indicator
let _syncStatus = null; // { state: 'ok'|'error'|'syncing', time: number }

// Filter state — library tab
let _libFType = null, _libFMove = null, _libSearch = '', _libAlpha = false, _libUnclassed = false;
let _libFMuscle = null, _libFPattern = null;

// Filter state — add-exercise modal
let _aFType = null, _aFMove = null, _aSearch = '', _aAlpha = false;
let _aFMuscle = null, _aFPattern = null;

// Filter state — plan editor modal
let _peFType = null, _peFMove = null, _peSearch = '', _peAlpha = false;
let _peFMuscle = null, _peFPattern = null;

// Plan editor working state
let _planExs = [], _planId = null;

// Exercise modal working state
let _newType = 'hypertrophy', _newCompound = true, _newRegime = 'weighted';
// Tracks whether the Composto/Isolado toggle was actually clicked during
// the current edit — see saveEditEx() for why this matters.
let _newCompoundTouched = false;
// Classification working state — see MUSCLE_GROUPS/MOVEMENT_PATTERNS
// (section 2). Unlike _newCompound, these are mandatory-with-an-escape-
// valve rather than nullable, so no _touched flag is needed: every save
// path writes them unconditionally.
let _newMuscle = 'undefined', _newPattern = 'undefined', _newAccessory = [];

// Pick-exercise modal working state
let _pickType = 'hypertrophy', _pickRegime = 'weighted';

// Rest timer state — null when no rest is running. endsAt (absolute
// timestamp) rather than a decrementing counter, so background-tab
// throttling and re-renders can never drift the clock; `done` flips once
// expiry has been signaled (vibration/beep fire exactly once). One global
// timer: checking the next set simply replaces it — that IS the flow.
let _restTimer = null; // { endsAt, total, label, done }
let _restTimerInterval = null;

// Rest durations (seconds) per type × transition, per-DEVICE (localStorage,
// like the gym selection): rest preferences belong to whoever holds the
// phone, and a settings sync would need a sixth collection + schema bump —
// deliberately not worth it for six numbers. Loaded lazily via timerCfg().
let _timerCfg = null;

// In-app plan shares addressed to me, unclaimed — refreshed in the
// background by loadReceivedShares() (on supabase pulls and on entering
// the Planos tab); rendered as the "Planos recebidos" section there.
let _receivedShares = [];
// Catalog rows from the last openCatalogUpdate() fetch — kept so the
// per-entry add buttons can resolve their row without refetching.
let _catalogRows = null;

// Currently-selected gym — per-DEVICE UI state (persisted to localStorage,
// never to D/the Gist): the phone at the gym and the desktop at home are
// legitimately "at" different places at once. null = no gym context, which
// disables all availability filtering. Resolved through currentGym() so a
// gym deleted on another device degrades to "no selection" instead of a
// dangling id.
let _currentGymId = null;

// Exercise modal working state — gym availability multi-select (mirrors
// _newAccessory's pattern; empty = available everywhere)
let _newGyms = [];


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  4. UTILITIES
// ║  Pure functions — no side effects, no state access.
// ║  Used throughout the app for formatting and calculation.
// ╚══════════════════════════════════════════════════════════════════════════════

const uid     = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
// LOCAL date, deliberately NOT toISOString() (which is UTC): in any timezone
// west of UTC — e.g. Brazil, UTC-3 — the UTC date rolls over at 21:00 local,
// so an evening workout logged after that got stamped with TOMORROW's date.
// Everything that keys off these strings (History ordering, bwIsStale()'s
// staleness window, getRecentWorkHistory()'s newest-first sort feeding
// suggestions) was silently wrong for late sessions. 'en-CA' is the one
// locale whose date format is exactly YYYY-MM-DD, matching what
// <input type="date"> and every date.localeCompare() in this file expect.
const today   = () => new Date().toLocaleDateString('en-CA');
const fmt     = d  => new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'});
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
const esc     = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const round   = (v,step) => Math.round(v/step)*step;

// "Was this field actually filled in" — NOT "is it truthy". A set's reps/kg
// can legitimately be 0 (a real 0kg assisted set at full graduation, a
// logged-but-failed 0-rep attempt) and 0 is falsy, indistinguishable from
// an untouched field under a plain `if(x)`/`x||fallback` check. Used
// everywhere a set's data needs "was this entered" rather than "is it
// nonzero" — computeSuggestion's graduation check, actualLoad, History's
// per-set display, and getRecentWorkHistory's inclusion filter.
const hasKg   = s => s.kg   !== '' && s.kg   != null;
const hasReps = s => s.reps !== '' && s.reps != null;

// "Can this exercise be done at this gym?" — an absent/EMPTY gyms list on
// the exercise means available EVERYWHERE (the zero-config default), and no
// selected gym (gymId null) means no availability filtering at all. Used by
// the session-block unavailability notice, the swap-exercise suggestions,
// and the add-exercise picker badges.
const availableAtGym = (ex, gymId) => !gymId || !(ex.gyms||[]).length || (ex.gyms||[]).includes(gymId);

// Resolves _currentGymId to the actual gym object, or null — a selection
// pointing at a gym that was deleted (possibly on another device, arriving
// via merge) degrades safely to "no gym selected" instead of dangling.
const currentGym = () => D.gyms.find(g => g.id === _currentGymId) || null;


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  5. STORAGE & SYNC — localStorage · window.storage · remote driver
// ║
// ║  Three-layer storage strategy:
// ║    1. localStorage   — fast, survives refresh, works on GitHub Pages
// ║    2. window.storage — Claude artifact fallback
// ║    3. Remote driver  — cross-device sync source of truth, one of two
// ║       transports behind the same remoteSave()/remotePull() interface:
// ║         · Supabase (default for fresh installs) — email magic-link
// ║           account; five user_blobs rows, one per collection, guarded
// ║           by row-level security. See "Supabase account & client".
// ║         · GitHub Gist (legacy) — five JSON files in a private Gist,
// ║           the original PAT-based setup, kept until every existing
// ║           device migrates.
// ║       Both carry the SAME five payloads (buildRemotePayload() is the
// ║       single source of the shape): sessions / library / plans /
// ║       weights / gyms, each with its own tombstones + lastModified.
// ║       Everything below the transport — queue, merge, tombstones,
// ║       schema guard — is driver-blind.
// ║
// ║  Merge logic (mergeCollection(), below) — all four collections use the
// ║  SAME rule: union by id with per-item last-writer-wins (each item's own
// ║  updatedAt decides; remote wins ties, which keeps legacy no-timestamp
// ║  items on their original remote-wins behavior). On top of that,
// ║  tombstones: a tombstoned id is removed again UNLESS the surviving
// ║  copy's own updatedAt is newer than the deletion (meaning it was
// ║  genuinely re-created/edited elsewhere after the delete, so that newer
// ║  edit wins over the older tombstone). Tombstones exist to close the
// ║  deletion-resurrection gap: a plain id-union can never represent "this
// ║  was intentionally removed," so a device that synced before seeing a
// ║  deletion would bring the item back and re-push it. The per-item LWW
// ║  exists because remoteSave() uploads whole collections — every push
// ║  implicitly rewrites every item, so without a recency compare a stale
// ║  device's push silently reverted other devices' newer edits.
// ║
// ║  Schema guard — every file remoteSave() writes is stamped with
// ║  SCHEMA_VERSION. If a fetch ever returns a file stamped NEWER than this
// ║  app build understands, the app refuses to merge or push until it's
// ║  been reloaded fresh (see mergeRemote()/remoteSave()) — an outdated
// ║  cached app writing back shapes it doesn't know about is how fields
// ║  like tombstones would silently vanish. Backfills handle old→new data
// ║  shapes; this guard handles the reverse direction, which backfills
// ║  can't.
// ║
// ║  Config (token, gistId) stored separately, never exported.
// ╚══════════════════════════════════════════════════════════════════════════════

// Bumped whenever the shape of what remoteSave() writes changes in a way an
// older app version would mangle by writing back (dropping fields it doesn't
// know it's holding). 1 = every file written before this field existed —
// which is also what a missing `schema` reads as on fetch.
// 3 = gym profiles: the fifth Gist file (gym-tracker-gyms.json), optional
//     per-exercise `gyms` availability tags, and session gymId/gymName —
//     a v2 app re-saving an edited session would silently drop its gym tag,
//     so v2 devices freeze sync until reloaded (which the v3 service worker
//     makes automatic when online).
const SCHEMA_VERSION = 3;
// Set when a fetched Gist file is stamped newer than SCHEMA_VERSION; while
// true, mergeRemote() refuses to merge and remoteSave() refuses to push.
// Cleared only by a fresh page load (which, post-service-worker-v3, always
// gets the current app when online).
let _remoteSchemaAhead = false;

// Safe localStorage wrapper — returns null instead of throwing in sandboxed envs
const LS = {
  get(k)    { try { return localStorage.getItem(k); }  catch(e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); }     catch(e) {} },
};

// Which transport is in effect. An explicit choice wins; otherwise a device
// with a working Gist config keeps using it (existing installs change
// nothing until their user opts in), and everything else — i.e. every fresh
// family install — defaults to the account backend.
function syncDriver() {
  if (CFG.driver) return CFG.driver;
  return (CFG.token && CFG.gistId) ? 'gist' : 'supabase';
}

// "Can remote sync actually run right now" — gates persist()'s fire-and-
// forget push, the background/resume pulls, and remotePull's button path.
function syncConfigured() {
  return syncDriver() === 'gist' ? !!(CFG.token && CFG.gistId) : !!(sb && sbSession);
}

// Flips this device to the account backend and does first-contact sync:
// pull-and-merge BEFORE the first push — the same discipline
// saveGithubConfig() enforces for Gist, for the same reason: a fresh login
// on a new phone must hydrate FROM the account, never blank it. Union+LWW
// makes the pull side safe by construction; a failed pull blocks the push.
async function connectSupabaseSync() {
  if (!sb || !sbSession) return;
  CFG.driver = 'supabase';
  await saveConfig();
  const ok = await remotePull();
  if (ok) await remoteSave();

// ── Daily local snapshots ─────────────────────────────────────────────────────
//
// A rolling 7-slot safety net, one slot per weekday (so up to a week of
// look-back before slots recycle): the first load of each calendar day
// stashes D as-loaded — BEFORE any remote merge can touch it — into
// gym:snapshot:<weekday>. Restorable from the Backup & Sync modal. This
// protects against the failure modes sync itself can't: a bad merge, an
// app bug mangling data, a fat-fingered "Importar e substituir". Honest
// limitation: a restore replaces LOCAL data only, it does not rewind the
// Gist — anything the Gist holds with a newer updatedAt (including
// tombstones) re-wins on the next merge; full remote rewind is the manual
// Gist-revision procedure documented in the project vault. Best-effort by
// design: a quota error just means no snapshot today, never a blocked load.
const SNAPSHOT_PREFIX = 'gym:snapshot:';

function writeDailySnapshot() {
  try {
    // An empty/fresh install has nothing worth keeping — the seed library
    // alone is reconstructible from library.json at any time.
    if (!D.sessions.length && !D.plans.length && !D.weights.length) return;
    const key = SNAPSHOT_PREFIX + new Date().getDay();
    const existing = LS.get(key);
    if (existing) {
      try { if (JSON.parse(existing).date === today()) return; } catch(e) {} // unparseable slot → overwrite it
    }
    LS.set(key, JSON.stringify({ date: today(), data: D }));
  } catch(e) {}
}

// All existing snapshots, newest first, for the restore list in the
// Backup & Sync modal. 'prerestore' is the automatic safety copy of
// whatever was live immediately before the last restore/import — so even
// a wrong restore is itself undoable.
function listSnapshots() {
  const out = [];
  ['0','1','2','3','4','5','6','prerestore'].forEach(slot => {
    const raw = LS.get(SNAPSHOT_PREFIX + slot);
    if (!raw) return;
    try {
      const p = JSON.parse(raw);
      if (p?.date && p?.data) out.push({ slot, date: p.date, data: p.data });
    } catch(e) {}
  });
  return out.sort((a,b) => b.date.localeCompare(a.date));
}

// Stashes the CURRENT state into the prerestore slot. Called before
// anything wholesale-replaces D (snapshot restore, backup import).
function stashPreRestore() {
  try { LS.set(SNAPSHOT_PREFIX + 'prerestore', JSON.stringify({ date: today(), data: D })); } catch(e) {}
}

function restoreSnapshot(slot) {
  const raw = LS.get(SNAPSHOT_PREFIX + slot);
  if (!raw) return;
  let p = null;
  try { p = JSON.parse(raw); } catch(e) {}
  if (!p?.data) { alert('Snapshot corrompido — não foi possível restaurar.'); return; }
  if (!confirm(`Substituir os dados atuais pelo snapshot de ${fmt(p.date)}?\n\nOs dados atuais ficam guardados em "antes da última restauração".`)) return;
  stashPreRestore();
  applyData(p.data);   // same validated path a backup import uses (backfill + scrub included)
  persist();
  closeModal();
  render();
}

// ── Gist helpers ──────────────────────────────────────────────────────────────

// Read one file from the Gist; returns parsed object or null
async function gistReadFile(filename) {
  if (!CFG.token || !CFG.gistId) return null;
  try {
    const r = await fetch(`https://api.github.com/gists/${CFG.gistId}`, {
      headers: { Authorization:`token ${CFG.token}`, Accept:'application/vnd.github.v3+json' }
    });
    if (!r.ok) return null;
    const g = await r.json();
    const content = g.files?.[filename]?.content;
    return content ? JSON.parse(content) : null;
  } catch(e) { return null; }
}

// Write one or more files to the Gist in a single PATCH call
async function gistWriteFiles(files) {
  if (!CFG.token) return false;
  try {
    if (CFG.gistId) {
      const r = await fetch(`https://api.github.com/gists/${CFG.gistId}`, {
        method: 'PATCH',
        headers: { Authorization:`token ${CFG.token}`, 'Content-Type':'application/json' },
        body: JSON.stringify({ files })
      });
      return r.ok;
    } else {
      // First run — create the Gist
      const r = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { Authorization:`token ${CFG.token}`, 'Content-Type':'application/json' },
        body: JSON.stringify({ description:'Gym Tracker Data', public:false, files })
      });
      if (!r.ok) return false;
      const g = await r.json();
      CFG.gistId = g.id;
      await saveConfig();
      return true;
    }
  } catch(e) { return false; }
}

// ── Gist sync — four independent files ───────────────────────────────────────

// Fetch all four files from the Gist in parallel
async function gistFetchAll() {
  if (!CFG.token || !CFG.gistId) return null;
  try {
    const r = await fetch(`https://api.github.com/gists/${CFG.gistId}`, {
      headers: { Authorization:`token ${CFG.token}`, Accept:'application/vnd.github.v3+json' }
    });
    if (!r.ok) return null;
    const g = await r.json();
    const parse = name => {
      const c = g.files?.[name]?.content;
      return c ? JSON.parse(c) : null;
    };
    return {
      sessions: parse('gym-tracker-sessions.json'),
      library:  parse('gym-tracker-library.json'),
      plans:    parse('gym-tracker-plans.json'),
      weights:  parse('gym-tracker-weights.json'),
      gyms:     parse('gym-tracker-gyms.json'),
    };
  } catch(e) { return null; }
}

// ── Remote payload (shared by both drivers) ──────────────────────────────────

// The five collection payloads, built in ONE place — the single source of
// the remote data shape for BOTH drivers. The Gist driver stringifies each
// into its own file; the Supabase driver stores each as one user_blobs
// row's jsonb content. Identical shape either way — that's what makes
// switching drivers a transport change rather than a data migration.
function buildRemotePayload() {
  const ts = D.lastModified;
  return {
    sessions: { schema:SCHEMA_VERSION, sessions:D.sessions,  tombstones:D.tombstones.sessions, lastModified:ts },
    library:  { schema:SCHEMA_VERSION, exercises:D.exercises, tombstones:D.tombstones.exercises, lastModified:ts },
    plans:    { schema:SCHEMA_VERSION, plans:D.plans,         tombstones:D.tombstones.plans,     lastModified:ts },
    weights:  { schema:SCHEMA_VERSION, weights:D.weights,     tombstones:D.tombstones.weights,   lastModified:ts },
    gyms:     { schema:SCHEMA_VERSION, gyms:D.gyms,           tombstones:D.tombstones.gyms,      lastModified:ts },
  };
}

const GIST_FILENAMES = {
  sessions: 'gym-tracker-sessions.json',
  library:  'gym-tracker-library.json',
  plans:    'gym-tracker-plans.json',
  weights:  'gym-tracker-weights.json',
  gyms:     'gym-tracker-gyms.json',
};

function payloadToGistFiles(payload) {
  const files = {};
  Object.entries(payload).forEach(([k, content]) => {
    files[GIST_FILENAMES[k]] = { content: JSON.stringify(content, null, 2) };
  });
  return files;
}

// ── Supabase data driver ──────────────────────────────────────────────────────

// Maps user_blobs rows back into the exact {sessions, library, plans,
// weights, gyms} shape gistFetchAll() returns, so mergeRemote() stays
// driver-blind. Unknown collection names (a future app version's new
// collection) are ignored rather than crashed on — the same tolerance the
// Gist side gets for free by only parsing known filenames.
function sbRowsToRemote(rows) {
  const remote = { sessions:null, library:null, plans:null, weights:null, gyms:null };
  (rows||[]).forEach(r => { if (r && r.collection in remote) remote[r.collection] = r.content; });
  return remote;
}

async function sbFetchAll() {
  if (!sb || !sbSession) return null;
  try {
    const { data, error } = await sb.from('user_blobs').select('collection,content');
    if (error) return null;   // surfaced upstream exactly like a failed Gist fetch
    return sbRowsToRemote(data);
  } catch(e) { return null; }
}

async function sbWriteAll(payload) {
  if (!sb || !sbSession) return false;
  try {
    // user_id must be set explicitly — the RLS insert/update policies
    // require user_id = auth.uid(), they don't fill it in.
    const uid = sbSession.user.id;
    const rows = Object.entries(payload).map(([collection, content]) => ({ user_id: uid, collection, content }));
    // upsert resolves conflicts on the table's composite primary key
    // (user_id, collection) — five rows overwritten in place per push.
    const { error } = await sb.from('user_blobs').upsert(rows);
    return !error;
  } catch(e) { return false; }
}

// Driver dispatch for the pull side — the push side dispatches inside
// remoteSave() (it also has to build/format the payload per driver).
async function remoteFetchAll() {
  return syncDriver() === 'supabase' ? sbFetchAll() : gistFetchAll();
}

// Which catalog entries are genuinely NEW for this library: not already
// present (by id) and not deliberately deleted here (tombstoned). The
// tombstone check is the important half — a seeded exercise the user
// deleted must never be pushed back by the catalog, the same
// no-ongoing-reconciliation promise seedStarterLibrary() makes.
function catalogNewEntries(rows) {
  return (rows||[])
    .filter(r => r && r.id && r.data && typeof r.data.name === 'string')
    .filter(r => !D.exercises.some(e => e.id === r.id))
    .filter(r => !(r.id in D.tombstones.exercises))
    .map(r => r.data);
}

// ── Sync queue ──────────────────────────────────────────────────────────────
//
// Every push (remoteSave) and pull (remotePull, loadData's background fetch)
// runs through this so they're never concurrent — a pull racing an
// in-flight push could read a half-written remote state, and two
// overlapping pushes could clobber each other's writes. A save that starts
// while one's already running doesn't wait or fire a second overlapping
// request; it just flags that there's more to sync, and the in-flight one
// triggers exactly one more push once it finishes, capturing whatever
// changed in between — so a burst of rapid edits collapses into at most one
// extra round-trip instead of a pile of overlapping requests. Pulls, being
// deliberate/infrequent rather than rapid-fire, simply wait their turn.
let _syncBusy = false;
let _syncQueued = false;

// Consecutive failed Gist round-trips (push or pull) while apparently
// ONLINE — attempts with navigator.onLine === false don't count, because
// failing to sync at the gym with no signal is expected, not a problem
// worth nagging about. Any success resets to 0. At 3+, the banner in
// buildPage() surfaces it: the tiny red dot alone proved too quiet for a
// genuinely broken setup (expired PAT, revoked scope), which otherwise
// stays invisible until someone happens to open the Backup modal.
let _syncFailStreak = 0;

// Stamped on every successful fetch+merge (loadData's background pull and
// remotePull) — read by the visibilitychange resume-pull below to rate-limit
// itself.
let _lastPullOk = 0;

function releaseSyncSlot() {
  _syncBusy = false;
  if (_syncQueued) { _syncQueued = false; remoteSave(); }
}

// Push all five payloads to the active driver (fire-and-forget from persist())
async function remoteSave() {
  if (!syncConfigured()) return;
  // Never let an app build overwrite data written by a NEWER one — this
  // flag is set when a pull saw a schema stamp ahead of ours (see
  // mergeRemote()). Checked before the busy/queue logic on purpose: a
  // blocked push must not sit in the queue and fire later anyway.
  if (_remoteSchemaAhead) { setSyncStatus('error'); return; }
  if (_syncBusy) { _syncQueued = true; return; }
  _syncBusy = true;
  setSyncStatus('syncing');
  const payload = buildRemotePayload();
  const ok = syncDriver() === 'supabase'
    ? await sbWriteAll(payload)
    : await gistWriteFiles(payloadToGistFiles(payload));
  if (ok) _syncFailStreak = 0;
  else if (navigator.onLine !== false) _syncFailStreak++;
  setSyncStatus(ok ? 'ok' : 'error');
  releaseSyncSlot();
}

// Manual re-sync — called from "Forçar download" button in sync modal.
// Since every data type below merges by safe union (never destructive),
// this doesn't need a "force" path anymore — it's just an on-demand version
// of the background fetch+merge loadData() already does automatically.
// Useful when you're about to start a workout and a session logged on
// another device hasn't shown up in History yet.
// Returns true only when the fetch AND merge both succeeded — the one
// caller that chains a push off this (saveGithubConfig()) must never push
// after a failed pull, or it would blind-overwrite the remote state it
// just failed to read.
async function remotePull() {
  if (!syncConfigured()) {
    alert(syncDriver() === 'supabase' ? 'Entre com seu e-mail primeiro (Backup & Sync).' : 'Configure o token do GitHub primeiro.');
    return false;
  }
  while (_syncBusy) await new Promise(r => setTimeout(r, 50)); // wait for any in-flight push/pull
  _syncBusy = true;
  setSyncStatus('syncing');
  const remote = await remoteFetchAll();
  if (!remote) { if (navigator.onLine !== false) _syncFailStreak++; setSyncStatus('error'); releaseSyncSlot(); return false; }
  if (!mergeRemote(remote)) { setSyncStatus('error'); releaseSyncSlot(); return false; } // remote schema is newer than this app — see mergeRemote(); not a failure streak
  await persistLocal();
  _syncFailStreak = 0;
  _lastPullOk = Date.now();
  setSyncStatus('ok');
  render();
  releaseSyncSlot();
  // Piggyback the shares inbox on every successful account pull — one cheap
  // extra select, keeps "Planos recebidos" fresh without its own schedule.
  if (syncDriver() === 'supabase') loadReceivedShares();
  return true;
}

// ── Resume pull ───────────────────────────────────────────────────────────────
//
// An installed PWA can sit warm in the app switcher for days, and
// loadData()'s background pull only runs on a genuine cold start — so
// "phone doesn't see the session logged on the desktop yesterday" kept
// happening until a manual Forçar download. This fires the same queued
// fetch+merge whenever the app becomes visible again, rate-limited by
// _lastPullOk so ordinary tab-switching doesn't hammer the API. On a
// successful pull it also pushes the merged result back (same convergence
// step loadData's cold-start pull does).
const RESUME_PULL_MIN_MS = 5 * 60 * 1000;
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (!syncConfigured()) return;           // no driver ready (no Gist config / not logged in)
  if (_remoteSchemaAhead) return;          // frozen until a fresh reload anyway
  if (Date.now() - _lastPullOk < RESUME_PULL_MIN_MS) return;
  const ok = await remotePull();             // queued — can never race an in-flight push
  if (ok) remoteSave();
});

// Merges one collection: union by id with per-item last-writer-wins (the
// copy with the higher updatedAt is kept; remote wins ties), then
// tombstones remove anything they cover UNLESS the surviving item's own
// updatedAt is newer than the deletion. Also unions the tombstone maps
// themselves (keeping the later deletedAt per id) so a deletion recorded
// on either side sticks. See the section 5 banner for why this exists —
// a plain union with no tombstones let a deleted item come back to life
// the next time a stale device synced.
function mergeCollection(local, remote, localTombstones, remoteTombstones) {
  const map = new Map(local.map(x => [x.id, x]));
  // Per-item LWW, not blind "remote wins": remoteSave() always uploads WHOLE
  // collections, so every push implicitly rewrites every item in them, not
  // just the one the user touched. Under blind remote-wins, any push from
  // a device holding a stale copy (e.g. a tab left open since yesterday
  // editing an unrelated plan) silently reverted newer edits everywhere —
  // no concurrent edit to the same item needed. Comparing each item's own
  // updatedAt closes that: the stale copy loses, the newer edit survives
  // the round-trip and re-propagates. Remote wins ties (>=) on purpose:
  // legacy items with no updatedAt compare 0 vs 0 and must keep the old
  // remote-wins behavior they were originally written under.
  (remote||[]).forEach(x => {
    const cur = map.get(x.id);
    if (!cur || (x.updatedAt||0) >= (cur.updatedAt||0)) map.set(x.id, x);
  });

  const tombstones = { ...localTombstones };
  Object.entries(remoteTombstones||{}).forEach(([id, deletedAt]) => {
    if (!tombstones[id] || deletedAt > tombstones[id]) tombstones[id] = deletedAt;
  });

  Object.entries(tombstones).forEach(([id, deletedAt]) => {
    const item = map.get(id);
    if (!item) return;
    if ((item.updatedAt||0) <= deletedAt) map.delete(id);
    else delete tombstones[id]; // item was genuinely edited after the delete — the tombstone is stale
  });

  return { items: [...map.values()], tombstones };
}

// Merge remote Gist data into D using mergeCollection() for all four
// collections — see the section 5 banner for the shared merge rule.
// Returns false (merging nothing at all) when any remote file was written
// by a newer app version than this one — a partial old-shape/new-shape
// merge is scarier than skipping a sync, and the next fresh load gets the
// current app anyway.
function mergeRemote(remote) {
  const remoteSchema = Math.max(...[remote.sessions, remote.library, remote.plans, remote.weights, remote.gyms].map(f => f?.schema || 1));
  if (remoteSchema > SCHEMA_VERSION) { _remoteSchemaAhead = true; return false; }

  if (remote.sessions?.sessions) {
    const { items, tombstones } = mergeCollection(D.sessions, remote.sessions.sessions, D.tombstones.sessions, remote.sessions.tombstones);
    D.sessions = items.sort((a,b) => b.date.localeCompare(a.date));
    D.tombstones.sessions = tombstones;
    // A remote device running an app version older than the saveSession()
    // metadata strip can push sets still carrying chip/dim scaffolding —
    // scrub after every merge, same reasoning as the backfill below.
    scrubSessionSetMetadata();
  }

  if (remote.library?.exercises) {
    const { items, tombstones } = mergeCollection(D.exercises, remote.library.exercises, D.tombstones.exercises, remote.library.tombstones);
    D.exercises = items;
    D.tombstones.exercises = tombstones;
    // A remote device that hasn't loaded this classification feature yet
    // could push exercises with no mainMuscle at all — backfill after every
    // merge, not just on local load, so that never leaves a gap.
    backfillExerciseClassification();
  }

  if (remote.plans?.plans) {
    const { items, tombstones } = mergeCollection(D.plans, remote.plans.plans, D.tombstones.plans, remote.plans.tombstones);
    D.plans = items;
    D.tombstones.plans = tombstones;
  }

  if (remote.weights?.weights) {
    const { items, tombstones } = mergeCollection(D.weights, remote.weights.weights, D.tombstones.weights, remote.weights.tombstones);
    D.weights = items;
    D.tombstones.weights = tombstones;
  }

  if (remote.gyms?.gyms) {
    const { items, tombstones } = mergeCollection(D.gyms, remote.gyms.gyms, D.tombstones.gyms, remote.gyms.tombstones);
    D.gyms = items;
    D.tombstones.gyms = tombstones;
  }
  return true;
}

// ── persist() — called after every mutation ───────────────────────────────────

async function persist() {
  D.lastModified = Date.now();
  await persistLocal();
  remoteSave(); // fire-and-forget
}

// ── Load sequence ─────────────────────────────────────────────────────────────
// 1. Load config
// 2. Load local cache → render immediately (app is usable offline)
// 2b. Fresh install only (no personal exercises yet) → seed from library.json
// 3. Fetch all four Gist files in background → merge → re-render

async function loadData() {
  await loadConfig();

  // Restore the per-device gym selection (see _currentGymId, section 3) —
  // resolved lazily through currentGym(), so a stale id is harmless.
  _currentGymId = LS.get('gym:currentGym') || null;

  // Step 2 — local cache
  const local = await loadLocalData();
  if (local) {
    D.exercises    = local.exercises    || [];
    D.plans        = local.plans        || [];
    D.sessions     = local.sessions     || [];
    D.weights      = local.weights      || [];
    D.gyms         = local.gyms         || [];
    D.tombstones   = local.tombstones   || { exercises:{}, plans:{}, sessions:{}, weights:{}, gyms:{} };
    // A cache written before gyms existed has a tombstones object with no
    // gyms key — normalize so delGym()/mergeCollection() never hit undefined.
    if (!D.tombstones.gyms) D.tombstones.gyms = {};
    D.lastModified = local.lastModified || 0;
    // Backfills any exercise saved before muscle-group classification
    // existed — see backfillExerciseClassification() (section 2). A no-op
    // once every exercise has been through it once.
    backfillExerciseClassification();
    // Same idea for sessions saved before the set-metadata strip existed —
    // see scrubSessionSetMetadata() (section 2). Also a no-op once clean.
    scrubSessionSetMetadata();
    // First load of the day → stash the as-loaded state (pre-any-merge)
    // into today's weekday snapshot slot. See writeDailySnapshot().
    writeDailySnapshot();
  }
  render();

  // Step 2b — a genuinely fresh install (no personal exercises at all yet)
  // gets seeded from library.json. Runs after the first render so the app
  // is already usable while this fetch is in flight.
  if (!D.exercises.length) await seedStarterLibrary();

  // Restore any persisted login BEFORE deciding whether sync can run — the
  // SDK reads its stored session from localStorage asynchronously, and the
  // supabase driver counts as configured only once that session exists.
  if (sb) { try { const { data } = await sb.auth.getSession(); sbSession = data?.session || null; } catch(e) {} }
  if (!syncConfigured()) return;

  // Step 3 — background remote fetch (whichever driver is active). Goes
  // through the same sync queue as remotePull()/remoteSave() (see their
  // comment) so this can't race a push that's already in flight. Status is
  // set to 'ok' only once the fetch+merge itself is actually done — it
  // used to be set right after firing remoteSave() without awaiting it,
  // which could show "synced" a moment before the push had even started,
  // let alone finished.
  while (_syncBusy) await new Promise(r => setTimeout(r, 50));
  _syncBusy = true;
  setSyncStatus('syncing');
  const remote = await remoteFetchAll();
  if (!remote) { if (navigator.onLine !== false) _syncFailStreak++; setSyncStatus('error'); releaseSyncSlot(); return; }

  if (!mergeRemote(remote)) { setSyncStatus('error'); releaseSyncSlot(); return; } // remote schema newer than this app — don't merge, don't push
  await persistLocal();
  _syncFailStreak = 0;
  _lastPullOk = Date.now();
  setSyncStatus('ok');
  render();
  releaseSyncSlot();
  remoteSave(); // push merged result back so all devices converge — goes through the queue itself
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  6. MEMORY SYSTEM
// ║
// ║  Computes progressive-overload suggestions directly from D.sessions —
// ║  there is no separate cached-memory layer (an earlier D.memory/
// ║  rebuildMemory() snapshot cache was removed as dead code: it only ever
// ║  held a single latest entry per key, nothing read it back once history-
// ║  aware suggestions shipped, and its own remote merge was provably
// ║  overwritten by its own rebuild in the same function).
// ║  Key format: "exId:type:regime"  e.g. "abc123:strength:weighted"
// ║
// ║  isCountedWork()       — a set counts as real performed work only if
// ║                          intent==='work' and it wasn't explicitly left
// ║                          unchecked (completed!==false, not ===true —
// ║                          sets saved before the checkbox existed, or a
// ║                          freshly-added row nobody has touched yet, have
// ║                          no `completed` at all and must still count).
// ║  profileFor()          — the baseline rep-range/target-set-count profile,
// ║                          by type and (for hypertrophy) regime. Per-
// ║                          exercise custom profiles are a deliberately
// ║                          deferred future feature (see the project Log).
// ║  getRecentWorkHistory()— last N sessions' counted work sets for a key,
// ║                          newest first — a short window, not a single
// ║                          snapshot, since detecting a multi-session stall
// ║                          needs more than the latest session alone.
// ║  computeSuggestion()   — the actual progression algorithm. NOT a simple
// ║                          per-number trend: "graduated" (ready for more
// ║                          weight) requires the FULL target work-set count
// ║                          to be completed at the top of the rep range, all
// ║                          at the same (working) weight. A set performed
// ║                          below that weight — e.g. a fatigue drop-off
// ║                          partway through a session — fails the check on
// ║                          its own, which is exactly the desired behavior:
// ║                          don't suggest more weight until the whole
// ║                          prescribed session can be done at it. Bodyweight
// ║                          is excluded from graduation/stall entirely (see
// ║                          below) — there's no adjustable resistance to
// ║                          progress in this data model.
// ║
// ║  Warm-up generation rules (weight scales off the SUGGESTED weight for
// ║  today, not last session's actual heaviest set; reps ramp 10-8-6 as the
// ║  sets get heavier/closer to work weight — see WU_REPS in
// ║  buildSetsFromMemory()):
// ║    Compound + weighted  → 3 WU sets at 25 / 55 / 85% of suggested weight
// ║    Compound + assisted  → 3 WU sets at 175 / 145 / 115% (more assist = easier)
// ║    Isolation + weighted → 1 WU set at 50% of suggested weight (6 reps —
// ║                           the "closest to work weight" step, not 10)
// ║    Isolation + assisted → 1 WU set at 150% (the complement of 50%, same
// ║                           inversion the compound ramp uses)
// ║    Bodyweight           → no warm-ups
// ║  Every set (warm-up and work) gets a completed checkbox — checking it
// ║  confirms whatever's currently shown as accurate, same as editing it by
// ║  hand (see toggleCompleted()).
// ╚══════════════════════════════════════════════════════════════════════════════

const memKey = (exId, type, regime) => `${exId}:${type}:${regime||'weighted'}`;

const isCountedWork = s => s.intent === 'work' && s.completed !== false;

function profileFor(type, regime) {
  if (type === 'strength') return { targetWorkSets: 3, repLow: 2, repHigh: 5 };
  // Hypertrophy's 1 target work set is the same for compound and isolation
  // — only the warm-up count differs by isComp (3 vs 1, in
  // buildWarmupSets()), the work-set target doesn't.
  return regime === 'assisted'
    ? { targetWorkSets: 1, repLow: 6, repHigh: 12 }
    : { targetWorkSets: 1, repLow: 6, repHigh: 10 };
}

// Returns up to n most recent sessions' counted work sets for this exact
// exercise+type+regime, newest first — e.g. [[{reps,kg},...], [{reps,kg},...]].
// Sessions where this exercise had no counted work sets are skipped
// entirely rather than counted as a zero — there's simply no data from that
// attempt to reason about.
function getRecentWorkHistory(exId, type, regime, n=3) {
  const key = memKey(exId, type, regime);
  const out = [];
  [...D.sessions]
    .sort((a,b) => b.date.localeCompare(a.date))
    .some(sess => {
      // A session can log the same exercise+type+regime combo more than
      // once (e.g. squat→curl→squat→curl as a superset) — combine every
      // matching entry's counted work sets for this session, not just the
      // first one found, so a repeated exercise's full contribution counts
      // toward suggestions/graduation instead of silently losing everything
      // past the first occurrence.
      const matches = (sess.exercises||[]).filter(e => memKey(e.exId, e.type, e.regime||'weighted') === key);
      const ws = matches.flatMap(ex => (ex.sets||[]).filter(s => isCountedWork(s) && (hasReps(s)||hasKg(s))));
      if (ws.length) out.push(ws.map(s => ({reps:s.reps, kg:s.kg})));
      return out.length >= n; // stop early once we have enough
    });
  return out;
}

// Default weight increment on graduation. Flipped for assisted regimes:
// less assistance is *harder*, so "heavier" there means a smaller
// counterweight number, not a larger one. Hardcoded for now — an easy
// config point once custom profiles exist.
function bumpWeight(kg, isAssisted) {
  const inc = 2.5;
  return isAssisted ? Math.max(0, round(kg - inc, 0.5)) : round(kg + inc, 0.5);
}

// The progression algorithm. See the section banner above for why
// "graduated" requires the full target work-set count, not just one set.
function computeSuggestion(exId, type, regime, profile) {
  const history = getRecentWorkHistory(exId, type, regime, 3);
  if (!history.length) return null;

  const isAsst = regime === 'assisted';
  const isBW   = regime === 'bodyweight';

  // Assisted: less counterweight = harder, so the WORKING weight (the one
  // that was actually challenging) is the SMALLEST kg logged in a session,
  // not the largest — inverse of every other regime, where more kg = harder.
  const workingKgOf = vals => isAsst ? Math.min(...vals) : Math.max(...vals);

  const graduatedAt = (sets) => {
    if (sets.length < profile.targetWorkSets) return false;
    if (isBW) {
      // No kg exists for bodyweight sets — graduation is reps-only: hit the
      // top of the rep range across the full prescribed set count.
      return sets.every(s => Number(s.reps) >= profile.repHigh);
    }
    const vals = sets.filter(hasKg).map(s => Number(s.kg));
    if (!vals.length) return false;
    const workingKg = workingKgOf(vals);
    return sets.every(s => hasKg(s) && Number(s.kg) === workingKg && Number(s.reps) >= profile.repHigh);
  };

  const last = history[0];
  let workingKg = null;
  if (!isBW) {
    const lastVals = last.filter(hasKg).map(s => Number(s.kg));
    workingKg = lastVals.length ? workingKgOf(lastVals) : null;
  }
  // Bodyweight has no adjustable resistance in this data model, so
  // "stalled, add weight" is never an actionable nudge — it opts out of
  // graduation/stall entirely, same as it already opts out of warm-ups
  // above. repsTarget stays at the top of the range permanently as a
  // stable "aim for more reps" cue. (Revisit if weighted-bodyweight
  // variants — vest/added load as a real progression axis — are ever
  // tracked; see the project Log.)
  const graduated = !isBW && graduatedAt(last);

  const suggestedKg = (graduated && workingKg != null) ? bumpWeight(workingKg, isAsst) : workingKg;
  const repsTarget   = graduated ? profile.repLow : profile.repHigh;

  // Stall streak — consecutive most-recent sessions that did NOT graduate.
  // 0 if the last session graduated (no stall, they just progressed).
  let stallStreak = 0;
  if (!isBW) {
    for (const sets of history) {
      if (graduatedAt(sets)) break;
      stallStreak++;
    }
  }

  return { last, workingKg, suggestedKg, repsTarget, graduated, stallStreak };
}

// Warm-up rep ramp (10-8-6, heaviest/closest-to-work step last) — shared by
// buildWarmupSets() below and read nowhere else.
const WU_REPS = [10, 8, 6];

// Builds warm-up set objects scaled off a base "today's target" weight.
// Shared by two callers with two different sources for that base weight:
// buildSetsFromMemory() (a returning exercise's computed suggestion) and
// estimateWarmups() (a first-ever log, where the user types their own
// estimate instead, since there's no history to suggest one — see
// estimateWarmups() for why). Reps ramp down (10-8-6) as the sets get
// heavier/closer to work weight — more reps to prime lightly-loaded early
// sets, fewer as it gets harder. A single isolation warm-up takes the LAST
// step (6) since it plays the same role as the final, closest-to-work step
// of the compound ramp, not the first. Isolation's multiplier mirrors the
// compound ramp's assisted inversion (less counterweight = harder): 0.5
// weighted's complement is 1.5, the same "2 − x" relationship the compound
// mults already use (0.25↔1.75, 0.55↔1.45, 0.85↔1.15). No warm-ups for
// bodyweight (no adjustable resistance to warm up into).
function buildWarmupSets(regime, isComp, baseKg) {
  if (regime === 'bodyweight' || baseKg == null) return [];
  const mults = isComp
    ? (regime === 'assisted' ? [1.75, 1.45, 1.15] : [0.25, 0.55, 0.85])
    : (regime === 'assisted' ? [1.5] : [0.5]);
  return mults.map((m, idx) => ({
    intent: 'warmup',
    reps: isComp ? WU_REPS[idx] : WU_REPS[WU_REPS.length - 1],
    kg: round(baseKg*m, 0.5),
    lastReps:null, lastKg:null, sugReps:null, sugKg:null,
  }));
}

function buildSetsFromMemory(ex) {
  const regime  = ex.regime || 'weighted';
  const isComp  = ex.compound !== false;
  const profile = profileFor(ex.type, regime);
  const sug     = computeSuggestion(ex.exId, ex.type, regime, profile);
  ex._sug       = sug; // cached for buildExBlock()'s stall banner — see its comment
  const sets    = [];

  // No history yet → return empty default rows based on type. No warm-ups
  // either (nothing to scale them off) — buildExBlock() shows a prompt
  // instead, letting the user estimate a working weight (see
  // estimateWarmups()) so warm-ups aren't just silently missing.
  if (!sug) {
    const ph = `${profile.repLow}–${profile.repHigh}`;
    for (let i=0; i<profile.targetWorkSets; i++) sets.push({ intent:'work', reps:'', kg:'', lastReps:null, lastKg:null, sugReps:null, sugKg:null, phReps:ph });
    return sets;
  }

  sets.push(...buildWarmupSets(regime, isComp, sug.suggestedKg));

  // Work rows: always start from what actually happened last time (never
  // silently replaced by the suggestion) — lastReps/lastKg feed the "repeat
  // last time" chip and the dimmed starting value; sugReps/sugKg feed the
  // "apply suggestion" chip, only meaningfully different when a row fell
  // short of target or the exercise just graduated.
  sug.last.forEach(s => sets.push({
    intent: 'work',
    reps: s.reps, kg: s.kg,
    lastReps: s.reps, lastKg: s.kg,
    sugReps: sug.repsTarget, sugKg: sug.suggestedKg,
  }));
  return sets;
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  7. BODYWEIGHT & VOLUME HELPERS
// ║
// ║  Bodyweight is used in two ways:
// ║    · Bodyweight exercises: actual load = BW (no input needed)
// ║    · Assisted exercises:   actual load = BW − counterweight
// ║
// ║  Volume is calculated using actual load, not entered kg.
// ╚══════════════════════════════════════════════════════════════════════════════

function currentBW() {
  if (!D.weights?.length) return null;
  return [...D.weights].sort((a,b) => b.date.localeCompare(a.date))[0].kg;
}

function bwIsStale() {
  if (!D.weights?.length) return true;
  const last = [...D.weights].sort((a,b) => b.date.localeCompare(a.date))[0].date;
  return (new Date(today()) - new Date(last)) / 86400000 > 7;
}

function actualLoad(set, regime) {
  const bw = currentBW();
  if (regime === 'bodyweight') return bw || null;
  // hasKg, not a truthy check — a genuinely-entered 0kg set (full
  // graduation for assisted; a deliberate empty-bar/0kg entry for
  // weighted) must count, not be treated as an untouched field. Applies to
  // both regimes here — weighted used to skip this and only assisted had
  // it, which was itself the bug: same class, same fix, every regime.
  if (regime === 'assisted') return (bw && hasKg(set)) ? Math.max(0, bw - Number(set.kg)) : null;
  return hasKg(set) ? Number(set.kg) : null;
}

function volEx(sets, regime) {
  return (sets||[])
    .filter(isCountedWork)
    .reduce((a,s) => {
      const l = actualLoad(s, regime||'weighted');
      return a + (l && s.reps ? Number(s.reps)*l : 0);
    }, 0);
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  8. UI HELPERS — buttons, pills, filter bars
// ║
// ║  These are pure HTML string factories.
// ║  B()  = full-width button
// ║  Bs() = small inline button
// ║  *Pill() = colored badge for type / regime / compound
// ╚══════════════════════════════════════════════════════════════════════════════

// ── Buttons ───────────────────────────────────────────────────────────────────
const B  = (bg,col,txt,oc,x='') => `<button onclick="${oc}" style="display:flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:8px;border:none;background:${bg};color:${col};font-weight:600;font-size:14px;cursor:pointer;width:100%;font-family:inherit;margin-bottom:8px${x}">${txt}</button>`;
const Bs = (bg,col,txt,oc,x='') => `<button onclick="${oc}" style="display:inline-flex;align-items:center;justify-content:center;padding:7px 12px;border-radius:7px;border:none;background:${bg};color:${col};font-weight:600;font-size:13px;cursor:pointer;font-family:inherit${x}">${txt}</button>`;

// ── Pills (colored badges) ────────────────────────────────────────────────────
const typePill = t => t === 'strength'
  ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#2d1010;color:#e57373">Força</span>`
  : `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#0d2744;color:#64b5f6">Hipert.</span>`;

const regimePill = r => r === 'assisted'
  ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#2e1a00;color:#f0a030">Assistido</span>`
  : r === 'bodyweight'
  ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#0a2e24;color:#6fcf97">Corporal</span>`
  : `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1a1a2e;color:#90caf9">Carga</span>`;

const compPill = c => c === true
  ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1a1035;color:#b39ddb">Composto</span>`
  : c === false
  ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1e1810;color:#d4a96a">Isolado</span>`
  : `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1a1a1a;color:${DM}">?</span>`;

// Combines mainMuscle + movementPattern into one pill ("Peito · Supino")
// rather than two separate ones — see MOVEMENT_PATTERNS (section 2) for why
// the pattern label depends on which muscle group it's being read from.
const musclePill = (m, p) => {
  // Checked against MUSCLE_GROUPS directly (not just `m === 'undefined'`) so
  // an unrecognized value — corrupted data, or a muscle group renamed/
  // removed in a future version — falls back to the gray "unclassified"
  // look instead of a teal "classified" pill showing the Undefined label.
  const isUndef = !m || !MUSCLE_GROUPS[m] || m === 'undefined';
  const mLabel  = MUSCLE_GROUPS[m] || MUSCLE_GROUPS.undefined;
  const pLabel  = (MOVEMENT_PATTERNS[m] || {})[p] || '';
  const label   = isUndef ? mLabel : (pLabel ? `${mLabel} · ${pLabel}` : mLabel);
  return isUndef
    ? `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#1a1a1a;color:${DM}">${label}</span>`
    : `<span style="display:inline-flex;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:#0a2e2e;color:#4dd0c4">${label}</span>`;
};


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  9. FILTER SYSTEM
// ║
// ║  applyFilters() — pure filter function, used by library, add-ex modal, plan editor
// ║
// ║  Filter bars are built as HTML strings with data-* attributes.
// ║  Listeners are attached programmatically after injection (avoids onclick
// ║  attribute CSP issues in sandboxed environments).
// ╚══════════════════════════════════════════════════════════════════════════════

function applyFilters(list, fType, fMove, search, alpha, unclassed, fMuscle, fPattern) {
  let out = list.filter(ex => {
    if (fType === 'strength'    && ex.type !== 'strength')    return false;
    if (fType === 'hypertrophy' && ex.type !== 'hypertrophy') return false;
    if (unclassed) { if (ex.compound != null) return false; }
    else {
      if (fMove === 'compound'  && ex.compound !== true)  return false;
      if (fMove === 'isolation' && ex.compound !== false) return false;
    }
    if (fMuscle && ex.mainMuscle !== fMuscle) return false;
    // Pattern is only ever checked once a muscle is also selected — each
    // group has its own scoped pattern vocabulary (MOVEMENT_PATTERNS), so
    // filterBarHTML() never offers a pattern pill without one, and checking
    // it here without fMuscle set would be ambiguous (the same pattern key
    // can mean different things — or not exist at all — in another group).
    if (fMuscle && fPattern && ex.movementPattern !== fPattern) return false;
    if (search && !ex.name.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });
  if (alpha) out = [...out].sort((a,b) => a.name.localeCompare(b.name,'pt'));
  return out;
}

// Builds a filter pill bar HTML string.
// Each pill carries a data-key attribute so listeners can be attached externally.
function filterBarHTML(fType, fMove, unclassed, showUnclassed, fMuscle, fPattern) {
  const p = (lbl, active, key, acBg) =>
    `<button data-fk="${key}" style="padding:6px 13px;border-radius:99px;border:none;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;background:${active?(acBg||CG):BG3};color:${active?TX:DM}">${lbl}</button>`;
  const muscleRow = Object.entries(MUSCLE_GROUPS)
    .filter(([k]) => k !== 'undefined')
    .map(([k,label]) => p(label, fMuscle===k, `mg:${k}`, '#0a2e2e')).join('');
  // Only the currently-selected muscle's own pattern list is ever shown —
  // see the comment in applyFilters() for why a global pattern list would
  // be misleading.
  const patternRow = fMuscle
    ? Object.entries(MOVEMENT_PATTERNS[fMuscle]||{}).map(([k,label]) => p(label, fPattern===k, `mp:${k}`, '#0a2e2e')).join('')
    : '';
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
    ${p('Força',        fType==='strength',              'ft:strength')}
    ${p('Hipert.',      fType==='hypertrophy',            'ft:hypertrophy')}
    <div style="width:1px;background:${BD};margin:0 2px"></div>
    ${p('Composto',     !unclassed&&fMove==='compound',  'fm:compound',  '#1a1035')}
    ${p('Isolado',      !unclassed&&fMove==='isolation', 'fm:isolation', '#1e1810')}
    ${showUnclassed ? p('Não classif.', unclassed, 'fm:unclassed', '#2a2a1a') : ''}
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:${patternRow?'6px':'10px'}">${muscleRow}</div>
  ${patternRow ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${patternRow}</div>` : ''}`;
}

// Attaches click listeners to a rendered filter bar.
// onType/onMove/onMuscle/onPattern(val) are callbacks that handle state changes.
function bindFilterBar(containerId, onType, onMove, onMuscle, onPattern) {
  const bar = document.getElementById(containerId);
  if (!bar) return;
  bar.querySelectorAll('[data-fk]').forEach(btn => {
    btn.addEventListener('click', function() {
      const [ns, val] = this.dataset.fk.split(':');
      if      (ns === 'ft') onType(val);
      else if (ns === 'fm') onMove(val);
      else if (ns === 'mg') onMuscle(val);
      else if (ns === 'mp') onPattern(val);
    });
  });
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  10. RENDER ENGINE
// ║
// ║  render() rebuilds the entire page from state.
// ║  Each tab is a separate function (sections 11–15).
// ║  After render, programmatic listeners are re-attached where needed.
// ╚══════════════════════════════════════════════════════════════════════════════

function render() {
  document.getElementById('root').innerHTML = buildPage();
  // Re-attach listeners that can't use onclick attributes
  bindLibraryFilters();
  updateSyncDot();
}

function buildPage() {
  const TABS = [['log','Treino'],['history','Histórico'],['library','Biblioteca'],['plans','Planos'],['weight','Peso']];
  const tabBar = `
    <div style="position:sticky;top:0;z-index:50;background:${BG};border-bottom:1px solid ${BD};display:flex;position:relative">
      ${TABS.map(([id,lbl]) => `
        <button onclick="setTab('${id}')" style="flex:1;padding:12px 2px;background:none;border:none;
          border-bottom:2px solid ${TAB===id?CG:'transparent'};color:${TAB===id?TX:DM};
          font-weight:600;font-size:11px;cursor:pointer;font-family:inherit">${lbl}</button>
      `).join('')}
      <div id="sync-dot" style="width:7px;height:7px;border-radius:99px;background:transparent;
        position:absolute;top:10px;right:10px;transition:background .3s"></div>
    </div>`;
  const body = TAB==='log'     ? buildLog()
             : TAB==='history' ? buildHistory()
             : TAB==='library' ? buildLibrary()
             : TAB==='plans'   ? buildPlans()
             :                   buildWeight();
  return `<div style="min-height:100vh">${tabBar}<div id="sync-banner">${syncProblemBanner()}</div><div style="padding:16px">${body}</div></div>`;
}

// Cross-tab problem banner, shown directly under the tab bar when sync is
// genuinely broken (not just a transient blip): either the remote data is
// from a newer app version (see SCHEMA_VERSION) or 3+ consecutive online
// round-trips have failed (see _syncFailStreak — an expired/revoked PAT
// looks exactly like this). Rendered by buildPage() and ALSO refreshed
// in place by setSyncStatus() via updateSyncBanner() — same pattern as the
// sync dot — so it appears/clears promptly without forcing a full render
// mid-interaction (a background render() would blow away input focus,
// exactly what setVal() is built to avoid).
function syncProblemBanner() {
  const style = `background:#1e1a00;border-bottom:1px solid #5a4a00;padding:9px 14px;font-size:12px;color:#e6c84a;display:flex;align-items:center;gap:10px`;
  if (_remoteSchemaAhead) return `<div style="${style}">
    <span style="flex:1">Dados na nuvem vêm de uma versão mais nova do app — recarregue para atualizar.</span>
    ${Bs(BG3,TX,'Recarregar','location.reload()')}
  </div>`;
  if (_syncFailStreak >= 3) return `<div style="${style}">
    <span style="flex:1">Sincronização falhando (${_syncFailStreak} tentativas) — verifique o token e a conexão.</span>
    ${Bs(BG3,TX,'Abrir','openBackup()')}
  </div>`;
  return '';
}
function updateSyncBanner() {
  const el = document.getElementById('sync-banner');
  if (el) el.innerHTML = syncProblemBanner();
}

function setTab(t) {
  if (t === 'library') _libSearch = ''; // clear search when entering library
  if (t === 'plans' && sb && sbSession) loadReceivedShares(); // background inbox refresh; re-renders on arrival
  TAB = t;
  render();
}

// Sync status dot — green=ok, red=error, yellow=syncing
function setSyncStatus(state) { _syncStatus = { state, time: Date.now() }; updateSyncDot(); updateSyncBanner(); }
function updateSyncDot() {
  const el = document.getElementById('sync-dot');
  if (!el) return;
  const s = _syncStatus?.state;
  el.style.background = s==='ok' ? CG : s==='error' ? CR : s==='syncing' ? '#e6c84a' : 'transparent';
  el.title = s==='ok' ? `Sincronizado · ${fmtTime(_syncStatus.time)}` : s==='error' ? 'Erro de sincronização' : s==='syncing' ? 'Sincronizando...' : '';
}

// BW stale banner — shown on Log tab when weight hasn't been logged in 7+ days
function bwBanner() {
  if (!bwIsStale()) return '';
  const msg = !D.weights?.length
    ? 'Nenhum peso corporal registrado — necessário para cálculos de carga.'
    : 'Peso corporal não atualizado há mais de 7 dias.';
  return `<div style="background:#1e1a00;border:1px solid #5a4a00;border-radius:10px;padding:11px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px">
    <span style="font-size:13px;color:#e6c84a;flex:1">${msg}</span>
    ${Bs(CG,TX,'+ Peso',"setTab('weight')")}
  </div>`;
}

function buildLog() {
