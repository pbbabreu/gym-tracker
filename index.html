function addPickedEx(exId) {
  const ex = D.exercises.find(e=>e.id===exId); if(!ex||!S)return;
  const o = { exId, exName:ex.name, type:_pickType, compound:ex.compound, regime:_pickRegime, sets:[] };
  o.sets = buildSetsFromMemory(o);
  S.exercises.push(o); closeModal(); render();
}

function createAndAdd() {
  const el   = document.getElementById('new-ex-name');
  const name = (el?el.value:'').trim(); if(!name)return;
  const id   = uid();
  // mainMuscle/movementPattern default to 'undefined' here, same as the
  // hardcoded compound/regime just above — this quick-create path only
  // exposes Type (see setNewType()); a proper classification still needs a
  // follow-up Library edit, exactly like fixing a mis-tagged regime already
  // does today.
  D.exercises.push({ id, name, type:_newType, compound:true, regime:'weighted', mainMuscle:'undefined', movementPattern:'undefined', accessoryMuscles:[], updatedAt:Date.now() });
  if (S) { const o={exId:id,exName:name,type:_newType,compound:true,regime:'weighted',sets:[]}; o.sets=buildSetsFromMemory(o); S.exercises.push(o); }
  persist(); closeModal(); render();
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  19. SESSION ACTIONS
// ║
// ║  Manages the active session (S):
// ║    startPlan()    — loads a plan into S with memory-populated sets
// ║    startFree()    — blank session
// ║    saveSession()  — commits S to D.sessions, rebuilds memory, persists
// ║    editSess()     — loads a saved session back into S for editing
// ║    cancelSession()— discards S
// ║
// ║  Per-set mutations (addSet, rmSet, toggleIntent, setVal) are called
// ║  directly from oninput/onclick attributes in the exercise block HTML.
// ╚══════════════════════════════════════════════════════════════════════════════

function startPlan(id) {
  const p = D.plans.find(x=>x.id===id); if(!p)return;
  const gm = currentGym(); // gymName is a snapshot, same pattern as planName — history survives a gym deletion
  _restTimer = null;
  S = {
    planId: p.id, planName: p.name, date: today(),
    gymId: gm?.id || null, gymName: gm?.name || null,
    exercises: (p.exercises||[]).map(exId => {
      const ex = D.exercises.find(e=>e.id===exId);
      // '(removido)' — same label the Plans tab itself shows for a plan
      // entry whose exercise was deleted from the library, not a bare '?'.
      const o  = { exId, exName:ex?ex.name:'(removido)', type:ex?.type||'hypertrophy', compound:ex?.compound, regime:ex?.regime||'weighted', sets:[] };
      o.sets   = buildSetsFromMemory(o);
      return o;
    })
  };
  render();
}

function startFree()     { const gm=currentGym(); S={ planId:null, planName:null, date:today(), gymId:gm?.id||null, gymName:gm?.name||null, exercises:[] }; _restTimer=null; render(); }
function cancelSession() { S=null; _restTimer=null; render(); }

function saveSession() {
  if (!S||!S.exercises.length) return;
  // Strip the render-only _sug cache before persisting — it's a snapshot
  // of computeSuggestion() from whenever the exercise was added/refreshed
  // this session and must never be saved as if it were real data.
  // editSess() recomputes it fresh instead of ever trusting a persisted
  // copy (see its own comment) — this strip is defense in depth, so a
  // stale/wrong cached suggestion can never masquerade as history even if
  // some future code path forgets to refresh it.
  // Sets get the same treatment: persist only what a saved set MEANS —
  // intent, the numbers, and the explicit completed state. Everything else
  // on a live row (lastReps/lastKg/sugReps/sugKg = chip sources, phReps =
  // placeholder hint, repsEdited/kgEdited = dim-state flags) is render-time
  // scaffolding: meaningless as history (a stored "suggestion" says nothing
  // later), a source of stale chips when re-editing old sessions, and pure
  // bloat multiplied across every set in every backup and Gist push
  // forever. Nothing is lost: editSess() force-sets the edited flags on
  // load anyway, and chips are rebuilt from live history, not saved data.
  // scrubSessionSetMetadata() (section 2) is this strip's cleanup twin for
  // sessions saved before it existed.
  const exercises = S.exercises.map(({_sug, ...ex}) => ({
    ...ex,
    sets: (ex.sets||[]).map(s => {
      const set = { intent: s.intent, reps: s.reps, kg: s.kg };
      // `completed` only when it was ever explicitly toggled — an absent
      // field means "legacy / never touched, counted by default" and that
      // three-state distinction (see isCountedWork()) must survive the save.
      if (s.completed !== undefined) set.completed = s.completed;
      return set;
    })
  }));
  const rec = { id:S._editId||uid(), date:S.date, planId:S.planId, planName:S.planName, gymId:S.gymId||null, gymName:S.gymName||null, exercises, updatedAt:Date.now() };
  if (S._editId) { const i=D.sessions.findIndex(s=>s.id===S._editId); if(i>=0)D.sessions[i]=rec; }
  else D.sessions.push(rec);
  persist(); S=null; _restTimer=null; TAB='history'; render();
}

function editSess(id) {
  const s = D.sessions.find(x=>x.id===id); if(!s)return;
  // repsEdited/kgEdited force to true here (never false, unlike a fresh
  // prefill from buildSetsFromMemory): this is real saved history, not a
  // suggestion the user hasn't looked at yet, so it should never render dim.
  S = { ...s, exercises:s.exercises.map(ex=>{
    // Recompute _sug fresh rather than trusting anything persisted on ex
    // (saveSession() strips it anyway, but this is the real fix): D.sessions
    // still has this exact session's own data in it until it's re-saved, so
    // computeSuggestion() here correctly reflects "is there OTHER history
    // for this exercise" — not a snapshot from whenever it was first added.
    // Deliberately does NOT call buildSetsFromMemory() (would rebuild
    // .sets from scratch, discarding the real logged data being edited).
    const profile = profileFor(ex.type, ex.regime||'weighted');
    return {
      ...ex,
      _sug: computeSuggestion(ex.exId, ex.type, ex.regime||'weighted', profile),
      sets: ex.sets.map(set=>({...set,repsEdited:true,kgEdited:true})),
    };
  }), _editId:s.id };
  TAB='log'; EXP=null; _restTimer=null; render();
}

function delSess(id)     { D.tombstones.sessions[id]=Date.now(); D.sessions=D.sessions.filter(s=>s.id!==id); EXP=null; persist(); render(); }
function toggleExp(id)   { EXP=EXP===id?null:id; render(); }

// Per-set mutations — called from inline event handlers in buildExBlock()
function addSet(i)            { S.exercises[i].sets.push({intent:'work',reps:'',kg:'',lastReps:null,lastKg:null,sugReps:null,sugKg:null}); render(); }
function rmSet(i,j)           { S.exercises[i].sets.splice(j,1); render(); }
function toggleIntent(i,j)    { const s=S.exercises[i].sets[j]; s.intent=s.intent==='work'?'warmup':'work'; render(); }

// A first-ever log of an exercise has no suggested weight to scale warm-ups
// off (buildSetsFromMemory()'s "no history" branch returns work rows only)
// — so buildExBlock() shows an inline prompt asking the user to estimate
// what they expect to work with instead, and this generates warm-ups off
// that estimate via the same ramp a returning exercise would get
// (buildWarmupSets()). Wired via onchange, not oninput — commits once the
// field is left rather than re-rendering (and blowing away its own focus)
// on every keystroke, same reasoning as the date input in
// buildLogSession(). New warm-ups are prepended ahead of the existing work
// rows; once they exist, buildExBlock()'s prompt condition is false and it
// stops rendering on its own — no extra flag needed. Deleting them all
// (via each row's own × button) brings the prompt back for another guess.
function estimateWarmups(i, v) {
  const kg = parseFloat(v);
  // Reject only a genuinely invalid/blank entry — NOT 0. A typed "0" is a
  // real, legitimate estimate (e.g. "I expect to need zero assistance"),
  // and rejecting it here would silently contradict the hasKg philosophy
  // applied everywhere else in this file.
  if (Number.isNaN(kg) || kg < 0) return;
  const ex = S.exercises[i];
  ex.sets = [...buildWarmupSets(ex.regime||'weighted', ex.compound!==false, kg), ...ex.sets];
  render();
}

// Deliberately does NOT call render() — this fires on every keystroke, and a
// full re-render would blow away the input's focus/cursor position mid-type.
// Instead it flips the field straight from "carried over" (dim) to
// "confirmed today" (normal) via a direct style tweak on the element itself,
// same pattern used elsewhere in the file (exF(), setNewType(), etc.) for
// in-place UI updates that shouldn't trigger a full rebuild.
function setVal(i,j,f,v) {
  const s = S.exercises[i].sets[j];
  // Parse first, then check for a genuinely invalid/empty result — NOT
  // `parseInt(v)||''`, which silently blanks a real, intentionally-typed
  // "0" (0 is falsy, indistinguishable from a failed parse under ||).
  const n = f==='reps' ? parseInt(v) : parseFloat(v);
  s[f] = Number.isNaN(n) ? '' : n;
  s[f==='reps' ? 'repsEdited' : 'kgEdited'] = true;
  const el = document.getElementById(`s-${f}-${i}-${j}`);
  if (el) el.style.color = TX;
}

// Quick-fill from a chip tap — "last" repeats last session's actual values,
// "sug" applies today's suggested target. Both fields fill together (a
// suggestion is a reps+weight pair, not independent numbers) and the row is
// marked edited exactly like manual typing. Button-triggered, not a
// keystroke, so a full render() is fine here (no focus to preserve).
function applyChip(i, j, which) {
  const s = S.exercises[i].sets[j];
  if (which === 'last') { s.reps = s.lastReps; s.kg = s.lastKg; }
  else                  { s.reps = s.sugReps;  s.kg = s.sugKg;  }
  s.repsEdited = true; s.kgEdited = true;
  render();
}

// ── Rest timer ────────────────────────────────────────────────────────────────
//
// Checking a set's ✓ starts a rest countdown sized by the TRANSITION being
// rested through, not a single flat value — the owner's real scheme, now the
// shipped default ("Recomendado"):
//   hypertrophy: WU→WU 1:00 · WU→W 3:00 · W→W 3:00
//   strength:    WU→WU 1:00 · WU→W 3:00 · W→W 5:00 ("at least 5" — the +1min
//                button covers the "at least" part)
// The transition is read from the checked set's intent and the NEXT row's
// intent in the same block (past the end = treat as work: resting after a
// block's last set is still real rest — the next exercise needs setting up).
// Presets below are starting points; every number is editable in the ⏱
// settings modal and persists per-device (see _timerCfg in section 3).

const TIMER_PRESETS = {
  recomendado: { label: 'Recomendado', hypertrophy: { wuwu: 60, wuw: 180, ww: 180 }, strength: { wuwu: 60, wuw: 180, ww: 300 } },
  rapido:      { label: 'Rápido',      hypertrophy: { wuwu: 45, wuw: 90,  ww: 120 }, strength: { wuwu: 60, wuw: 120, ww: 180 } },
  pesado:      { label: 'Pesado',      hypertrophy: { wuwu: 90, wuw: 180, ww: 240 }, strength: { wuwu: 90, wuw: 300, ww: 300 } },
};

function timerCfg() {
  if (_timerCfg) return _timerCfg;
  try {
    const raw = LS.get('gym:timers');
    if (raw) {
      const p = JSON.parse(raw);
      if (p?.hypertrophy?.ww && p?.strength?.ww) { _timerCfg = p; return _timerCfg; }
    }
  } catch(e) {}
  _timerCfg = JSON.parse(JSON.stringify({ preset: 'recomendado', ...TIMER_PRESETS.recomendado })); // deep copy — custom edits must never mutate the preset table
  return _timerCfg;
}

function restDurationFor(type, fromIntent, toIntent) {
  const cfg = timerCfg()[type === 'strength' ? 'strength' : 'hypertrophy'];
  if (fromIntent === 'warmup') return toIntent === 'warmup' ? cfg.wuwu : cfg.wuw;
  return cfg.ww; // work → anything rests like work→work (a manual W-before-WU reorder is the user's own exotic choice)
}

function startRestTimer(i, j) {
  const ex = S?.exercises[i]; if (!ex) return;
  const s  = ex.sets[j]; if (!s) return;
  const next = ex.sets[j + 1];
  const secs = restDurationFor(ex.type, s.intent, next ? next.intent : 'work');
  if (!secs || secs <= 0) return; // a zeroed-out custom value means "no timer for this transition"
  const isWU = s.intent === 'warmup' && next && next.intent === 'warmup';
  _restTimer = {
    endsAt: Date.now() + secs * 1000,
    total: secs,
    label: isWU ? 'descanso entre aquecimentos' : (s.intent === 'warmup' ? 'descanso antes da série de trabalho' : 'descanso entre séries'),
    done: false,
  };
  if (!_restTimerInterval) _restTimerInterval = setInterval(restTimerTick, 500);
}

// Interval tick — updates the countdown text IN PLACE (the setVal()
// philosophy: never a full render on a clock tick, it would blow away
// whatever the user is typing mid-set). Full renders rebuild the banner
// from _restTimer state anyway, so the two never disagree.
function restTimerTick() {
  if (!_restTimer) { clearInterval(_restTimerInterval); _restTimerInterval = null; return; }
  const remaining = Math.max(0, Math.ceil((_restTimer.endsAt - Date.now()) / 1000));
  const el = document.getElementById('rest-time');
  if (el) el.textContent = fmtRest(remaining);
  const bar = document.getElementById('rest-bar');
  if (bar) bar.style.width = `${Math.max(0, Math.min(100, 100 * remaining / _restTimer.total))}%`;
  if (remaining <= 0 && !_restTimer.done) {
    _restTimer.done = true;
    signalRestDone();
    render(); // one full render to flip the banner into its "done" look — safe: nothing is mid-type right as a rest expires
  }
}

const fmtRest = secs => `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;

// Expiry signal — best-effort on every front, silent where unsupported:
// vibration is Android-browser territory (iOS has no navigator.vibrate),
// and the beep needs an AudioContext, which browsers only allow after a
// user gesture — the ✓ tap that started the timer was one, so creating the
// context lazily HERE (post-gesture in the same page session) works.
let _audioCtx = null;
function signalRestDone() {
  try { navigator.vibrate?.([200, 100, 200, 100, 400]); } catch(e) {}
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t0 => {
      const o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(_audioCtx.destination);
      g.gain.setValueAtTime(0.15, _audioCtx.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + t0 + 0.2);
      o.start(_audioCtx.currentTime + t0); o.stop(_audioCtx.currentTime + t0 + 0.22);
    });
  } catch(e) {}
}

function skipRestTimer() { _restTimer = null; render(); }
function extendRestTimer(secs) {
  if (!_restTimer) return;
  // Extending a finished rest restarts it from now — "+1:00 more" after the
  // beep means one more minute, not total-elapsed arithmetic.
  const base = _restTimer.done ? Date.now() : _restTimer.endsAt;
  _restTimer.endsAt = base + secs * 1000;
  _restTimer.total += secs;
  _restTimer.done = false;
  render();
}

// Sticky countdown banner, rendered inside the active session right under
// the tab bar. Rebuilt from state on every render; the interval only
// touches #rest-time/#rest-bar between renders.
function restTimerHTML() {
  if (!_restTimer) return '';
  const remaining = Math.max(0, Math.ceil((_restTimer.endsAt - Date.now()) / 1000));
  const done = _restTimer.done;
  const pct = done ? 0 : Math.max(0, Math.min(100, 100 * remaining / _restTimer.total));
  return `
  <div style="position:sticky;top:46px;z-index:45;background:${done ? '#0a2e24' : BG2};border:1px solid ${done ? '#1a4a3a' : BD};border-radius:10px;margin-bottom:12px;overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;padding:9px 12px">
      <span id="rest-time" style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:${done ? '#6fcf97' : TX}">${done ? 'Bora!' : fmtRest(remaining)}</span>
      <span style="flex:1;font-size:11px;color:${DM}">${done ? 'descanso concluído' : esc(_restTimer.label)}</span>
      ${done ? '' : Bs(BG3, TX, '+1:00', 'extendRestTimer(60)', ';padding:6px 10px;font-size:12px;flex-shrink:0')}
      <button onclick="openTimerSettings()" title="Configurar descansos" style="background:none;border:none;color:${DM};font-size:14px;cursor:pointer;padding:4px;flex-shrink:0">⚙</button>
      <button onclick="skipRestTimer()" style="background:none;border:none;color:${DM};font-size:20px;cursor:pointer;padding:2px 6px;line-height:1;flex-shrink:0">×</button>
    </div>
    <div id="rest-bar" style="height:3px;background:${CG};width:${pct}%;transition:width .4s linear"></div>
  </div>`;
}

// ── Timer settings modal — presets + fully custom values ─────────────────────

function openTimerSettings() {
  const cfg = timerCfg();
  const presetPill = (key, label) => `<button onclick="applyTimerPreset('${key}')" style="padding:6px 13px;border-radius:99px;border:none;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${cfg.preset === key ? CG : BG3};color:${cfg.preset === key ? TX : DM}">${label}</button>`;
  const num = (id, val) => `<input id="${id}" type="number" inputmode="numeric" min="0" step="5" value="${val}"
    style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:14px;padding:8px 6px;text-align:center;outline:none;box-sizing:border-box">`;
  const grid = (title, p, v) => `
    <div style="font-size:12px;font-weight:700;margin:12px 0 6px">${title}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div><div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">Aquec.→Aquec.</div>${num(p + '-wuwu', v.wuwu)}</div>
      <div><div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">Aquec.→Trab.</div>${num(p + '-wuw', v.wuw)}</div>
      <div><div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">Trab.→Trab.</div>${num(p + '-ww', v.ww)}</div>
    </div>`;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Descanso entre séries</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Segundos por transição — o timer dispara ao marcar ✓ numa série. Um valor 0 desliga o timer daquela transição. Ajustes valem neste aparelho.</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">${Object.entries(TIMER_PRESETS).map(([k, p]) => presetPill(k, p.label)).join('')}${presetPill('custom', 'Personalizado')}</div>
    ${grid('Hipertrofia', 'tm-h', cfg.hypertrophy)}
    ${grid('Força', 'tm-s', cfg.strength)}
    ${B(CG, TX, 'Salvar', 'saveTimerSettings()', ';margin-top:16px')}
    ${B(BG3, TX, 'Cancelar', 'closeModal()', ';margin-bottom:0')}`);
}

// Preset tap = fill the editable inputs with that preset's numbers (the
// user can still tweak before saving — tweaking just makes it custom).
function applyTimerPreset(key) {
  const p = TIMER_PRESETS[key];
  if (p) {
    [['tm-h', p.hypertrophy], ['tm-s', p.strength]].forEach(([prefix, v]) =>
      ['wuwu', 'wuw', 'ww'].forEach(k => { const el = document.getElementById(`${prefix}-${k}`); if (el) el.value = v[k]; }));
  }
  const cfg = timerCfg();
  cfg.preset = key;
  openTimerSettings.__pendingPreset = key; // remembered until Salvar actually persists
  // re-highlight pills without rebuilding the whole modal (inputs hold edits)
  document.querySelectorAll('#modal-ov button[onclick^="applyTimerPreset"]').forEach(b => {
    const active = b.getAttribute('onclick').includes(`'${key}'`);
    b.style.background = active ? CG : BG3;
    b.style.color = active ? TX : DM;
  });
}

function saveTimerSettings() {
  const read = (prefix) => {
    const v = {};
    ['wuwu', 'wuw', 'ww'].forEach(k => {
      const n = parseInt(document.getElementById(`${prefix}-${k}`)?.value, 10);
      v[k] = Number.isNaN(n) || n < 0 ? 0 : n;
    });
    return v;
  };
  const h = read('tm-h'), s = read('tm-s');
  const chosen = openTimerSettings.__pendingPreset || timerCfg().preset || 'custom';
  const matchesPreset = TIMER_PRESETS[chosen]
    && JSON.stringify(TIMER_PRESETS[chosen].hypertrophy) === JSON.stringify(h)
    && JSON.stringify(TIMER_PRESETS[chosen].strength) === JSON.stringify(s);
  _timerCfg = { preset: matchesPreset ? chosen : 'custom', hypertrophy: h, strength: s };
  LS.set('gym:timers', JSON.stringify(_timerCfg));
  openTimerSettings.__pendingPreset = null;
  closeModal();
  render();
}

// Marks a set (work OR warm-up) as actually performed. Separate from just
// having numbers in the fields, since those numbers might just be an
// autofilled/computed suggestion the user hasn't attempted yet — only
// completed work sets count toward future suggestions/warm-ups
// (getRecentWorkHistory) and volume (volEx). Checking the box also counts as
// confirming whatever's currently shown: if the user never touched the
// suggested reps/kg, checking "done" is itself an implicit "yes, that's what
// I did," so the fields flip from dim to normal same as typing would.
// One-directional on purpose — unchecking doesn't undo that confirmation.
// Checking (not unchecking) also starts the rest timer — see the Rest timer
// section above for the transition-based duration rules.
function toggleCompleted(i,j) {
  const s = S.exercises[i].sets[j];
  s.completed = !s.completed;
  if (s.completed) { s.repsEdited = true; s.kgEdited = true; startRestTimer(i, j); }
  render();
}

// Type/regime changes re-run auto-population from memory — DESTRUCTIVE by
// design: whatever the user already typed into this exercise's rows this
// session (reps/kg, completed checks, warm-ups from an estimate) is
// discarded and replaced wholesale, since there's no way to reconcile
// already-entered values against a different type/regime's rep range or
// warm-up rules. Intentional, not a bug to "fix" by trying to preserve the
// old values — a type/regime combo change (e.g. Carga → Assistido) usually
// means the numbers that were valid a moment ago don't mean the same thing
// anymore anyway.
function setExType(i,t)       { S.exercises[i].type=t;   S.exercises[i].sets=buildSetsFromMemory(S.exercises[i]); render(); }
function setExRegime(i,r)     { S.exercises[i].regime=r; S.exercises[i].sets=buildSetsFromMemory(S.exercises[i]); render(); }
function moveEx(i,dir)        { const j=i+dir; if(!S||j<0||j>=S.exercises.length)return; [S.exercises[i],S.exercises[j]]=[S.exercises[j],S.exercises[i]]; render(); }
function rmEx(i)              { S.exercises.splice(i,1); render(); }

// ── Swap exercise ─────────────────────────────────────────────────────────────
//
// Replaces a session exercise with an equivalent one, in place (same
// position). The everyday case is "machine occupied / not available at this
// gym" — so candidates are ranked by how equivalent they are for training
// purposes: same mainMuscle + same movementPattern first, then same
// mainMuscle, then everything else — this ranking is exactly what the
// muscle-classification system was built to enable. When the session has a
// gym context (S.gymId), unavailable-there exercises are filtered out of
// the suggestions entirely (an unavailable suggestion is noise, not help).
// An exercise with an Undefined main muscle can't be matched meaningfully,
// so everything lands in the "others" bucket — searchable, just unranked.
function swapCandidates(sessionEx, search) {
  const lib = D.exercises.find(e => e.id === sessionEx.exId);
  const muscle  = lib?.mainMuscle, pattern = lib?.movementPattern;
  const canRank = muscle && muscle !== 'undefined';
  const q = (search||'').toLowerCase();
  const tiers = { samePattern: [], sameMuscle: [], others: [] };
  D.exercises.forEach(e => {
    if (e.id === sessionEx.exId) return;                       // can't swap to itself
    if (S?.gymId && !availableAtGym(e, S.gymId)) return;       // unavailable here = not a suggestion
    if (q && !e.name.toLowerCase().includes(q)) return;
    if (canRank && e.mainMuscle === muscle && e.movementPattern === pattern && pattern !== 'other') tiers.samePattern.push(e);
    else if (canRank && e.mainMuscle === muscle) tiers.sameMuscle.push(e);
    else tiers.others.push(e);
  });
  return tiers;
}

function openSwapEx(i) {
  const ex = S.exercises[i]; if (!ex) return;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Trocar exercício</div>
    <div style="font-size:13px;color:${DM};margin-bottom:12px">Substituir <strong style="color:${TX}">${esc(ex.exName)}</strong>${S.gymName?` — mostrando apenas o que está disponível em ${esc(S.gymName)}`:''}</div>
    <input id="sw-search" type="text" placeholder="Buscar por nome..."
      style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 12px;outline:none;margin-bottom:10px;box-sizing:border-box">
    <div id="sw-list" style="max-height:300px;overflow-y:auto;margin-bottom:14px"></div>
    ${B(BG3,TX,'Cancelar','closeModal()',';margin-bottom:0')}`);
  const inp = document.getElementById('sw-search');
  if (inp) inp.addEventListener('input', function() { swRefreshList(i, this.value); });
  swRefreshList(i, '');
}

function swRefreshList(i, search) {
  const c = document.getElementById('sw-list'); if (!c) return;
  const ex = S.exercises[i];
  const tiers = swapCandidates(ex, search);
  const row = e => `
    <button onclick="doSwapEx(${i},'${e.id}')" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-family:inherit;cursor:pointer;margin-bottom:6px">
      <span style="flex:1;font-weight:500;font-size:13px;text-align:left">${esc(e.name)}</span>
      <div style="display:flex;gap:4px;flex-shrink:0">${e.type?typePill(e.type):''}${e.regime?regimePill(e.regime):''}${musclePill(e.mainMuscle,e.movementPattern)}</div>
    </button>`;
  const section = (lbl, list) => list.length
    ? `<div style="font-size:11px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin:8px 0 6px">${lbl}</div>${list.map(row).join('')}`
    : '';
  const html = section('Mesmo músculo e padrão', tiers.samePattern)
             + section('Mesmo músculo', tiers.sameMuscle)
             + section('Outros', tiers.others);
  c.innerHTML = html || `<div style="text-align:center;color:${DM};padding:16px 0;font-size:13px">Nenhum exercício encontrado.</div>`;
  c.scrollTop = 0;
}

// The swap is DESTRUCTIVE for the block being replaced, same reasoning as
// setExType/setExRegime: entered numbers were for the OLD exercise and
// can't be reinterpreted for a different one. The replacement starts fresh
// from its own library defaults + history-driven rows. A confirm guards the
// case where real numbers were already typed in.
function doSwapEx(i, newId) {
  const ne = D.exercises.find(e => e.id === newId); if (!ne || !S) return;
  const old = S.exercises[i];
  const hasData = (old.sets||[]).some(s => hasReps(s) || hasKg(s));
  if (hasData && !confirm(`Substituir "${old.exName}" por "${ne.name}"?\n\nAs séries já preenchidas serão descartadas.`)) return;
  const o = { exId: ne.id, exName: ne.name, type: ne.type||'hypertrophy', compound: ne.compound, regime: ne.regime||'weighted', sets: [] };
  o.sets = buildSetsFromMemory(o);
  S.exercises[i] = o;
  closeModal();
  render();
}

      <div id="sb-login-msg" style="font-size:12px;color:${DM};margin-bottom:8px;display:none"></div>
      ${Bs(CG,TX,'Enviar código de acesso','sbSendLink()',';width:100%;justify-content:center;padding:10px')}
      <div id="sb-otp-row" style="display:none;margin-top:10px">
        <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">Código do e-mail</label>
        <div style="display:flex;gap:8px">
          <input id="sb-otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456"
            style="flex:1;background:${BG2};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:16px;letter-spacing:.15em;padding:9px 12px;outline:none;min-width:0;box-sizing:border-box">
          ${Bs(CG,TX,'Entrar','sbVerifyCode()',';flex-shrink:0;padding:9px 16px')}

      <div style="font-size:11px;color:${DM};margin-top:8px;line-height:1.5">Sem senha: o e-mail traz um <strong>código</strong> para digitar aqui (funciona em qualquer aparelho) e um link direto. No iPhone, use o código — o link abre no navegador, fora do app instalado. Contas novas são criadas por convite.</div>`;

  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:6px">Backup & Sync</div>

    <!-- Account (Supabase) -->
    <div style="background:${BG3};border:1px solid ${BD};border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px">Conta</div>
      ${accountBlock}
    </div>

    ${showGistCard ? `
    <!-- GitHub Gist (legacy driver) -->
    <div style="background:${BG3};border:1px solid ${BD};border-radius:10px;padding:14px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:700;margin-bottom:4px">GitHub Gist Sync <span style="font-weight:400;color:${DM}">(legado${drv==='gist'?' · ativo':''})</span></div>
      <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">Personal Access Token</label>
      <input id="gh-token" type="password" placeholder="ghp_xxxxxxxxxxxx" value="${esc(CFG.token)}"
        style="background:${BG2};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
      <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">Gist ID <span style="font-weight:400">(deixe em branco para criar novo)</span></label>
      <input id="gh-gist" type="text" placeholder="Preenchido automaticamente" value="${esc(CFG.gistId)}"
        style="background:${BG2};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 12px;width:100%;outline:none;margin-bottom:10px;box-sizing:border-box">
      <div style="display:flex;gap:8px">
        ${Bs(CG,TX,'Salvar e sincronizar','saveGithubConfig()',';flex:1;justify-content:center;padding:10px')}

// Sends the magic-link email from the Backup modal's account block and
// narrates the outcome inline. Errors here are usually MEANINGFUL, not
// technical: with public sign-ups disabled server-side, an uninvited
// address is refused right here — that's the invite-only policy speaking.
async function sbSendLink() {
  const el  = document.getElementById('sb-email');
  const msg = document.getElementById('sb-login-msg');
  const email = (el ? el.value : '').trim();
  if (!email || !msg) return;
  msg.style.display = 'block'; msg.style.color = DM; msg.textContent = 'Enviando…';
  const { error } = await sbSignIn(email);
  msg.style.color   = error ? '#e57373' : '#6fcf97';
  msg.textContent   = error
    ? 'Não foi possível enviar: ' + (error.message || 'erro desconhecido')
    : 'Enviado! Digite o código do e-mail abaixo — ou toque no link do e-mail neste aparelho.';
  // Reveal the code entry only once there's actually a code in flight.
  if (!error) { const row = document.getElementById('sb-otp-row'); if (row) row.style.display = 'block'; }
}

// The code path exists because of a real platform trap: on iOS, tapping the
// emailed magic LINK opens Safari — a different storage context from the
// installed home-screen PWA — so the session lands outside the app and the
// PWA stays logged out. Typing the 6-digit code INSIDE the app creates the
// session in the right context on every platform. (The email template must
// include {{ .Token }} for the code to appear — dashboard configuration,
// documented in the project vault.) type:'email' is the OTP flavor for
// magic-link/OTP sign-ins, as opposed to e.g. recovery or invite flows.
async function sbVerifyCode() {
  const email = (document.getElementById('sb-email')?.value || '').trim();
  const token = (document.getElementById('sb-otp')?.value || '').trim();
  const msg   = document.getElementById('sb-login-msg');
  if (!email || !token || !sb || !msg) return;
  msg.style.display = 'block'; msg.style.color = DM; msg.textContent = 'Verificando…';
  try {
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    if (error) {
      msg.style.color = '#e57373';
      msg.textContent = 'Código inválido ou expirado — confira ou peça um novo.';
      return;
    }
    // Success → SIGNED_IN fires and (on the supabase driver) auto-connects;
    // just get the modal out of the way and let the sync state show itself.
    closeModal();
    render();
  } catch(e) {
    msg.style.color = '#e57373';
    msg.textContent = 'Erro ao verificar o código.';
  }
}

async function saveGithubConfig() {
  CFG.token  = (document.getElementById('gh-token')?.value||'').trim();
  CFG.gistId = (document.getElementById('gh-gist')?.value||'').trim();
  // Saving a Gist config is an explicit choice OF the gist driver — without
  // this, a device that had flipped to supabase and then re-saved its token
  // would keep pushing to supabase while looking like it configured Gist.
  if (CFG.token) CFG.driver = 'gist';
  await saveConfig();
  closeModal();
  if (!CFG.token) return;
  if (CFG.gistId) {
    // An EXISTING Gist ID was entered (the typical second-device / new-
    // phone setup) — pull-and-merge BEFORE the first push. Pushing first
    // would overwrite the whole Gist with this device's local state, which
    // on a fresh install is four empty collections: the entire remote
    // history wiped at HEAD, in exactly the "new phone, get my data back"
    // scenario this button exists for. The union+LWW merge makes the pull
    // side safe by construction; only push once the pull genuinely
    // succeeded — a failed fetch must NOT fall through to a blind
    // overwrite of remote state we couldn't read.
    const ok = await remotePull();
    if (ok) await remoteSave();
  } else {
    // No Gist ID yet → there's no remote state to protect; pushing is what
    // CREATES the Gist (gistWriteFiles' POST path stores the new id).
    setSyncStatus('syncing');
    await remoteSave();
  }
  render();
}

function copyBackup() {
  const ta=document.getElementById('exp-area'), btn=document.getElementById('copy-btn');
  if(!ta)return; ta.select();
  try { document.execCommand('copy'); if(btn){btn.textContent='✓ Copiado!'; setTimeout(()=>{if(btn)btn.textContent='Copiar JSON';},2000);} } catch(e){}
}
function downloadBackup(fn) {
  const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=fn;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
// Applies an imported backup object (same shape as D, see downloadBackup()/
// the export textarea above — both are just JSON.stringify(D)) onto live
// state. Mirrors the local-cache assignment in loadData() (section 5) so the
// two code paths that hydrate D from a plain object stay consistent.
// Deliberately does NOT touch CFG — token/gistId are never part of a backup.
function applyData(p) {
  D.exercises    = p.exercises    || [];
  D.plans        = p.plans        || [];
  D.sessions     = p.sessions     || [];
  D.weights      = p.weights      || [];
  D.gyms         = p.gyms         || []; // absent in pre-gyms backups — valid, just empty
  // Older backups (pre-tombstones) won't have this field — default to
  // empty rather than leaving D.tombstones as whatever it was before the
  // import, so a restore is a genuine clean replacement.
  D.tombstones   = p.tombstones   || { exercises:{}, plans:{}, sessions:{}, weights:{}, gyms:{} };
  // Same normalization loadData() does — a backup from the tombstones era
  // but before gyms has the object without a gyms key.
  if (!D.tombstones.gyms) D.tombstones.gyms = {};
  D.lastModified = p.lastModified || 0;
  // An older backup predates muscle-group classification entirely — same
  // backfill loadData() runs on its own local-cache load.
  backfillExerciseClassification();
  // And the same for set scaffolding in sessions saved before the
  // saveSession() metadata strip — see scrubSessionSetMetadata() (section 2).
  scrubSessionSetMetadata();
}

function importBackup() {
  const ta=document.getElementById('imp-area'), err=document.getElementById('imp-err');
  const json=(ta?ta.value:'').trim(); if(!json)return;
  try {
    const p=JSON.parse(json);
    if(!Array.isArray(p.exercises)||!Array.isArray(p.plans)||!Array.isArray(p.sessions)||!Array.isArray(p.weights)) throw new Error();
    // Same pre-replacement safety copy a snapshot restore takes — a wrong
    // import is undoable from the "antes da última restauração" slot.
    stashPreRestore();
    applyData(p); persist(); closeModal(); render();
  } catch(e) { if(err)err.style.display='block'; }
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  21. PWA — Progressive Web App
// ║
// ║  Registers the service worker (sw.js) which enables:
// ║    · Offline use (cached assets)
// ║    · "Add to Home Screen" on iOS/Android as a proper app icon
// ║
// ║  Requires manifest.json and sw.js alongside index.html in the repo.
// ╚══════════════════════════════════════════════════════════════════════════════

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  22. INIT — entry point
// ║
// ║  loadData() kicks off the full load sequence (see section 5):
// ║    1. Load config (driver, token, gistId) from localStorage / window.storage
// ║    2. Load local data → render immediately
// ║    3. Restore login session, fetch remote (active driver) in background
// ║       → merge → re-render
// ╚══════════════════════════════════════════════════════════════════════════════

// Ask the browser to mark this origin's storage persistent — best-effort,
// fire-and-forget (Chrome grants it silently for installed PWAs, other
// browsers may ignore it). Without it, localStorage and the SW cache are
// "best effort" storage that an OS-level storage crunch — or weeks of
// disuse on iOS — is allowed to evict wholesale; with it, eviction needs
// explicit user action. The Gist copy is the backstop either way, but
// local data shouldn't be one cache-pressure event away from a restore.
try { navigator.storage?.persist?.(); } catch(e) {}

loadData();

</script>
