// ║  1. DESIGN TOKENS
// ║  Colors and constants used throughout the UI.
// ║  Change a color here and it updates everywhere.
// ╚══════════════════════════════════════════════════════════════════════════════

const COLOR = {

  blue:   '#185FA5',  // weighted regime, hypertrophy

// ╔══════════════════════════════════════════════════════════════════════════════
// ║  2. EXERCISE LIBRARY SEED
// ║
// ║  The starter exercise library used to live here as a hardcoded array.
// ║  It now lives in library.json (same origin as this file, fetched with a
// ║  plain relative fetch() — no CORS/auth needed) so it can be edited
// ║  without touching app code.
// ║
// ║  seedStarterLibrary() is called from loadData() ONLY when D.exercises is
// ║  completely empty — i.e. a genuinely fresh install. It is deliberately
// ║  NOT an ongoing sync: once seeded, entries are indistinguishable from
// ║  anything the user adds themselves (same array, same CRUD functions), so
// ║  deleting a seeded exercise deletes it for good — it will not silently
// ║  reappear because library.json still has it. The SHARED library now
// ║  exists server-side as the global_exercises catalog (same 44 entries,
// ║  same slug ids — see supabase/02-sharing.sql): connected users pull new
// ║  the curated catalog arrives automatically (syncGlobalLibrary,
// ║  section 13), which honors deletions via the tombstone check. The
// ║  in-app suggestion-and-approval workflow remains deferred to M3;
// ║  catalog curation is dashboard-only until then.
// ╚══════════════════════════════════════════════════════════════════════════════

// Set on a failed seed fetch so buildLibrary() can offer a retry — the only
// case this matters is a fresh install with zero exercises AND no network
// (so the service-worker cache, populated by a previous successful load,
// isn't there yet either).
let _libSeedError = false;

async function seedStarterLibrary() {
  try {
    // cache:'no-store' is load-bearing, not defensive. A plain fetch() here
    // is answered by the service worker's cache (and the HTTP cache), so a
    // device that had ever loaded an older library.json would re-seed the
    // OLD library — including right after a factory reset, which is exactly
    // when the point is to land on the CURRENT one. Caught in testing: a
    // wiped install re-seeded 44 exercises from cache while the file on the
    // server already had 48. Offline first-run still degrades correctly:
    // the fetch simply fails and the retry banner appears.
    const r = await fetch('library.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('fetch failed: ' + r.status);
    const data = await r.json();
    // Everything in library.json IS the curated catalog, by definition —
    // stamped here rather than shipped in the file so the generator's
    // schema stays about the exercise, not about how it was delivered.
    // `updatedAt: 0` is load-bearing, see CATALOG_BASELINE_AT.
    D.exercises = (data.exercises || []).map(e => ({...e, origin: ORIGIN_GLOBAL, updatedAt: CATALOG_BASELINE_AT}));
    // library.json ships fully classified, so this is normally a no-op —
    // but calling it here too (not just from loadData()/mergeRemote()/
    // applyData()) means a future entry added to library.json without the
    // new fields still degrades safely instead of relying entirely on the
    // seed file always being complete.
    backfillExerciseClassification(); backfillPlanEntries(); normalizeExerciseOrigin();
    _libSeedError = false;
    await persist();
  } catch(e) {
    _libSeedError = true;
  }
  render();
}

//

// JS value — but 'undefined' is itself a valid MUSCLE_GROUPS key, so a user
// who doesn't know how to classify something yet always has a real, saveable
// option instead of a blocked save. Movement patterns are scoped PER main
// muscle group (MOVEMENT_PATTERNS[mainMuscle]), not a single global list —
// this is deliberate: "leg curl" and "bicep curl" are different enough
// exercises that collapsing them onto one shared "curl" pattern would make

// Idempotent — safe to call on every load. Fills mainMuscle/movementPattern/
// accessoryMuscles ONLY on exercises that don't have them yet (a falsy
// ex.mainMuscle means "never classified," including truly missing from an
// old backup/sync — the literal string 'undefined' is a real, already-made
// classification choice and is left alone). Called from loadData() (local
// cache + after a remote merge) and applyData() (backup restore) — anywhere
// D.exercises can be hydrated from a source that predates this feature.
function backfillExerciseClassification() {
  D.exercises.forEach(ex => {
    const seed = SEED_CLASSIFICATION[ex.id];
    // Movement backfill runs INDEPENDENTLY of the muscle/pattern one below:
    // every already-classified install still lacks `movement` the first time
    // the movement layer loads on it, so gating this behind the mainMuscle
    // check would mean it never runs anywhere real. Same no-updatedAt-bump
    // rule as the set scrub: a backfill isn't a user edit, and inflated
    // recency would beat genuine remote edits in the per-item LWW merge.
    if (!ex.movement && seed && seed[3]) ex.movement = seed[3];
    if (ex.mainMuscle) return;
    ex.mainMuscle       = seed ? seed[0] : 'undefined';
    ex.movementPattern  = seed ? seed[1] : 'undefined';
    ex.accessoryMuscles = seed ? [...seed[2]] : [];
  });
}

// ── Exercise provenance (schema 6) ───────────────────────────────────────────
//
// Every exercise says where it came from. The three tiers are deliberately
// ONE SHAPE: an exercise is an exercise, and `origin` is the only field that
// differs between them. Any field added or removed later applies to all
// three alike — there is no global-only field and no user-only field (a user
// may write their own cues; a catalog entry may lack them). That rule is
// what keeps the planned ADOPTION flow — moving a user's own exercise onto
// an official one that ships later, without losing their history — a plain
// reference repoint (mergeExercises, section 13) instead of a shape
// migration.
//
// Stored, never derived. Deriving "is it global?" from library.json
// membership breaks three ways: it can't tell `user` from `shared` at all,
// it degrades offline, and it silently reclassifies a user's own exercise
// the day the catalog happens to ship the same lift.
// Set MEASUREMENT (see the full rationale beside fmtSecs in section 4):
// 'time' means this exercise is counted in SECONDS rather than reps.
// Declared here, with the other record-shape vocabulary, because the
// exercise-modal state below initialises from TRACK_REPS -- keeping these
// further down put that initialiser in their temporal dead zone.
const TRACK_TIME = 'time', TRACK_REPS = 'reps';
const trackingOf = ex => (ex && ex.tracking === TRACK_TIME) ? TRACK_TIME : TRACK_REPS;
const isTimed    = ex => trackingOf(ex) === TRACK_TIME;

// ── Supersets (E3b) ──────────────────────────────────────────────────────────
//
// A superset is a VIEW over N ordinary exercise entries, never a new kind of
// entry. Every member keeps its own `sets` array exactly as an ungrouped
// exercise does, so nothing downstream learns a new shape: history,
// computeSuggestion, graduation, volEx, weeklyMuscleVolume, exerciseProgress,
// machine attach and the plate modes all read a grouped member exactly as
// they read a lone one. That is the direct consequence of the owner's framing
// (2026-08-03): "the superset is mostly a visual tool ... which will track
// exercises individually for progress". Same move as bw-plus not being isBW
// and as timed sets living in s.reps -- pick the representation that leaves
// every consumer unchanged.
//
// Two fields on the ENTRY (session block or plan entry), both optional:
//   ss   -- group id; absent means ungrouped, which is every exercise today
//   ssWu -- this member's LEADING warm-ups ride the rounds instead of being
//           done solo beforehand (default absent = grouped warm-ups, the
//           owner's stated default)
// The group's own config (member order, rests, per-round deviations) lives in
// a `groups` map on the session record / plan -- see sanitizeGroups().
const isGrouped = ex => !!(ex && ex.ss);

// Which of a member's sets take part in the interleaved ROUNDS: everything
// from its first work set onward. Anything before that -- its leading
// warm-ups -- is done solo, in the pre-round section, unless ssWu says
// otherwise.
//
// Deliberately positional rather than "sets whose intent is work", and the
// difference is not cosmetic. Under the intent test, tapping W/WU on a row
// inside a round would EJECT that set from the round and teleport it up into
// the warm-up section -- which reads as the app losing a set. Positional
// keeps every intent toggle exactly where the user pressed it, while still
// routing genuinely leading warm-ups out of the rounds. It is also fully
// derived: no stored index that a later-inserted warm-up could invalidate.
//
// Mixed intent WITHIN a round is the point, not an edge case (owner: "if the
// user wants ... one or more of the exercises to be still a WU while another
// or more of the exercises are in W regimes, it should be possible"). Because
// intent stays a per-set property, member A can sit on a warm-up while member
// B works the same round with nothing extra to represent it.
// A member with NO work sets at all participates in FULL. The solo section
// exists to hold warm-ups that come BEFORE the work; with no work there is
// nothing for them to precede, so they are simply that member's sets. Found
// by a live probe: flipping a one-set member's only row to WU dropped it out
// of the round entirely, which is the opposite of the requirement this rule
// exists to serve (a member warming up while a partner works).
function roundSetIdxs(ex) {
  const sets = (ex && ex.sets) || [];
  if (ex && ex.ssWu) return sets.map((_, j) => j);
  const first = sets.findIndex(s => s.intent === 'work');
  return first === -1 ? sets.map((_, j) => j) : sets.map((_, j) => j).slice(first);
}

// The leading warm-ups roundSetIdxs() left out -- rendered per-member in the
// pre-round section. Empty whenever ssWu is set, and empty when the member
// has no work sets at all (see above): in both cases nothing is solo.
function soloSetIdxs(ex) {
  const sets = (ex && ex.sets) || [];
  if (ex && ex.ssWu) return [];
  const first = sets.findIndex(s => s.intent === 'work');
  return first === -1 ? [] : sets.map((_, j) => j).slice(0, first);
}

// How many rounds a group has: the MAX participating-set count across its
// members, so unequal set counts need no special case at all -- a member with
// three work sets against a partner's four simply does not appear in round 4
// (owner: "unequal set counts are fine, history will add up the work that was
// done"). A member is passed in as its entry object, not an index.
const roundCountFor = members => members.reduce((n, ex) => Math.max(n, roundSetIdxs(ex).length), 0);

// ── The curated library is delivered, not opted into ─────────────────────────
//
// `library.json` is the catalog. It is served as a static file alongside the
// app, so **keeping the library current requires no account** — logging in
// buys remote backup and sharing, nothing else. That is a deliberate product
// rule (owner, 2026-08-02): someone who only wants to train and export their
// own data should never be locked out of the exercise library.
//
// syncGlobalLibrary() adds catalog entries this install doesn't have yet, on
// every load. It only ever ADDS:
//   * updating existing entries stays behind ⟳ Nomes, because that overwrites
//     fields the user may have edited and so needs a confirm listing them;
//   * re-adding something the user DELETED stays behind the restore dialog,
//     because undoing a deliberate deletion is the user's call.
// Adding an exercise they simply don't have yet destroys nothing, which is
// what makes it safe to do silently.
//
// `updatedAt: 0` on catalog-delivered rows is load-bearing, not laziness.
// mergeCollection() drops a tombstone when the item is NEWER than the delete
// ("edited after the delete, so the tombstone is stale"). If a delivered row
// carried Date.now(), a device that hadn't yet received a deletion would
// re-add that exercise with a fresher stamp, the merge would throw the
// tombstone away as stale, and the user's deletion would silently undo
// itself across devices. At 0, any real user action — edit, delete, anything
// — outranks the catalog baseline, which is exactly the intended precedence.
// Same reasoning as the backfills' no-bump rule: this is not a user edit.
const CATALOG_BASELINE_AT = 0;

const ORIGIN_GLOBAL = 'global';   // curated catalog: library.json (auto-synced) or the restore dialog
const ORIGIN_USER   = 'user';     // created here, by this user
const ORIGIN_SHARED = 'shared';   // arrived inside someone else's shared plan
const ORIGINS = [ORIGIN_GLOBAL, ORIGIN_USER, ORIGIN_SHARED];

// The offline authority for "this id belongs to the curated catalog".
// SEED_CLASSIFICATION is baked into this file, so the answer is synchronous
// and works with no network — which matters because plan import must decide
// an origin even on a plane. Its blind spot is honest and one-directional:
// a catalog entry published AFTER this build shipped isn't in the table, so
// a shared plan carrying it lands `shared` rather than `global`. That errs
// toward NOT claiming official status we can't verify, and the adoption
// flow is exactly the thing that later corrects it.
const isKnownGlobalId = id => typeof id === 'string' && !!SEED_CLASSIFICATION[id];

// Display/logic accessor with a derived fallback. The fallback is a repair
// path for malformed data, NOT the mechanism: after schema 6 every exercise
// is stamped at the point it enters, and normalizeExerciseOrigin() below
// keeps it that way. Reading through this helper means a stray origin-less
// record renders as something sane instead of "undefined".
const originOf = ex => (ex && ORIGINS.includes(ex.origin)) ? ex.origin
  : (ex && isKnownGlobalId(ex.id) ? ORIGIN_GLOBAL : ORIGIN_USER);
const isGlobalEx = ex => originOf(ex) === ORIGIN_GLOBAL;

// Belt and braces for one narrow race. The schema guard freezes a v5 device
// the moment it READS v6 data — but a v5 device that pushes before it ever
// reads can land origin-less exercises in the merge. This stamps them on
// arrival, using the same derived rule as originOf(). No updatedAt bump:
// same rule as every other backfill — normalization is not a user edit and
// must never outrank a genuine remote change in the per-item LWW merge.
function normalizeExerciseOrigin() {
  D.exercises.forEach(ex => { if (!ORIGINS.includes(ex.origin)) ex.origin = originOf(ex); });
}

// Adds catalog entries this install is missing. Returns how many landed.
// Pure and synchronous so it can be unit-tested without a network; the fetch
// lives in refreshGlobalLibrary() below.
//
// Two things it deliberately does NOT do: touch an exercise that already
// exists (that is ⟳ Nomes' job, with its confirm), and resurrect a
// tombstoned id (that is the restore dialog's job). See CATALOG_BASELINE_AT
// for why the rows land at updatedAt 0.
function syncGlobalLibrary(catalog) {
  const have = new Set(D.exercises.map(e => e.id));
  let added = 0;
  (catalog || []).forEach(e => {
    if (!e || typeof e.id !== 'string' || typeof e.name !== 'string') return;
    if (have.has(e.id)) return;
    if (e.id in (D.tombstones.exercises || {})) return;   // deleted on purpose — stays gone
    D.exercises.push({ ...e, origin: ORIGIN_GLOBAL, updatedAt: CATALOG_BASELINE_AT });
    have.add(e.id);
    added++;
  });
  return added;
}

// The delivery half: fetch the catalog and apply it. `cache:'no-store'` for
// the same reason seedStarterLibrary() uses it — the service worker will
// otherwise answer with a stale library.json and the app would keep
// "syncing" to an old catalog forever. Failure is silent by design: offline
// simply means no new exercises this load, never an error the user must
// dismiss mid-workout.
async function refreshGlobalLibrary() {
  try {
    const r = await fetch('library.json', { cache: 'no-store' });
    if (!r.ok) return 0;
    const data = await r.json();
    const added = syncGlobalLibrary(data.exercises || []);
    if (added) { persist(); render(); }
    return added;
  } catch (e) { return 0; }
}

// Catalog entries the user deliberately deleted — the restore dialog's list.
// Kept as a function rather than cached state so it always reflects the
// current tombstones, including ones that just arrived via a merge.
function deletedCatalogEntries(catalog) {
  return (catalog || []).filter(e => e && e.id && (e.id in (D.tombstones.exercises || {})));
}

// ── Plan-entry backfill (E3, schema 5) ───────────────────────────────────────
//
// Upgrades legacy plans ('bench-press' strings in plan.exercises) to entry
// objects { eid, exId } in place, re-keying plan.rests from exId to the
// minted entry's eid — rests can't key by exId anymore because a slot
// entry has no exId until session time. A legacy exId duplicated within
// one plan (possible via doSaveSession('update')'s duplicates-preserved
// path) copies its rest onto EACH minted entry, preserving the old
// shared-timing behavior. Runs on every hydration path (loadData local
// cache, mergeRemote, applyData restore) because a schema-4 device can
// keep winning per-item LWW with string-array plan copies until it
// reloads — each arrival is simply re-normalized. Re-minted eids across
// devices are tolerable BY DESIGN: eids are plan-internal (only
// plan.rests references them, re-keyed here in the same pass; sessions
// reference exercises by exId and movements by slug, never by eid), and
// plans merge whole-item, never per-entry. Same no-updatedAt-bump rule as
// every backfill: normalization isn't a user edit and must never outrank
// one in the merge.
function backfillPlanEntries() {
  D.plans.forEach(p => {
    const list = p.exercises || [];
    if (!list.some(e => typeof e === 'string' || !e.eid)) return;
    const rests = p.rests || {};
    const newRests = {};
    p.exercises = list.map(e => {
      if (typeof e !== 'string') {
        if (!e.eid) e.eid = uid(); // defensive: an entry object should always carry one
        if (rests[e.eid]) newRests[e.eid] = rests[e.eid];
        return e;
      }
      const entry = { eid: uid(), exId: e };
      if (rests[e]) newRests[entry.eid] = rests[e];
      return entry;
    });
    p.rests = newRests;
  });
}

// ── Saved-session set scrub ───────────────────────────────────────────────────
//
// Cleanup twin of saveSession()'s metadata strip (section 19): sessions
// saved before that strip existed carry render-time scaffolding on every
// set (chip sources, dim-state flags, placeholder hints) that means nothing
// as history and bloats every backup, localStorage write, and Gist push
// forever. A BLOCKLIST of known-scaffolding keys, not an allowlist rebuild,
// so any genuinely-new set field added in the future survives untouched.
// Deliberately does NOT bump updatedAt — this isn't a user edit, and
// inflating recency would let a merely-scrubbed copy beat a genuine remote
// edit under mergeCollection()'s per-item LWW. Idempotent and cheap, so it
// runs on every path that hydrates D.sessions (loadData local cache,
// mergeRemote, applyData backup restore) — the exact same pattern
// backfillExerciseClassification() above uses, for the same reason.
const SET_SCAFFOLDING_KEYS = ['lastReps','lastKg','sugReps','sugKg','phReps','repsEdited','kgEdited'];
function scrubSessionSetMetadata() {
  D.sessions.forEach(sess => (sess.exercises||[]).forEach(ex => (ex.sets||[]).forEach(s => {
    SET_SCAFFOLDING_KEYS.forEach(k => { if (k in s) delete s[k]; });
  })));
}

// ║  3. APPLICATION STATE
// ║  All mutable state lives here. Nothing outside this section should
// ║  hold data that needs to survive a re-render.
// ║
// ║  D  = persisted data (saved to localStorage + Gist)

// ║  CFG = sync configuration (token, gistId — never exported with data)

// Persisted data — written to storage on every mutation
let D = {
  exercises:    [],  // library entries: { id, name, type, compound, regime,
                      // mainMuscle, movementPattern, accessoryMuscles, updatedAt,
                      // gyms?: [gymId,...] — OPTIONAL availability tags: absent or
                      // empty means "available everywhere" (the zero-config
                      // default — nobody is forced to tag anything; see
                      // availableAtGym() in section 4) }
  plans:        [],  // training plans (schema 5): { id, name, exercises:[{eid, exId|null, movement|null, perGym?, prescription?},...], rests:{eid:{...}}, updatedAt }
  sessions:     [],  // history:         { id, date, planId, planName, gymId?, gymName?,
                      // exercises:[...], updatedAt } — gymId/gymName tag which gym the
                      // session happened at; gymName is a snapshot (same pattern as
                      // planName) so history still reads right after a gym is deleted
  weights:      [],  // bodyweight log:  { id, date, kg, updatedAt }
  gyms:         [],  // gym profiles:    { id, name, updatedAt } — a fifth synced
                      // collection, same merge/tombstone machinery as the others.
                      // Which gym is CURRENTLY selected is per-device UI state
                      // (_currentGymId + localStorage), deliberately NOT in D:
                      // "where am I training today" shouldn't sync across devices.
  machines:     [],  // equipment instances (E2, owner requirement 2026-07-29 —
                      // "I feel much stronger in different machines"):
                      // { id, name, exId, gymIds:[], maker?, model?, location?,
                      //   note?, updatedAt }. The SPECIFIC apparatus an exercise
                      // is done on — "Remada baixa máquina" is the exercise,
                      // "Technogym #3 (banco 7)" is the machine. Bound to one
                      // exercise (exId); gymIds is a LIST so equipment named at
                      // gym A is one tap to reuse at gym B. Session entries
                      // record { instanceId, instanceName } (name = snapshot,
                      // same pattern as gymName) and suggestions prefer
                      // same-machine history — see getRecentWorkHistory().
                      // Sixth synced collection, same merge/tombstone machinery.
  // One deletedAt-timestamp map per collection, keyed by id. Exists so a
  // deletion can survive being merged against a device that hasn't synced
  // it yet — see mergeCollection() in section 5 for how these are used and
  // why a plain union (no tombstones) let deletions get silently
  // resurrected. Small enough (id+timestamp per entry) that these are never
  // garbage-collected.
  tombstones: { exercises:{}, plans:{}, sessions:{}, weights:{}, gyms:{}, machines:{} },
  lastModified: 0,   // unix timestamp of the last local mutation — used to
                      // decide whether a fresh Gist push is needed, NOT for
                      // per-item conflict resolution (each item's own
                      // updatedAt handles that, see mergeCollection()).
};

let EXP = null; // expanded session id in history

let _newCompoundTouched = false;

// gym deleted on another device degrades to "no selection" instead of a

let _currentGymId = null;

let _newGyms = [];


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  4. UTILITIES
// ║  Pure functions — no side effects, no state access.
// ║  Used throughout the app for formatting and calculation.
// ╚══════════════════════════════════════════════════════════════════════════════

const uid     = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
// Ids for USER-CREATED exercises live in their own `u_` namespace (schema 6).
// Global catalog ids are hand-authored slugs from the vault ('bench-press'),
// so the prefix makes a collision between the two impossible by
// construction. That matters specifically because plan sharing preserves
// the SENDER's ids: without the namespace, an exercise someone invented
// could one day carry the same id as a real catalog entry, and "is this the
// official one?" would have no honest answer — which is exactly the question
// the planned adoption flow has to ask. Exercise ids only; everything else
// (sessions, plans, machines) keeps plain uid().
const newUserExId = () => 'u_' + uid();
// LOCAL date, deliberately NOT toISOString() (which is UTC): in any timezone
// west of UTC — e.g. Brazil, UTC-3 — the UTC date rolls over at 21:00 local,
// so an evening workout logged after that got stamped with TOMORROW's date.
// Everything that keys off these strings (History ordering, bwIsStale()'s
// staleness window, getRecentWorkHistory()'s newest-first sort feeding
// suggestions) was silently wrong for late sessions. 'en-CA' is the one
// locale whose date format is exactly YYYY-MM-DD, matching what
// <input type="date"> and every date.localeCompare() in this file expect.
const today   = () => new Date().toLocaleDateString('en-CA');
const fmt     = d  => new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short',year:'numeric'});
const fmtTime = ts => ts ? new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}) : '';
const esc     = s  => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const round   = (v,step) => Math.round(v/step)*step;

// "Was this field actually filled in" — NOT "is it truthy". A set's reps/kg
// can legitimately be 0 (a real 0kg assisted set at full graduation, a
// logged-but-failed 0-rep attempt) and 0 is falsy, indistinguishable from
// an untouched field under a plain `if(x)`/`x||fallback` check. Used
// everywhere a set's data needs "was this entered" rather than "is it
// nonzero" — computeSuggestion's graduation check, actualLoad, History's
// per-set display, and getRecentWorkHistory's inclusion filter.
const hasKg   = s => s.kg   !== '' && s.kg   != null;
const hasReps = s => s.reps !== '' && s.reps != null;

// ── Time-based sets (`tracking`) ─────────────────────────────────────────────
//
// Some exercises are measured in SECONDS, not repetitions: planks, dead
// hangs, any isometric hold. `tracking` is an EXERCISE-level property
// ('reps' | 'time', absent = 'reps') because it never varies set to set —
// a plank is always timed, a bench press never is. Sets keep the number in
// `s.reps`, which is really "the count dimension of a set"; `tracking` says
// what that number MEANS. Storing seconds there rather than in a new field
// is deliberate: every consumer (history, memory, the volume tally, the
// chips) already treats it as a plain number, so nothing has to learn a
// second shape, and no stored session needs migrating.
//
// What time-based DOES change is the rep-arithmetic, all of which is
// meaningless on seconds and is switched off exactly the way `bodyweight`
// already switches off weight-arithmetic:
//   * graduation / stall  — "hit 12 reps to earn more load" has no meaning
//     for a 45-second hold. See computeSuggestion().
//   * estimated 1RM       — Epley on seconds is nonsense. See exerciseProgress().
//   * volume-load (kg×reps) — kg×seconds is not volume-load. See the
//     Histórico session tally.
// Set COUNT still counts everywhere (isCountedWork is untouched), so a
// timed exercise contributes to weekly muscle volume like any other.
//
// Real progression for holds — longer hold, then added load, and isometric
// training regimes generally — is deliberately future work; see Backlog.
// m:ss, the same shape the rest timer uses (fmtRest) so a duration reads
// identically wherever it appears in the app.
const fmtSecs = v => (v === '' || v == null || isNaN(Number(v))) ? '–'
  : `${Math.floor(Number(v) / 60)}:${String(Math.round(Number(v) % 60)).padStart(2, '0')}`;

// "Can this exercise be done at this gym?" — an absent/EMPTY gyms list on
// the exercise means available EVERYWHERE (the zero-config default), and no
// selected gym (gymId null) means no availability filtering at all. Used by
// the session-block unavailability notice, the swap-exercise suggestions,
// and the add-exercise picker badges.
const availableAtGym = (ex, gymId) => !gymId || !(ex.gyms||[]).length || (ex.gyms||[]).includes(gymId);

// Resolves _currentGymId to the actual gym object, or null — a selection
// pointing at a gym that was deleted (possibly on another device, arriving
// via merge) degrades safely to "no gym selected" instead of dangling.
const currentGym = () => D.gyms.find(g => g.id === _currentGymId) || null;

// Normalizes a rest-override object ({wuwu?,wuw?,ww?} in seconds) from ANY
// source — modal inputs, an imported plan, a catalog row — keeping only
// finite integers in [0, 3600] (0 is a real value: "no timer for this
// transition"). Returns undefined when nothing valid remains, so callers
// can store "no override" as an absent field instead of an empty object.
function sanitizeRest(r) {
  if (!r || typeof r !== 'object') return undefined;
  const out = {};
  ['wuwu', 'wuw', 'ww'].forEach(k => {
    const n = typeof r[k] === 'string' && r[k].trim() === '' ? NaN : Math.round(Number(r[k]));
    if (Number.isFinite(n) && n >= 0 && n <= 3600) out[k] = n;
  });
  return Object.keys(out).length ? out : undefined;
}

// One rest duration, same bounds and same 0-is-real rule sanitizeRest()
// applies per transition key. Shared by the superset group config below.
function sanitizeSecs(v) {
  const n = typeof v === 'string' && v.trim() === '' ? NaN : Math.round(Number(v));
  return (Number.isFinite(n) && n >= 0 && n <= 3600) ? n : undefined;
}

// Normalizes a superset `groups` map ({ [groupId]: {...} }) from ANY source —
// the builder, a stored session, an imported plan — and, just as importantly,
// serializes it CANONICALLY.
//
// Canonical key order is load-bearing, not tidiness. sessionPlanDiff()
// decides "did this workout change the plan?" by comparing JSON.stringify of
// the derived shape against the stored one (that is exactly why sanitizeRest
// fixes its own key order). If `groups` serialized in whatever order the
// object happened to be built in, every untouched grouped session would read
// as drift and prompt the user to update a plan nothing had changed.
//
// Shape, per Design - Supersets (E3b):
//   order      -- default member order, a list of entry ids
//   roundOrder -- SPARSE per-round order deviations, { roundIndex: [eid,...] }
//   rest       -- { between, round, overrides: { 'roundIdx:eid'|'roundIdx:end': secs } }
// Both deviation maps are sparse over a default, which is one idea used
// twice: it is what makes "the same timer applies to all gaps of that type
// but the user can edit them individually" and "reorder this round without
// affecting the rest" the same mechanism rather than two.
//
// Everything unrecognized is dropped — a plan file is untrusted input, the
// same rule normalizeExerciseDef() applies to shared definitions.
function sanitizeGroups(g) {
  if (!g || typeof g !== 'object') return undefined;
  const out = {};
  Object.keys(g).sort().forEach(gid => {
    const src = g[gid];
    if (!src || typeof src !== 'object') return;
    const grp = {};

    const order = Array.isArray(src.order) ? src.order.filter(e => typeof e === 'string' && e) : [];
    if (order.length) grp.order = order;

    // Round indices are stored as object keys, so they come back as strings —
    // coerce and re-emit sorted NUMERICALLY, or round 10 would sort before
    // round 2 and two identical configs could stringify differently.
    if (src.roundOrder && typeof src.roundOrder === 'object') {
      const ro = {};
      Object.keys(src.roundOrder)
        .map(Number).filter(n => Number.isInteger(n) && n >= 0).sort((a, b) => a - b)
        .forEach(r => {
          const list = src.roundOrder[r] ?? src.roundOrder[String(r)];
          const clean = Array.isArray(list) ? list.filter(e => typeof e === 'string' && e) : [];
          if (clean.length) ro[r] = clean;
        });
      if (Object.keys(ro).length) grp.roundOrder = ro;
    }

    const rest = {};
    const between = sanitizeSecs(src.rest?.between);
    const round   = sanitizeSecs(src.rest?.round);
    if (between != null) rest.between = between;
    if (round   != null) rest.round   = round;
    if (src.rest?.overrides && typeof src.rest.overrides === 'object') {
      const ov = {};
      Object.keys(src.rest.overrides).sort().forEach(k => {
        // Gap ids are `${roundIndex}:${memberEid}` or `${roundIndex}:end` —
        // keyed by MEMBER rather than by position, so reordering a round
        // carries its overrides along instead of shifting them onto whoever
        // moved into that slot.
        if (!/^\d+:(end|[A-Za-z0-9_-]+)$/.test(k)) return;
        const n = sanitizeSecs(src.rest.overrides[k]);
        if (n != null) ov[k] = n;
      });
      if (Object.keys(ov).length) rest.overrides = ov;
    }
    if (Object.keys(rest).length) grp.rest = rest;

    // A group with no members left is dead weight — drop it rather than
    // storing an empty shell that every reader then has to guard against.
    if (grp.order) out[gid] = grp;
  });
  return Object.keys(out).length ? out : undefined;
}

// Stable serialization for the drift comparison, mirroring restsKey()'s job
// for the per-entry rest overrides.
const groupsKey = g => JSON.stringify(sanitizeGroups(g) || null);

// THE single definition of what makes a stored superset valid.
//
// Four write paths independently derive an entry list plus a candidate group
// map — savePlan(), sessionPlanShape(), doPlanFromSession() and
// applyImportedPlan() — and every one of them has to apply the same two
// rules:
//   1. a group needs 2+ SURVIVING members, or it isn't a superset any more
//      (entries get removed during a workout, dropped on import when their
//      exercise can't be resolved, deleted in the plan editor);
//   2. its member order is rebuilt from those entries and never trusted from
//      the incoming config, which can legitimately name members that were
//      swapped out — or, in a hand-edited share file, members that never
//      existed.
// Then any entry whose group didn't survive has its markers stripped, so
// nothing is left pointing at a group that isn't there.
//
// This lived as four near-identical copies until the post-build review. An
// invariant duplicated per call site is one that drifts the moment a fifth
// path appears, and the failure would be quiet: a half-pruned group renders
// as a one-member "superset" or an entry marked into a group with no config.
//
// Mutates `entries` in place (that is the marker strip) and returns the
// cleaned group map, or undefined when nothing survives.
function pruneGroups(entries, srcGroups) {
  const out = {};
  Object.keys(srcGroups || {}).forEach(gid => {
    const mems = entries.filter(en => en.ss === gid).map(en => en.ssMem);
    if (mems.length >= 2) out[gid] = { ...srcGroups[gid], order: mems };
  });
  entries.forEach((en, k) => {
    if (en.ss && !out[en.ss]) { const { ss, ssMem, ssWu, ...bare } = en; entries[k] = bare; }
  });
  return sanitizeGroups(out);
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  5. STORAGE & SYNC — localStorage · window.storage · remote driver
// ║
// ║  Three-layer storage strategy:
// ║    1. localStorage   — fast, survives refresh, works on GitHub Pages
// ║    2. window.storage — Claude artifact fallback
// ║    3. Remote driver  — cross-device sync source of truth, one of two
// ║       transports behind the same remoteSave()/remotePull() interface:
// ║         · Supabase (default for fresh installs) — email magic-link
// ║           account; six user_blobs rows, one per collection, guarded
// ║           by row-level security. See "Supabase account & client".
// ║         · GitHub Gist (legacy) — six JSON files in a private Gist,
// ║           the original PAT-based setup, kept until every existing
// ║           device migrates.
// ║       Both carry the SAME six payloads (buildRemotePayload() is the
// ║       single source of the shape): sessions / library / plans /
// ║       weights / gyms / machines, each with tombstones + lastModified.
// ║       Everything below the transport — queue, merge, tombstones,
// ║       schema guard — is driver-blind.
// ║
// ║  Merge logic (mergeCollection(), below) — all four collections use the
// ║  SAME rule: union by id with per-item last-writer-wins (each item's own
// ║  updatedAt decides; remote wins ties, which keeps legacy no-timestamp
// ║  items on their original remote-wins behavior). On top of that,
// ║  tombstones: a tombstoned id is removed again UNLESS the surviving
// ║  copy's own updatedAt is newer than the deletion (meaning it was
// ║  genuinely re-created/edited elsewhere after the delete, so that newer
// ║  edit wins over the older tombstone). Tombstones exist to close the
// ║  deletion-resurrection gap: a plain id-union can never represent "this
// ║  was intentionally removed," so a device that synced before seeing a
// ║  deletion would bring the item back and re-push it. The per-item LWW
// ║  exists because remoteSave() uploads whole collections — every push
// ║  implicitly rewrites every item, so without a recency compare a stale
// ║  device's push silently reverted other devices' newer edits.
// ║
// ║  Schema guard — every file remoteSave() writes is stamped with
// ║  SCHEMA_VERSION. If a fetch ever returns a file stamped NEWER than this
// ║  app build understands, the app refuses to merge or push until it's
// ║  been reloaded fresh (see mergeRemote()/remoteSave()) — an outdated
// ║  cached app writing back shapes it doesn't know about is how fields
// ║  like tombstones would silently vanish. Backfills handle old→new data
// ║  shapes; this guard handles the reverse direction, which backfills
// ║  can't.
// ║
// ║  Config (token, gistId) stored separately, never exported.
// ╚══════════════════════════════════════════════════════════════════════════════

// Bumped whenever the shape of what remoteSave() writes changes in a way an
// older app version would mangle by writing back (dropping fields it doesn't
// know it's holding). 1 = every file written before this field existed —
// which is also what a missing `schema` reads as on fetch.
// 3 = gym profiles: the fifth Gist file (gym-tracker-gyms.json), optional
//     per-exercise `gyms` availability tags, and session gymId/gymName —
//     a v2 app re-saving an edited session would silently drop its gym tag,
//     so v2 devices freeze sync until reloaded (which the v3 service worker
//     makes automatic when online).
// 4 = per-exercise rest timings: optional `rest` on library exercises and
//     session exercises, and a `rests` map on plans — a v3 app's
//     savePlan() rebuilds the plan object without `rests`, silently
//     dropping every per-plan timing, so v3 devices freeze until reloaded.
// 5 = plan entries as objects (E3): plan.exercises holds
//     { eid, exId|null, movement|null, perGym, prescription } instead of
//     bare exId strings, and plan.rests re-keys from exId to eid — a v4
//     app's savePlan() would rebuild plans as string arrays (destroying
//     slots, per-gym memory and prescription notes) and write rests keyed
//     by ids nothing references anymore, so v4 devices freeze until
//     reloaded. backfillPlanEntries() (section 2) upgrades v4 data on
//     every hydration path.
//   v6 (2026-08-02): exercise PROVENANCE — every exercise carries
//     `origin` ('global' | 'user' | 'shared'), and user-created ids gain a
//     `u_` prefix. A v5 device knows neither, so it would push origin-less
//     exercises into an origin-aware library; the guard freezes it as soon
//     as it sees v6 data. normalizeExerciseOrigin() (section 2) closes the
//     narrow race where a v5 device pushes before ever reading v6.
const SCHEMA_VERSION = 6;
// Set when a fetched Gist file is stamped newer than SCHEMA_VERSION; while
// true, mergeRemote() refuses to merge and remoteSave() refuses to push.
// Cleared only by a fresh page load (which, post-service-worker-v3, always
// gets the current app when online).
let _remoteSchemaAhead = false;

// Safe localStorage wrapper — returns null instead of throwing in sandboxed envs
const LS = {
  get(k)    { try { return localStorage.getItem(k); }  catch(e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); }     catch(e) {} },
};

// ── Daily local snapshots ─────────────────────────────────────────────────────
//
// A rolling 7-slot safety net, one slot per weekday (so up to a week of
// look-back before slots recycle): the first load of each calendar day
// stashes D as-loaded — BEFORE any remote merge can touch it — into
// gym:snapshot:<weekday>. Restorable from the Backup & Sync modal. This
// protects against the failure modes sync itself can't: a bad merge, an
// app bug mangling data, a fat-fingered "Importar e substituir". Honest
// limitation: a restore replaces LOCAL data only, it does not rewind the
// Gist — anything the Gist holds with a newer updatedAt (including
// tombstones) re-wins on the next merge; full remote rewind is the manual
// Gist-revision procedure documented in the project vault. Best-effort by
// design: a quota error just means no snapshot today, never a blocked load.
const SNAPSHOT_PREFIX = 'gym:snapshot:';

function writeDailySnapshot() {
  try {
    // An empty/fresh install has nothing worth keeping — the seed library
    // alone is reconstructible from library.json at any time.
    if (!D.sessions.length && !D.plans.length && !D.weights.length) return;
    const key = SNAPSHOT_PREFIX + new Date().getDay();
    const existing = LS.get(key);
    if (existing) {
      try { if (JSON.parse(existing).date === today()) return; } catch(e) {} // unparseable slot → overwrite it
    }
    LS.set(key, JSON.stringify({ date: today(), data: D }));
  } catch(e) {}
}

// All existing snapshots, newest first, for the restore list in the
// Backup & Sync modal. 'prerestore' is the automatic safety copy of
// whatever was live immediately before the last restore/import — so even
// a wrong restore is itself undoable.
function listSnapshots() {
  const out = [];
  ['0','1','2','3','4','5','6','prerestore'].forEach(slot => {
    const raw = LS.get(SNAPSHOT_PREFIX + slot);
    if (!raw) return;
    try {
      const p = JSON.parse(raw);
      if (p?.date && p?.data) out.push({ slot, date: p.date, data: p.data });
    } catch(e) {}
  });
  return out.sort((a,b) => b.date.localeCompare(a.date));
}

// Stashes the CURRENT state into the prerestore slot. Called before
// anything wholesale-replaces D (snapshot restore, backup import).
function stashPreRestore() {
  try { LS.set(SNAPSHOT_PREFIX + 'prerestore', JSON.stringify({ date: today(), data: D })); } catch(e) {}
}

function restoreSnapshot(slot) {
  const raw = LS.get(SNAPSHOT_PREFIX + slot);
  if (!raw) return;
  let p = null;
  try { p = JSON.parse(raw); } catch(e) {}
  if (!p?.data) { alert('Snapshot corrompido — não foi possível restaurar.'); return; }
  if (!confirm(`Substituir os dados atuais pelo snapshot de ${fmt(p.date)}?\n\nOs dados atuais ficam guardados em "antes da última restauração".`)) return;
  stashPreRestore();
  applyData(p.data);   // same validated path a backup import uses (backfill + scrub included)
  persist();
  closeModal();
  render();
}

// Read one file from the Gist; returns parsed object or null
async function gistReadFile(filename) {
  if (!CFG.token || !CFG.gistId) return null;
  try {
    const r = await fetch(`https://api.github.com/gists/${CFG.gistId}`, {
      headers: { Authorization:`token ${CFG.token}`, Accept:'application/vnd.github.v3+json' }
    });
    if (!r.ok) return null;
    const g = await r.json();
    const content = g.files?.[filename]?.content;
    return content ? JSON.parse(content) : null;
  } catch(e) { return null; }
}

// Write one or more files to the Gist in a single PATCH call
async function gistWriteFiles(files) {
  if (!CFG.token) return false;
  try {
    if (CFG.gistId) {
      const r = await fetch(`https://api.github.com/gists/${CFG.gistId}`, {
        method: 'PATCH',
        headers: { Authorization:`token ${CFG.token}`, 'Content-Type':'application/json' },
        body: JSON.stringify({ files })
      });
      return r.ok;
    } else {
      // First run — create the Gist
      const r = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { Authorization:`token ${CFG.token}`, 'Content-Type':'application/json' },
        body: JSON.stringify({ description:'Gym Tracker Data', public:false, files })
      });
      if (!r.ok) return false;
      const g = await r.json();
      CFG.gistId = g.id;
      await saveConfig();
      return true;
    }
  } catch(e) { return false; }
}

// ── Remote payload (shared by both drivers) ──────────────────────────────────

// The six collection payloads, built in ONE place — the single source of
// the remote data shape for BOTH drivers. The Gist driver stringifies each
// into its own file; the Supabase driver stores each as one user_blobs
// row's jsonb content. Identical shape either way — that's what makes
// switching drivers a transport change rather than a data migration.
function buildRemotePayload() {
  const ts = D.lastModified;
  return {
    sessions: { schema:SCHEMA_VERSION, sessions:D.sessions,  tombstones:D.tombstones.sessions, lastModified:ts },
    library:  { schema:SCHEMA_VERSION, exercises:D.exercises, tombstones:D.tombstones.exercises, lastModified:ts },
    plans:    { schema:SCHEMA_VERSION, plans:D.plans,         tombstones:D.tombstones.plans,     lastModified:ts },
    weights:  { schema:SCHEMA_VERSION, weights:D.weights,     tombstones:D.tombstones.weights,   lastModified:ts },
    gyms:     { schema:SCHEMA_VERSION, gyms:D.gyms,           tombstones:D.tombstones.gyms,      lastModified:ts },
    machines: { schema:SCHEMA_VERSION, machines:D.machines,   tombstones:D.tombstones.machines,  lastModified:ts },
  };
}

const GIST_FILENAMES = {
  sessions: 'gym-tracker-sessions.json',
  library:  'gym-tracker-library.json',
  plans:    'gym-tracker-plans.json',
  weights:  'gym-tracker-weights.json',
  gyms:     'gym-tracker-gyms.json',
  machines: 'gym-tracker-machines.json',
};

function payloadToGistFiles(payload) {
  const files = {};
  Object.entries(payload).forEach(([k, content]) => {
    files[GIST_FILENAMES[k]] = { content: JSON.stringify(content, null, 2) };
  });
  return files;
}

// ── Supabase data driver ──────────────────────────────────────────────────────

// Maps user_blobs rows back into the exact {sessions, library, plans,
// weights, gyms, machines} shape gistFetchAll() returns, so mergeRemote()
// stays driver-blind. Unknown collection names (a future app version's new
// collection) are ignored rather than crashed on — the same tolerance the
// Gist side gets for free by only parsing known filenames.
function sbRowsToRemote(rows) {
  const remote = { sessions:null, library:null, plans:null, weights:null, gyms:null, machines:null };
  (rows||[]).forEach(r => { if (r && r.collection in remote) remote[r.collection] = r.content; });
  return remote;
}

async function sbFetchAll() {
  if (!sb || !sbSession) return null;
  try {
    const { data, error } = await sb.from('user_blobs').select('collection,content');
    if (error) return null;   // surfaced upstream exactly like a failed Gist fetch
    return sbRowsToRemote(data);
  } catch(e) { return null; }
}

async function sbWriteAll(payload) {
  if (!sb || !sbSession) return false;
  try {
    // user_id must be set explicitly — the RLS insert/update policies
    // require user_id = auth.uid(), they don't fill it in.
    const uid = sbSession.user.id;
    const rows = Object.entries(payload)
      .filter(([collection]) => collection !== 'machines')
      .map(([collection, content]) => ({ user_id: uid, collection, content }));
    // upsert resolves conflicts on the table's composite primary key
    // (user_id, collection) — the original five rows overwritten in place.
    const { error } = await sb.from('user_blobs').upsert(rows);
    // The machines row goes in its OWN upsert, failure-tolerated: the table's
    // CHECK constraint only admits the original five collection names until
    // supabase/04-machines.sql is applied, and a rejected sixth row inside
    // the combined upsert would fail the WHOLE push — turning an un-run
    // migration into a sync outage for everything. Machines stay local-only
    // (and re-attempt on every push) until the migration lands; the five
    // core collections must never be hostage to that.
    if (payload.machines) {
      try { await sb.from('user_blobs').upsert([{ user_id: uid, collection: 'machines', content: payload.machines }]); }
      catch(e) {}
    }
    return !error;
  } catch(e) { return false; }
}

// Driver dispatch for the pull side — the push side dispatches inside
// remoteSave() (it also has to build/format the payload per driver).
async function remoteFetchAll() {
  return syncDriver() === 'supabase' ? sbFetchAll() : gistFetchAll();
}
