function saveSession() {
  if (!S||!S.exercises.length) return;
  // Machine nudge first, once, never for re-edits (those save silently by
  // convention — nagging about machines on every history touch-up would
  // train people to ignore the prompt).
  if (!_machineNudgeDone && !S._editId && machineNudgeTargets().length) { openMachineNudge(); return; }
  const diff = sessionPlanDiff();
  if (diff) { openSaveOptions(diff); return; }
  if (!S.planId && !S._editId) { openFreeSaveOptions(); return; }
  doSaveSession('keep');
}

function doSaveSession(mode) {
  if (!S||!S.exercises.length) return;
  if (mode === 'update') {
    const plan = D.plans.find(p => p.id === S.planId);
    if (plan) {
      // Deep-cloned so the plan never shares mutable entry objects (perGym,
      // prescription) with the derivation's inputs. Slot entries survive as
      // slots, duplicates as separate entries — see sessionPlanShape().
      const shape = sessionPlanShape(plan);
      plan.exercises = JSON.parse(JSON.stringify(shape.entries));
      plan.rests     = shape.rests;
      // Deleted rather than left as undefined: `groups` has to disappear
      // outright when the last superset is dissolved, or a stale config would
      // survive on the plan and keep re-registering as drift forever.
      if (shape.groups) plan.groups = JSON.parse(JSON.stringify(shape.groups)); else delete plan.groups;
      plan.updatedAt = Date.now();
    }
  } else if (mode === 'new') {
    const name = (document.getElementById('save-new-plan-name')?.value || '').trim() || `${S.planName || 'Treino'} (2)`;
    // Forking from a plan-based session preserves its slot entries in the
    // fork (the source plan resolves _planEid provenance); a free workout
    // has no provenance and forks as all-concrete entries. Clone for the
    // same no-shared-objects reason as 'update' — a duplicated eid across
    // two plans is harmless (eids are plan-internal), a shared perGym
    // OBJECT would not be.
    const src = S.planId ? D.plans.find(p => p.id === S.planId) : null;
    const shape = sessionPlanShape(src || null);
    const np = { id: uid(), name, exercises: JSON.parse(JSON.stringify(shape.entries)), rests: shape.rests,
      ...(shape.groups ? { groups: JSON.parse(JSON.stringify(shape.groups)) } : {}), updatedAt: Date.now() };
    D.plans.push(np);
    // The session record belongs to the plan it actually represents now.
    S.planId = np.id; S.planName = np.name;
  }
  closeModal();
  // Strip the render-only _sug cache before persisting — it's a snapshot
  // of computeSuggestion() from whenever the exercise was added/refreshed
  // this session and must never be saved as if it were real data.
  // editSess() recomputes it fresh instead of ever trusting a persisted
  // copy (see its own comment) — this strip is defense in depth, so a
  // stale/wrong cached suggestion can never masquerade as history even if
  // some future code path forgets to refresh it.
  // Sets get the same treatment: persist only what a saved set MEANS —
  // intent, the numbers, and the explicit completed state. Everything else
  // on a live row (lastReps/lastKg/sugReps/sugKg = chip sources, phReps =
  // placeholder hint, repsEdited/kgEdited = dim-state flags) is render-time
  // scaffolding: meaningless as history (a stored "suggestion" says nothing
  // later), a source of stale chips when re-editing old sessions, and pure
  // bloat multiplied across every set in every backup and Gist push
  // forever. Nothing is lost: editSess() force-sets the edited flags on
  // load anyway, and chips are rebuilt from live history, not saved data.
  // scrubSessionSetMetadata() (section 2) is this strip's cleanup twin for
  // sessions saved before it existed.
  // _collapsed joins _sug in the strip: both are live-session UI state
  // (which blocks are folded right now), meaningless as history. So does
  // _loadSetup (whether the ⚖ section is expanded). loadMode/barKg are NOT
  // stripped — they're the entry-units preference the next session re-seeds
  // from (see seedLoadPrefs()).
  // Slot placeholders never persist — an unresolved slot means that
  // movement wasn't trained today; the entry lives on in the plan, not in
  // history. _planEid/_planNote join the strip: entry provenance served the
  // reconciliation above, and the prescription is plan data, not session
  // data.
  const exercises = S.exercises.filter(ex => !ex.slot).map(({_sug, _collapsed, _loadSetup, _planEid, _planNote, ...ex}) => ({
    ...ex,
    sets: (ex.sets||[]).map(s => {
      const set = { intent: s.intent, reps: s.reps, kg: s.kg };
      // `completed` only when it was ever explicitly toggled — an absent
      // field means "legacy / never touched, counted by default" and that
      // three-state distinction (see isCountedWork()) must survive the save.
      if (s.completed !== undefined) set.completed = s.completed;
      return set;
    })
  }));
  // Superset grouping into history. The `ss`/`ssWu` markers on each exercise
  // ride along for free — the strip above is a BLOCKLIST, so genuinely new
  // fields survive by design. The group CONFIG does not: this record is a
  // WHITELIST, so `groups` has to be named explicitly. That asymmetry is the
  // easiest way to ship this feature half-working, and it cuts the other way
  // too — S.ssCollapsed (which round is folded right now) can never leak into
  // history precisely because nothing names it.
  // Pruned to the groups actually referenced by the saved exercises, so a
  // group whose members were all removed (or were unresolved slots) doesn't
  // persist as a dead shell.
  const usedGids = new Set(exercises.map(e => e.ss).filter(Boolean));
  const savedGroups = sanitizeGroups(Object.fromEntries(
    Object.entries(S.groups || {}).filter(([g]) => usedGids.has(g))));
  const rec = { id:S._editId||uid(), date:S.date, planId:S.planId, planName:S.planName, gymId:S.gymId||null, gymName:S.gymName||null, exercises, ...(savedGroups ? { groups: savedGroups } : {}), updatedAt:Date.now() };
  if (S._editId) { const i=D.sessions.findIndex(s=>s.id===S._editId); if(i>=0)D.sessions[i]=rec; }
  else D.sessions.push(rec);
  persist(); S=null; _restTimer=null; _machineNudgeDone=false; TAB='history'; render();
}

function editSess(id) {
  const s = D.sessions.find(x=>x.id===id); if(!s)return;
  // repsEdited/kgEdited force to true here (never false, unlike a fresh
  // prefill from buildSetsFromMemory): this is real saved history, not a
  // suggestion the user hasn't looked at yet, so it should never render dim.
  S = { ...s, exercises:s.exercises.map(ex=>{
    // Recompute _sug fresh rather than trusting anything persisted on ex
    // (saveSession() strips it anyway, but this is the real fix): D.sessions
    // still has this exact session's own data in it until it's re-saved, so
    // computeSuggestion() here correctly reflects "is there OTHER history
    // for this exercise" — not a snapshot from whenever it was first added.
    // Deliberately does NOT call buildSetsFromMemory() (would rebuild
    // .sets from scratch, discarding the real logged data being edited).
    const profile = profileFor(ex.type, ex.regime||'weighted', trackingOf(ex));
    return {
      ...ex,
      _sug: computeSuggestion(ex.exId, ex.type, ex.regime||'weighted', profile, calibratedInstanceId(ex)),
      sets: ex.sets.map(set=>({...set,repsEdited:true,kgEdited:true})),
    };
  }), _editId:s.id };
  TAB='log'; EXP=null; _restTimer=null; _machineNudgeDone=false; render();
}

function delSess(id)     { D.tombstones.sessions[id]=Date.now(); D.sessions=D.sessions.filter(s=>s.id!==id); EXP=null; persist(); render(); }
function toggleExp(id)   { EXP=EXP===id?null:id; render(); }

// ── Plan from a saved session (History's "Criar plano") ──────────────────────
//
// Any saved session — free workout, plan-based, old or new — can be
// extracted into a plan: its exercise order (duplicates preserved, a
// superset session IS a valid plan shape) plus whatever per-exercise rest
// overrides it carried (minus library-identical ones, same rule the
// save-time reconciliation applies). Unlike save-time "criar novo plano",
// the SESSION IS NOT RETAGGED: it already happened, possibly under another
// plan's name, and extracting a plan from it shouldn't rewrite history.
function openPlanFromSession(sessId) {
  const s = D.sessions.find(x => x.id === sessId); if (!s) return;
  const suggested = s.planName ? `${s.planName} (2)` : `Treino ${fmt(s.date)}`;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Criar plano deste treino</div>
    <div style="font-size:13px;color:${DM};margin-bottom:14px">${esc(s.planName||'Treino livre')} · ${fmt(s.date)} — ${s.exercises.length} exercício${s.exercises.length!==1?'s':''}, na ordem em que foram feitos, com os descansos usados.</div>
    <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">Nome do plano</label>
    <input id="pfs-name" type="text" value="${esc(suggested)}"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
    ${B(CG,TX,'Criar plano',`doPlanFromSession('${s.id}')`)}
    ${B(BG3,TX,'Cancelar','closeModal()',';margin-bottom:0')}`);
}

function doPlanFromSession(sessId) {
  const s = D.sessions.find(x => x.id === sessId); if (!s) return;
  const name = (document.getElementById('pfs-name')?.value || '').trim() || `Treino ${fmt(s.date)}`;
  // Fresh CONCRETE entries, one per occurrence — a superset session maps to
  // duplicate entries, each with its own eid carrying its own timing
  // (strictly better than the old last-occurrence-wins exId key). Slots are
  // deliberately not reconstructed from fromMovement provenance in v1: an
  // extracted plan pins what was actually done.
  // Supersets are extracted too — a session that was trained in rounds should
  // come back as a plan that still says so. Member ids are re-minted onto the
  // fresh eids (the session's own ssMem values belong to that session's
  // entries), and only groups that still have 2+ members survive.
  const entries = [], rests = {}, memMap = {};
  s.exercises.forEach(e => {
    const en = { eid: uid(), exId: e.exId };
    // Member ids are RE-MINTED onto the fresh eids: the session's own ssMem
    // values identify that session's entries, and the new plan's entries are
    // new. memMap carries the old→new mapping for the group config below.
    if (e.ss) { en.ss = e.ss; en.ssMem = en.eid; if (e.ssWu) en.ssWu = true; memMap[e.ssMem] = en.eid; }
    entries.push(en);
    const r = planWorthyRest(e);
    if (r) rests[en.eid] = r;
  });
  // Both deviation maps key by member id, so both are remapped onto the fresh
  // ids FIRST — otherwise they would survive the extraction looking perfectly
  // valid while applying to nothing. pruneGroups() then applies the shared
  // validity rules (2+ surviving members, order rebuilt from the entries).
  const remapped = {};
  Object.keys(s.groups || {}).forEach(gid => {
    const src = s.groups[gid], grp = { ...src };
    const ov = {};
    Object.keys(src.rest?.overrides || {}).forEach(k => {
      const [r, slot] = k.split(':');
      const to = slot === 'end' ? 'end' : memMap[slot];
      if (to) ov[`${r}:${to}`] = src.rest.overrides[k];
    });
    grp.rest = { ...(src.rest || {}) };
    if (Object.keys(ov).length) grp.rest.overrides = ov; else delete grp.rest.overrides;
    if (src.roundOrder) grp.roundOrder = Object.fromEntries(Object.entries(src.roundOrder)
      .map(([r, list]) => [r, list.map(m => memMap[m]).filter(Boolean)]));
    remapped[gid] = grp;
  });
  const cleanGroups = pruneGroups(entries, remapped);
  D.plans.push({ id: uid(), name, exercises: entries, rests, ...(cleanGroups ? { groups: cleanGroups } : {}), updatedAt: Date.now() });
  persist();
  closeModal();
  TAB = 'plans'; // land where the result is
  render();
}

// Per-set mutations — called from inline event handlers in buildExBlock()
function addSet(i)            { S.exercises[i].sets.push({intent:'work',reps:'',kg:'',lastReps:null,lastKg:null,sugReps:null,sugKg:null}); render(); }
function rmSet(i,j)           { S.exercises[i].sets.splice(j,1); render(); }
function toggleIntent(i,j)    { const s=S.exercises[i].sets[j]; s.intent=s.intent==='work'?'warmup':'work'; render(); }

// A first-ever log of an exercise has no suggested weight to scale warm-ups
// off (buildSetsFromMemory()'s "no history" branch returns work rows only)
// — so buildExBlock() shows an inline prompt asking the user to estimate
// what they expect to work with instead, and this generates warm-ups off
// that estimate via the same ramp a returning exercise would get
// (buildWarmupSets()). Wired via onchange, not oninput — commits once the
// field is left rather than re-rendering (and blowing away its own focus)
// on every keystroke, same reasoning as the date input in
// buildLogSession(). New warm-ups are prepended ahead of the existing work
// rows; once they exist, buildExBlock()'s prompt condition is false and it
// stops rendering on its own — no extra flag needed. Deleting them all
// (via each row's own × button) brings the prompt back for another guess.
function estimateWarmups(i, v) {
  const kg = parseFloat(v);
  // Reject only a genuinely invalid/blank entry — NOT 0. A typed "0" is a
  // real, legitimate estimate (e.g. "I expect to need zero assistance"),
  // and rejecting it here would silently contradict the hasKg philosophy
  // applied everywhere else in this file.
  if (Number.isNaN(kg) || kg < 0) return;
  const ex = S.exercises[i];
  ex.sets = [...buildWarmupSets(ex.regime||'weighted', ex.compound!==false, kg, warmupCtxFor(ex)), ...ex.sets];
  // The guess is also today's intended WORKING weight — prefill the work
  // rows' load with it (kgEdited: the user typed this number themselves,
  // it's not a machine suggestion to render dim). Only rows still empty:
  // a load someone already typed directly into a row must never be
  // overwritten by the estimate field.
  ex.sets.forEach(s => { if (s.intent === 'work' && !hasKg(s)) { s.kg = kg; s.kgEdited = true; } });
  render();
}

// Deliberately does NOT call render() — this fires on every keystroke, and a
// full re-render would blow away the input's focus/cursor position mid-type.
// Instead it flips the field straight from "carried over" (dim) to
// "confirmed today" (normal) via a direct style tweak on the element itself,
// same pattern used elsewhere in the file (exF(), setNewType(), etc.) for
// in-place UI updates that shouldn't trigger a full rebuild.
function setVal(i,j,f,v) {
  const s = S.exercises[i].sets[j];
  // Parse first, then check for a genuinely invalid/empty result — NOT
  // `parseInt(v)||''`, which silently blanks a real, intentionally-typed
  // "0" (0 is falsy, indistinguishable from a failed parse under ||).
  let n = f==='reps' ? parseInt(v) : parseFloat(v);
  // The typed load is in the block's chosen input units (per-side/plates);
  // what gets STORED is always the grand total — see loadToDisplay()'s
  // banner. A typed "0" in side mode is the empty bar: stored = barKg.
  if (f === 'kg' && !Number.isNaN(n)) n = displayToTotal(S.exercises[i], n);
  s[f] = Number.isNaN(n) ? '' : n;
  s[f==='reps' ? 'repsEdited' : 'kgEdited'] = true;
  const el = document.getElementById(`s-${f}-${i}-${j}`);
  // A keystroke lifts the "cleared, nothing typed yet" marker — from here on
  // blurVal() must NOT restore the pre-focus value, even if the user deletes
  // everything again: typing-then-erasing is a deliberate clear (state
  // already holds '' from this very function), not an abandoned tap.
  if (el) { el.style.color = TX; delete el.dataset.cleared; }
  // Keystrokes deliberately skip render() (see the comment above), so the
  // universal render()-time mirror misses them — stash here too, or a
  // tab death mid-set would lose exactly the numbers being typed.
  stashLiveSession();
}

// Tap-to-edit on a prefilled set field. The row starts holding a machine-
// written value (last time's numbers, a chip fill, or the first-log
// estimate), and typing into it used to MIX with those digits — real-device
// feedback (2026-07-29): every correction meant deleting the old value digit
// by digit first. Now focusing a non-empty field clears it so typing starts
// fresh, and leaving without typing puts back exactly what was there.
//
// The clear is display-only and provenance-blind, one uniform rule for
// machine-filled and hand-typed values alike ("tap = start fresh, leave
// without typing = nothing happened") — predictable mid-set beats a rule
// that behaves differently per field history. State (s.reps/s.kg) and the
// dim/confirmed color are untouched unless a keystroke actually fires
// setVal(): a mere tap still never confirms a dim value as today's claim.
// The pre-focus value is remembered on the element (dataset), not in state,
// because it's pure display scaffolding — a full render rebuilds the input
// from state anyway.
function focusVal(el) {
  if (el.value === '') return; // placeholder-only field: nothing to clear
  el.dataset.prev = el.value;
  el.dataset.cleared = '1';    // "no keystroke yet" — setVal() lifts it
  el.value = '';
}
function blurVal(el) {
  if (el.dataset.cleared === '1' && el.value === '') el.value = el.dataset.prev;
  delete el.dataset.cleared; delete el.dataset.prev;
}

// Quick-fill from a chip tap — "last" repeats last session's actual values,
// "sug" applies today's suggested target. Both fields fill together (a
// suggestion is a reps+weight pair, not independent numbers) and the row is
// marked edited exactly like manual typing. Button-triggered, not a
// keystroke, so a full render() is fine here (no focus to preserve).
function applyChip(i, j, which) {
  const s = S.exercises[i].sets[j];
  if (which === 'last') { s.reps = s.lastReps; s.kg = s.lastKg; }
  else                  { s.reps = s.sugReps;  s.kg = s.sugKg;  }
  s.repsEdited = true; s.kgEdited = true;
  render();
}

// ── Rest timer ────────────────────────────────────────────────────────────────
//
// Checking a set's ✓ starts a rest countdown sized by the TRANSITION being
// rested through, not a single flat value — the owner's real scheme, now the
// shipped default ("Recomendado"):
//   hypertrophy: WU→WU 1:00 · WU→W 3:00 · W→W 3:00
//   strength:    WU→WU 1:00 · WU→W 3:00 · W→W 5:00 ("at least 5" — the +1min
//                button covers the "at least" part)
// The transition is read from the checked set's intent and the NEXT row's
// intent in the same block (past the end = treat as work: resting after a
// block's last set is still real rest — the next exercise needs setting up).
// Presets below are starting points; every number is editable in the ⏱
// settings modal and persists per-device (see _timerCfg in section 3).

const TIMER_PRESETS = {
  recomendado: { label: 'Recomendado', hypertrophy: { wuwu: 60, wuw: 180, ww: 180 }, strength: { wuwu: 60, wuw: 180, ww: 300 } },
  rapido:      { label: 'Rápido',      hypertrophy: { wuwu: 45, wuw: 90,  ww: 120 }, strength: { wuwu: 60, wuw: 120, ww: 180 } },
  pesado:      { label: 'Pesado',      hypertrophy: { wuwu: 90, wuw: 180, ww: 240 }, strength: { wuwu: 90, wuw: 300, ww: 300 } },
};

function timerCfg() {
  if (_timerCfg) return _timerCfg;
  try {
    const raw = LS.get('gym:timers');
    if (raw) {
      const p = JSON.parse(raw);
      if (p?.hypertrophy?.ww && p?.strength?.ww) { _timerCfg = p; return _timerCfg; }
    }
  } catch(e) {}
  _timerCfg = JSON.parse(JSON.stringify({ preset: 'recomendado', ...TIMER_PRESETS.recomendado })); // deep copy — custom edits must never mutate the preset table
  return _timerCfg;
}

const restKeyFor = (fromIntent, toIntent) =>
  fromIntent === 'warmup' ? (toIntent === 'warmup' ? 'wuwu' : 'wuw') : 'ww';
  // work → anything rests like work→work (a manual W-before-WU reorder is
  // the user's own exotic choice)

// Rest resolution cascade, per TRANSITION KEY independently:
//   1. the session exercise's own `rest` override — which was seeded at
//      add-time from plan-per-exercise + library-per-exercise values (see
//      seedRestFor()) and is editable mid-session (openExRest());
//   2. the device's per-type defaults (timerCfg()).
// An explicit 0 at level 1 means "no timer for this transition" (deliberate
// disable), which is why the check is != null rather than truthy — the same
// 0-is-real-data philosophy hasKg() applies to sets.
function restDurationFor(ex, fromIntent, toIntent) {
  const key = restKeyFor(fromIntent, toIntent);
  const own = ex?.rest?.[key];
  if (own != null && own !== '') return own;
  const cfg = timerCfg()[ex?.type === 'strength' ? 'strength' : 'hypertrophy'];
  return cfg[key];
}

// The rest override a session exercise starts with: the followed plan's
// per-exercise timing wins over the library exercise's own default, key by
// key (both partial-friendly). Returns undefined when neither has anything
// — an absent override means "live-inherit the device defaults", so
// tweaking ⏱ settings mid-session still reaches non-overridden exercises.
function seedRestFor(exId, planId, eid) {
  const lib  = D.exercises.find(e => e.id === exId);
  const plan = planId ? D.plans.find(p => p.id === planId) : null;
  // Plan rests key by ENTRY id since schema 5 (a slot has no exId until
  // session time). Blocks that know their entry (seeded by startPlan or a
  // slot resolution) pass eid; a mid-session add of an exercise the plan
  // also contains still finds that entry's timing via the exId fallback —
  // plan timings keep reaching mid-session adds, the documented behavior.
  // First matching entry wins on duplicates (one exercise, one timing).
  const entryEid = eid || (plan?.exercises||[]).find(en => en.exId === exId)?.eid;
  const merged = { ...(lib?.rest || {}), ...(plan?.rests?.[entryEid] || {}) };
  return Object.keys(merged).length ? merged : undefined;
}

function startRestTimer(i, j) {
  const ex = S?.exercises[i]; if (!ex) return;
  const s  = ex.sets[j]; if (!s) return;
  let secs, label;
  // Inside a superset ROUND the transition cascade doesn't apply at all —
  // the group's own gap config decides (see groupGapSecs). Which gap depends
  // on whether this check just finished the round: mid-round it's the gap
  // after this member, and on the last check it's the between-rounds rest,
  // which is exactly the owner's "once he checks the C set as done, the block
  // collapses and the rest timer starts". A grouped member's SOLO warm-ups
  // are not round sets, so they fall through to the normal cascade below —
  // correct, since those are performed per exercise before the rounds begin.
  const r = isGrouped(ex) ? roundSetIdxs(ex).indexOf(j) : -1;
  if (r >= 0) {
    const done = roundIsDone(groupIdxsOf(ex.ss), r);
    secs  = groupGapSecs(ex.ss, r, done ? 'end' : ex.ssMem);
    label = done ? 'descanso após a rodada' : 'descanso entre exercícios';
  } else {
    const next = ex.sets[j + 1];
    secs = restDurationFor(ex, s.intent, next ? next.intent : 'work');
    const isWU = s.intent === 'warmup' && next && next.intent === 'warmup';
    label = isWU ? 'descanso entre aquecimentos' : (s.intent === 'warmup' ? 'descanso antes da série de trabalho' : 'descanso entre séries');
  }
  if (!secs || secs <= 0) return; // a zeroed-out value means "no timer for this gap/transition"
  _restTimer = { endsAt: Date.now() + secs * 1000, total: secs, label, done: false };
  if (!_restTimerInterval) _restTimerInterval = setInterval(restTimerTick, 500);
}

// Interval tick — updates the countdown text IN PLACE (the setVal()
// philosophy: never a full render on a clock tick, it would blow away
// whatever the user is typing mid-set). Full renders rebuild the banner
// from _restTimer state anyway, so the two never disagree.
function restTimerTick() {
  if (!_restTimer) { clearInterval(_restTimerInterval); _restTimerInterval = null; return; }
  const remaining = Math.max(0, Math.ceil((_restTimer.endsAt - Date.now()) / 1000));
  const el = document.getElementById('rest-time');
  if (el) el.textContent = fmtRest(remaining);
  const bar = document.getElementById('rest-bar');
  if (bar) bar.style.width = `${Math.max(0, Math.min(100, 100 * remaining / _restTimer.total))}%`;
  if (remaining <= 0 && !_restTimer.done) {
    _restTimer.done = true;
    signalRestDone();
    render(); // one full render to flip the banner into its "done" look — safe: nothing is mid-type right as a rest expires
  }
}

const fmtRest = secs => `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;

// Expiry signal — best-effort on every front, silent where unsupported.
// Vibration reality check (verified 2026-07-29): only Blink engines ship it
// — Chrome/Edge/Samsung Internet on Android. Firefox REMOVED the Vibration
// API outright in v129 (Aug 2024, all platforms — abuse by scam pages), so
// on Firefox/Android `navigator.vibrate` is undefined and the ?. call is a
// deliberate no-op; iOS never had it. For Firefox users the BEEP is the
// only expiry channel (and it needs media volume up). The beep's
// AudioContext is created lazily HERE because browsers only allow audio
// after a user gesture — the ✓ tap that started the timer was one. A
// pocket-proof alert (system notification via the SW) is a real future
// feature, not a bug fix — see Backlog.
let _audioCtx = null;
function signalRestDone() {
  try { navigator.vibrate?.([200, 100, 200, 100, 400]); } catch(e) {}
  try {
    _audioCtx = _audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(t0 => {
      const o = _audioCtx.createOscillator(), g = _audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(_audioCtx.destination);
      g.gain.setValueAtTime(0.15, _audioCtx.currentTime + t0);
      g.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + t0 + 0.2);
      o.start(_audioCtx.currentTime + t0); o.stop(_audioCtx.currentTime + t0 + 0.22);
    });
  } catch(e) {}
}

function skipRestTimer() { _restTimer = null; render(); }
function extendRestTimer(secs) {
  if (!_restTimer) return;
  // Extending a finished rest restarts it from now — "+1:00 more" after the
  // beep means one more minute, not total-elapsed arithmetic.
  const base = _restTimer.done ? Date.now() : _restTimer.endsAt;
  _restTimer.endsAt = base + secs * 1000;
  _restTimer.total += secs;
  _restTimer.done = false;
  render();
}

// Sticky countdown banner, rendered inside the active session right under
// the tab bar. Rebuilt from state on every render; the interval only
// touches #rest-time/#rest-bar between renders.
function restTimerHTML() {
  if (!_restTimer) return '';
  const remaining = Math.max(0, Math.ceil((_restTimer.endsAt - Date.now()) / 1000));
  const done = _restTimer.done;
  const pct = done ? 0 : Math.max(0, Math.min(100, 100 * remaining / _restTimer.total));
  return `
  <div style="position:sticky;top:46px;z-index:45;background:${done ? '#0a2e24' : BG2};border:1px solid ${done ? '#1a4a3a' : BD};border-radius:10px;margin-bottom:12px;overflow:hidden">
    <div style="display:flex;align-items:center;gap:10px;padding:9px 12px">
      <span id="rest-time" style="font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:${done ? '#6fcf97' : TX}">${done ? 'Bora!' : fmtRest(remaining)}</span>
      <span style="flex:1;font-size:11px;color:${DM}">${done ? 'descanso concluído' : esc(_restTimer.label)}</span>
      ${done ? '' : Bs(BG3, TX, '+1:00', 'extendRestTimer(60)', ';padding:6px 10px;font-size:12px;flex-shrink:0')}
      <button onclick="openTimerSettings()" title="Configurar descansos" style="background:none;border:none;color:${DM};font-size:14px;cursor:pointer;padding:4px;flex-shrink:0">⚙</button>
      <button onclick="skipRestTimer()" style="background:none;border:none;color:${DM};font-size:20px;cursor:pointer;padding:2px 6px;line-height:1;flex-shrink:0">×</button>
    </div>
    <div id="rest-bar" style="height:3px;background:${CG};width:${pct}%;transition:width .4s linear"></div>
  </div>`;
}

// ── Timer settings modal — presets + fully custom values ─────────────────────

function openTimerSettings() {
  const cfg = timerCfg();
  const presetPill = (key, label) => `<button onclick="applyTimerPreset('${key}')" style="padding:6px 13px;border-radius:99px;border:none;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${cfg.preset === key ? CG : BG3};color:${cfg.preset === key ? TX : DM}">${label}</button>`;
  const num = (id, val) => `<input id="${id}" type="number" inputmode="numeric" min="0" step="5" value="${val}"
    style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:14px;padding:8px 6px;text-align:center;outline:none;box-sizing:border-box">`;

      <div><div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">Aquec.→Aquec.</div>${num(p + '-wuwu', v.wuwu)}</div>
      <div><div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">Aquec.→Trab.</div>${num(p + '-wuw', v.wuw)}</div>
      <div><div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">Trab.→Trab.</div>${num(p + '-ww', v.ww)}</div>

    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px">${Object.entries(TIMER_PRESETS).map(([k, p]) => presetPill(k, p.label)).join('')}${presetPill('custom', 'Personalizado')}</div>
    ${grid('Hipertrofia', 'tm-h', cfg.hypertrophy)}
    ${grid('Força', 'tm-s', cfg.strength)}
    ${B(CG, TX, 'Salvar', 'saveTimerSettings()', ';margin-top:16px')}
    ${B(BG3, TX, 'Cancelar', 'closeModal()', ';margin-bottom:0')}`);
}

// Preset tap = fill the editable inputs with that preset's numbers (the
// user can still tweak before saving — tweaking just makes it custom).
function applyTimerPreset(key) {
  const p = TIMER_PRESETS[key];
  if (p) {
    [['tm-h', p.hypertrophy], ['tm-s', p.strength]].forEach(([prefix, v]) =>
      ['wuwu', 'wuw', 'ww'].forEach(k => { const el = document.getElementById(`${prefix}-${k}`); if (el) el.value = v[k]; }));
  }
  const cfg = timerCfg();
  cfg.preset = key;
  openTimerSettings.__pendingPreset = key; // remembered until Salvar actually persists
  // re-highlight pills without rebuilding the whole modal (inputs hold edits)
  document.querySelectorAll('#modal-ov button[onclick^="applyTimerPreset"]').forEach(b => {
    const active = b.getAttribute('onclick').includes(`'${key}'`);
    b.style.background = active ? CG : BG3;
    b.style.color = active ? TX : DM;
  });
}

function saveTimerSettings() {
  const read = (prefix) => {
    const v = {};
    ['wuwu', 'wuw', 'ww'].forEach(k => {
      const n = parseInt(document.getElementById(`${prefix}-${k}`)?.value, 10);
      v[k] = Number.isNaN(n) || n < 0 ? 0 : n;
    });
    return v;
  };
  const h = read('tm-h'), s = read('tm-s');
  const chosen = openTimerSettings.__pendingPreset || timerCfg().preset || 'custom';
  const matchesPreset = TIMER_PRESETS[chosen]
    && JSON.stringify(TIMER_PRESETS[chosen].hypertrophy) === JSON.stringify(h)
    && JSON.stringify(TIMER_PRESETS[chosen].strength) === JSON.stringify(s);
  _timerCfg = { preset: matchesPreset ? chosen : 'custom', hypertrophy: h, strength: s };
  LS.set('gym:timers', JSON.stringify(_timerCfg));
  openTimerSettings.__pendingPreset = null;
  closeModal();
  render();
}

// Per-exercise rest editor for the ACTIVE session — edits ex.rest on the
// session copy only (the plan/library stay untouched until the save-time
// choice, see saveSession's options). Placeholders show what "blank"
// currently inherits, so the three states read clearly: number = override,
// 0 = timer off, blank = inherit the device default.
// Which block's note input is force-open. A block whose note already has
// content renders open regardless (see noteRow), so this only tracks the
// "opened, still empty" state.
let _exNoteEdit = null;
function toggleExNote(i) { _exNoteEdit = _exNoteEdit === i ? null : i; render(); }

// Trimmed and capped like every other free-text field that rides the sync
// payload (the same 200-char discipline as the plan prescription note).
// Empty clears the field entirely rather than storing "" — an absent note
// and a blank one should not be two different states in history.
function setExNote(i, v) {
  const ex = S && S.exercises[i]; if (!ex) return;
  const note = (v || '').trim().slice(0, 200);
  if (note) ex.note = note; else delete ex.note;
  _exNoteEdit = null;
  // render() mirrors the live session through stashLiveSession() before
  // rebuilding, so the note survives a reload without an explicit persist.
  render();
}

function openExRest(i) {
  const ex = S?.exercises[i]; if (!ex) return;
  const cfg = timerCfg()[ex.type === 'strength' ? 'strength' : 'hypertrophy'];
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Descanso — ${esc(ex.exName)}</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Segundos por transição, só para este exercício neste treino. Em branco = padrão do tipo (mostrado como dica). 0 desliga. Ao salvar o treino você decide se isso vai para o plano.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px">
      ${[['wuwu','Aquec.→Aquec.'],['wuw','Aquec.→Trab.'],['ww','Trab.→Trab.']].map(([k,lbl]) => `
      <div>
        <div style="font-size:10px;color:${DM};text-align:center;margin-bottom:3px">${lbl}</div>
        <input id="sxr-${k}" type="number" inputmode="numeric" min="0" step="5" placeholder="${cfg[k]}" value="${ex.rest?.[k] ?? ''}"
          style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:14px;padding:8px 4px;text-align:center;outline:none;box-sizing:border-box">
      </div>`).join('')}
    </div>
    ${B(CG,TX,'Aplicar',`saveExRest(${i})`)}
    ${B(BG3,TX,'Cancelar','closeModal()',';margin-bottom:0')}`);
}

function saveExRest(i) {
  const ex = S?.exercises[i]; if (!ex) return;
  const v = {};
  ['wuwu','wuw','ww'].forEach(k => { v[k] = document.getElementById('sxr-'+k)?.value ?? ''; });
  const rest = sanitizeRest(v);
  if (rest) ex.rest = rest; else delete ex.rest;
  closeModal(); render();
}

// Marks a set (work OR warm-up) as actually performed. Separate from just
// having numbers in the fields, since those numbers might just be an
// autofilled/computed suggestion the user hasn't attempted yet — only
// completed work sets count toward future suggestions/warm-ups
// (getRecentWorkHistory) and volume (volEx). Checking the box also counts as
// confirming whatever's currently shown: if the user never touched the
// suggested reps/kg, checking "done" is itself an implicit "yes, that's what
// I did," so the fields flip from dim to normal same as typing would.
// One-directional on purpose — unchecking doesn't undo that confirmation.
// Checking (not unchecking) also starts the rest timer — see the Rest timer
// section above for the transition-based duration rules.
function toggleCompleted(i,j) {
  const sets = S.exercises[i].sets;
  const s = sets[j];
  s.completed = !s.completed;
  if (s.completed) {
    s.repsEdited = true; s.kgEdited = true;
    startRestTimer(i, j);
    // Checking the LAST remaining set finishes the exercise — same
    // collapse-and-advance the header box does, per the requested "either
    // marks this exercise-level check mark or marks all the individual
    // sets" equivalence.
    // Inside a superset the unit that finishes is the ROUND, not the
    // exercise: a member is normally still mid-workout when its round-1 set
    // is done. Same fold-and-advance, one level down.
    const ex = S.exercises[i];
    if (isGrouped(ex)) {
      const r = roundSetIdxs(ex).indexOf(j);
      if (r >= 0 && roundIsDone(groupIdxsOf(ex.ss), r)) { collapseRoundAndAdvance(ex.ss, r); return; }
    } else if (exIsDone(ex)) { collapseAndAdvance(i); return; }
  } else {
    // Unchecking CASCADES DOWNWARD: sets are performed in order, so "set 4
    // didn't happen (yet)" implies 5 and 6 didn't either — the common case
    // being an over-eager exercise-level ✓ (or check-all) walked back from
    // the point of the mistake. Only rows BELOW, only ones currently
    // checked, and they get the same explicit `false` a manual uncheck
    // sets — this is the user declaring those sets not-done, not a reset
    // to the neutral counted-by-default state (the header box's un-✓ does
    // that whole-exercise reset instead).
    for (let k = j + 1; k < sets.length; k++) {
      if (sets[k].completed === true) sets[k].completed = false;
    }
  }
  render();
}

// ── Exercise-level done & focus mode (collapse/expand) ───────────────────────

// "Done" means every set EXPLICITLY completed — the strict ===true check,
// not isCountedWork()'s counted-by-default leniency: this drives the
// header checkbox and auto-collapse, and only deliberate checks should
// trigger those. An exercise with no sets can't be done.
const exIsDone = ex => (ex.sets||[]).length > 0 && ex.sets.every(s => s.completed === true);

function toggleExCollapse(i) {
  const ex = S.exercises[i];
  ex._collapsed = !ex._collapsed;
  render();
}

// The header checkbox: checking marks EVERY set completed (with the same
// implicit "yes, that's what I did" confirmation semantics a per-set check
// carries), fires the rest timer for the last set's transition, and
// collapses-and-advances. Unchecking reverts the sets to the NEUTRAL
// unset state — not completed:false, which would silently exclude them
// from history/suggestions (isCountedWork) over what's usually a mistap —
// and re-expands the block.
function toggleExDone(i) {
  const ex = S.exercises[i]; if (!ex) return;
  if (!exIsDone(ex)) {
    ex.sets.forEach(s => { s.completed = true; s.repsEdited = true; s.kgEdited = true; });
    if (ex.sets.length) startRestTimer(i, ex.sets.length - 1);
    collapseAndAdvance(i);
  } else {
    ex.sets.forEach(s => { delete s.completed; });
    ex._collapsed = false;
    render();
  }
}

// Fold the finished exercise, unfold the next unfinished one below it, and
// bring that one into view — the "focus mode" loop the whole feature
// exists for. Scroll happens after render() so the target element exists.
function collapseAndAdvance(i) {
  S.exercises[i]._collapsed = true;
  const next = S.exercises.findIndex((e, idx) => idx > i && !exIsDone(e));
  if (next !== -1) S.exercises[next]._collapsed = false;
  render();
  if (next !== -1) document.getElementById('exblk-' + next)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Supersets: actions (E3b) ─────────────────────────────────────────────────

const groupIdxsOf = gid => (S?.exercises || []).map((e, i) => e.ss === gid ? i : -1).filter(i => i >= 0);

function toggleRoundCollapse(gid, r) {
  if (!S.ssCollapsed) S.ssCollapsed = {};
  const k = `${gid}:${r}`;
  if (S.ssCollapsed[k]) delete S.ssCollapsed[k]; else S.ssCollapsed[k] = true;
  render();
}

// The round-level twin of collapseAndAdvance(): fold the finished round,
// unfold the next unfinished one, bring it into view. This is the owner's
// focus-mode ask — "once he checks the C set as done, the block collapses and
// the rest timer starts" — one level down from the per-exercise version, and
// deliberately the same shape so the two behave alike.
function collapseRoundAndAdvance(gid, r) {
  if (!S.ssCollapsed) S.ssCollapsed = {};
  S.ssCollapsed[`${gid}:${r}`] = true;
  const idxs = groupIdxsOf(gid);
  const total = roundCountFor(idxs.map(i => S.exercises[i]));
  for (let n = r + 1; n < total; n++) {
    if (!roundIsDone(idxs, n)) { delete S.ssCollapsed[`${gid}:${n}`]; break; }
  }
  render();
  document.getElementById('ssblk-' + gid)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// One more round = one more work set on every member. Uses the same fresh-row
// shape addSet() does, so a round added mid-session is indistinguishable from
// a set added the ordinary way.
function addRound(gid) {
  groupIdxsOf(gid).forEach(i => S.exercises[i].sets.push({ intent:'work', reps:'', kg:'', lastReps:null, lastKg:null, sugReps:null, sugKg:null }));
  render();
}

// Grow or shrink a group's rounds to an explicit count, NON-DESTRUCTIVELY —
// and non-destructive here has to mean "nothing moves", not merely "nothing
// is deleted". An earlier version rebuilt each member as
// [...allWarmups, ...allWorkSets], which discarded nothing but silently
// REORDERED: a member whose round-2 set the user had toggled to WU (the
// mixed-intent case rounds explicitly support) would see that set jump to the
// front, become a LEADING warm-up, and so drop out of the rounds altogether
// into the solo section. Positions of surviving sets are therefore preserved
// exactly: trimming removes from the end of the given intent, and growth
// appends work sets at the end and warm-ups after the last existing one.
//
// Deliberately unlike setExType/setExRegime, which rebuild wholesale — there
// the numbers stop meaning the same thing, whereas a round count is just how
// many times you go round.
function setRoundCounts(gid, nWu, nW) {
  groupIdxsOf(gid).forEach(i => {
    const ex = S.exercises[i];
    const sets = ex.sets.slice();
    const mk = intent => ({ intent, reps:'', kg:'', lastReps:null, lastKg:null, sugReps:null, sugKg:null });
    const countOf = k => sets.filter(s => s.intent === k).length;
    const trim = (k, want) => {
      for (let n = sets.length - 1; n >= 0 && countOf(k) > want; n--) if (sets[n].intent === k) sets.splice(n, 1);
    };
    trim('warmup', nWu); trim('work', nW);
    while (countOf('warmup') < nWu) sets.splice(sets.map(s => s.intent).lastIndexOf('warmup') + 1, 0, mk('warmup'));
    while (countOf('work')   < nW)  sets.push(mk('work'));
    ex.sets = sets;
  });
  render();
}

// Build a group out of the chosen blocks. Members are moved into a CONTIGUOUS
// run at the position of the first one, because the round view's whole
// premise is that a group is one stretch of the session (see sessionUnits()).
// Each member gets a stable ssMem — reusing its plan entry id where it has
// one — which is what lets per-round order and per-gap rests key by member
// rather than by position and survive a reorder.
function makeSuperset(idxSel, opts = {}) {
  const picks = [...new Set(idxSel)].sort((a, b) => a - b).filter(i => S.exercises[i] && !S.exercises[i].slot);
  if (picks.length < 2) return null;
  const gid = 'g' + uid();
  const at  = picks[0];
  const members = picks.map(i => S.exercises[i]);
  members.forEach(ex => { ex.ss = gid; if (!ex.ssMem) ex.ssMem = ex._planEid || ('m' + uid()); });
  // Remove then re-insert as one run, preserving the picked order. Every
  // member sits at an index >= picks[0], so nothing before that index moves
  // and picks[0] is still the right insertion point in the filtered array.
  S.exercises = S.exercises.filter(ex => !members.includes(ex));
  S.exercises.splice(Math.min(at, S.exercises.length), 0, ...members);
  if (!S.groups) S.groups = {};
  S.groups[gid] = {
    order: members.map(ex => ex.ssMem),
    rest: { between: opts.between ?? 0, round: opts.round ?? 120 },
  };
  return gid;
}

// Desagrupar — the owner's "a function that untangles supersets and adds the
// exercises to the plan individually". Members stay exactly where they are,
// in their group order, and become ordinary blocks again. Their own `rest`
// fields were never touched while grouped, so the normal per-transition
// cascade resumes immediately: grouping is not a one-way door.
function ungroupSuperset(gid) {
  groupIdxsOf(gid).forEach(i => { const ex = S.exercises[i]; delete ex.ss; delete ex.ssMem; delete ex.ssWu; });
  if (S.groups) delete S.groups[gid];
  if (S.ssCollapsed) Object.keys(S.ssCollapsed).filter(k => k.startsWith(gid + ':')).forEach(k => delete S.ssCollapsed[k]);
  closeModal(); render();
}

function removeFromSuperset(i) {
  const ex = S.exercises[i]; if (!ex || !ex.ss) return;
  const gid = ex.ss;
  delete ex.ss; delete ex.ssMem; delete ex.ssWu;
  // A group of one is not a superset — dissolve it rather than leaving a
  // degenerate round table with a single column.
  if (groupIdxsOf(gid).length < 2) { ungroupSuperset(gid); return; }
  closeModal(); render();
}

// Reorder within ONE round. Writes a sparse roundOrder deviation and leaves
// every other round alone — the owner's "add, remove or change the order of
// exercises per block, without affecting the rest".
function moveInRound(gid, r, memId, dir) {
  const cfg = S.groups?.[gid]; if (!cfg) return;
  const idxs = groupIdxsOf(gid);
  const cur = roundMembers(idxs, gid, r)
    .filter(i => roundSetIdxs(S.exercises[i])[r] != null)
    .map(i => S.exercises[i].ssMem);
  const at = cur.indexOf(memId), to = at + dir;
  if (at < 0 || to < 0 || to >= cur.length) return;
  [cur[at], cur[to]] = [cur[to], cur[at]];
  cfg.roundOrder = cfg.roundOrder || {};
  // Members absent from THIS round (unequal set counts) are appended so the
  // stored order stays a complete statement about the group rather than a
  // partial one that shifts meaning as sets are added.
  const missing = idxs.map(i => S.exercises[i].ssMem).filter(m => !cur.includes(m));
  cfg.roundOrder[r] = [...cur, ...missing];
  render();
}

// Promote one round's order to the group default. The DEFAULT order is the
// order the member blocks sit in (roundMembers falls back to the array), so
// this has to move the blocks themselves — writing cfg.order alone would be
// ignored, which is exactly the kind of silently-inert state this codebase
// avoids by deriving instead of storing.
function applyRoundOrderToAll(gid, r) {
  const cfg = S.groups?.[gid]; if (!cfg) return;
  const want = cfg.roundOrder?.[r]; if (!want) return;
  const idxs = groupIdxsOf(gid), at = idxs[0];
  const byMem = new Map(idxs.map(i => [S.exercises[i].ssMem, S.exercises[i]]));
  const ordered = want.map(m => byMem.get(m)).filter(Boolean);
  const members = [...ordered, ...idxs.map(i => S.exercises[i]).filter(ex => !ordered.includes(ex))];
  S.exercises = S.exercises.filter(ex => !members.includes(ex));
  S.exercises.splice(Math.min(at, S.exercises.length), 0, ...members);
  cfg.order = members.map(ex => ex.ssMem);
  delete cfg.roundOrder;   // one order for every round again
  render();
}

// Group-level warm-up placement: every member at once. The per-member
// toggle in openSsMember() stays for the mixed case (one exercise still
// warming up while the others work) — this is just the common decision made
// once, which is what the builder was missing.
function setGroupWu(gid, on) {
  groupIdxsOf(gid).forEach(i => { if (on) S.exercises[i].ssWu = true; else delete S.exercises[i].ssWu; });
  render(); openSsBuilder(gid);
}

function toggleMemberWu(i) {
  const ex = S.exercises[i]; if (!ex) return;
  if (ex.ssWu) delete ex.ssWu; else ex.ssWu = true;
  render();
}

// ── Supersets: builder, member sheet, gap editor ─────────────────────────────

// Which blocks are ticked in the create-a-superset picker. Module state, like
// every other modal's working state (_planExs, _dupKeepers), because the modal
// is rebuilt from it on each toggle.
//
// These are INDICES into S.exercises, so a stale selection is not merely
// untidy — after a reorder or a removal the same index names a different
// exercise, and "Criar superset" would group the wrong blocks. It must
// therefore be cleared on every fresh entry, which is what startSsBuilder()
// is for; openSsBuilder() cannot do it because it doubles as the re-render
// after each tick, and clearing there would un-tick every box as it was
// ticked.
let _ssPick = [];

// Set while the add-exercise picker was opened FROM the builder, so
// addPickedEx() knows to tick the new block and come straight back instead of
// dropping the user into the session. Cleared on every entry and exit, since
// a stale true would hijack an ordinary "+ Exercício" afterwards.
let _ssPendingAdd = false;

// Fresh create-mode entry. The only way in from the session screen.
function startSsBuilder() { _ssPick = []; _ssPendingAdd = false; openSsBuilder(); }
function closeSsBuilder() { _ssPick = []; _ssPendingAdd = false; closeModal(); }

// "+ Exercício" from inside the builder: park the pending flag, hand over to
// the normal picker, and let addPickedEx() bring us back.
function ssAddExercise() { _ssPendingAdd = true; openAddEx(); }

function toggleSsPick(i) {
  _ssPick = _ssPick.includes(i) ? _ssPick.filter(x => x !== i) : [..._ssPick, i];
  openSsBuilder();
}

// The builder. Two modes in one modal, switched entirely on whether `gid` is
// given:
//
//   CREATE (no gid) — a tick list of the session's ungrouped blocks, plus the
//     two rest defaults the new group will start with. Nothing is written
//     until "Criar superset"; the ticks live in _ssPick (see the warning
//     there about stale indices).
//   EDIT (gid) — the group's current members, each with a remove ✕ and a "WU
//     nas rodadas" toggle; the round counts; the same two rest defaults. Here
//     everything applies IMMEDIATELY, including the rest fields (see
//     setSsRestDefault), so there is no Salvar to forget.
//
// One modal rather than two screens because both answer the same three
// questions — who is in it, how many rounds, where the rests go — and the
// owner asked for "a builder menu", singular. The cost is that every block
// below carries an `editing ?` branch, which is why the mode is resolved once
// here at the top rather than re-tested inline.
//
// Re-entered on every tick and every toggle (each handler calls back into
// this function), so it must be cheap and must not reset anything the user is
// part-way through — the reason startSsBuilder() exists as a separate door.
function openSsBuilder(gid) {
  const editing = !!gid;
  const idxs = editing ? groupIdxsOf(gid) : [];
  const cfg  = editing ? groupCfg(gid) : {};

  // Round counts are shown from the FIRST member; setRoundCounts applies to
  // all. Members can legitimately diverge afterwards (unequal set counts are
  // supported), so this is an editing convenience, not a stored fact.
  const first = editing ? S.exercises[idxs[0]] : null;
  const nWu = first ? first.sets.filter(s => s.intent === 'warmup').length : 0;
  const nW  = first ? first.sets.filter(s => s.intent === 'work').length   : 3;

  // Are the warm-ups PART of the rounds, or done per exercise beforehand?
  // This has to be a visible group-level choice, and it wasn't: the count
  // field sat under a "RODADAS" heading while the default (ssWu absent) sent
  // every warm-up to the solo section, so asking for "2 rodadas de
  // aquecimento" produced two loose sets and zero warm-up rounds. The count
  // and the placement are one decision and are now presented as one.
  const wuInRounds = editing && idxs.length > 0 && idxs.every(i => !!S.exercises[i].ssWu);

  const pickable = (S?.exercises || [])
    .map((ex, i) => ({ ex, i }))
    .filter(({ ex }) => !ex.slot && !isGrouped(ex));

  const memberRows = editing ? idxs.map(i => {
    const ex = S.exercises[i];
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:.5px solid ${BD}">
      <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ex.exName)}</span>
      <button onclick="toggleMemberWu(${i});openSsBuilder('${gid}')" title="Aquecimento junto com as rodadas" style="flex-shrink:0;padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:10px;cursor:pointer;font-family:inherit;background:${ex.ssWu?CB:BG3};color:${ex.ssWu?TX:DM}">WU nas rodadas</button>
      <button onclick="removeFromSuperset(${i})" style="flex-shrink:0;background:none;border:none;color:${DM};font-size:19px;cursor:pointer;padding:2px 4px;line-height:1">×</button>
    </div>`;
  }).join('') : pickable.map(({ ex, i }) => {
    const on = _ssPick.includes(i);
    return `<button onclick="toggleSsPick(${i})" style="width:100%;display:flex;align-items:center;gap:10px;padding:9px 0;border:none;border-bottom:.5px solid ${BD};background:none;color:${TX};font-family:inherit;text-align:left;cursor:pointer">
      <span style="flex-shrink:0;width:20px;height:20px;border-radius:5px;border:1px solid ${on?CG:BD};background:${on?CG:'transparent'};color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">${on?'✓':''}</span>
      <span style="flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ex.exName)}</span>
      <span style="flex-shrink:0">${typePill(ex.type)}</span>
    </button>`;
  }).join('');


  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">${editing ? 'Editar superset' : 'Novo superset'}</div>
    <div style="font-size:12px;color:${DM};margin-bottom:14px">${editing
      ? 'Os exercícios continuam sendo registrados individualmente — o superset é como você treina, não como o progresso é medido.'
      : 'Escolha 2 ou mais exercícios. Eles serão executados em rodadas, na ordem escolhida.'}</div>

    <div style="max-height:34vh;overflow-y:auto;margin-bottom:8px">${memberRows || `<div style="font-size:13px;color:${DM};padding:6px 0">Nenhum exercício ainda — adicione abaixo.</div>`}</div>
    ${editing ? '' : Bs(BG3,TX,'+ Exercício','ssAddExercise()',';width:100%;justify-content:center;margin-bottom:14px')}

    ${editing ? `
    <div style="font-size:11px;color:${DM};font-weight:700;margin-bottom:6px">AQUECIMENTO</div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button onclick="setGroupWu('${gid}',false)" style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${!wuInRounds?CB:BG3};color:${!wuInRounds?TX:DM}">Antes, por exercício</button>
      <button onclick="setGroupWu('${gid}',true)"  style="flex:1;padding:8px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${wuInRounds?CB:BG3};color:${wuInRounds?TX:DM}">Nas rodadas</button>
    </div>
    <div style="font-size:11px;color:${DM};margin-bottom:12px">${wuInRounds
      ? 'As séries de aquecimento entram como rodadas, junto com os outros exercícios.'
      : 'Cada exercício faz seu aquecimento antes de começarem as rodadas.'}</div>

    <div style="font-size:11px;color:${DM};font-weight:700;margin-bottom:6px">SÉRIES POR EXERCÍCIO</div>
    <div style="display:flex;gap:8px;margin-bottom:6px">
      ${numField('ss-nwu', wuInRounds ? 'Rodadas de aquec.' : 'Aquec. (soltas)', nWu, 1)}
      ${numField('ss-nw','Rodadas de trabalho', nW, 1)}
    </div>
    ${Bs(BG3,TX,'Aplicar',`setRoundCounts('${gid}',+document.getElementById('ss-nwu').value,+document.getElementById('ss-nw').value);openSsBuilder('${gid}')`,';width:100%;justify-content:center;margin-bottom:14px')}` : ''}

    <div style="font-size:11px;color:${DM};font-weight:700;margin-bottom:6px">DESCANSO PADRÃO</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      ${numField('ss-between','Entre exercícios (s)', cfg.rest?.between ?? 0, 5, editing ? `setSsRestDefault('${gid}','between',this.value)` : '')}
      ${numField('ss-round','Após a rodada (s)', cfg.rest?.round ?? 120, 5, editing ? `setSsRestDefault('${gid}','round',this.value)` : '')}
    </div>
    <div style="font-size:11px;color:${DM};margin-bottom:14px">Cada intervalo pode ser ajustado individualmente depois, tocando na linha de descanso dentro da rodada.</div>

    ${editing
      ? B(BG3,TX,'Desagrupar (separar exercícios)',`ungroupSuperset('${gid}')`)
        + B(BG3,DM,'Fechar','closeModal()',';margin-bottom:0')
      : B(_ssPick.length>=2?CG:'#333',TX,`Criar superset${_ssPick.length?` (${_ssPick.length})`:''}`,'doCreateSuperset()')
        + B(BG3,DM,'Cancelar','closeSsBuilder()',';margin-bottom:0')}`);
}

function doCreateSuperset() {
  if (_ssPick.length < 2) return;
  // Both fields are always rendered pre-filled, so a blank one is a
  // deliberate clear rather than "untouched" — it reads as 0, "no rest here",
  // the same 0-is-real-data rule sanitizeRest() and hasKg() follow.
  const between = sanitizeSecs(document.getElementById('ss-between')?.value) ?? 0;
  const round   = sanitizeSecs(document.getElementById('ss-round')?.value) ?? 0;
  const gid = makeSuperset(_ssPick, { between, round });
  _ssPick = []; _ssPendingAdd = false;
  closeModal(); render();
  if (gid) document.getElementById('ssblk-' + gid)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// Committed on change rather than behind a Salvar button, because every other
// control in the edit-mode builder — removing a member, the WU toggle,
// "Aplicar rodadas" — already applies immediately. A modal where half the
// controls save instantly and half wait for a button is the kind of quiet
// inconsistency people lose edits to. (The PLAN editor's equivalent sheet
// does keep a Salvar, deliberately: there the whole editor is a working copy
// committed by savePlan(), so an explicit save is the local convention.)
function setSsRestDefault(gid, key, val) {
  const cfg = S.groups?.[gid]; if (!cfg) return;
  cfg.rest = cfg.rest || {};
  cfg.rest[key] = sanitizeSecs(val) ?? 0;
  render();
}

// The per-member sheet. An interleaved round view has no per-exercise header
// to hang the block furniture on, so everything a normal block carries in its
// header lives here instead — reached from the ⋯ on the member's row or from
// its chip in the group header.
function openSsMember(i) {
  const ex = S.exercises[i]; if (!ex) return;
  const ctx = exRowCtx(ex, i);
  const isS = ex.type === 'strength';
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:2px">${esc(ex.exName)}</div>
    <div style="font-size:12px;color:${DM};margin-bottom:14px">Exercício dentro do superset</div>

    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px">
      <button onclick="setExType(${i},'strength');openSsMember(${i})" style="padding:5px 11px;border-radius:99px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;background:${isS?'#A32D2D':BG3};color:${isS?TX:DM}">Força</button>
      <button onclick="setExType(${i},'hypertrophy');openSsMember(${i})" style="padding:5px 11px;border-radius:99px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;background:${!isS?CB:BG3};color:${!isS?TX:DM}">Hipert.</button>
      <button onclick="toggleMemberWu(${i});openSsMember(${i})" style="padding:5px 11px;border-radius:99px;border:none;font-weight:700;font-size:12px;cursor:pointer;font-family:inherit;background:${ex.ssWu?CB:BG3};color:${ex.ssWu?TX:DM}">Aquecer nas rodadas</button>
    </div>

    ${Bs(BG3,TX,'🔧 ' + (ex.instanceName ? esc(ex.instanceName) : equipChipLabel(ex.exId)), `closeModal();openMachinePicker(${i})`, ';width:100%;justify-content:flex-start;margin-bottom:8px')}
    ${ctx.isBarbell ? Bs(BG3,TX,'⚖ Como digitar a carga', `closeModal();toggleLoadSetup(${i})`, ';width:100%;justify-content:flex-start;margin-bottom:8px') : ''}
    ${Bs(BG3,TX,'📝 Observação de hoje', `closeModal();toggleExNote(${i})`, ';width:100%;justify-content:flex-start;margin-bottom:8px')}
    ${Bs(BG3,TX,'⇄ Trocar exercício', `closeModal();openSwapEx(${i})`, ';width:100%;justify-content:flex-start;margin-bottom:8px')}
    ${Bs(BG3,TX,'ℹ Ver dicas e detalhes', `closeModal();openExerciseDetail('${ex.exId}')`, ';width:100%;justify-content:flex-start;margin-bottom:8px')}

    <div style="font-size:11px;color:${DM};margin:14px 0 10px">O descanso deste exercício é definido pelo superset, não pelo ⏱ individual.</div>
    ${B(BG3,TX,'Remover do superset',`removeFromSuperset(${i})`)}
    ${B(BG3,DM,'Fechar','closeModal()',';margin-bottom:0')}`);
}

function openGapRest(gid, r, slot) {
  const isEnd = slot === 'end';
  const cur = groupGapSecs(gid, r, slot);
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">${isEnd ? 'Descanso após a rodada' : 'Descanso entre exercícios'}</div>
    <div style="font-size:12px;color:${DM};margin-bottom:14px">Rodada ${r + 1}. Use 0 para não descansar aqui.</div>
    <input id="gap-secs" type="number" inputmode="numeric" min="0" step="5" value="${cur}"
      style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:16px;padding:11px 10px;text-align:center;outline:none;box-sizing:border-box;margin-bottom:14px">
    ${B(CG,TX,'Só nesta rodada',`setGapRest('${gid}',${r},'${slot}',document.getElementById('gap-secs').value,false)`)}
    ${B(BG3,TX,'Aplicar a todas as rodadas',`setGapRest('${gid}',${r},'${slot}',document.getElementById('gap-secs').value,true)`)}
    ${B(BG3,DM,'Cancelar','closeModal()',';margin-bottom:0')}`);
}

// Per-gap rest editing. Writes an OVERRIDE, leaving the group default alone —
// or, on "todas as rodadas", rewrites the default and clears the overrides of
// that kind, which is the owner's "be asked if he wants to apply it to all
// blocks or just the one" applied to timings.
function setGapRest(gid, r, slot, val, allRounds) {
  const cfg = S.groups?.[gid]; if (!cfg) return;
  const secs = sanitizeSecs(val) ?? 0;
  cfg.rest = cfg.rest || {};
  if (allRounds) {
    if (slot === 'end') cfg.rest.round = secs; else cfg.rest.between = secs;
    if (cfg.rest.overrides) {
      Object.keys(cfg.rest.overrides)
        .filter(k => (k.split(':')[1] === 'end') === (slot === 'end'))
        .forEach(k => delete cfg.rest.overrides[k]);
    }
  } else {
    cfg.rest.overrides = cfg.rest.overrides || {};
    cfg.rest.overrides[`${r}:${slot}`] = secs;
  }
  closeModal(); render();
}

// Type/regime changes re-run auto-population from memory — DESTRUCTIVE by
// design: whatever the user already typed into this exercise's rows this
// session (reps/kg, completed checks, warm-ups from an estimate) is
// discarded and replaced wholesale, since there's no way to reconcile
// already-entered values against a different type/regime's rep range or
// warm-up rules. Intentional, not a bug to "fix" by trying to preserve the
// old values — a type/regime combo change (e.g. Carga → Assistido) usually
// means the numbers that were valid a moment ago don't mean the same thing
// anymore anyway.
function setExType(i,t)       { S.exercises[i].type=t;   S.exercises[i].sets=buildSetsFromMemory(S.exercises[i]); render(); }
function setExRegime(i,r)     { S.exercises[i].regime=r; S.exercises[i].sets=buildSetsFromMemory(S.exercises[i]); render(); }
function moveEx(i,dir)        { const j=i+dir; if(!S||j<0||j>=S.exercises.length)return; [S.exercises[i],S.exercises[j]]=[S.exercises[j],S.exercises[i]]; render(); }
function rmEx(i)              { S.exercises.splice(i,1); render(); }

// ── Swap exercise ─────────────────────────────────────────────────────────────
//
// Replaces a session exercise with an equivalent one, in place (same
// position). The everyday case is "machine occupied / not available at this
// gym" — so candidates are ranked by how equivalent they are for training
// purposes: same mainMuscle + same movementPattern first, then same
// mainMuscle, then everything else — this ranking is exactly what the
// muscle-classification system was built to enable. When the session has a
// gym context (S.gymId), unavailable-there exercises are filtered out of
// the suggestions entirely (an unavailable suggestion is noise, not help).
// An exercise with an Undefined main muscle can't be matched meaningfully,
// so everything lands in the "others" bucket — searchable, just unranked.
function swapCandidates(sessionEx, search) {
  const lib = D.exercises.find(e => e.id === sessionEx.exId);
  const muscle  = lib?.mainMuscle, pattern = lib?.movementPattern;
  const canRank = muscle && muscle !== 'undefined';
  const q = (search||'').toLowerCase();
  const tiers = { samePattern: [], sameMuscle: [], others: [] };
  D.exercises.forEach(e => {
    if (e.id === sessionEx.exId) return;                       // can't swap to itself
    if (S?.gymId && !availableAtGym(e, S.gymId)) return;       // unavailable here = not a suggestion
    // Bilingual search, same rule as everywhere else (name/name_en/aliases,
    // accent-folded) — typing the English name you remember must keep
    // finding the now-PT-named exercise.
    if (q && !exerciseMatchesSearch(e, q)) return;
    if (canRank && e.mainMuscle === muscle && e.movementPattern === pattern && pattern !== 'other') tiers.samePattern.push(e);
    else if (canRank && e.mainMuscle === muscle) tiers.sameMuscle.push(e);
    else tiers.others.push(e);
  });
  return tiers;
}

function openSwapEx(i) {
  const ex = S.exercises[i]; if (!ex) return;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Trocar exercício</div>
    <div style="font-size:13px;color:${DM};margin-bottom:12px">Substituir <strong style="color:${TX}">${esc(ex.exName)}</strong>${S.gymName?` — mostrando apenas o que está disponível em ${esc(S.gymName)}`:''}</div>
    <input id="sw-search" type="text" placeholder="Buscar por nome..."
      style="width:100%;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 12px;outline:none;margin-bottom:10px;box-sizing:border-box">
    <div id="sw-list" style="max-height:300px;overflow-y:auto;margin-bottom:14px"></div>
    ${B(BG3,TX,'Cancelar','closeModal()',';margin-bottom:0')}`);
  const inp = document.getElementById('sw-search');
  if (inp) inp.addEventListener('input', function() { swRefreshList(i, this.value); });
  swRefreshList(i, '');
}

function swRefreshList(i, search) {
  const c = document.getElementById('sw-list'); if (!c) return;
  const ex = S.exercises[i];
  const tiers = swapCandidates(ex, search);
  const row = e => `
    <button onclick="doSwapEx(${i},'${e.id}')" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-family:inherit;cursor:pointer;margin-bottom:6px">
      <span style="flex:1;font-weight:500;font-size:13px;text-align:left">${esc(e.name)}</span>
      <div style="display:flex;gap:4px;flex-shrink:0">${e.regime?regimePill(e.regime):''}${musclePill(e.mainMuscle,e.movementPattern)}</div>
    </button>`;
  const section = (lbl, list) => list.length
    ? `<div style="font-size:11px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin:8px 0 6px">${lbl}</div>${list.map(row).join('')}`
    : '';
  const html = section('Mesmo músculo e padrão', tiers.samePattern)
             + section('Mesmo músculo', tiers.sameMuscle)
             + section('Outros', tiers.others);
  c.innerHTML = html || `<div style="text-align:center;color:${DM};padding:16px 0;font-size:13px">Nenhum exercício encontrado.</div>`;
  c.scrollTop = 0;
}

// The swap is DESTRUCTIVE for the block being replaced, same reasoning as
// setExType/setExRegime: entered numbers were for the OLD exercise and
// can't be reinterpreted for a different one. The replacement starts fresh
// from its own library defaults + history-driven rows. A confirm guards the
// case where real numbers were already typed in.
function doSwapEx(i, newId) {
  const ne = D.exercises.find(e => e.id === newId); if (!ne || !S) return;
  const old = S.exercises[i];
  const hasData = (old.sets||[]).some(s => hasReps(s) || hasKg(s));
  if (hasData && !confirm(`Substituir "${old.exName}" por "${ne.name}"?\n\nAs séries já preenchidas serão descartadas.`)) return;
  const o = { exId: ne.id, exName: ne.name, type: ne.type||'hypertrophy', compound: ne.compound, regime: ne.regime||'weighted', ...(isTimed(ne) ? { tracking: TRACK_TIME } : {}), rest: seedRestFor(ne.id, S.planId), sets: [] };
  o.sets = buildSetsFromMemory(o);
  S.exercises[i] = o;
  closeModal();
  render();
}
