// ── Gyms (gym profiles) ───────────────────────────────────────────────────────
//
// A gym is just { id, name } — availability lives on the EXERCISES (their
// optional gyms tag list), not here. The selector below picks "where am I
// training today" (per-device, see _currentGymId); sessions started while a
// gym is selected carry its id + a name snapshot, and exercise blocks whose
// library entry isn't available at that gym get an inline notice with a
// swap shortcut (see buildExBlock / openSwapEx).

// Pill row on the Log start screen. Tapping the selected gym deselects it
// (back to "no gym context" — no availability filtering). The ⚙ pill opens
// the manager; when no gyms exist yet, a single quiet "+ Academias" pill is
// the only trace of the whole feature.
function gymSelectorHTML() {
  const pill = (lbl, active, oc, dim) =>
    `<button onclick="${oc}" style="padding:6px 13px;border-radius:99px;border:none;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;background:${active?CG:BG3};color:${active?TX:(dim?DM:TX)}">${lbl}</button>`;
  if (!D.gyms.length) {
    return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">${pill('+ Academias', false, 'openGymManager()', true)}</div>`;
  }
  return `<div style="margin-bottom:16px">
    <div style="font-size:11px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Academia de hoje</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${D.gyms.map(gm => pill(esc(gm.name), _currentGymId===gm.id, `setCurrentGym('${gm.id}')`)).join('')}
      ${pill('⚙', false, 'openGymManager()', true)}
    </div>
  </div>`;
}

function setCurrentGym(id) {
  _currentGymId = _currentGymId === id ? null : id; // tap the active one to deselect
  LS.set('gym:currentGym', _currentGymId || '');
  render();
}

function openGymManager() {
  const rows = D.gyms.map(gm => `
    <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:.5px solid ${BD}">
      <input type="text" value="${esc(gm.name)}" onchange="renameGym('${gm.id}', this.value)"
        style="flex:1;background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:14px;padding:8px 10px;outline:none;min-width:0">
      <button onclick="delGym('${gm.id}')" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0">×</button>
    </div>`).join('');
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:6px">Academias</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px;line-height:1.5">Perfis de academia — marque em quais academias cada exercício está disponível (na Biblioteca), e escolha a academia do dia na tela de treino. Exercícios sem marcação valem em todas.</div>
    ${rows || `<div style="font-size:13px;color:${DM};margin-bottom:8px">Nenhuma academia cadastrada.</div>`}
    <div style="display:flex;gap:8px;margin:14px 0">
      <input id="gym-new-name" type="text" placeholder="Nome da academia"
        style="flex:1;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;outline:none;min-width:0">
      ${Bs(CG,TX,'+ Adicionar','addGym()')}
    </div>
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0')}`);
}

function addGym() {
  const el = document.getElementById('gym-new-name');
  const name = (el?el.value:'').trim(); if (!name) return;
  D.gyms.push({ id: uid(), name, updatedAt: Date.now() });
  persist();
  openGymManager(); // rebuild the modal with the new row
  render();
}

function renameGym(id, v) {
  const name = (v||'').trim();
  const gm = D.gyms.find(g => g.id === id); if (!gm) return;
  if (!name) { openGymManager(); return; } // blank rename → just restore the row
  gm.name = name; gm.updatedAt = Date.now();
  persist(); render();
}

function delGym(id) {
  const gm = D.gyms.find(g => g.id === id); if (!gm) return;
  if (!confirm(`Excluir a academia "${gm.name}"?\n\nExercícios marcados apenas nela passam a valer em todas as academias.`)) return;
  D.tombstones.gyms[id] = Date.now();
  D.gyms = D.gyms.filter(g => g.id !== id);
  // Strip the dead tag from every exercise that carried it — an updatedAt
  // bump included, so the cleanup propagates through the LWW merge instead
  // of lingering as a dangling id on other devices. An exercise whose list
  // becomes empty is now available everywhere, exactly what the confirm
  // text promised.
  D.exercises.forEach(ex => {
    if ((ex.gyms||[]).includes(id)) {
      ex.gyms = ex.gyms.filter(g => g !== id);
      ex.updatedAt = Date.now();
    }
  });
  if (_currentGymId === id) { _currentGymId = null; LS.set('gym:currentGym', ''); }
  persist();
  openGymManager();
  render();
}

function buildLogStartScreen() {
  let plans = '';
  if (D.plans.length) {
    plans = `<div style="font-size:11px;font-weight:700;color:${DM};text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">Escolher plano</div>`;
    plans += D.plans.map(p => `
      <button onclick="startPlan('${p.id}')" style="display:flex;align-items:center;justify-content:space-between;
        padding:13px 16px;background:${BG2};border:1px solid ${BD};border-radius:10px;cursor:pointer;
        width:100%;margin-bottom:8px;color:${TX};font-family:inherit">
        <span style="font-weight:600">${esc(p.name)}</span>
        <span style="color:${DM};font-size:13px">${(p.exercises||[]).length} exerc.</span>
      </button>`).join('');
    plans += `<div style="height:1px;background:${BD};margin:14px 0"></div>`;
  }
  return `
    ${bwBanner()}
    <div style="font-size:20px;font-weight:700;margin-bottom:4px">Treinar</div>
    <div style="color:${DM};font-size:13px;margin-bottom:20px">${fmt(today())}</div>
    ${gymSelectorHTML()}
    ${plans}
    ${B(CG,TX,'+ Treino livre','startFree()',';margin-bottom:0')}
    ${!D.plans.length ? `<div style="text-align:center;color:${DM};padding:32px 0;font-size:14px;line-height:1.6">Crie um plano ou comece um treino livre.</div>` : ''}`;
}

function buildLogSession() {
  const isEdit = !!S._editId;
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:17px;margin-bottom:4px">${esc(S.planName||(isEdit?'Editar treino':'Treino livre'))}${S.gymName?` <span style="font-weight:400;font-size:12px;color:${DM}">· ${esc(S.gymName)}</span>`:''}</div>
        <input type="date" value="${S.date}" onchange="S.date=this.value"
          style="background:${BG3};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:13px;padding:6px 10px;outline:none;width:auto">
      </div>
      <div style="display:flex;gap:6px;margin-left:8px;flex-shrink:0">
        <button onclick="openTimerSettings()" title="Descanso entre séries" style="background:${BG3};border:none;border-radius:7px;color:${DM};font-size:15px;cursor:pointer;padding:7px 10px">⏱</button>
        ${Bs(BG3,TX,'Cancelar','cancelSession()')}
      </div>
    </div>
    ${restTimerHTML()}
    ${S.exercises.map((ex,i) => buildExBlock(ex,i)).join('')}
    ${B(BG3,TX,'+ Exercício','openAddEx()')}
    ${B(S.exercises.length?CG:'#333',TX,isEdit?'Salvar alterações':'Salvar treino','saveSession()',';margin-bottom:0')}`;
}

function buildExBlock(ex, i) {
  const isS  = ex.type==='strength', isH=ex.type==='hypertrophy';
  const isW  = ex.regime==='weighted', isAs=ex.regime==='assisted', isBW=ex.regime==='bodyweight';
  const isFirst = i===0, isLast=i===S.exercises.length-1;
  const bw = currentBW();

  // Same exercise+type+regime logged more than once in this session (e.g.
  // a squat→curl→squat→curl superset) is supported, not blocked — history
  // combines their sets for suggestions/graduation (see
  // getRecentWorkHistory()), and Histórico/Planos always show each
  // occurrence separately in the order they were added. The border +
  // info icon here are purely a same-session heads-up so it's obvious at a
  // glance this isn't accidental duplication, not a restriction.
  const isDuplicated = S.exercises.filter(e =>
    memKey(e.exId, e.type, e.regime||'weighted') === memKey(ex.exId, ex.type, ex.regime||'weighted')
  ).length > 1;

  // Reads the suggestion buildSetsFromMemory() already cached on the
  // exercise object (ex._sug) rather than recomputing computeSuggestion()
  // again here — keeps this banner and each row's sug*/last* chip fields
  // single-sourced so they can never disagree, and avoids redundantly
  // re-deriving the same result on every render. Refreshed on the same
  // triggers the row data already refreshes on: adding the exercise, or
  // changing its type/regime mid-session (setExType/setExRegime both
  // re-run buildSetsFromMemory).
  const sug = ex._sug;
  const stallBanner = (sug && sug.stallStreak >= 2) ? `
    <div style="background:#2d1010;border:1px solid #5c1a1a;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12px;color:#e57373">
      Mesma carga há ${sug.stallStreak} treinos — foque em completar todas as séries no topo da faixa de reps antes de aumentar a carga.
    </div>` : '';

  // Availability lives on the LIBRARY entry, not the session copy — look it
  // up fresh so a mid-session availability edit is reflected. Only warns
  // when this session actually has a gym context (S.gymId); never blocks —
  // maybe the machine exists and the tags are just stale.
  const libEx = D.exercises.find(e => e.id === ex.exId);
  const unavailableHere = S.gymId && libEx && !availableAtGym(libEx, S.gymId);
  const unavailableBanner = unavailableHere ? `
    <div style="background:#1e1a00;border:1px solid #5a4a00;border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12px;color:#e6c84a;display:flex;align-items:center;gap:10px">
      <span style="flex:1">Não disponível em ${esc(S.gymName||'nesta academia')} — trocar por um exercício equivalente?</span>
      ${Bs(BG3,TX,'Trocar',`openSwapEx(${i})`,';flex-shrink:0;padding:6px 10px;font-size:12px')}
    </div>` : '';

  // First-ever log of this exercise (no sug) has no warm-ups yet — see
  // estimateWarmups(). Disappears on its own once warm-up rows exist
  // (generated from an estimate, or from real history the next time this
  // exercise is logged); reappears if they're all removed.
  const hasWarmups = ex.sets.some(s => s.intent === 'warmup');
  const estimatePrompt = (!sug && !isBW && !hasWarmups) ? `
    <div style="background:${BG3};border:1px solid ${BD};border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:12px;color:${DM}">
      Primeira vez com este exercício — sem histórico para calcular o aquecimento. Quanto você espera usar hoje?
      <input type="number" inputmode="decimal" step="0.5" placeholder="${isAs?'Assist. estimado':'Kg estimado'}"
        onchange="estimateWarmups(${i}, this.value)"
        style="margin-top:8px;width:100%;background:${BG2};border:1px solid ${BD};border-radius:7px;color:${TX};font-size:14px;padding:8px 10px;outline:none;box-sizing:border-box">
    </div>` : '';

  const setHeader = ex.sets.length ? `
    <div style="display:grid;grid-template-columns:28px 54px 1fr 1fr 38px;gap:6px;margin-bottom:6px">
      <span></span>
      <span style="font-size:11px;color:${DM};text-align:center">Tipo</span>
      <span style="font-size:11px;color:${DM};text-align:center">Reps</span>
      <span style="font-size:11px;color:${DM};text-align:center">${isAs?'Assist.':isBW?'BW':'Kg'}</span>
      <span></span>
    </div>` : '';

  // Formats a reps/kg pair for a quick-fill chip label. BW rows have no
  // meaningful kg (it's always just current bodyweight, not user-entered),
  // so they only ever show reps.
  const fmtPair = (r,k) => isBW ? `${r??'–'} reps` : `${r??'–'} × ${k??'–'} ${isAs?'assist.':'kg'}`;

  const setRows = ex.sets.map((s,j) => {
    const isWork = s.intent === 'work';
    const rv = (s.reps===''||s.reps==null) ? '' : s.reps;
    const kv = (s.kg===''  ||s.kg==null)   ? '' : s.kg;
    const repsColor = s.repsEdited ? TX : DM;
    const kgColor   = s.kgEdited   ? TX : DM;

    // Quick-fill chips — up to two per work row. "Repeat last time" always
    // shows when there's history; "apply suggestion" only shows when it
    // actually differs from last time (nothing to offer otherwise). Tapping
    // either fills both reps+kg at once and marks the row edited, same as
    // typing — see applyChip().
    let chips = '';
    if (isWork && (s.lastReps!=null || s.lastKg!=null)) {
      const parts = [`<button onclick="applyChip(${i},${j},'last')" style="background:none;border:none;padding:2px 6px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:${DM}">↺ ${fmtPair(s.lastReps,s.lastKg)}</button>`];
      // Bodyweight never has a suggested/last kg (there's no kg field for
      // it at all — sugKg is always null, lastKg is always the unused
      // default ''), so comparing kg there would always read as "different"
      // even when the rep suggestion is identical. Compare reps only for BW.
      const sameAsLast = s.sugReps===s.lastReps && (isBW || s.sugKg===s.lastKg);
      if ((s.sugReps!=null || s.sugKg!=null) && !sameAsLast) {
        // A lower rep target than last time is never a regression — the
        // only way sugReps < lastReps happens at all is a genuine weight
        // graduation (working weight went up, so the rep target resets to
        // the bottom of the range). Show it from the weight's perspective,
        // which really did go up (▲), not the reps', with a distinct color
        // so a graduation still stands out from a routine "aim higher"
        // nudge — just not as if something went wrong.
        const isGraduation = s.sugReps!=null && s.lastReps!=null && s.sugReps < s.lastReps;
        parts.push(`<button onclick="applyChip(${i},${j},'sug')" style="background:none;border:none;padding:2px 6px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;color:${isGraduation?CA:CG}">▲ ${fmtPair(s.sugReps,s.sugKg)}</button>`);
      }
      chips = `<div style="display:flex;gap:2px;flex-wrap:wrap;margin-bottom:2px">${parts.join('')}</div>`;
    }

    // Completed checkbox — every row, warm-ups included. Warm-up completion
    // doesn't feed memory/volume (those already filter to intent==='work'
    // upstream), it's purely for the user's own tracking — but checking it
    // still confirms whatever's in the fields, same as a work row (see
    // toggleCompleted()).
    const checkCell = `<button onclick="toggleCompleted(${i},${j})" aria-label="Concluído" style="width:100%;min-height:38px;border-radius:7px;border:1px solid ${s.completed?CG:BD};background:${s.completed?CG:'transparent'};color:#fff;font-size:14px;font-weight:700;cursor:pointer;padding:0">${s.completed?'✓':''}</button>`;

    return `<div style="margin-bottom:8px">
      ${chips}
      <div style="display:grid;grid-template-columns:28px 54px 1fr 1fr 38px;gap:6px;align-items:center">
        ${checkCell}
        <button onclick="toggleIntent(${i},${j})" style="padding:10px 0;border:none;border-radius:7px;
          background:${isWork?CG:'#555'};color:#fff;font-weight:700;font-size:11px;cursor:pointer;
          font-family:inherit;text-align:center;width:100%">${isWork?'W':'WU'}</button>
        <input id="s-reps-${i}-${j}" type="number" inputmode="decimal" placeholder="${s.phReps||'Reps'}" value="${rv}"
          oninput="setVal(${i},${j},'reps',this.value)"
          style="background:${BG3};border:1px solid ${BD};border-radius:7px;color:${repsColor};font-size:15px;padding:10px 4px;text-align:center;outline:none;width:100%;box-sizing:border-box">
        ${isBW
          ? `<div style="text-align:center;font-size:12px;color:${DM};padding:4px">${bw?bw+'kg':'BW'}</div>`
          : `<input id="s-kg-${i}-${j}" type="number" inputmode="decimal" placeholder="${isAs?'Assist.':'Kg'}" step="0.5" value="${kv}"
               oninput="setVal(${i},${j},'kg',this.value)"
               style="background:${BG3};border:1px solid ${isAs?CA:BD};border-radius:7px;color:${kgColor};font-size:15px;padding:10px 4px;text-align:center;outline:none;width:100%;box-sizing:border-box">`}
        <button onclick="rmSet(${i},${j})" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px;line-height:1;text-align:center;width:100%">×</button>
      </div>
    </div>`;
  }).join('');

  return `
    <div style="background:${BG2};border:1px solid ${isDuplicated?CA:BD};border-radius:10px;margin-bottom:12px;overflow:hidden">
      <!-- Exercise header: reorder arrows, name, type/regime toggles, remove -->
      <div style="padding:10px 12px 10px 10px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid ${BD};gap:8px">
        <div style="display:flex;flex-direction:column;gap:2px;padding-top:2px;flex-shrink:0">
          <button onclick="moveEx(${i},-1)" ${isFirst?'disabled':''} style="background:none;border:none;color:${isFirst?BD:DM};font-size:14px;cursor:${isFirst?'default':'pointer'};padding:1px 4px;line-height:1">▲</button>
          <button onclick="moveEx(${i},1)"  ${isLast?'disabled':''} style="background:none;border:none;color:${isLast?BD:DM};font-size:14px;cursor:${isLast?'default':'pointer'};padding:1px 4px;line-height:1">▼</button>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:700;font-size:15px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px">
            <span style="overflow:hidden;text-overflow:ellipsis">${esc(ex.exName)}</span>
            ${isDuplicated ? `<button onclick="alert('Este exercício aparece mais de uma vez neste treino (mesmo tipo e regime). O histórico combina os dados das duas entradas para sugestões futuras, mas cada uma é salva separadamente, na ordem em que foram adicionadas.')" style="flex-shrink:0;background:none;border:1px solid ${CA};color:${CA};border-radius:99px;width:16px;height:16px;font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0">i</button>` : ''}
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <button onclick="setExType(${i},'strength')"    style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isS?'#A32D2D':BG3};color:${isS?TX:DM}">Força</button>
            <button onclick="setExType(${i},'hypertrophy')" style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isH?CB:BG3};color:${isH?TX:DM}">Hipert.</button>
            <button onclick="setExRegime(${i},'weighted')"   style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isW?CB:BG3};color:${isW?TX:DM}">Carga</button>
            <button onclick="setExRegime(${i},'assisted')"   style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isAs?CA:BG3};color:${isAs?TX:DM}">Assist.</button>
            <button onclick="setExRegime(${i},'bodyweight')" style="padding:4px 9px;border-radius:99px;border:none;font-weight:700;font-size:11px;cursor:pointer;font-family:inherit;background:${isBW?CG:BG3};color:${isBW?TX:DM}">BW</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0">
          <button onclick="rmEx(${i})" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px 6px;line-height:1;margin-top:-2px">×</button>
          <button onclick="openSwapEx(${i})" title="Trocar exercício" style="background:none;border:none;color:${DM};font-size:15px;cursor:pointer;padding:2px 6px;line-height:1">⇄</button>
        </div>
      </div>
      <!-- Set rows -->
      <div style="padding:12px 16px">
        ${unavailableBanner}
        ${stallBanner}
        ${estimatePrompt}
        ${!ex.sets.length ? `<div style="font-size:13px;color:${DM};margin-bottom:8px">Nenhuma série. Adicione abaixo.</div>` : ''}
        ${setHeader}${setRows}
        ${B(BG3,TX,'+ Série',`addSet(${i})`,';margin-bottom:0;margin-top:4px')}
      </div>
    </div>`;
}


// ╔══════════════════════════════════════════════════════════════════════════════
// ║  12. TAB: HISTORY (Histórico)
// ║
// ║  Sorted list of saved sessions, newest first.
// ║  Each row is tappable to expand — shows per-exercise set detail.
// ║  Actions: Edit (loads session back into Log tab), Delete.
// ╚══════════════════════════════════════════════════════════════════════════════

function buildHistory() {
  const bkp = `<div style="display:flex;justify-content:flex-end;margin-bottom:16px">${Bs(BG3,DM,'⬆ Backup & Sync','openBackup()')}</div>`;
  if (!D.sessions.length)
    return bkp + `<div style="text-align:center;color:${DM};padding:40px;font-size:14px">Nenhum treino salvo ainda.</div>`;

  const sorted = [...D.sessions].sort((a,b) => b.date.localeCompare(a.date));
  return bkp + `<div style="font-size:18px;font-weight:700;margin-bottom:16px">Histórico</div>` + sorted.map(s => {
    const v  = s.exercises.reduce((a,ex) => a + volEx(ex.sets, ex.regime), 0);
    // isCountedWork, not a bare intent==='work' check — an explicitly-
    // unchecked set shouldn't inflate the displayed series count when the
    // volume total on the same line already excludes it via volEx().
    const ws = s.exercises.reduce((a,ex) => a + (ex.sets||[]).filter(isCountedWork).length, 0);
    const open = EXP === s.id;

    let detail = '';
    if (open) {
      const exRows = s.exercises.map(ex => {
        let wc = 0;
        const lines = (ex.sets||[]).map(set => {
          if (set.intent==='work') wc++;
          const lbl = set.intent==='work' ? `W${wc}` : 'WU';
          const bw  = currentBW();
          // hasKg (shared, section 4), not a truthy check — a genuinely-
          // entered 0kg set (full graduation for assisted; a deliberate
          // 0kg entry for weighted) must show "0", not "–" as if untouched.
          const kgLbl = ex.regime==='bodyweight' ? (bw?`${bw}kg (BW)`:'BW')
            : ex.regime==='assisted' ? (bw ? `${hasKg(set)?set.kg:'–'} assist. (${bw&&hasKg(set)?Math.max(0,bw-Number(set.kg)):'-'}kg real)` : `${hasKg(set)?set.kg:'–'} assist.`)
            : `${hasKg(set)?set.kg:'–'} kg`;
          return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:.5px solid ${BD};font-size:14px">
            <span style="background:${set.intent==='work'?CG:'#555'};color:#fff;padding:2px 7px;border-radius:5px;font-size:11px;font-weight:700;min-width:34px;text-align:center">${lbl}</span>
            <span>${set.reps||'–'} reps × ${kgLbl}</span>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:14px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">
            <span style="font-weight:600">${esc(ex.exName)}</span>${typePill(ex.type)}${ex.regime?regimePill(ex.regime):''}
          </div>${lines}
        </div>`;
      }).join('');

      detail = `<div style="border-top:1px solid ${BD};padding:14px 16px">${exRows}
        <div style="display:flex;gap:8px;margin-top:12px">
          ${Bs(BG3,TX,'Editar',`editSess('${s.id}')`,';flex:1;padding:10px;justify-content:center')}
          ${Bs('#1a0808',CR,'Excluir',`delSess('${s.id}')`,`;flex:1;padding:10px;justify-content:center;border:1px solid #3a1010`)}
        </div>
      </div>`;
    }

    return `<div style="background:${BG2};border:1px solid ${BD};border-radius:10px;margin-bottom:9px;overflow:hidden">
      <div onclick="toggleExp('${s.id}')" style="padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer">
        <div>
          <div style="font-weight:600">${esc(s.planName||'Treino livre')}</div>
          <div style="font-size:13px;color:${DM}">${fmt(s.date)}${s.gymName?` · ${esc(s.gymName)}`:''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:13px;color:${DM}">${ws} série${ws!==1?'s':''} · ${s.exercises.length} ex.</div>
          ${v>0 ? `<div style="font-size:12px;color:${DM}">${v.toFixed(0)} kg vol.</div>` : ''}
        </div>
      </div>${detail}
    </div>`;
  }).join('');
}

// ║  13. TAB: LIBRARY (Biblioteca)
// ║
// ║  Displays all exercises in D.exercises with filtering, search, and A-Z sort.
// ║  Filter bar uses data-* attributes + bindLibraryFilters() after render.
// ║  Search updates the results list in-place (no full re-render) to keep focus.
// ╚══════════════════════════════════════════════════════════════════════════════

function buildLibrary() {
  const total    = D.exercises.length;
  const filtered = applyFilters(D.exercises, _libFType, _libFMove, _libSearch, _libAlpha, _libUnclassed, _libFMuscle, _libFPattern);
  const hasFilter = _libFType || _libFMove || _libSearch || _libUnclassed || _libFMuscle;
  const countNote = hasFilter
    ? ` — ${filtered.length} ${_libUnclassed?'sem classificação':'resultado'+(filtered.length!==1?'s':'')}`
    : '';

  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
      <div>
        <div style="font-size:20px;font-weight:700">Biblioteca</div>
        <div id="lib-count" style="font-size:13px;color:${DM};margin-top:2px">${total} exercício${total!==1?'s':''}${countNote}</div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0">
        ${sb && sbSession ? Bs(BG3,TX,'⟳ Catálogo','openCatalogUpdate()') : ''}
        ${Bs(CG,TX,'+ Novo','openNewEx()')}
      </div>
    </div>

    ${(!total && _libSeedError) ? `
      <div style="background:#2d1010;border:1px solid #5c1a1a;border-radius:10px;padding:12px 14px;margin:14px 0 0;display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <div style="font-size:13px;color:#e57373;font-weight:600;margin-bottom:2px">Não foi possível carregar a biblioteca inicial</div>
          <div style="font-size:12px;color:#c96a6a">Verifique sua conexão e tente novamente.</div>
        </div>
        ${Bs(CG,TX,'Tentar novamente','seedStarterLibrary()')}
      </div>` : ''}

    <div style="margin-top:14px">
      <div id="lib-filter-bar">
        ${filterBarHTML(_libFType, _libFMove, _libUnclassed, true, _libFMuscle, _libFPattern)}
      </div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input type="text" placeholder="Buscar por nome..." value="${esc(_libSearch)}"
          oninput="libSearchInput(this.value)"
          style="flex:1;background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 12px;outline:none;box-sizing:border-box">
        <button onclick="libAlphaToggle()" style="padding:9px 13px;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;font-family:inherit;background:${_libAlpha?CG:BG3};color:${_libAlpha?TX:DM}">A–Z</button>
      </div>
    </div>

    <div id="lib-results">
      ${!total
        ? `<div style="text-align:center;color:${DM};padding:32px 0;font-size:14px;line-height:1.7">Nenhum exercício cadastrado.<br>Adicione manualmente pelo botão "+ Novo" acima.</div>`
        : !filtered.length
        ? `<div style="text-align:center;color:${DM};padding:32px 0;font-size:14px">Nenhum exercício encontrado.</div>`
        : filtered.map(libExRow).join('')}
    </div>`;
}

// Single exercise row in the library list
function libExRow(ex) {
  return `<div style="background:${BG2};border:1px solid ${BD};border-radius:10px;margin-bottom:7px;padding:12px 14px;display:flex;align-items:center;gap:10px">
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:14px;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ex.name)}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        ${ex.type?typePill(ex.type):''}
        ${ex.regime?regimePill(ex.regime):''}
        ${compPill(ex.compound!=null?ex.compound:null)}
        ${musclePill(ex.mainMuscle, ex.movementPattern)}
      </div>
    </div>
    ${Bs(BG3,TX,'Editar',`openEditEx('${ex.id}')`,';padding:6px 10px;font-size:12px')}
    <button onclick="delEx('${ex.id}')" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0">×</button>
  </div>`;
}

// Attached after render — handles library filter pill clicks
function bindLibraryFilters() {
  bindFilterBar('lib-filter-bar',
    val => { _libFType = _libFType===val?null:val; render(); },
    val => {
      if (val === 'unclassed') { _libUnclassed=!_libUnclassed; if(_libUnclassed)_libFMove=null; }
      else { _libUnclassed=false; _libFMove=_libFMove===val?null:val; }
      render();
    },
    val => { _libFMuscle = _libFMuscle===val?null:val; _libFPattern=null; render(); },
    val => { _libFPattern = _libFPattern===val?null:val; render(); }
  );
}

// Search updates results in-place to preserve input focus
function libSearchInput(v) {
  _libSearch = v;
  const c       = document.getElementById('lib-results');
  const countEl = document.getElementById('lib-count');
  if (!c) return;
  const total    = D.exercises.length;
  const filtered = applyFilters(D.exercises, _libFType, _libFMove, _libSearch, _libAlpha, _libUnclassed, _libFMuscle, _libFPattern);
  const hasFilter = _libFType || _libFMove || _libSearch || _libUnclassed || _libFMuscle;
  const countNote = hasFilter ? ` — ${filtered.length} ${_libUnclassed?'sem classificação':'resultado'+(filtered.length!==1?'s':'')}` : '';
  if (countEl) countEl.textContent = `${total} exercício${total!==1?'s':''}${countNote}`;
  c.innerHTML = !filtered.length
    ? `<div style="text-align:center;color:${DM};padding:32px 0;font-size:14px">Nenhum exercício encontrado.</div>`
    : filtered.map(libExRow).join('');
}

function libAlphaToggle() { _libAlpha = !_libAlpha; render(); }

// ── Global catalog updates (M2) ───────────────────────────────────────────────
//
// Opt-in pull from the admin-curated global_exercises table: shows only
// entries this library doesn't have and never deleted (see
// catalogNewEntries() in section 5 for the tombstone rule), each one tap
// away from being added. Deliberately NOT automatic reconciliation — the
// library stays fully personal; the catalog is an offer, not an authority.
async function openCatalogUpdate() {
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Catálogo global</div>
    <div style="font-size:12px;color:${DM};margin-bottom:12px">Exercícios do catálogo compartilhado que ainda não estão na sua biblioteca. Adicionar é sempre opcional — exercícios que você excluiu não voltam.</div>
    <div id="cat-body" style="font-size:13px;color:${DM}">Carregando…</div>
    ${B(BG3,TX,'Fechar','closeModal()',';margin-bottom:0;margin-top:14px')}`);
  const rows = await fetchCatalog();
  _catalogRows = rows;
  const body = document.getElementById('cat-body');
  if (!body) return; // modal closed while fetching
  if (!rows) { body.textContent = 'Não foi possível carregar o catálogo — verifique a conexão.'; return; }
  renderCatalogList();
}

function renderCatalogList() {
  const body = document.getElementById('cat-body');
  if (!body || !_catalogRows) return;
  const news = catalogNewEntries(_catalogRows);
  if (!news.length) { body.innerHTML = `<span style="color:#6fcf97">Biblioteca em dia com o catálogo ✓</span>`; return; }
  body.innerHTML = news.map(d => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid ${BD}">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px;color:${TX};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.name)}</div>
        <div style="display:flex;gap:4px;margin-top:4px;flex-wrap:wrap">${d.type?typePill(d.type):''}${d.regime?regimePill(d.regime):''}${musclePill(d.mainMuscle,d.movementPattern)}</div>
      </div>
      ${Bs(CG,TX,'+ Adicionar',`addCatalogExercise('${esc(d.id)}')`,';padding:6px 10px;font-size:12px;flex-shrink:0')}
    </div>`).join('');
}

function addCatalogExercise(catalogId) {
  const row = (_catalogRows||[]).find(r => r.id === catalogId);
  if (!row || !row.data || typeof row.data.name !== 'string') return;
  // Same hardening every foreign definition gets (normalizeExerciseDef,
  // section 14) — the catalog is admin-curated, but "trusted author" is not
  // a reason to skip validation that costs nothing.
  D.exercises.push(normalizeExerciseDef(row.data));
  persist();
  renderCatalogList(); // entry disappears from the offer list
  render();            // library list behind the modal updates too
}

// ║  14. TAB: PLANS (Planos)
// ║
// ║  Displays saved training plans.
// ║  Plan editor modal replaces the old <select> dropdown with a full
// ║  search + filter + scrollable exercise picker (same UX as add-exercise).
// ║
// ║  Plan sharing — exportPlan()/importPlanFile()/applyImportedPlan() —
// ║  ships one plan as its own JSON file (name + a snapshot of its
// ║  exercises' definitions, not just their ids) for sending to another
// ║  user. Separate from the full-state Backup & Sync export/import in
// ║  section 20 — this is scoped to a single plan, and merges into the
// ║  local library on import rather than replacing it.

// "Planos recebidos" — in-app shares addressed to me, awaiting a decision.
// Only rendered when there are any; refreshed in the background by
// loadReceivedShares() (tab entry + every successful account pull).
function receivedSharesHTML() {
  if (!_receivedShares.length) return '';
  const rows = _receivedShares.map(s => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid ${BD}">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.payload?.name||'Plano')}</div>
        <div style="font-size:11px;color:${DM};margin-top:1px">de ${esc(s.from_email)} · ${(s.payload?.exercises||[]).length} exerc.</div>
      </div>
      ${Bs(CG,TX,'Importar',`importShare('${s.id}')`,';padding:6px 10px;font-size:12px')}
      <button onclick="dismissShare('${s.id}')" style="background:none;border:none;color:${DM};font-size:20px;cursor:pointer;padding:4px;line-height:1;flex-shrink:0">×</button>
    </div>`).join('');
  return `<div style="background:${BG2};border:1px solid #1a4a3a;border-radius:10px;padding:12px 16px;margin-bottom:14px">
    <div style="font-size:12px;font-weight:700;color:#6fcf97;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Planos recebidos (${_receivedShares.length})</div>
    ${rows}
  </div>`;
}

function buildPlans() {
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700">Planos</div>
      <div style="display:flex;gap:8px">
        <input type="file" id="plan-import-file" accept="application/json" style="display:none" onchange="importPlanFile(this)">
        ${Bs(BG3,TX,'⬆ Importar',"document.getElementById('plan-import-file').click()")}
        ${Bs(CG,TX,'+ Novo','openNewPlan()')}
      </div>
    </div>
    ${receivedSharesHTML()}
    ${!D.plans.length
      ? `<div style="text-align:center;color:${DM};padding:40px;font-size:14px">Nenhum plano criado.</div>`
      : D.plans.map(p => {
          const hasList = (p.exercises||[]).length > 0;
          const exList  = (p.exercises||[]).map((exId,idx) => {
            const ex = D.exercises.find(e => e.id===exId);
            return `<div style="padding:6px 0;border-bottom:.5px solid ${BD};font-size:14px;display:flex;align-items:center;gap:6px">
              <span style="color:${DM};min-width:20px">${idx+1}.</span>
              <span style="flex:1">${esc(ex?ex.name:'(removido)')}</span>
              ${ex&&ex.type?typePill(ex.type):''}${ex&&ex.regime?regimePill(ex.regime):''}${ex?musclePill(ex.mainMuscle,ex.movementPattern):''}
            </div>`;
          }).join('');
          return `<div style="background:${BG2};border:1px solid ${BD};border-radius:10px;margin-bottom:10px;overflow:hidden">
            <div style="padding:13px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:${hasList?`1px solid ${BD}`:'none'}">
              <span style="font-weight:700;font-size:16px">${esc(p.name)}</span>
              <div style="display:flex;gap:8px">
                ${hasList && sb && sbSession ? Bs(BG3,TX,'✉',`openSharePlan('${p.id}')`) : ''}
                ${hasList ? Bs(BG3,TX,'⬇','exportPlan(\''+p.id+'\')') : ''}
                ${Bs(BG3,TX,'Editar',`openEditPlan('${p.id}')`)}
                ${Bs(BG3,CR,'×',`delPlan('${p.id}')`)}
              </div>
            </div>
            ${hasList ? `<div style="padding:6px 16px 12px">${exList}</div>` : ''}
          </div>`;
        }).join('')}`;

function savePlan() {

// ── Plan sharing — export a single plan as its own JSON file, import one ──
//
// Unlike the full Backup & Sync export (all of D), this bundles just one
// plan PLUS a snapshot of its exercises' definitions (name/type/compound/
// regime) — not just their ids. A plan only stores exercise ids
// (`p.exercises: [exId,...]`), and ids are random per user for anything
// custom-created, so shipping ids alone would only work if the receiving
// user's library happened to already contain matching ids. Bundling the
// definitions means the plan works on import even into an empty library.
// One plan + a snapshot of its exercises' definitions — the self-contained
// sharing unit, used identically by the file export (exportPlan, e.g. over
// WhatsApp) and the in-app send (sendPlanShare). gyms tags deliberately NOT
// included: availability references the sender's own gym ids, which mean
// nothing in the receiver's library — shared exercises arrive untagged
// (= available everywhere).
function buildPlanPayload(p) {
  const exercises = (p.exercises||[])
    .map(exId => D.exercises.find(e => e.id === exId))
    .filter(Boolean)
    .map(e => ({ id:e.id, name:e.name, type:e.type, compound:e.compound, regime:e.regime,
      mainMuscle:e.mainMuscle, movementPattern:e.movementPattern, accessoryMuscles:e.accessoryMuscles||[] }));
  return { type: 'gym-tracker-plan', name: p.name, exercises };
}

function exportPlan(id) {
  const p = D.plans.find(x => x.id === id); if (!p) return;
  const payload = buildPlanPayload(p);
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const fn   = `plano-${p.name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')||'sem-nome'}.json`;
  const a = document.createElement('a'); a.href=url; a.download=fn;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

// Reads a plan file selected via the hidden file input (not paste-into-
// textarea like Backup & Sync — this is meant to be received as an actual
// file from another user, e.g. over WhatsApp/email, so picking it directly
// is the more natural flow).
function importPlanFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (data.type !== 'gym-tracker-plan' || !Array.isArray(data.exercises)) throw new Error();
      applyImportedPlan(data);
    } catch(e) {
      alert('Arquivo de plano inválido.');
    }
  };
  reader.readAsText(file);
  input.value = ''; // reset so re-selecting the same file re-fires onchange
}

// Normalizes ONE untrusted exercise definition into a safe library entry.
// Single-sourced on purpose: the file import (applyImportedPlan), the
// in-app received share (same function), and the catalog add
// (addCatalogExercise) all apply EXACTLY this hardening — a fix here fixes
// every path.
//   · type/regime/compound outside the app's real enums are coerced to
//     defaults rather than stored verbatim. Every hand-created exercise is
//     constrained to these values by the modal's toggles (exF()); a stray
//     regime:'eccentric' would make the regime pill show one thing while
//     actualLoad()/buildWarmupSets() — which only special-case
//     'assisted'/'bodyweight' — silently treat it as another.
//   · mainMuscle/movementPattern are typeof-guarded before the enum lookup
//     because bracket access coerces its key to a string —
//     MUSCLE_GROUPS[undefined] resolves to the *string* key "undefined"
//     (a real, valid entry), so an absent field would otherwise pass the
//     membership check and store the literal JS value undefined instead of
//     the string 'undefined'.
//   · an absent id gets a fresh uid() — it must never fall through as
//     literal `undefined`, or two id-less entries would collide on the
//     same key for every `D.exercises.find(e => e.id === ...)` in the app.
// Caller remains responsible for name-presence filtering and for deciding
// whether a matching local exercise should be reused instead.
function normalizeExerciseDef(imp) {
  const type     = imp.type==='strength' ? 'strength' : 'hypertrophy';
  const regime   = (imp.regime==='assisted'||imp.regime==='bodyweight') ? imp.regime : 'weighted';
  const compound = imp.compound===true || imp.compound===false ? imp.compound : null;
  const mainMuscle = (typeof imp.mainMuscle === 'string' && MUSCLE_GROUPS[imp.mainMuscle]) ? imp.mainMuscle : 'undefined';
  const patternMap = MOVEMENT_PATTERNS[mainMuscle] || MOVEMENT_PATTERNS.undefined;
  const movementPattern = (typeof imp.movementPattern === 'string' && patternMap[imp.movementPattern])
    ? imp.movementPattern : (mainMuscle==='undefined'?'undefined':'other');
  const accessoryMuscles = Array.isArray(imp.accessoryMuscles)
    ? imp.accessoryMuscles.filter(m => typeof m==='string' && m!=='undefined' && MUSCLE_GROUPS[m]) : [];
  return { id: imp.id || uid(), name: imp.name, type, compound, regime, mainMuscle, movementPattern, accessoryMuscles, updatedAt: Date.now() };
}

// Merges an imported plan's exercises into the local library and creates a
// new plan referencing them. Matches each imported exercise against the
// local library first by id (works out of the box for anyone's untouched
// library.json-seeded exercises, since those ids are stable slugs shared
// across every install), falling back to a case-insensitive name match
// (covers a renamed or independently-recreated exercise with a different
// id). Only when neither matches is a new library entry added, using the
// sender's own id — keeping a second import of the same plan idempotent
// against the exercise list rather than creating duplicates.
function applyImportedPlan(data) {
  const exIds = data.exercises
    // A plan file is untrusted input (from another user, possibly hand-
    // edited) — an entry with no usable name can't become a real library
    // exercise, so drop it rather than importing something invisible.
    .filter(imp => imp && typeof imp.name === 'string' && imp.name.trim())
    .map(imp => {
      // Match by id only if one was actually given — an absent id must
      // never fall through to `local.id` as literal `undefined`, or two
      // separately-imported id-less entries would collide on the same
      // `id: undefined` and become indistinguishable to every other
      // `D.exercises.find(e => e.id === ...)` lookup in the app.
      let local = (imp.id && D.exercises.find(e => e.id === imp.id))
        || D.exercises.find(e => String(e.name||'').toLowerCase() === imp.name.toLowerCase());
      if (!local) {
        local = normalizeExerciseDef(imp);
        D.exercises.push(local);
      }
      return local.id;
    });
  // De-duplicate — the plan editor's own addExToPlan() already refuses to
  // add the same exercise to a plan twice; an imported file isn't bound by
  // that same guard, so enforce it here too.
  const uniqueExIds = [...new Set(exIds)];
  D.plans.push({ id: uid(), name: data.name || 'Plano importado', exercises: uniqueExIds, updatedAt: Date.now() });
  persist(); render();
}

// ── In-app plan sharing UI (M2) — send by email, receive in "Planos recebidos"

function openSharePlan(planId) {
  const p = D.plans.find(x => x.id === planId); if (!p) return;
  showModal(`
    <div style="font-size:17px;font-weight:700;margin-bottom:4px">Enviar plano</div>
    <div style="font-size:13px;color:${DM};margin-bottom:14px">"${esc(p.name)}" — o destinatário vê o plano em <strong>Planos recebidos</strong> na próxima vez que abrir o app conectado.</div>
    <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">E-mail do destinatário</label>
    <input id="share-email" type="email" inputmode="email" placeholder="pessoa@exemplo.com"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:10px 12px;width:100%;outline:none;margin-bottom:8px;box-sizing:border-box">
    <div id="share-msg" style="font-size:12px;color:${DM};margin-bottom:10px;display:none"></div>
    ${B(CG,TX,'Enviar',`doSendPlanShare('${p.id}')`)}
    ${B(BG3,TX,'Cancelar','closeModal()',';margin-bottom:0')}`);
}

async function doSendPlanShare(planId) {
  const p = D.plans.find(x => x.id === planId); if (!p) return;
  const el  = document.getElementById('share-email');
  const msg = document.getElementById('share-msg');
  const to  = (el ? el.value : '').trim();
  if (!to || !msg) return;
  msg.style.display = 'block'; msg.style.color = DM; msg.textContent = 'Enviando…';
  const { error } = await sendPlanShare(to, p);
  msg.style.color = error ? '#e57373' : '#6fcf97';
  msg.textContent = error
    ? 'Não foi possível enviar: ' + (error.message || 'erro desconhecido')
    : `Enviado! Aparece em Planos recebidos quando ${to} abrir o app.`;
}

// Importing a received share runs the exact same pipeline as a picked file:
// shape guard first (same one importPlanFile applies), then
// applyImportedPlan()'s full untrusted-input hardening — an in-app share is
// still another user's data, trust it exactly as much as a file.
async function importShare(id) {
  const s = _receivedShares.find(x => x.id === id); if (!s) return;
  const data = s.payload;
  if (!data || data.type !== 'gym-tracker-plan' || !Array.isArray(data.exercises)) {
    alert('Plano recebido em formato inválido.');
    return;
  }
  applyImportedPlan(data);                 // persists + renders
  _receivedShares = _receivedShares.filter(x => x.id !== id);
  markShareClaimed(id);                    // fire-and-forget; row stays server-side with claimed_at set
  render();
}

async function dismissShare(id) {
  _receivedShares = _receivedShares.filter(x => x.id !== id);
  markShareClaimed(id);
  render();
}

// ║  15. TAB: WEIGHT (Peso Corporal)
// ║
// ║  Simple log of bodyweight over time.
// ║  currentBW() (section 7) reads from this log.
// ║  Used for actual load calculation in assisted and bodyweight exercises.
// ╚══════════════════════════════════════════════════════════════════════════════

function buildWeight() {
  const sorted = [...D.weights].sort((a,b) => b.date.localeCompare(a.date));
  const rows   = sorted.map((w,i) => {
    const prev  = sorted[i+1];
    const delta = prev ? w.kg - prev.kg : null;
    const ds    = delta===null ? ''
      : delta===0 ? `<span style="color:${DM};font-size:12px">→</span>`
      : delta<0   ? `<span style="color:#6fcf97;font-size:12px">▼ ${Math.abs(delta).toFixed(1)}kg</span>`
      :             `<span style="color:#e57373;font-size:12px">▲ ${delta.toFixed(1)}kg</span>`;
    return `<div style="background:${BG2};border:1px solid ${BD};border-radius:10px;margin-bottom:7px;padding:12px 16px;display:flex;align-items:center;gap:10px">
      <div style="flex:1">
        <div style="font-weight:600;font-size:15px">${w.kg} kg</div>
        <div style="font-size:13px;color:${DM};margin-top:2px">${fmt(w.date)}</div>
      </div>
      ${ds}
      <button onclick="delWeight('${w.id}')" style="background:none;border:none;color:${DM};font-size:22px;cursor:pointer;padding:4px;line-height:1">×</button>
    </div>`;
  }).join('');

  return `
    <div style="font-size:20px;font-weight:700;margin-bottom:4px">Peso Corporal</div>
    ${sorted.length
      ? `<div style="font-size:13px;color:${DM};margin-bottom:16px">Atual: <strong style="color:${TX}">${sorted[0].kg} kg</strong> · ${fmt(sorted[0].date)}</div>`
      : `<div style="font-size:13px;color:${DM};margin-bottom:16px">Nenhum registro ainda.</div>`}
    ${bwIsStale() ? `<div style="background:#1e1a00;border:1px solid #5a4a00;border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13px;color:#e6c84a">
      ${!D.weights.length?'Registre seu peso para cálculos de carga em exercícios assistidos e corporais.':'Último registro há mais de 7 dias — atualize seu peso.'}
    </div>` : ''}
    <div style="background:${BG2};border:1px solid ${BD};border-radius:10px;padding:14px 16px;margin-bottom:16px">
      <div style="font-size:13px;font-weight:600;margin-bottom:12px">Registrar peso</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <div style="flex:1">
          <label style="font-size:11px;color:${DM};display:block;margin-bottom:4px">Data</label>
          <input id="bw-date" type="date" value="${today()}"
            style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 10px;width:100%;outline:none;box-sizing:border-box">
        </div>
        <div style="flex:1">
          <label style="font-size:11px;color:${DM};display:block;margin-bottom:4px">Peso (kg)</label>
          <input id="bw-val" type="number" inputmode="decimal" step="0.1" placeholder="85.0"
            style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:14px;padding:9px 10px;width:100%;outline:none;box-sizing:border-box">
        </div>
      </div>
      ${B(CG,TX,'Salvar','saveWeight()',';margin-bottom:0')}
    </div>
    ${rows || `<div style="text-align:center;color:${DM};padding:24px 0;font-size:14px">Nenhum registro de peso ainda.</div>`}`;
}

function saveWeight() {
  const d = document.getElementById('bw-date')?.value;
  const v = parseFloat(document.getElementById('bw-val')?.value);
  if (!d || !v || v<=0) return;
  D.weights.push({ id:uid(), date:d, kg:v, updatedAt:Date.now() });
  persist(); render();
}
function delWeight(id) { D.tombstones.weights[id]=Date.now(); D.weights=D.weights.filter(w=>w.id!==id); persist(); render(); }

// ║  16. MODAL SYSTEM
// ║
// ║  All modals share the same overlay/box pattern.
// ║  showModal() injects HTML into a fixed overlay appended to body.
// ║  Tapping outside the modal closes it.
// ╚══════════════════════════════════════════════════════════════════════════════

function showModal(html) {
  closeModal();
  const ov  = document.createElement('div');
  ov.id     = 'modal-ov';
  ov.style.cssText = `position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:flex-end`;
  ov.onclick = e => { if (e.target===ov) closeModal(); };
  const box = document.createElement('div');
  box.style.cssText = `background:${BG2};border-radius:10px 10px 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto;box-sizing:border-box`;
  box.innerHTML = html;
  ov.appendChild(box);
  document.body.appendChild(ov);
}
function closeModal() { document.getElementById('modal-ov')?.remove(); }

// ║  17. EXERCISE MODAL (Library: new / edit)
// ║
// ║  Used from the Library tab to create or edit an exercise definition.
// ║  Fields: name, type (strength/hypertrophy), compound/isolation, regime.
// ║  exF() updates button styles in-place without re-rendering the modal.
// ╚══════════════════════════════════════════════════════════════════════════════

function exModalBody(title, nameVal, saveFn, hidden='') {
  return `
    <div style="font-size:17px;font-weight:700;margin-bottom:16px">${title}</div>
    ${hidden}
    <label style="font-size:12px;color:${DM};margin-bottom:5px;display:block">Nome</label>
    <input id="ex-name" type="text" value="${esc(nameVal)}" placeholder="Ex: Agachamento"
      style="background:${BG3};border:1px solid ${BD};border-radius:8px;color:${TX};font-size:15px;padding:11px 12px;width:100%;outline:none;margin-bottom:14px;box-sizing:border-box">
    <label style="font-size:12px;color:${DM};margin-bottom:6px;display:block">Tipo</label>
    <div style="display:flex;gap:6px;margin-bottom:14px">

// Renders just the movement-pattern button row for whatever _newMuscle is
// currently selected — MOVEMENT_PATTERNS is keyed per muscle group, so this
// has to be rebuilt (not just re-styled) every time the muscle changes.
function patternButtonsHTML() {
  const patterns = MOVEMENT_PATTERNS[_newMuscle] || MOVEMENT_PATTERNS.undefined;
  return Object.entries(patterns).map(([key,label]) =>
    `<button onclick="exF('pattern','${key}')" style="padding:8px 10px;border:none;border-radius:8px;font-weight:600;font-size:12px;cursor:pointer;font-family:inherit;background:${_newPattern===key?'#0a2e2e':BG3};color:${_newPattern===key?'#4dd0c4':DM}">${label}</button>`
  ).join('');
}

// Updates button styles in-place when type/compound/regime/muscle/
// pattern/accessory is toggled.
function exF(field, val) {
  if (field === 'type') {
    _newType = val;
    const s=document.getElementById('ex-s'), h=document.getElementById('ex-h');
    if(s){s.style.background=val==='strength'?'#A32D2D':BG3;s.style.color=val==='strength'?TX:DM;}
    if(h){h.style.background=val==='hypertrophy'?CB:BG3;h.style.color=val==='hypertrophy'?TX:DM;}
  } else if (field === 'compound') {
    _newCompound = val;
    _newCompoundTouched = true;
    const c=document.getElementById('ex-c'), i=document.getElementById('ex-i');
    if(c){c.style.background=val===true?'#1a1035':BG3;c.style.color=val===true?'#b39ddb':DM;}
    if(i){i.style.background=val===false?'#1e1810':BG3;i.style.color=val===false?'#d4a96a':DM;}
  } else if (field === 'regime') {
    _newRegime = val;
    const w=document.getElementById('ex-w'), a=document.getElementById('ex-a'), b=document.getElementById('ex-bw');
    if(w){w.style.background=val==='weighted'?CB:BG3;w.style.color=val==='weighted'?TX:DM;}
    if(a){a.style.background=val==='assisted'?CA:BG3;a.style.color=val==='assisted'?TX:DM;}
    if(b){b.style.background=val==='bodyweight'?CG:BG3;b.style.color=val==='bodyweight'?TX:DM;}
  } else if (field === 'muscle') {
    _newMuscle = val;
    // Changing muscle invalidates the old pattern — each group has its own
    // scoped vocabulary (MOVEMENT_PATTERNS) — so reset to that group's own
    // escape valve rather than leaving a stale key from a different group.
    _newPattern = val === 'undefined' ? 'undefined' : 'other';
    const g = document.getElementById('ex-pattern-group');
    if (g) g.innerHTML = patternButtonsHTML();
  } else if (field === 'pattern') {
    _newPattern = val;
    const g = document.getElementById('ex-pattern-group');
    if (g) g.innerHTML = patternButtonsHTML();
  } else if (field === 'accessory') {
    const idx = _newAccessory.indexOf(val);
    if (idx === -1) _newAccessory.push(val); else _newAccessory.splice(idx,1);
    const el = document.getElementById('acc-'+val);
    if (el) { el.style.background = _newAccessory.includes(val)?'#0a2e2e':BG3; el.style.color = _newAccessory.includes(val)?'#4dd0c4':DM; }
  } else if (field === 'gymav') {
    // Gym availability multi-toggle — same pattern as accessory muscles.
    const idx = _newGyms.indexOf(val);
    if (idx === -1) _newGyms.push(val); else _newGyms.splice(idx,1);
    const el = document.getElementById('gav-'+val);
    if (el) { el.style.background = _newGyms.includes(val)?'#0a2e24':BG3; el.style.color = _newGyms.includes(val)?'#6fcf97':DM; }
  }
}

function openNewEx()  {
  _newType='hypertrophy'; _newCompound=true; _newRegime='weighted';
  _newMuscle='undefined'; _newPattern='undefined'; _newAccessory=[]; _newGyms=[];
  showModal(exModalBody('Novo exercício','','saveNewEx()'));
}
function openEditEx(id) {
  const ex = D.exercises.find(e=>e.id===id); if(!ex)return;
  // _newCompound defaults to `true` here purely so the modal has SOMETHING
  // to highlight for an unclassified (compound:null) exercise — it does
  // not mean the user chose Composto. _newCompoundTouched tracks whether
  // they actually clicked the toggle, so saveEditEx() knows whether this
  // display default should ever be written back.
  _newType=ex.type||'hypertrophy'; _newCompound=ex.compound!=null?ex.compound:true; _newRegime=ex.regime||'weighted';
  _newCompoundTouched = false;
  // mainMuscle/movementPattern are mandatory-with-an-undefined-value, not
  // nullable like compound — every exercise already has a real string here
  // (backfillExerciseClassification() guarantees it) — but default anyway
  // in case this is ever called mid-migration.
  _newMuscle = ex.mainMuscle || 'undefined';
  _newPattern = ex.movementPattern || 'undefined';
  _newAccessory = [...(ex.accessoryMuscles||[])];
  // Availability tags may reference a since-deleted gym on data merged from
  // another device before its delGym cleanup arrives — filter to real gyms
  // so the modal never shows phantom chips.
  _newGyms = (ex.gyms||[]).filter(id => D.gyms.some(g => g.id === id));
  showModal(exModalBody('Editar exercício', ex.name, 'saveEditEx()', `<input type="hidden" id="edit-ex-id" value="${ex.id}">`));
}
function saveNewEx() {
  const name = (document.getElementById('ex-name')?.value||'').trim(); if(!name)return;
  D.exercises.push({ id:uid(), name, type:_newType, compound:_newCompound, regime:_newRegime,
    mainMuscle:_newMuscle, movementPattern:_newPattern, accessoryMuscles:[..._newAccessory],
    gyms:[..._newGyms], updatedAt:Date.now() });
  persist(); closeModal(); render();
}
function saveEditEx() {
  const id   = document.getElementById('edit-ex-id')?.value;
  const name = (document.getElementById('ex-name')?.value||'').trim();
  if (!id||!name) return;
  const ex = D.exercises.find(e=>e.id===id);
  // Only write compound if the toggle was actually clicked this edit —
  // otherwise an unclassified (compound:null) exercise gets permanently
  // reclassified to _newCompound's display default just from renaming it
  // or editing type/regime, without the user ever making that choice.
  // mainMuscle/movementPattern/accessoryMuscles have no such nullable state
  // to preserve — they're mandatory-with-an-escape-valve, so every save
  // just writes whatever the modal currently shows, same as type/regime.
  if (ex) {
    ex.name=name; ex.type=_newType; if(_newCompoundTouched) ex.compound=_newCompound; ex.regime=_newRegime;
    ex.mainMuscle=_newMuscle; ex.movementPattern=_newPattern; ex.accessoryMuscles=[..._newAccessory];
    ex.gyms=[..._newGyms];
    ex.updatedAt=Date.now();
  }
  persist(); closeModal(); render();
}
function delEx(id) { D.tombstones.exercises[id]=Date.now(); D.exercises=D.exercises.filter(e=>e.id!==id); persist(); render(); }

function aBindFilters() {

    val => { _aFMove=_aFMove===val?null:val; aBindFilters(); aRefreshList(); },
    val => { _aFMuscle=_aFMuscle===val?null:val; _aFPattern=null; aBindFilters(); aRefreshList(); },

function aRefreshList() {
  const c = document.getElementById('a-list'); if(!c)return;
  const filtered = applyFilters(D.exercises, _aFType, _aFMove, _aSearch, _aAlpha, false, _aFMuscle, _aFPattern);

    // This picker only opens mid-session, so S exists — when the session

      <span style="color:${DM};font-size:12px">→</span>

}

function setNewType(t) {

  const s=document.getElementById('m-str'),h=document.getElementById('m-hyt');

// Type + regime picker before adding to session
function pickEx(id) {
